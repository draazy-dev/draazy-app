name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

# `main` is excluded so pushed history always keeps a completed run against it.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

permissions:
  contents: read

env:
  # The repo declares no `engines`, so without this the runner's default silently decides.
  NODE_VERSION: '26'

jobs:
  secrets:
    name: Secret scan (new commits)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      # The binary, not gitleaks-action: the action needs a paid licence on organisation repos.
      - name: Install gitleaks
        env:
          VERSION: 8.30.1
          SHA256: 551f6fc83ea457d62a0d98237cbad105af8d557003051f41f3e7ca7b3f2470eb
        run: |
          curl -sSfL -o /tmp/gitleaks.tgz \
            "https://github.com/gitleaks/gitleaks/releases/download/v${VERSION}/gitleaks_${VERSION}_linux_x64.tar.gz"
          echo "${SHA256}  /tmp/gitleaks.tgz" | sha256sum -c -
          tar -xzf /tmp/gitleaks.tgz -C /tmp gitleaks

      # Only the commits this run introduces: older history holds already-triaged noise (see .gitleaks.toml).
      - name: Scan
        env:
          BASE: ${{ github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          if [ -z "$BASE" ] || ! git cat-file -e "$BASE^{commit}" 2>/dev/null; then
            range="-1 $HEAD"
          else
            range="$BASE..$HEAD"
          fi
          /tmp/gitleaks git --no-banner --redact --exit-code 1 --log-opts="$range" .

  checks:
    name: Lint, content checks, build, size budget
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` rather than `npm install`: it fails when package.json and the
      # lockfile disagree, which is the check we want in CI.
      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # Split rather than `npm run check` so the failing gate is visible without opening logs.
      - name: Lint
        working-directory: frontend
        run: npm run lint

      - name: i18n key and locale checks
        working-directory: frontend
        run: npm run check:i18n

      - name: Help content check
        working-directory: frontend
        run: npm run check:help

      - name: Build
        working-directory: frontend
        run: npm run build

      # Must run after the build — it measures dist/.
      - name: Bundle size budget
        working-directory: frontend
        run: npm run check:size

  lighthouse:
    name: Lighthouse (mobile, record-only, no backend)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # No thresholds: runner CPU variance exceeds a real regression; budget only from main's recorded spread.
    # The preview has no API, so only FCP/TBT mean anything here; deploy.yml measures sandbox with real data.
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install frontend dependencies
        working-directory: frontend
        run: npm ci

      # A production build, not the dev server: unminified modules over hundreds of
      # requests would produce numbers that describe a machine no user has.
      - name: Build
        working-directory: frontend
        run: npm run build

      # --strictPort or Vite silently moves to 4174 and the poll below fails against an
      # empty port; stdout must go to a file or the backgrounded process hangs the step.
      - name: Serve production build
        working-directory: frontend
        run: |
          npm run preview -- --host 127.0.0.1 --port 4173 --strictPort > /tmp/preview.log 2>&1 &
          for _ in $(seq 1 60); do
            if curl -sfo /dev/null http://127.0.0.1:4173/; then
              echo "preview server up"
              exit 0
            fi
            sleep 1
          done
          echo "preview server did not come up on 127.0.0.1:4173" >&2
          cat /tmp/preview.log >&2
          exit 1

      - name: Measure
        run: node .github/lighthouse/run-lighthouse.mjs

      - name: Upload Lighthouse reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: lighthouse-reports
          path: .lighthouse/
          retention-days: 30

  backend:
    name: Backend tests (Maven)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # A real gate, and red until three pre-existing architecture-guard failures
    # (ServiceSizeGuardTest, SpecCoverageTest, ErasureCoverageTest) are resolved.
    services:
      # Matches backend/src/test/resources/application.properties exactly — same database
      # name, user and password — so no TEST_DB_* override is needed.
      postgres:
        image: postgres:13
        env:
          POSTGRES_DB: draazy_test
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        # Without the health check Flyway dials a port that is listening but not yet
        # accepting, and every test fails at context load looking like a schema problem.
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v7

      # Zulu 25 to match JAVA_HOME on the development machines and the <java.version>25 in
      # pom.xml. A lower JDK does not merely warn here - the build sets release 25 and fails.
      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      # Output lands in backend/target-cli, not backend/target: backend/.mvn/maven.config
      # applies -DbuildDirName=target-cli, which sonar-project.properties also reads.
      - name: Run backend test suite
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress test

      # Surefire XML is the only place a failure's assertion message survives; the console log
      # truncates. `always()` because this artifact matters most on the red runs.
      - name: Upload surefire reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: backend/target-cli/surefire-reports/
          retention-days: 7

  sonar:
    name: SonarQube Cloud
    runs-on: ubuntu-latest
    timeout-minutes: 20
    # `pull_request`, never `pull_request_target`: the latter exposes SONAR_TOKEN to fork code.
    # The condition drops fork PRs, which cannot read the secret and would fail on auth anyway.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v7
        with:
          # Shallow clone breaks blame, so the whole legacy codebase is attributed to this PR
          # and the Clean as You Code gate fails on issues nobody in it wrote.
          fetch-depth: 0

      - uses: actions/setup-java@v6
        with:
          distribution: zulu
          java-version: '25'
          cache: maven

      # SonarJava reads bytecode: without classes the Java module is silently skipped and
      # reported as clean. -DskipTests because the `backend` job above owns the test signal.
      - name: Compile backend (required for Java analysis)
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress -DskipTests test-compile

      # Without the jars SonarJava cannot resolve foreign types and quietly drops the rules
      # that depend on resolution - a thinner analysis that still reports success.
      - name: Collect dependency jars for type resolution
        working-directory: backend
        run: ./mvnw --batch-mode --no-transfer-progress dependency:copy-dependencies -DoutputDirectory=target-cli/deps -DincludeScope=test

      # Distinguishes "Java analysed and found nothing" from "Java was never analysed".
      - name: Verify Java binaries resolved
        run: |
          count=$(find backend/target-cli/classes -name '*.class' | wc -l)
          echo "compiled classes: $count"
          if [ "$count" -eq 0 ]; then
            echo "::error::backend/target-cli/classes contains no .class files - Sonar would silently skip Java analysis and report it as clean." >&2
            exit 1
          fi

      # Configuration lives in sonar-project.properties at the repo root; this action reads it.
      # SONAR_TOKEN is a repository secret - rotate it in the SonarQube Cloud UI if ever leaked.
      - name: SonarQube scan
        uses: SonarSource/sonarqube-scan-action@4d1dc0c91ee400dcf8a6dddf2f705ac36542e304 # v8.4.0
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
