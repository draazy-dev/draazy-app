name: Deploy (sandbox)

# One pipeline for both halves, off one commit, backend first — docs/DEPLOY.md §5.1 and §6.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sandbox" to confirm the target environment'
        required: true
        default: ''
      target:
        description: 'Which half to deploy'
        required: true
        default: both
        type: choice
        options:
          - both
          - backend
          - frontend

# `id-token: write` is absent here because any holder can mint deploy credentials.
permissions:
  contents: read

# One group for all four jobs, so a second dispatch's frontend cannot overtake the first's backend.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

env:
  REGION: asia-south1
  SERVICE: draazy-api-sandbox
  AR_REPOSITORY: draazy

  CF_PAGES_PROJECT: draazy
  CF_PRODUCTION_BRANCH: main

  # Only the custom domain shares a registrable domain between SPA and /api.
  # The `__Host-` refresh cookie depends on that.
  SITE_URL: https://sandbox.draazy.com

  # Pin one SHA across images, Pages and checkouts even if the branch moves mid-run.
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  # One decision point for both halves, so a mistyped confirmation stops the whole run rather than half of it.
  gate:
    name: Decide what deploys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      # The only thing between a stray click and a live `gcloud run services replace`.
      - name: Confirm target
        if: inputs.confirm != 'sandbox'
        run: |
          echo "::error::Confirmation input did not match 'sandbox'. Nothing was deployed." >&2
          exit 1

      - id: decide
        name: Decide which halves deploy
        env:
          # A `choice` input, so GitHub rejects anything not on the list before the job starts.
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          emit() {
            echo "backend=$1" >> "$GITHUB_OUTPUT"
            echo "frontend=$2" >> "$GITHUB_OUTPUT"
            echo "::notice::This run deploys — backend=$1 frontend=$2"
          }

          # The chosen ref need not be main, so there is no reliable previous commit to diff.
          case "$TARGET" in
            both)     emit true  true  ;;
            backend)  emit true  false ;;
            frontend) emit false true  ;;
            *)
              echo "::error::Unknown target '${TARGET}'." >&2
              exit 1
              ;;
          esac

  backend:
    name: Build image and replace Cloud Run service
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: gate
    if: needs.gate.outputs.backend == 'true'
    # The environment name is part of the GCP trust condition, case included.
    environment: sandbox
    # The only job that needs to mint GCP credentials.
    permissions:
      contents: read
      id-token: write

    steps:
      # Explicit ref keeps all checkouts pinned to DEPLOY_SHA if the branch moves.
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          # checkout leaves GITHUB_TOKEN in .git/config as an http extraheader.
          persist-credentials: false

      # WIF stores no GCP credential; the provider's GCP-side attribute condition is the guard.
      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.GCP_WIF_PROVIDER }}
          service_account: ${{ vars.GCP_DEPLOYER_SA }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker "${REGION}-docker.pkg.dev" --quiet

      - uses: docker/setup-buildx-action@v3

      # Commit SHA tags make rollback a known redeploy, never a mutable `latest`.
      - name: Build and push image
        uses: docker/build-push-action@v6
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/api:${{ env.DEPLOY_SHA }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render service definition
        env:
          GCP_PROJECT_ID: ${{ vars.GCP_PROJECT_ID }}
          IMAGE: ${{ env.REGION }}-docker.pkg.dev/${{ vars.GCP_PROJECT_ID }}/${{ env.AR_REPOSITORY }}/api:${{ env.DEPLOY_SHA }}
          DB_URL: ${{ secrets.SANDBOX_DB_URL }}
          FLYWAY_DB_URL: ${{ secrets.SANDBOX_FLYWAY_DB_URL }}
          DB_USER: ${{ secrets.SANDBOX_DB_USER }}
          FLYWAY_DB_USER: ${{ secrets.SANDBOX_FLYWAY_DB_USER }}
          # Must be in envsubst: literal "${R2_ENDPOINT}" is non-blank and bypasses
          # R2FileStorage's boot refusal.
          R2_ENDPOINT: ${{ vars.SANDBOX_R2_ENDPOINT }}
          R2_BUCKET_PRIVATE: ${{ vars.SANDBOX_R2_BUCKET_PRIVATE }}
          R2_BUCKET_PUBLIC: ${{ vars.SANDBOX_R2_BUCKET_PUBLIC }}
          R2_PUBLIC_BASE_URL: ${{ vars.SANDBOX_R2_PUBLIC_BASE_URL }}
          # Optional: blank leaves the admin bootstrap off — docs/DEPLOY.md §3. Secrets, not vars,
          # because run logs on a public repo print vars in clear.
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.SANDBOX_BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_MOBILE: ${{ secrets.SANDBOX_BOOTSTRAP_ADMIN_MOBILE }}
          BOOTSTRAP_ADMIN_RECOVER: ${{ vars.SANDBOX_BOOTSTRAP_ADMIN_RECOVER }}
        run: |
          set -euo pipefail
          for required in GCP_PROJECT_ID DB_URL FLYWAY_DB_URL DB_USER FLYWAY_DB_USER \
                          R2_ENDPOINT R2_BUCKET_PRIVATE R2_BUCKET_PUBLIC R2_PUBLIC_BASE_URL; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is empty. Cloud Run would start a container that fails on the first query, or refuses to boot at all." >&2
              exit 1
            fi
          done
          envsubst '${GCP_PROJECT_ID} ${IMAGE} ${DB_URL} ${FLYWAY_DB_URL} ${DB_USER} ${FLYWAY_DB_USER} ${R2_ENDPOINT} ${R2_BUCKET_PRIVATE} ${R2_BUCKET_PUBLIC} ${R2_PUBLIC_BASE_URL} ${BOOTSTRAP_ADMIN_EMAIL} ${BOOTSTRAP_ADMIN_MOBILE} ${BOOTSTRAP_ADMIN_RECOVER}' \
            < backend/deploy/cloudrun-sandbox.yaml > "${RUNNER_TEMP}/service.yaml"
          envsubst '${GCP_PROJECT_ID} ${IMAGE} ${FLYWAY_DB_URL} ${FLYWAY_DB_USER}' \
            < backend/deploy/cloudrun-migrate-sandbox.yaml > "${RUNNER_TEMP}/migrate.yaml"

      # Runs while the old revision still serves, so every migration must stay compatible with it.
      - name: Migrate the database
        run: |
          set -euo pipefail
          gcloud run jobs replace "${RUNNER_TEMP}/migrate.yaml" --region "$REGION" --quiet
          gcloud run jobs execute draazy-migrate-sandbox --region "$REGION" --wait --quiet

      # `replace`, not `deploy`: removed repo settings must not linger on the service.
      - name: Deploy to Cloud Run
        run: gcloud run services replace "${RUNNER_TEMP}/service.yaml" --region "$REGION" --quiet

      # `services replace` leaves IAM untouched; a new service would make Cloudflare 403.
      - name: Allow public invocation
        run: |
          gcloud run services add-iam-policy-binding "$SERVICE" \
            --region "$REGION" \
            --member allUsers \
            --role roles/run.invoker \
            --quiet

      # Checks external reachability through the IAM binding, which the startup probe cannot; gates the frontend.
      - name: Smoke test
        run: |
          set -euo pipefail
          url=$(gcloud run services describe "$SERVICE" --region "$REGION" --format 'value(status.url)')
          attempt=1
          max=12
          while : ; do
            if curl -fsS --max-time 15 "$url/api/actuator/health"; then
              echo
              break
            fi
            if [ "$attempt" -ge "$max" ]; then
              echo "::error::Cloud Run health check failed after ${max} attempts." >&2
              exit 1
            fi
            echo "Waiting for Cloud Run routing mesh to warm up (attempt ${attempt}/${max})..."
            attempt=$((attempt + 1))
            sleep 5
          done

      # Self-hosted runners can keep RUNNER_TEMP after the job.
      - name: Remove rendered service definition
        if: always()
        run: rm -f "${RUNNER_TEMP}/service.yaml" "${RUNNER_TEMP}/migrate.yaml"

  # Keep the deploy token away from repository code; dependency scripts can alter
  # the workspace that a later `npx` resolves from.
  frontend-build:
    name: Build the frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, backend]
    # `always()` also runs on cancel, so `!cancelled()` preserves cancellation.
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.frontend == 'true' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          # A different major here would mean the artifact that ships was produced by a toolchain nothing tested.
          node-version: '22'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails on lock drift, so the bundle uses the dependency tree CI resolved.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vite inlines every `VITE_*`; this block is the complete build-time config.
      - name: Build
        working-directory: frontend
        env:
          VITE_DEPLOY_ENV: sandbox
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_CASHFREE_MODE: ${{ vars.VITE_CASHFREE_MODE }}
          VITE_PMF_MODE: ${{ vars.VITE_PMF_MODE }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          # Missing map or analytics ids degrade; a missing Maps key breaks every map.
          if [ -z "${VITE_GOOGLE_MAPS_API_KEY}" ]; then
            echo "::error::VITE_GOOGLE_MAPS_API_KEY is empty. The build would succeed and every map would render as a watermarked grey box. Set it as a repository secret." >&2
            exit 1
          fi

          npm run build

      # The build cannot catch missing proxy/model values; the browser hangs instead.
      - name: Verify build output
        working-directory: frontend
        run: |
          set -euo pipefail
          for required in dist/index.html dist/404.html dist/_redirects dist/_headers functions/api/'[[path]]'.js \
                          dist/models/face_landmarker.task; do
            if [ ! -f "$required" ]; then
              echo "::error::Expected ${required} to exist before deploying. Refusing to publish an incomplete site." >&2
              exit 1
            fi
          done

      # Wrangler needs dist/ and functions/ side by side to publish the site and /api proxy,
      # with edge/, src/ and scripts/ for SSR/SEO Pages Functions to resolve their imports.
      - name: Upload the built site
        uses: actions/upload-artifact@v4
        with:
          name: site-${{ env.DEPLOY_SHA }}
          path: |
            frontend/dist
            frontend/functions
            frontend/edge
            frontend/src
            frontend/scripts
          if-no-files-found: error
          retention-days: 1

  frontend-publish:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Plain `needs:` already means "only if that succeeded"; the skip is handled earlier.
    needs: frontend-build
    # Backend and frontend environments stay separate because GCP trusts only `sandbox`.
    environment: sandbox-web
    permissions:
      contents: read

    steps:
      # No checkout: repository dependencies cannot redirect the `npx wrangler` resolution.
      - name: Download the built site
        uses: actions/download-artifact@v4
        with:
          name: site-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/site

      # See docs/DEPLOY.md §6.
      - name: Publish to Cloudflare Pages
        working-directory: ${{ runner.temp }}/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is empty. Set it on the 'sandbox-web' environment; the token needs Account → Cloudflare Pages → Edit and nothing else." >&2
              exit 1
            fi
          done
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$CF_PRODUCTION_BRANCH" \
            --commit-hash "$DEPLOY_SHA" \
            --commit-message "Deploy ${DEPLOY_SHA} from ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"

      # Both failure modes return 200, so the smoke test must assert the media type.
      - name: Smoke test through the proxy
        run: |
          set -euo pipefail

          body="${RUNNER_TEMP}/health.json"
          attempt=1
          max=5

          while : ; do
            ok=true

            curl -fsS --max-time 30 -o /dev/null "${SITE_URL}/" || ok=false

            # Deep links must reach the shell; unknown paths must 404, not a soft 200.
            if [ "$ok" = true ]; then
              for probe in "/listings 200" "/locality/baner 200" "/locality/smoke-area 200" "/property/smoke 404" "/no-such-page-smoke 404"; do
                set -- $probe
                code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${SITE_URL}$1") || code=000
                if [ "$code" != "$2" ]; then
                  echo "::warning::$1 answered $code, expected $2. Check the generated dist/_redirects and dist/404.html."
                  ok=false
                fi
              done
            fi

            # `/` gets dist/_headers; Function pages get SECURITY_HEADERS from edge/seo-pages.mjs, so both are probed.
            if [ "$ok" = true ]; then
              for path in / /property/smoke /society/smoke-society; do
                head=$(curl -sS --max-time 30 -o /dev/null -D - "${SITE_URL}${path}" | tr -d '\r') || head=
                for want in "^content-security-policy:.*frame-ancestors 'none'" "^strict-transport-security: *max-age=" \
                    "^x-frame-options: *deny" "^x-content-type-options: *nosniff" "^referrer-policy: *no-referrer\$"; do
                  if ! grep -qiE "$want" <<<"$head"; then
                    echo "::warning::${path} lacks a header matching ${want}. / reads dist/_headers (exactly one /* rule); Function pages read SECURITY_HEADERS."
                    ok=false
                  fi
                done
              done
            fi

            if [ "$ok" = true ]; then
              head=$(curl -sS --max-time 30 -o /dev/null -D - -H 'Origin: https://cors-probe.invalid' \
                "${SITE_URL}/api/actuator/health" | tr -d '\r') || head=
              if grep -qi '^access-control-allow-origin:' <<<"$head"; then
                echo "::warning::/api granted CORS to a foreign Origin. The proxy must strip it (functions/api) and WEB_ORIGINS must list only our sites."
                ok=false
              fi
            fi

            if [ "$ok" = true ]; then
              content_type=$(curl -fsS --max-time 60 -o "$body" -w '%{content_type}' \
                "${SITE_URL}/api/actuator/health") || ok=false
            fi

            if [ "$ok" = true ]; then
              case "$content_type" in
                *json*) ;;
                *)
                  echo "::warning::/api/actuator/health answered with content-type '${content_type}', not JSON. The Pages Function is not intercepting /api and the SPA fallback is serving index.html with a 200."
                  ok=false
                  ;;
              esac
            fi

            if [ "$ok" = true ] && ! grep -q '"status":"UP"' "$body"; then
              echo "::warning::/api/actuator/health returned JSON but not status UP."
              ok=false
            fi

            if [ "$ok" = true ]; then
              echo "::notice::${SITE_URL} is serving, and /api is proxied to a healthy backend."
              break
            fi

            if [ "$attempt" -ge "$max" ]; then
              echo "::error::${SITE_URL} did not answer correctly after ${max} attempts. Check that the Pages Function shipped (frontend/functions/) and that API_ORIGIN is set on the Pages project to the current Cloud Run URL." >&2
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 10
          done

      # The response file becomes sensitive if this ever targets an authenticated route.
      - name: Remove smoke test output
        if: always()
        run: rm -f "${RUNNER_TEMP}/health.json"
