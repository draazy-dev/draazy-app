name: Deploy (sandbox)

# One pipeline for both halves, off one commit, backend first — docs/DEPLOY.md §5.1 and §6.
on:
  workflow_dispatch:
    inputs:
      confirm:
        description: 'Type "sandbox" to confirm the target environment'
        required: true
        default: ''
      target:
        description: 'Which half to deploy'
        required: true
        default: both
        type: choice
        options:
          - both
          - backend
          - frontend

# `id-token: write` is absent here because any holder can mint deploy credentials.
permissions:
  contents: read

# One group for all four jobs, so a second dispatch's frontend cannot overtake the first's backend.
concurrency:
  group: deploy-sandbox
  cancel-in-progress: false

env:
  CF_PAGES_PROJECT: draazy
  CF_PRODUCTION_BRANCH: main

  # Only the custom domain shares a registrable domain between SPA and /api.
  # The `__Host-` refresh cookie depends on that.
  SITE_URL: https://sandbox.draazy.com

  # Pin one SHA across images, Pages and checkouts even if the branch moves mid-run.
  DEPLOY_SHA: ${{ github.sha }}

jobs:
  # One decision point for both halves, so a mistyped confirmation stops the whole run rather than half of it.
  gate:
    name: Decide what deploys
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      backend: ${{ steps.decide.outputs.backend }}
      frontend: ${{ steps.decide.outputs.frontend }}
    steps:
      - name: Confirm target
        if: inputs.confirm != 'sandbox'
        run: |
          echo "::error::Confirmation input did not match 'sandbox'. Nothing was deployed." >&2
          exit 1

      - id: decide
        name: Decide which halves deploy
        env:
          # A `choice` input, so GitHub rejects anything not on the list before the job starts.
          TARGET: ${{ inputs.target }}
        run: |
          set -euo pipefail

          emit() {
            echo "backend=$1" >> "$GITHUB_OUTPUT"
            echo "frontend=$2" >> "$GITHUB_OUTPUT"
            echo "::notice::This run deploys — backend=$1 frontend=$2"
          }

          # The chosen ref need not be main, so there is no reliable previous commit to diff.
          case "$TARGET" in
            both)     emit true  true  ;;
            backend)  emit true  false ;;
            frontend) emit false true  ;;
            *)
              echo "::error::Unknown target '${TARGET}'." >&2
              exit 1
              ;;
          esac

  backend:
    name: Build image and deploy to DigitalOcean
    runs-on: ubuntu-latest
    timeout-minutes: 40
    needs: gate
    if: needs.gate.outputs.backend == 'true'
    environment: sandbox
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - id: owner
        env:
          OWNER: ${{ github.repository_owner }}
        run: echo "lower=${OWNER,,}" >> "$GITHUB_OUTPUT"

      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/setup-buildx-action@v4

      - name: Build and push image
        uses: docker/build-push-action@v7
        with:
          context: backend
          file: backend/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.owner.outputs.lower }}/draazy-api:${{ env.DEPLOY_SHA }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Render app spec
        env:
          GHCR_OWNER: ${{ steps.owner.outputs.lower }}
          BOOTSTRAP_ADMIN_EMAIL: ${{ secrets.SANDBOX_BOOTSTRAP_ADMIN_EMAIL }}
          BOOTSTRAP_ADMIN_MOBILE: ${{ secrets.SANDBOX_BOOTSTRAP_ADMIN_MOBILE }}
          BOOTSTRAP_ADMIN_RECOVER: ${{ vars.SANDBOX_BOOTSTRAP_ADMIN_RECOVER }}
          ORIGIN_SHARED_SECRET: ${{ secrets.SANDBOX_ORIGIN_SHARED_SECRET }}
          JWT_SECRET: ${{ secrets.SANDBOX_JWT_SECRET }}
          REFERRAL_SIGNAL_SALT: ${{ secrets.SANDBOX_REFERRAL_SIGNAL_SALT }}
          IDENTITY_HASH_SECRET: ${{ secrets.SANDBOX_IDENTITY_HASH_SECRET }}
          STAFF_TOTP_KEY: ${{ secrets.SANDBOX_STAFF_TOTP_KEY }}
          IDENTITY_ENCRYPTION_KEY: ${{ secrets.SANDBOX_IDENTITY_ENCRYPTION_KEY }}
          CASHFREE_APP_ID: ${{ secrets.SANDBOX_CASHFREE_APP_ID }}
          CASHFREE_SECRET_KEY: ${{ secrets.SANDBOX_CASHFREE_SECRET_KEY }}
          ZEPTOMAIL_API_KEY: ${{ secrets.SANDBOX_ZEPTOMAIL_API_KEY }}
          R2_ENDPOINT: ${{ vars.SANDBOX_R2_ENDPOINT }}
          R2_BUCKET_PRIVATE: ${{ vars.SANDBOX_R2_BUCKET_PRIVATE }}
          R2_BUCKET_PUBLIC: ${{ vars.SANDBOX_R2_BUCKET_PUBLIC }}
          R2_PUBLIC_BASE_URL: ${{ vars.SANDBOX_R2_PUBLIC_BASE_URL }}
          R2_ACCESS_KEY_ID: ${{ secrets.SANDBOX_R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.SANDBOX_R2_SECRET_ACCESS_KEY }}
          GOOGLE_PLACES_SERVER_KEY: ${{ secrets.SANDBOX_GOOGLE_PLACES_SERVER_KEY }}
          PUSH_VAPID_PRIVATE_KEY: ${{ secrets.SANDBOX_PUSH_VAPID_PRIVATE_KEY }}
          PUSH_VAPID_PUBLIC_KEY: ${{ secrets.SANDBOX_PUSH_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail
          required="GHCR_OWNER DEPLOY_SHA ORIGIN_SHARED_SECRET JWT_SECRET REFERRAL_SIGNAL_SALT IDENTITY_HASH_SECRET
            STAFF_TOTP_KEY IDENTITY_ENCRYPTION_KEY CASHFREE_APP_ID CASHFREE_SECRET_KEY ZEPTOMAIL_API_KEY
            R2_ENDPOINT R2_BUCKET_PRIVATE R2_BUCKET_PUBLIC R2_PUBLIC_BASE_URL R2_ACCESS_KEY_ID
            R2_SECRET_ACCESS_KEY GOOGLE_PLACES_SERVER_KEY PUSH_VAPID_PRIVATE_KEY PUSH_VAPID_PUBLIC_KEY"
          for name in $required; do
            [ -n "${!name}" ] || { echo "::error::$name is empty." >&2; exit 1; }
          done
          vars=$(printf '${%s} ' $required BOOTSTRAP_ADMIN_EMAIL BOOTSTRAP_ADMIN_MOBILE BOOTSTRAP_ADMIN_RECOVER)
          envsubst "$vars" < backend/deploy/do-app-sandbox.yaml > "$RUNNER_TEMP/app.yaml"

      - uses: digitalocean/action-doctl@v2
        with:
          token: ${{ secrets.DIGITALOCEAN_ACCESS_TOKEN }}

      - id: deploy
        name: Create or update the app
        run: |
          set -euo pipefail
          id=$(doctl apps list --output json | jq -r '.[] | select(.spec.name=="draazy-api-sandbox") | .id')
          if [ -z "$id" ]; then
            doctl apps create --spec "$RUNNER_TEMP/app.yaml" --wait --output json > "$RUNNER_TEMP/app.json"
            id=$(jq -r '.[0].id' "$RUNNER_TEMP/app.json")
          else
            doctl apps update "$id" --spec "$RUNNER_TEMP/app.yaml" --wait --output json > "$RUNNER_TEMP/app.json"
          fi
          phase=$(doctl apps list-deployments "$id" --output json | jq -r '.[0].phase')
          [ "$phase" = "ACTIVE" ] || { echo "::error::Latest deployment is $phase, not ACTIVE." >&2; exit 1; }
          echo "url=$(doctl apps get "$id" --output json | jq -r '.[0].default_ingress')" >> "$GITHUB_OUTPUT"

      - name: Smoke test
        env:
          URL: ${{ steps.deploy.outputs.url }}
        run: |
          set -euo pipefail
          for attempt in $(seq 1 12); do
            curl -fsS --max-time 15 "$URL/api/actuator/health" && exit 0
            sleep 5
          done
          echo "::error::Health check failed on $URL" >&2
          exit 1

      - name: Remove rendered spec
        if: always()
        run: rm -f "$RUNNER_TEMP/app.yaml" "$RUNNER_TEMP/app.json"

  # Keep the deploy token away from repository code; dependency scripts can alter
  # the workspace that a later `npx` resolves from.
  frontend-build:
    name: Build the frontend bundle
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [gate, backend]
    # `always()` also runs on cancel, so `!cancelled()` preserves cancellation.
    if: >-
      !cancelled() &&
      needs.gate.result == 'success' &&
      needs.gate.outputs.frontend == 'true' &&
      needs.backend.result != 'failure' &&
      needs.backend.result != 'cancelled'
    permissions:
      contents: read

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.DEPLOY_SHA }}
          persist-credentials: false

      - uses: actions/setup-node@v7
        with:
          # A different major here would mean the artifact that ships was produced by a toolchain nothing tested.
          node-version: '26'
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      # `npm ci` fails on lock drift, so the bundle uses the dependency tree CI resolved.
      - name: Install dependencies
        working-directory: frontend
        run: npm ci

      # Vite inlines every `VITE_*`; this block is the complete build-time config.
      - name: Build
        working-directory: frontend
        env:
          VITE_DEPLOY_ENV: sandbox
          VITE_GOOGLE_MAPS_API_KEY: ${{ secrets.VITE_GOOGLE_MAPS_API_KEY }}
          VITE_GOOGLE_MAPS_MAP_ID: ${{ vars.VITE_GOOGLE_MAPS_MAP_ID }}
          VITE_CASHFREE_MODE: ${{ vars.VITE_CASHFREE_MODE }}
          VITE_PMF_MODE: ${{ vars.VITE_PMF_MODE }}
          VITE_GA_ID: ${{ secrets.VITE_GA_ID }}
          VITE_VAPID_PUBLIC_KEY: ${{ vars.VITE_VAPID_PUBLIC_KEY }}
        run: |
          set -euo pipefail

          # Missing map or analytics ids degrade; a missing Maps key breaks every map.
          if [ -z "${VITE_GOOGLE_MAPS_API_KEY}" ]; then
            echo "::error::VITE_GOOGLE_MAPS_API_KEY is empty. The build would succeed and every map would render as a watermarked grey box. Set it as a repository secret." >&2
            exit 1
          fi

          npm run build

      # The build cannot catch missing proxy/model values; the browser hangs instead.
      - name: Verify build output
        working-directory: frontend
        run: |
          set -euo pipefail
          for required in dist/index.html dist/404.html dist/_redirects dist/_headers functions/api/'[[path]]'.js \
                          dist/models/face_landmarker.task; do
            if [ ! -f "$required" ]; then
              echo "::error::Expected ${required} to exist before deploying. Refusing to publish an incomplete site." >&2
              exit 1
            fi
          done

      # Wrangler needs dist/ and functions/ side by side to publish the site and /api proxy,
      # with edge/, src/ and scripts/ for SSR/SEO Pages Functions to resolve their imports.
      - name: Upload the built site
        uses: actions/upload-artifact@v7
        with:
          name: site-${{ env.DEPLOY_SHA }}
          path: |
            frontend/dist
            frontend/functions
            frontend/edge
            frontend/src
            frontend/scripts
          if-no-files-found: error
          retention-days: 1

  frontend-publish:
    name: Publish to Cloudflare Pages
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # Plain `needs:` already means "only if that succeeded"; the skip is handled earlier.
    needs: frontend-build
    # Backend and frontend environments stay separate because GCP trusts only `sandbox`.
    environment: sandbox-web
    permissions:
      contents: read

    steps:
      # No checkout: repository dependencies cannot redirect the `npx wrangler` resolution.
      - name: Download the built site
        uses: actions/download-artifact@v8
        with:
          name: site-${{ env.DEPLOY_SHA }}
          path: ${{ runner.temp }}/site

      # See docs/DEPLOY.md §6.
      - name: Publish to Cloudflare Pages
        working-directory: ${{ runner.temp }}/site
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          set -euo pipefail
          for required in CLOUDFLARE_API_TOKEN CLOUDFLARE_ACCOUNT_ID; do
            if [ -z "${!required}" ]; then
              echo "::error::$required is empty. Set it on the 'sandbox-web' environment; the token needs Account → Cloudflare Pages → Edit and nothing else." >&2
              exit 1
            fi
          done
          npx --yes wrangler@4 pages deploy dist \
            --project-name "$CF_PAGES_PROJECT" \
            --branch "$CF_PRODUCTION_BRANCH" \
            --commit-hash "$DEPLOY_SHA" \
            --commit-message "Deploy ${DEPLOY_SHA} from ${GITHUB_WORKFLOW} #${GITHUB_RUN_NUMBER}"

      # Both failure modes return 200, so the smoke test must assert the media type.
      - name: Smoke test through the proxy
        run: |
          set -euo pipefail

          body="${RUNNER_TEMP}/health.json"
          attempt=1
          max=5

          while : ; do
            ok=true

            curl -fsS --max-time 30 -o /dev/null "${SITE_URL}/" || ok=false

            # Deep links must reach the shell; unknown paths must 404, not a soft 200.
            if [ "$ok" = true ]; then
              for probe in "/listings 200" "/locality/baner 200" "/locality/smoke-area 200" "/property/smoke 404" "/no-such-page-smoke 404"; do
                set -- $probe
                code=$(curl -sS --max-time 30 -o /dev/null -w '%{http_code}' "${SITE_URL}$1") || code=000
                if [ "$code" != "$2" ]; then
                  echo "::warning::$1 answered $code, expected $2. Check the generated dist/_redirects and dist/404.html."
                  ok=false
                fi
              done
            fi

            # A 404 probe cannot tell a missing listing from an unreachable API; this page's own title can.
            if [ "$ok" = true ] && ! curl -sS --max-time 30 "${SITE_URL}/rent/pune" | grep -q '<title[^>]*>Flats and homes for rent in Pune'; then
              echo "::warning::/rent/pune fell back to the bare shell, so the edge cannot read the API (API_ORIGIN, ORIGIN_SHARED_SECRET, /api prefix)."
              ok=false
            fi

            if [ "$ok" = true ] && ! curl -sS --max-time 30 -o /dev/null -D - "${SITE_URL}/" | grep -qi '^x-robots-tag: *noindex'; then
              echo "::warning::${SITE_URL}/ is indexable. Only draazy.com may be; check the host rules at the end of public/_headers."
              ok=false
            fi

            # `/` gets dist/_headers; Function pages get SECURITY_HEADERS from edge/seo-pages.mjs, so both are probed.
            if [ "$ok" = true ]; then
              for path in / /property/smoke /society/smoke-society; do
                head=$(curl -sS --max-time 30 -o /dev/null -D - "${SITE_URL}${path}" | tr -d '\r') || head=
                for want in "^content-security-policy:.*frame-ancestors 'none'" "^strict-transport-security: *max-age=" \
                    "^x-frame-options: *deny" "^x-content-type-options: *nosniff" "^referrer-policy: *no-referrer\$"; do
                  if ! grep -qiE "$want" <<<"$head"; then
                    echo "::warning::${path} lacks a header matching ${want}. / reads dist/_headers (exactly one /* rule); Function pages read SECURITY_HEADERS."
                    ok=false
                  fi
                done
              done
            fi

            if [ "$ok" = true ]; then
              head=$(curl -sS --max-time 30 -o /dev/null -D - -H 'Origin: https://cors-probe.invalid' \
                "${SITE_URL}/api/actuator/health" | tr -d '\r') || head=
              if grep -qi '^access-control-allow-origin:' <<<"$head"; then
                echo "::warning::/api granted CORS to a foreign Origin. The proxy must strip it (functions/api) and WEB_ORIGINS must list only our sites."
                ok=false
              fi
            fi

            if [ "$ok" = true ]; then
              content_type=$(curl -fsS --max-time 60 -o "$body" -w '%{content_type}' \
                "${SITE_URL}/api/actuator/health") || ok=false
            fi

            if [ "$ok" = true ]; then
              case "$content_type" in
                *json*) ;;
                *)
                  echo "::warning::/api/actuator/health answered with content-type '${content_type}', not JSON. The Pages Function is not intercepting /api and the SPA fallback is serving index.html with a 200."
                  ok=false
                  ;;
              esac
            fi

            if [ "$ok" = true ] && ! grep -q '"status":"UP"' "$body"; then
              echo "::warning::/api/actuator/health returned JSON but not status UP."
              ok=false
            fi

            if [ "$ok" = true ]; then
              echo "::notice::${SITE_URL} is serving, and /api is proxied to a healthy backend."
              break
            fi

            if [ "$attempt" -ge "$max" ]; then
              echo "::error::${SITE_URL} did not answer correctly after ${max} attempts. Check that the Pages Function shipped (frontend/functions/) and that API_ORIGIN is set on the Pages project to the current backend URL." >&2
              exit 1
            fi

            attempt=$((attempt + 1))
            sleep 10
          done

      # The response file becomes sensitive if this ever targets an authenticated route.
      - name: Remove smoke test output
        if: always()
        run: rm -f "${RUNNER_TEMP}/health.json"
