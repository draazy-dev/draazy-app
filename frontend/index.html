    <!-- Before first paint, or a light-theme visitor sees a dark flash. Mirrors applyAppPrefs and the default theme in src/lib/localPrefs.js.
         Its sha256 is pinned in the CSP here, in public/_headers and in edge/seo-pages.mjs. -->
    <script>try { if (JSON.parse(localStorage.getItem('dzAppPrefs') || '{}').theme !== 'dark') { document.documentElement.classList.add('light'); document.querySelector('meta[name="color-scheme"]').content = 'light'; document.querySelector('meta[name="theme-color"]').content = '#f3f7f6'; var f = document.querySelector('link[rel="icon"]'); f.dataset.dark = f.href; f.href = f.dataset.light; } } catch (e) {}</script>

    <!-- `preconnect` warms the socket but cannot remove the hop, and on a 4G phone Outfit ships 400/500/600/700/800 — the five weights the app actually uses. -->

    <!-- Starts the reference-data read, and the signed-in shell's when a token is stored, before the bundle loads; services/http.js
         adopts them. A <link rel="preload"> was blocked by the CSP after the first load, so these are fetches with buffered bodies. -->
    <script>(function () { function early(path, token) { var h = { Accept: 'application/json' }; if (token) h.Authorization = 'Bearer ' + token; return fetch('__API_BASE__' + path, { credentials: 'include', headers: h }).then(function (r) { return r.blob().then(function (b) { return new Response(b, { status: r.status, statusText: r.statusText, headers: r.headers }); }); }).catch(function () { return null; }); } window.__dzBootstrap = early('/bootstrap'); try { var t = JSON.parse(localStorage.getItem('draazyTokens') || sessionStorage.getItem('draazyTokens') || 'null'); if (t && t.accessToken) { window.__dzMeBootstrap = early('/me/bootstrap', t.accessToken); window.__dzMeBootstrap.token = t.accessToken; } } catch (e) {} })();</script>
