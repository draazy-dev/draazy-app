# One project for both halves: they share a contract, so one dashboard and one New Code baseline.
# The free plan has no LOC cap only while the repo is public (~188k ncloc; the private cap is 50k).
sonar.projectKey=draazy-dev_draazy-app
sonar.organization=draazy-dev
sonar.projectName=Draazy

# Stated because a scanner left to guess on Windows reads cp1252 and mangles every em-dash.
sonar.sourceEncoding=UTF-8

# frontend/functions and frontend/edge are the Cloudflare proxy that holds the origin secret.
# .github, the Dockerfile and backend/deploy get Sonar's GitHub Actions, Docker and secrets rules.
sonar.sources=\
  frontend/src,\
  frontend/functions,\
  frontend/edge,\
  frontend/index.html,\
  backend/src/main,\
  backend/Dockerfile,\
  backend/deploy,\
  .github
sonar.tests=backend/src/test,e2e

# Without real .class files SonarJava skips the module and reports it clean. `target-cli` because
# backend/.mvn/maven.config sets -DbuildDirName=target-cli; the CI sonar job compiles first.
sonar.java.binaries=backend/target-cli/classes
sonar.java.test.binaries=backend/target-cli/test-classes
sonar.java.libraries=backend/target-cli/deps/*.jar
sonar.java.test.libraries=backend/target-cli/deps/*.jar
sonar.java.source=25

# Produced by the CI backend job and handed to the sonar job as the backend-test-reports artifact.
# No JS coverage: the frontend has no unit runner, only Playwright e2e.
sonar.coverage.jacoco.xmlReportPaths=backend/target-cli/site/jacoco/jacoco.xml
sonar.junit.reportPaths=backend/target-cli/surefire-reports

# societies-rera.js is 182 KB of generated minified data, not logic.
sonar.exclusions=\
  backend/target/**,\
  backend/target-*/**,\
  frontend/dist/**,\
  frontend/public/**,\
  graphify-out/**,\
  e2e/playwright-report/**,\
  e2e/test-results/**,\
  **/node_modules/**,\
  **/*.test.mjs,\
  frontend/src/data/societies-rera.js
