# Standalone near-copy of the prod file; SandboxProfileContractTest holds the two to parity.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
draazy.security.jwt.secret=${JWT_SECRET}
draazy.security.referral-signal-salt=${REFERRAL_SIGNAL_SALT}
draazy.security.identity-hash-secret=${IDENTITY_HASH_SECRET}
draazy.security.identity-key=${IDENTITY_ENCRYPTION_KEY}
draazy.security.identity-key-id=${IDENTITY_ENCRYPTION_KEY_ID}
draazy.security.staff-totp-key=${STAFF_TOTP_KEY}
draazy.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET}

# Hardcoded, not ${ENV}: no environment wants a 30-day credential in clear on the wire.
draazy.security.refresh-cookie.secure=true

draazy.web.cors.allowed-origins=${WEB_ORIGINS}

draazy.web.public-origin=${API_PUBLIC_ORIGIN}

# Required behind a transaction-mode pooler: named prepared statements break on the 6th execution.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

spring.datasource.hikari.max-lifetime=600000

# `prefer` SILENTLY falls back to plaintext; `require` is the floor, verify-full still needs the CA.
spring.datasource.hikari.data-source-properties.sslmode=require

# Only the --migrate-only pre-deploy job migrates; the serving app never holds the schema-owner role.
spring.flyway.enabled=false

spring.flyway.url=${FLYWAY_DB_URL}
spring.flyway.user=${FLYWAY_DB_USER}
spring.flyway.password=${FLYWAY_DB_PASSWORD}

# The one intentional difference from prod: the demo catalogue. Never promote this database to production.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

logging.structured.format.console=ecs

# `health` only: `info` publishes build, git and Java versions to the internet.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Re-pinned because `local,sandbox` also loads the loosened file. Sandbox codes are real SMS.
draazy.otp.send-cooldown-seconds=60
draazy.otp.max-sends-per-window=5
draazy.otp.max-sends-per-day=10
draazy.otp.max-sends-per-ip-per-window=20

# Pinned, or an active `e2e` raises the deployment-wide hourly OTP ceiling to 100000.
draazy.otp.max-platform-sends-per-window=500

draazy.otp.max-verify-attempts=3

# Pinned empty so an active `e2e` cannot hand a deployment a predictable login code.
draazy.otp.fixed-code=

# Pinned empty like prod: a fixed authenticator code would void staff 2FA.
draazy.staff-totp.fixed-code=

# Pinned empty like prod: sandbox delivers real codes over WhatsApp.
draazy.otp.sandbox-code=

# Must be the load balancer's real CIDR; wrong puts the whole internet in one rate-limit bucket.
draazy.security.trusted-proxies=${INTERNAL_PROXIES}

# Without it the *.ondigitalocean.app URL serves anyone and rate-limiter client addresses can be forged.
draazy.security.origin-secret=${ORIGIN_SHARED_SECRET}
