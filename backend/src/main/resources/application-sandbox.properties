# Profile 3 of 4 (sandbox): the shared test environment, standalone and a near-copy of the prod file
# rather than a delta on it. SandboxProfileContractTest holds the two to parity: docs/system/profiles.md.

# Fail fast if the real secrets/datasource aren't provided by the environment. Same variable NAMES as
# prod, different VALUES -- a separate database and its own GitHub environment secrets.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
draazy.security.jwt.secret=${JWT_SECRET}
draazy.security.referral-signal-salt=${REFERRAL_SIGNAL_SALT}
draazy.security.identity-hash-secret=${IDENTITY_HASH_SECRET}
draazy.security.identity-key=${IDENTITY_ENCRYPTION_KEY}
draazy.security.identity-key-id=${IDENTITY_ENCRYPTION_KEY_ID}
draazy.security.staff-totp-key=${STAFF_TOTP_KEY}
draazy.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET}

# Hardcoded, not ${ENV}: no environment wants a 30-day credential in clear on the wire.
draazy.security.refresh-cookie.secure=true

# Without this a deploy refuses its own frontend, as opaque browser CORS errors and 200s in the log.
draazy.web.cors.allowed-origins=${WEB_ORIGINS}

# The origin the BROWSER uses, so CookieDeliveryCheck can prove same-site at boot. Unset, it skips.
draazy.web.public-origin=${API_PUBLIC_ORIGIN}

# Safe behind a transaction-mode pooler (DO connection pool / PgBouncer), which gives each transaction
# a different backend, so named prepared statements would break on the 6th execution.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Small and allowed to drain: N instances holding 10 idle slots each exhaust a small database's connections.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Shorter than a pooler's idle reaping; Hikari's 30-minute default hands dead sockets to requests.
spring.datasource.hikari.max-lifetime=600000

# pgjdbc defaults to `prefer`, which SILENTLY falls back to plaintext. `require` is the floor, not
# the goal -- it does not authenticate the server, so verify-full still needs the CA (docs/DEPLOY.md).
spring.datasource.hikari.data-source-properties.sslmode=require

# Only the `--migrate-only` pre-deploy job migrates; the serving app never holds the owner role (docs/DEPLOY.md §2.1).
spring.flyway.enabled=false

# Session connection (pg_advisory_lock) as the schema owner, on its own DataSource, so user and password are
# explicit. The dev database has one user, so DatabasePrivilegeCheck only warns (docs/DEPLOY.md §2.1).
spring.flyway.url=${FLYWAY_DB_URL}
spring.flyway.user=${FLYWAY_DB_USER}
spring.flyway.password=${FLYWAY_DB_PASSWORD}

# THE ONE INTENTIONAL DIFFERENCE FROM PROD: the demo catalogue, so the shared environment has
# something to look at. Repeatable, so a seeded database can never be promoted to production.
spring.flyway.locations=classpath:db/migration,classpath:db/seed

logging.structured.format.console=ecs

# `health` only -- `info` publishes build, git and Java version to the internet, which serves attackers.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Re-pinned because `local,sandbox` would otherwise load the loosened file. Sandbox sends REAL codes
# through the same gateway prod uses: they cost money and ring a stranger's phone.
draazy.otp.send-cooldown-seconds=60
draazy.otp.max-sends-per-window=5
draazy.otp.max-sends-per-day=10
draazy.otp.max-sends-per-ip-per-window=20

# Keyed on nothing, so this is the whole deployment's hourly ceiling. Left unpinned an active `e2e`
# raises it to 100000 -- and sandbox codes are real SMS.
draazy.otp.max-platform-sends-per-window=500

# Pinned so the value cannot arrive from a properties file active alongside this one. Not a lock:
# DRAAZY_OTP_MAX_VERIFY_ATTEMPTS still outranks it, and rejectUnusableAttemptCap is the only ceiling.
draazy.otp.max-verify-attempts=3

# Pinned empty so an active `e2e` cannot hand a deployment a predictable login code, which also keeps
# OtpService.rejectFixedCodeInProduction armed here.
draazy.otp.fixed-code=

# Pinned empty like prod: a fixed authenticator code would void staff 2FA.
draazy.staff-totp.fixed-code=

# Pinned empty like prod: sandbox delivers real codes over WhatsApp (docs/DEPLOY.md §3.1).
draazy.otp.sandbox-code=

# Must be the load balancer's actual CIDR as a Java regex. Wrong here puts the whole internet in one
# bucket, so one host sending 120 logins a minute 429s every anonymous write on the platform.
draazy.security.trusted-proxies=${INTERNAL_PROXIES}

# Sent by the Pages Function as X-Proxy-Auth. Without it the *.ondigitalocean.app URL serves anyone who finds
# it, and any address the rate limiter trusts can be forged -- docs/DEPLOY.md §4.
draazy.security.origin-secret=${ORIGIN_SHARED_SECRET}
