spring.application.name=draazy-api

# A container that ignores the injected PORT fails its health check.
server.port=${PORT:8080}

server.servlet.context-path=/api

# Relative redirects, or an absolute Location leaks the origin's Host and scheme behind the edge proxy.
server.tomcat.use-relative-redirects=true

# `text/event-stream` must stay out of the MIME list, or SSE responses get buffered.
server.compression.enabled=true

server.tomcat.threads.max=50

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# `/actuator/info` is permitAll, so build-info stays off or it discloses version and build time.
management.info.build.enabled=false

# Never `draazy_test`: that database belongs to the Java suite's exact row counts.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/draazy}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

spring.jpa.open-in-view=false

# Setting this REPLACES Flyway's default location, so db/migration must stay listed.
spring.flyway.locations=classpath:db/migration
spring.flyway.sql-migration-prefix=

# Spring's default of 2000 on public GET /properties is an amplification vector.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

draazy.security.jwt.secret=${JWT_SECRET:dev-only-hs256-secret-key-that-is-long-enough-32b}

draazy.security.jwt.refresh-grace=15s

# On means `__Host-` prefixed cookie names, which require Path=/ (so no `path`).
draazy.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# Lax is why /auth/refresh needs no CSRF token of its own; do not loosen it.
draazy.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

# Refused outside 1..20 at boot: 0 locks everyone out, a large number voids the brute-force cap.
draazy.otp.max-verify-attempts=${DRAAZY_OTP_MAX_VERIFY_ATTEMPTS:3}

draazy.web.public-origin=${API_PUBLIC_ORIGIN:}

# Unsalted SHA-256 of an IPv4 is a rainbow table, not a hash.
draazy.security.referral-signal-salt=${REFERRAL_SIGNAL_SALT:dev-only-referral-signal-salt}

# A 12-digit Aadhaar is enumerable, so the dedup digest must be keyed or it reverses offline.
draazy.security.identity-hash-secret=${IDENTITY_HASH_SECRET:dev-only-identity-hash-secret}

# The key id is stored in each value; to rotate, make a new key current and list the old as keyId:base64key.
draazy.security.identity-key=${IDENTITY_ENCRYPTION_KEY:2oh5y8Uo5ETsnB8k4cETSkKRRyYj3+wtXw++y48anfY=}
draazy.security.identity-key-id=${IDENTITY_ENCRYPTION_KEY_ID:dev}
draazy.security.identity-retired-keys=${IDENTITY_RETIRED_KEYS:}

# The dev seed encrypts staff TOTP secrets under this default; changing it breaks seeded staff 2FA locally.
draazy.security.staff-totp-key=${STAFF_TOTP_KEY:C64v20lxf+ZYULQuk6gRhsim9MRjT7Mn5lyVhbKor9M=}

draazy.identity.image-retention-days=7
draazy.identity.pending-ttl=P14D

# A locked group run holds 2 connections; more threads starve Hikari's 5 for HTTP.
spring.task.scheduling.pool.size=2
draazy.jobs.enabled=true
draazy.jobs.frequent.cron=0 */15 * * * *
draazy.jobs.hourly.cron=0 5 * * * *
draazy.jobs.nightly.cron=0 0 0 * * *
draazy.jobs.daytime.cron=0 0 10 * * *
draazy.jobs.abandoned-checkouts.enabled=true
draazy.jobs.pass-refunds.enabled=true
draazy.jobs.listing-duplicates.enabled=true
draazy.jobs.subscription-expiry.enabled=true
draazy.jobs.saved-search-counts.enabled=true
draazy.jobs.page-view-rollup.enabled=true
draazy.jobs.refresh-tokens.enabled=true
draazy.jobs.referral-signal-retention.enabled=true
draazy.jobs.co-fill-invite-retention.enabled=true
draazy.jobs.service-request-identity-retention.enabled=true
draazy.jobs.notification-retention.enabled=true
draazy.jobs.page-view-retention.enabled=true
draazy.jobs.provider-call-retention.enabled=true
draazy.jobs.listing-content-purge.enabled=true
draazy.jobs.photo-upload-sweep.enabled=true
draazy.jobs.photo-webp-backfill.enabled=true
draazy.jobs.error-event-retention.enabled=true
draazy.jobs.audit-log-retention.enabled=true
draazy.jobs.identity-image-purge.enabled=true
draazy.jobs.identity-delete-retry.enabled=true
draazy.jobs.identity-conflict-retention.enabled=true
draazy.jobs.identity-pending-expiry.enabled=true
draazy.jobs.contact-returns.enabled=true
draazy.jobs.referral-holds.enabled=true
draazy.jobs.needs-info.enabled=true
draazy.jobs.flatmate-owner-tier.enabled=true
draazy.jobs.flatmate-agreement-expiry.enabled=true
draazy.jobs.flatmate-draazy-agreements.enabled=true
draazy.jobs.flatmate-post-reminders.enabled=true
draazy.jobs.flatmate-post-expiry.enabled=true
draazy.jobs.flatmate-owner-notice-purge.enabled=true
draazy.jobs.renewal-reminders.enabled=true
draazy.jobs.lease-end-reminders.enabled=true
draazy.jobs.tracked-rent-reminders.enabled=true
draazy.jobs.waiting-digest.enabled=true
draazy.jobs.staff-sla.enabled=true

logging.pattern.correlation=[%X{traceId:-}]\u0020
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache=WARN
logging.level.com.draazy.api=INFO

draazy.error-log.enabled=true

# Cashfree signs callbacks with x-client-secret and issues no separate webhook secret.
draazy.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET:dev-webhook-secret}

draazy.providers.cashfree.enabled=${CASHFREE_ENABLED:false}
draazy.providers.cashfree.base-url=${CASHFREE_BASE_URL:https://sandbox.cashfree.com}
draazy.providers.cashfree.app-id=${CASHFREE_APP_ID:}
draazy.providers.cashfree.secret-key=${CASHFREE_SECRET_KEY:}

draazy.providers.cashfree.notify-url=${CASHFREE_NOTIFY_URL:}
draazy.payments.abandoned-checkout-ttl-minutes=20

draazy.storage.dir=${STORAGE_DIR:${java.io.tmpdir}/draazy-storage}

draazy.providers.storage.enabled=${STORAGE_ENABLED:false}
draazy.providers.storage.endpoint=${R2_ENDPOINT:}
draazy.providers.storage.access-key-id=${R2_ACCESS_KEY_ID:}
draazy.providers.storage.secret-access-key=${R2_SECRET_ACCESS_KEY:}
draazy.providers.storage.public-bucket=${R2_BUCKET_PUBLIC:}
draazy.providers.storage.private-bucket=${R2_BUCKET_PRIVATE:}
draazy.providers.storage.public-base-url=${R2_PUBLIC_BASE_URL:}

draazy.providers.whatsapp.enabled=${WHATSAPP_ENABLED:false}
draazy.providers.whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com}
draazy.providers.whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
draazy.providers.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
draazy.providers.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
draazy.providers.whatsapp.otp-template-name=${WHATSAPP_OTP_TEMPLATE_NAME:}
draazy.providers.whatsapp.otp-template-lang=${WHATSAPP_OTP_TEMPLATE_LANG:en_US}
draazy.providers.whatsapp.identity-template-name=${WHATSAPP_IDENTITY_TEMPLATE_NAME:}
draazy.providers.whatsapp.identity-template-lang=${WHATSAPP_IDENTITY_TEMPLATE_LANG:en_US}
draazy.providers.whatsapp.digest-template-name=${WHATSAPP_DIGEST_TEMPLATE_NAME:}
draazy.providers.whatsapp.digest-template-lang=${WHATSAPP_DIGEST_TEMPLATE_LANG:en_US}
draazy.providers.whatsapp.owner-notice-template-name=${WHATSAPP_OWNER_NOTICE_TEMPLATE_NAME:}
draazy.providers.whatsapp.owner-notice-template-lang=${WHATSAPP_OWNER_NOTICE_TEMPLATE_LANG:en_US}
draazy.providers.whatsapp.owner-notice-phone-number-id=${WHATSAPP_OWNER_NOTICE_PHONE_NUMBER_ID:}
draazy.providers.whatsapp.service-template-name=${WHATSAPP_SERVICE_TEMPLATE_NAME:}
draazy.providers.whatsapp.service-template-lang=${WHATSAPP_SERVICE_TEMPLATE_LANG:en_US}
draazy.providers.whatsapp.app-secret=${WHATSAPP_APP_SECRET:}
draazy.providers.whatsapp.webhook-verify-token=${WHATSAPP_WEBHOOK_VERIFY_TOKEN:}
draazy.flatmates.owner-notices-per-hour=30

draazy.providers.push.vapid-public-key=${PUSH_VAPID_PUBLIC_KEY:}
draazy.providers.push.vapid-private-key=${PUSH_VAPID_PRIVATE_KEY:}
draazy.providers.push.subject=${PUSH_VAPID_SUBJECT:mailto:noreply@draazy.com}

draazy.providers.zeptomail.enabled=${ZEPTOMAIL_ENABLED:false}
draazy.providers.zeptomail.base-url=${ZEPTOMAIL_BASE_URL:https://cpaas.zoho.in}
draazy.providers.zeptomail.api-key=${ZEPTOMAIL_API_KEY:}
draazy.providers.zeptomail.from-address=${ZEPTOMAIL_FROM_ADDRESS:noreply@draazy.com}
draazy.providers.zeptomail.from-name=${ZEPTOMAIL_FROM_NAME:Draazy}

draazy.google.places.server-key=${GOOGLE_PLACES_SERVER_KEY:}
draazy.google.places.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}

draazy.app.base-url=${APP_BASE_URL:https://draazy.com}
draazy.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
draazy.bootstrap.admin.mobile=${BOOTSTRAP_ADMIN_MOBILE:}
draazy.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Administrator}
draazy.bootstrap.admin.recover=${BOOTSTRAP_ADMIN_RECOVER:}

# Just above DocumentUploads.MAX_BYTES, so our 413 naming the limit wins over the container's.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

draazy.security.rate-limit.enabled=true
draazy.security.rate-limit.writes-per-window=120
draazy.security.rate-limit.window-seconds=60

# `memory` is correct for exactly one instance; a second silently multiplies the budget.
draazy.ratelimit.store=${RATELIMIT_STORE:memory}

draazy.cache.public-reads.ttl=${PUBLIC_READ_CACHE_TTL:30s}

draazy.cache.settings.ttl=${SETTINGS_CACHE_TTL:30s}

# Fails CLOSED: failing open makes the attack "break the verifier", easier than solving the challenge.
draazy.security.turnstile.enabled=${TURNSTILE_ENABLED:false}
draazy.security.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
draazy.security.turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
draazy.security.turnstile.connect-timeout-seconds=3
draazy.security.turnstile.read-timeout-seconds=5

# `none` trusts the socket address: wrong behind any load balancer, where one host would rate-limit everyone.
draazy.security.trusted-proxies=none

draazy.security.origin-secret=none
