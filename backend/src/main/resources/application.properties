spring.application.name=draazy-api

# The base every profile layers on, in the order a change travels: local -> e2e -> sandbox -> prod.
# What each tier is for, and which of them are standalone rather than deltas: docs/system/profiles.md.

# The container host may inject PORT; a container that ignores it fails its health check. 8080 keeps local dev working.
server.port=${PORT:8080}

# Routes.java is written relative to this: health is /api/actuator/health, Swagger UI /api/docs.
server.servlet.context-path=/api

# Behind the edge proxy the container sees the origin's Host and scheme; an absolute Location would leak them.
server.tomcat.use-relative-redirects=true

# Default MIME list (JSON, text, JS, CSS) over 2 KB; `text/event-stream` is not in it, so SSE is never buffered.
server.compression.enabled=true

management.endpoints.web.exposure.include=health,info
management.endpoint.health.probes.enabled=true

# `/actuator/info` is permitAll, so build-info would disclose artifact, version and build time --
# off here too, so a boot that loses the prod profile still discloses nothing.
management.info.build.enabled=false

# Env-overridable so a clone can boot; prod re-declares these bare so a missing secret fails the boot.
# Deliberately NOT `draazy_test` -- that database belongs to the Java suite's exact row counts.
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/draazy}
spring.datasource.username=${DB_USER:postgres}
spring.datasource.password=${DB_PASSWORD:postgres}

# Flyway owns the schema; Hibernate only validates, so a green boot proves entities match migrations.
spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# OSIV off. No controller returns an entity, so a missed fetch is an exception, not a silent N+1.
spring.jpa.open-in-view=false

# Migrations only. The seed is named by application-local/-sandbox, so it must be asked for by name.
# Listing db/migration is required: setting this REPLACES Flyway's default location, it does not add.
spring.flyway.locations=classpath:db/migration
# Versioned migrations are named <yy>.<mm>.<seq>__<description>.sql (26.10.01__...), with no `V` prefix.
spring.flyway.sql-migration-prefix=

# Contract cap is 100; Spring's own default is 2000, which on public GET /properties is amplification.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Local-only HS256 signing key (must be >= 32 bytes). Prod overrides with a bare ${JWT_SECRET}.
draazy.security.jwt.secret=${JWT_SECRET:dev-only-hs256-secret-key-that-is-long-enough-32b}

# Two tabs waking together both refresh; the loser presents a token spent milliseconds ago.
draazy.security.jwt.refresh-grace=15s

# Defaults TRUE; the localhost affordance lives in application-local.properties and must be asked for.
# It also decides the cookie NAMES: on means `__Host-` prefixed, which requires Path=/ (so no `path`).
draazy.security.refresh-cookie.secure=${REFRESH_COOKIE_SECURE:true}

# Lax is the design, not a default to tune: it is why /auth/refresh needs no CSRF token of its own.
draazy.security.refresh-cookie.same-site=${REFRESH_COOKIE_SAME_SITE:Lax}

# Wrong guesses allowed against one login code before it is burned. Refused outside 1..20 at boot:
# 0 locks everyone out, and a large number stops the cap being a brute-force defence.
draazy.otp.max-verify-attempts=${DRAAZY_OTP_MAX_VERIFY_ATTEMPTS:3}

# Feeds CookieDeliveryCheck only. Blank locally, where the API is reached through the Vite proxy.
draazy.web.public-origin=${API_PUBLIC_ORIGIN:}

# Salt for referral fraud digests. Unsalted SHA-256 of an IPv4 is a rainbow table, not a hash.
draazy.security.referral-signal-salt=${REFERRAL_SIGNAL_SALT:dev-only-referral-signal-salt}

# Key for the identity-document dedup HMAC. A 12-digit Aadhaar is enumerable, so a plain hash of it
# would be reversible offline by anyone holding the table.
draazy.security.identity-hash-secret=${IDENTITY_HASH_SECRET:dev-only-identity-hash-secret}

# AES-256 key (base64 of 32 bytes) for service_request_identities.pan/aadhaar, and its id. The id is
# stored in each value; to rotate, make a new key current and list the old one as keyId:base64key.
draazy.security.identity-key=${IDENTITY_ENCRYPTION_KEY:2oh5y8Uo5ETsnB8k4cETSkKRRyYj3+wtXw++y48anfY=}
draazy.security.identity-key-id=${IDENTITY_ENCRYPTION_KEY_ID:dev}
draazy.security.identity-retired-keys=${IDENTITY_RETIRED_KEYS:}

# AES-256 key (base64 of 32 bytes) for staff authenticator secrets. The dev seed encrypts under this
# default, so changing it leaves seeded staff unable to pass the second factor locally.
draazy.security.staff-totp-key=${STAFF_TOTP_KEY:C64v20lxf+ZYULQuk6gRhsim9MRjT7Mn5lyVhbKor9M=}

# Identity images are deleted this many days after a staff decision; the row keeps only last-4/name/DOB.
draazy.identity.image-retention-days=7
draazy.identity.pending-ttl=P14D
draazy.identity.qa-sample-rate=0.25

# A locked group run holds 2 DB connections (lock + work); 2 threads keep hikari's 5 from starving HTTP.
spring.task.scheduling.pool.size=2
draazy.jobs.enabled=true
draazy.jobs.frequent.cron=0 */15 * * * *
draazy.jobs.hourly.cron=0 5 * * * *
draazy.jobs.nightly.cron=0 0 0 * * *
draazy.jobs.daytime.cron=0 0 10 * * *
draazy.jobs.abandoned-checkouts.enabled=true
draazy.jobs.pass-refunds.enabled=true
draazy.jobs.listing-duplicates.enabled=true
draazy.jobs.subscription-expiry.enabled=true
draazy.jobs.saved-search-counts.enabled=true
draazy.jobs.page-view-rollup.enabled=true
draazy.jobs.refresh-tokens.enabled=true
draazy.jobs.referral-signal-retention.enabled=true
draazy.jobs.co-fill-invite-retention.enabled=true
draazy.jobs.service-request-identity-retention.enabled=true
draazy.jobs.notification-retention.enabled=true
draazy.jobs.page-view-retention.enabled=true
draazy.jobs.provider-call-retention.enabled=true
draazy.jobs.error-event-retention.enabled=true
draazy.jobs.audit-log-retention.enabled=true
draazy.jobs.identity-image-purge.enabled=true
draazy.jobs.identity-delete-retry.enabled=true
draazy.jobs.identity-conflict-retention.enabled=true
draazy.jobs.identity-pending-expiry.enabled=true
draazy.jobs.contact-returns.enabled=true
draazy.jobs.referral-holds.enabled=true
draazy.jobs.needs-info.enabled=true
draazy.jobs.flatmate-owner-tier.enabled=true
draazy.jobs.flatmate-agreement-expiry.enabled=true
draazy.jobs.flatmate-draazy-agreements.enabled=true
draazy.jobs.flatmate-post-reminders.enabled=true
draazy.jobs.flatmate-post-expiry.enabled=true
draazy.jobs.renewal-reminders.enabled=true
draazy.jobs.tracked-rent-reminders.enabled=true
draazy.jobs.waiting-digest.enabled=true

logging.pattern.correlation=[%X{traceId:-}]\u0020
logging.level.org.hibernate=WARN
logging.level.org.springframework.security=WARN
logging.level.com.zaxxer.hikari=WARN
logging.level.org.apache=WARN
logging.level.com.draazy.api=INFO

draazy.error-log.enabled=true

# Cashfree signs callbacks with x-client-secret and issues no separate webhook secret.
# The fallback only makes the mock flow demoable; prod overrides it bare.
draazy.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET:dev-webhook-secret}

# Off wires the mocks and CashfreeClient is never instantiated. Deliberately independent of profile:
# "which environment" and "do we hold vendor keys" are separate questions.
draazy.providers.cashfree.enabled=${CASHFREE_ENABLED:false}
draazy.providers.cashfree.base-url=${CASHFREE_BASE_URL:https://sandbox.cashfree.com}
draazy.providers.cashfree.app-id=${CASHFREE_APP_ID:}
draazy.providers.cashfree.secret-key=${CASHFREE_SECRET_KEY:}

# Blank falls back to the dashboard endpoint, which is the deployed arrangement; a local tunnel
# sets it because its address changes on every restart.
draazy.providers.cashfree.notify-url=${CASHFREE_NOTIFY_URL:}
draazy.payments.abandoned-checkout-ttl-minutes=20

# Where MockFileStorage writes, so a local upload is a real side effect rather than a URL-shaped lie.
draazy.storage.dir=${STORAGE_DIR:${java.io.tmpdir}/draazy-storage}

# Cloudflare R2. Off wires the local-disk mock (local) or the throwing stub (elsewhere).
draazy.providers.storage.enabled=${STORAGE_ENABLED:false}
draazy.providers.storage.endpoint=${R2_ENDPOINT:}
draazy.providers.storage.access-key-id=${R2_ACCESS_KEY_ID:}
draazy.providers.storage.secret-access-key=${R2_SECRET_ACCESS_KEY:}
draazy.providers.storage.public-bucket=${R2_BUCKET_PUBLIC:}
draazy.providers.storage.private-bucket=${R2_BUCKET_PRIVATE:}
draazy.providers.storage.public-base-url=${R2_PUBLIC_BASE_URL:}

# WhatsApp Cloud API login OTP. Off logs the code locally and throws everywhere else; the
# flag wins over the profile, and otp-template-name must be an APPROVED AUTHENTICATION template.
draazy.providers.whatsapp.enabled=${WHATSAPP_ENABLED:false}
draazy.providers.whatsapp.base-url=${WHATSAPP_BASE_URL:https://graph.facebook.com}
draazy.providers.whatsapp.api-version=${WHATSAPP_API_VERSION:v23.0}
draazy.providers.whatsapp.phone-number-id=${WHATSAPP_PHONE_NUMBER_ID:}
draazy.providers.whatsapp.access-token=${WHATSAPP_ACCESS_TOKEN:}
draazy.providers.whatsapp.otp-template-name=${WHATSAPP_OTP_TEMPLATE_NAME:}
draazy.providers.whatsapp.otp-template-lang=${WHATSAPP_OTP_TEMPLATE_LANG:en_US}
# Optional UTILITY template for the identity-verification decision ({{1}} = outcome sentence).
# Blank means the decision is in-app only; the WhatsApp leg is skipped with a log line.
draazy.providers.whatsapp.identity-template-name=${WHATSAPP_IDENTITY_TEMPLATE_NAME:}
draazy.providers.whatsapp.identity-template-lang=${WHATSAPP_IDENTITY_TEMPLATE_LANG:en_US}
# Optional UTILITY template for the daily "waiting on you" digest ({{1}} = e.g. "3 requests"). Blank skips the send.
draazy.providers.whatsapp.digest-template-name=${WHATSAPP_DIGEST_TEMPLATE_NAME:}
draazy.providers.whatsapp.digest-template-lang=${WHATSAPP_DIGEST_TEMPLATE_LANG:en_US}

# Web Push (RFC 8291/8292). Both keys blank wires the logging sender; the private key selects the real one.
# Generate once with `npx web-push generate-vapid-keys`; the public key is also the frontend's VITE_VAPID_PUBLIC_KEY.
draazy.providers.push.vapid-public-key=${PUSH_VAPID_PUBLIC_KEY:}
draazy.providers.push.vapid-private-key=${PUSH_VAPID_PRIVATE_KEY:}
draazy.providers.push.subject=${PUSH_VAPID_SUBJECT:mailto:noreply@draazy.com}

# Zoho ZeptoMail (CPaaS) transactional email. Off logs recipient domain + subject only, never the body.
# api-key is the agent's Send Mail token; from-address must sit on a domain verified in the console.
draazy.providers.zeptomail.enabled=${ZEPTOMAIL_ENABLED:false}
draazy.providers.zeptomail.base-url=${ZEPTOMAIL_BASE_URL:https://cpaas.zoho.in}
draazy.providers.zeptomail.api-key=${ZEPTOMAIL_API_KEY:}
draazy.providers.zeptomail.from-address=${ZEPTOMAIL_FROM_ADDRESS:noreply@draazy.com}
draazy.providers.zeptomail.from-name=${ZEPTOMAIL_FROM_NAME:Draazy}

# Google Places API (New) Place Details: verifies a society's Place ID server-side. Blank wires the dev
# lookup that trusts the client's hint (everywhere but prod, where it refuses to verify).
draazy.google.places.server-key=${GOOGLE_PLACES_SERVER_KEY:}
draazy.google.places.base-url=${GOOGLE_PLACES_BASE_URL:https://places.googleapis.com}

# Outreach links are read on someone else's phone, and the request's own Host header is not trusted.
draazy.app.base-url=${APP_BASE_URL:https://draazy.com}
draazy.bootstrap.admin.email=${BOOTSTRAP_ADMIN_EMAIL:}
draazy.bootstrap.admin.mobile=${BOOTSTRAP_ADMIN_MOBILE:}
draazy.bootstrap.admin.name=${BOOTSTRAP_ADMIN_NAME:Administrator}
draazy.bootstrap.admin.recover=${BOOTSTRAP_ADMIN_RECOVER:}

# Just above DocumentUploads.MAX_BYTES (10MB), so our 413 naming the limit wins over the container's.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Caps mutating requests per caller. Kept at production values locally: this protects the database
# and the queues, which exist locally too. A legitimate 429 means the number is wrong.
draazy.security.rate-limit.enabled=true
draazy.security.rate-limit.writes-per-window=120
draazy.security.rate-limit.window-seconds=60

# `memory` is correct for exactly one instance; a second silently multiplies the budget. `redis`
# selects the shared counter and refuses to start rather than falling back. Not selectable yet.
draazy.ratelimit.store=${RATELIMIT_STORE:memory}

# Public reference reads are cached this long in memory and at the browser/edge, so worst-case staleness is 2x.
# Staff reads bypass; 0s turns off the cache, its headers and ETags.
draazy.cache.public-reads.ttl=${PUBLIC_READ_CACHE_TTL:30s}

# Display and price settings are read from memory this long; an admin write evicts its own instance, others lag.
# Kill switches and the permission allow-list are always read fresh; 0s reads every time.
draazy.cache.settings.ttl=${SETTINGS_CACHE_TTL:30s}

# Turnstile, on the writes a stranger can reach only. Fails CLOSED: failing open would make the
# attacker's job "break the verifier", which is easier than solving the challenge.
draazy.security.turnstile.enabled=${TURNSTILE_ENABLED:false}
draazy.security.turnstile.secret-key=${TURNSTILE_SECRET_KEY:}
draazy.security.turnstile.verify-url=${TURNSTILE_VERIFY_URL:https://challenges.cloudflare.com/turnstile/v0/siteverify}
draazy.security.turnstile.connect-timeout-seconds=3
draazy.security.turnstile.read-timeout-seconds=5

# `none` means the socket address is the client's -- true locally, and wrong behind any load balancer,
# where one host would otherwise rate-limit the platform. Declared here so every profile has an answer.
draazy.security.trusted-proxies=none

# `none` locally, where nothing proxies the app. Deploys must name the secret their edge proxy sends.
draazy.security.origin-secret=none

# Disclosures, not switches. A structural zero and a measured zero render identically, so each stays
# false while the money path behind its figure does not exist, and the screen says so.
draazy.finance.refunds-measured=${FINANCE_REFUNDS_MEASURED:false}
draazy.finance.service-orders-counted=${FINANCE_SERVICE_ORDERS_COUNTED:false}
