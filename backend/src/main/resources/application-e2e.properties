# Activate alongside local (`local,e2e`), never instead: `e2e` alone has no OTP sender, so every login throws.

spring.datasource.url=${E2E_DB_URL:jdbc:postgresql://localhost:5432/draazy_e2e}

# db/seed-staff gives back-office accounts known credentials: never load it in sandbox or prod.
spring.flyway.locations=classpath:db/migration,classpath:db/seed,classpath:db/seed-staff

draazy.otp.fixed-code=${E2E_OTP_CODE:000000}
draazy.staff-totp.fixed-code=${E2E_STAFF_TOTP_CODE:000000}

# Pinned off: run-fast.ps1 loads backend/.env.local, whose live keys would send fixture data to real providers.
draazy.providers.whatsapp.enabled=false
draazy.providers.zeptomail.enabled=false
draazy.google.places.server-key=

draazy.otp.send-cooldown-seconds=0
draazy.otp.max-sends-per-window=1000
draazy.otp.max-sends-per-day=1000

draazy.otp.max-sends-per-ip-per-window=100000

draazy.otp.max-platform-sends-per-window=100000

draazy.otp.max-purpose-sends-per-window=100000
draazy.otp.max-caller-sends-per-window=1000

draazy.security.rate-limit.writes-per-window=100000
draazy.security.rate-limit.locality-resolves-per-window=100000
draazy.security.rate-limit.property-reads-per-window=100000
draazy.security.rate-limit.living-style-reads-per-window=100000

draazy.cache.public-reads.ttl=0s
draazy.cache.settings.ttl=0s

draazy.listings.max-posts-per-day=100000
draazy.photos.max-uploads-per-day=100000
draazy.flatmates.owner-notices-per-hour=100000

draazy.app.base-url=${E2E_APP_BASE_URL:http://localhost:5173}

logging.level.com.draazy.api=INFO
