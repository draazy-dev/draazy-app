# Also needs DRAAZY_DEV_MACHINE; LocalProfileGuard reads it via System.getenv, so no file satisfies it.
logging.level.com.draazy.api=DEBUG

management.endpoints.web.exposure.include=health,info

# Flyway locations replace rather than append, so db/migration must be repeated here.
spring.flyway.locations=classpath:db/migration,classpath:db/seed,classpath:db/seed-local,classpath:db/seed-staff

draazy.otp.send-cooldown-seconds=60
draazy.otp.max-sends-per-window=100
draazy.otp.max-sends-per-day=1000
draazy.otp.max-sends-per-ip-per-window=1000
draazy.otp.max-caller-sends-per-window=100

# Non-empty enables the fixed code. It lives only here because `sandbox` is standalone and cannot inherit it.
draazy.otp.fixed-code=${LOCAL_OTP_CODE:}
draazy.staff-totp.fixed-code=${LOCAL_STAFF_TOTP_CODE:}

# Insecure cookie for http://localhost only; a browser never stores a Secure cookie there.
draazy.security.refresh-cookie.secure=false

draazy.app.base-url=${APP_BASE_URL:http://localhost:5173}
