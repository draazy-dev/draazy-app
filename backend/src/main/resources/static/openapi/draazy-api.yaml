      responses:
        '201':
          description: Invited
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestParty' }
        '400':
          description: Not a role this request has, or not a mobile number
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: >
            No account holds that mobile, or the role is already taken, or that person is already on
            this request, or that person already declined this request, or the request is finished. Deliberately not 404: the request exists and
            the caller can see it, so the thing that is missing is the invitee's account.
  /service-requests/{id}/parties/{partyId}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
      - name: partyId
        in: path
        required: true
        description: The invitation's own id, as returned by `inviteServiceRequestParty`.
        schema: { type: string }
    delete:
      tags: [Services & Support]
      summary: Withdraw an unanswered or declined invitation (requester only)
      operationId: withdrawServiceRequestParty
      description: >
        Takes back an invitation nobody has answered, or clears one that was declined, releasing the
        side so a mistyped number can be corrected or somebody else invited.


        Not a convenience. `uq_service_request_parties_role` means one invitation spoken for the
        owner side is the owner side, so a wrong number leaves the requester unable to invite the
        person they meant *and* unable to open checkout, since `openServiceRequestCheckout` refuses
        while an invitation is outstanding. Before V107 a stranger would at least eventually decline
        their way out of it; a pending row addressed to a number belonging to nobody has no one who
        *can* answer, so without this route the requester would have been stuck behind the ninety-day
        expiry sweep.


        **Only while unanswered or declined**, and only by the requester. An accepted party is on the
        matter and has been shown it -- removing them is not an edit to a form, and it is not
        something the other side gets to do quietly. A declined row stays until the requester clears
        it, so they see they were turned down rather than watching the invitation evaporate; clearing
        it is what frees the side -- for somebody else; the person who declined cannot be invited to
        the same request again -- because otherwise the request could neither re-invite nor check
        out. Refused (409) once the request is finished.


        The row is deleted rather than flagged, because releasing the side is the whole point and the
        unique index keys on the row's existence. The act is not lost: it is written to `audit_log`
        and appears on the request's own timeline.
      responses:
        '204':
          description: >
            Withdrawn. No body, for the reason `markServiceRequestRead` returns none -- the caller is
            undoing something, not reading. The remaining parties are on the request itself.
        '404':
          description: >
            No such request for this caller, or no such invitation on it. A stranger's request is
            invisible rather than forbidden, on the same terms as every other customer-scoped read
            here.
        '409':
          description: >
            The invitation has already been accepted, so the party is on the matter and cannot be
            removed.
