openapi: 3.1.0
info:
  title: Draazy API
  version: "1.3.0"
  summary: Pune-first real-estate marketplace backend API.
  description: |
    Enterprise API contract for **Draazy**, a Pune-first real-estate marketplace
    (broker-optional listings, rentals, deals, services and back-office operations).

    **This specification is the single source of truth for the Draazy HTTP API.**
    Endpoints, request/response shapes, and enums are defined here and nowhere else.
    Companion docs describe *behaviour and data*, not the wire contract:
      - `docs/system/data-model.md`     — ER map / DB persistence design (field shapes are the schemas below)
      - `docs/system/cross-cutting.md`  — auth, contact gate, maker-checker, audit rules
      - `docs/system/platform-architecture.md` — component/vendor decisions & ADRs (KYC, payments, verification posture)
      - `docs/system/package-structure.md` — the 11 bounded contexts and their package/schema mapping
      - `docs/flows/**`                 — per-feature behavioural specs

    `x-roles` follows the server's role hierarchy (admin > manager > staff): a route listing `staff`
    also admits managers and admins.

    ### Changelog
    - 1.3.0 — **Flatmates re-modelled around seeker intent.** The flatmates/rooms/groups triple is
      replaced by two feeds, `move-in` and `team-up` (`FlatmateTab`; the old values survive as
      deprecated read aliases). `FlatmatePost` is renamed `FlatmateSeekerPost` and re-shaped to what
      a seeker actually posts; `FlatmateRoom`, `FlatmateGroup`, `FlatmateRequest`, `FlatmateReview`,
      `GroupApplication`, `AgreementDoc`, `FlatmateAlertCriteria` and `HostEligibility` are new.
      New supply model: `RoomKind`, `PriceBasis` (per-room vs per-person rent), `Occupancy` and the
      flat occupancy ledger, plus the owner **flat split** (`POST|DELETE /properties/{id}/split`).
      Room enquiries carry a `ShareIntent`. The flatmates "Verified" pill is the **same** identity
      L2 badge as the rest of the app (ADR-009a), not a separate seeker OTP. `SavedSearch` gains
      `kind`/`criteria`/`label`/`mobile` and an `sms` channel for flatmate alerts. Moderation adds
      the ops flatmate-verification queue and the admin flatmate/group-application desks.
    - 1.2.0 — **Verification is a badge, not a gate** (ADR-019): browsing and contacting
      owners require only a signed-in mobile-OTP account (L1); identity verification is an
      **opt-in "Verified" badge** (L2) and is hard-required only at the deal step (L3).
      The badge is earned by submitting live-captured photos of a government ID and a selfie
      (`/me/verification/identity`) that staff review in `/moderation/identity-reviews`;
      dedup is a keyed `identity_hash` of the confirmed document number (ADR-009b). Contact
      `403 verification_required` is returned **only** when the target owner opted into
      "verified contact only".
    - 1.1.0 — Reconciled the role model to the canonical `buyer/owner/staff/admin`
      set (`staff` scoped by `team`); aligned `Team` to the ops teams; made this
      spec the sole API source of truth (retired the duplicate markdown catalogue).

    ## Conventions
    - Base path: `/api`
    - Auth: Bearer JWT (`Authorization: Bearer <token>`) unless marked public.
    - Pagination: `?page=0&size=20` (zero-indexed); responses use `PageEnvelope`.
    - Sort: `?sort=field,direction` (e.g. `sort=createdAt,desc`).
    - Dates: ISO-8601 UTC. Money: integer INR (paise-free rupees).
    - Errors: `{ "error": "code", "message": "human-readable", "status": 400 }`.
    - Soft-delete: archive/restore only — no hard DELETE for core aggregates.
    - Maintenance: while the `maintenanceMode` flag is on, **every** state-changing request
      (POST/PUT/PATCH/DELETE) answers `503 maintenance_mode` — see
      `#/components/responses/ServiceUnavailable`. Reads are unaffected. Exempt: everything under
      `/auth/`, the signed provider callbacks, and callers holding `ROLE_ADMIN`/`ROLE_STAFF`.
      Not a 403: nothing about the caller's identity would change the answer, so offering a
      sign-in is the wrong recovery. No `Retry-After` — the window's length is not known.

    Tags map to **bounded contexts** to support future microservice decomposition.
  contact:
    name: Draazy Platform Engineering
    url: https://draazy.example.com
  license:
    name: Proprietary
servers:
  - url: http://localhost:8080/api
    description: Local development
  - url: https://staging.draazy.example.com/api
    description: Staging
  - url: https://api.draazy.example.com/api
    description: Production

tags:
  - name: Identity & Access
    description: Authentication, sessions, current-user profile, staff onboarding.
  - name: Catalog & Search
    description: Public property discovery, localities, cities, reference/fee data.
  - name: Listings
    description: Owner listing lifecycle (create, edit, deals, offers, visits).
  - name: Moderation
    description: Admin property/user moderation, verification, reports, audit.
  - name: Leads & Contact
    description: Contact-gate requests, enquiries, finalization (maker-checker).
  - name: Rentals & Payments
    description: Tenancies, tenant profiles and the owner's own rent-receipt log.
  - name: Documents
    description: Property documents, buyer document-access requests, sharing.
  - name: Services & Support
    description: Service tickets, support tickets, service workflows, agreements.
  - name: Billing & Growth
    description: Plans, service orders, referrals, fees.
  - name: Engagement
    description: Saved properties/searches, reviews, notifications, flatmates.
  - name: Admin & Analytics
    description: KPIs, analytics, platform settings, content/CMS, society leads.

externalDocs:
  description: >
    Behavioural flow specs (actors, screens, sequence) and the architecture / ADRs that
    this wire contract implements. Swagger documents the request/response of each call;
    these docs document the end-to-end journey across calls, actors and time.
  url: docs/system/platform-architecture.md

security:
  - bearerAuth: []

paths:
  /auth/login:
    post:
      tags: [Identity & Access]
      summary: Login via OTP-verified mobile
      security: []
      operationId: login
      description: >
        Dual-mode. Posting `mobile` **without** `otp` is the *send* step: a code is dispatched and
        the response is `{ "otpSent": true, "resendAfterSeconds": 60 }`, where the second field is
        the cooldown this environment enforces before another code to the same number is allowed.
        Posting `mobile` **with** `otp` is step 2 (L1):
        it verifies the code and returns access/refresh tokens. First-time mobiles are provisioned
        as `buyer` on successful verification, so no separate sign-up call exists — unless the
        `signupsEnabled` flag has closed onboarding, in which case a verified code from an unknown
        mobile is refused `403` and no account is created; known mobiles sign in as usual. L1
        sign-in is the only floor for participating (posting, enquiring, contacting owners) —
        identity verification is an opt-in badge on top (ADR-019). On success, call `getMe`.
      externalDocs:
        description: Auth / OTP sign-in flow (actors + screens)
        url: docs/flows/consumer/auth.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LoginRequest' }
      responses:
        '200':
          description: >
            Either the OTP-send acknowledgement (`{ "otpSent": true }`) or, when `otp` was supplied
            and verified, the issued access token — with the refresh token set as the
            `__Host-draazy_rt` cookie rather than returned in the body, alongside a readable
            `__Host-draazy_session` marker (see `AuthResponse`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
          links:
            currentUser: { $ref: '#/components/links/GetCurrentUser' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >
            The `otp` was wrong, expired, or there is no code outstanding for that mobile — or the
            code was right and the account behind it is archived, which answers
            `error: account_archived`. Only a wrong `otp` carries `attemptsRemaining`, so between
            the two generic cases its presence is what distinguishes "try again, 2 left" from
            "that code is gone, ask for another". Branch on `error` and the presence of the count;
            the `message` says which in English and the client should not parse it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                wrongCode:
                  summary: Wrong digits, two guesses left
                  value: { error: unauthorized, message: Incorrect OTP, status: 401, attemptsRemaining: 2 }
                noCode:
                  summary: Nothing outstanding for this mobile
                  value: { error: unauthorized, message: No active OTP — request a new code, status: 401 }
        '403':
          description: >
            `signups_closed` is returned only after a valid OTP from an unknown mobile is verified
            while onboarding is closed. It is terminal for that mobile: requesting another code or
            retrying the same one cannot create an account. A caller that already has an account
            must instead sign in with its registered number. `account_suspended` is equally
            terminal, after a valid OTP. The send step (no `otp`) answers `forbidden` when bot
            defence is enforced and the `CF-Turnstile-Response` header is missing or rejected;
            reloading the page for a fresh challenge is the remedy. The verify step is never
            challenged.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                signupsClosed:
                  summary: A verified unknown mobile cannot provision an account
                  value: { error: signups_closed, message: New accounts are closed at the moment, status: 403 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: >
            Two different refusals share this status and only `error` separates them.
            `otp_attempts_exhausted` means this code is spent — waiting cannot help and the
            caller must request a new one, so its `Retry-After` is `0`. The generic
            `rate_limited` comes from the per-IP write limiter, so the code in hand is still
            good and the caller should retry after the header says. Treating the second as the
            first strands anyone behind shared mobile egress; treating the first as the second
            loops them on a dead code.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
              description: Seconds to wait. `0` on `otp_attempts_exhausted`, where waiting is not the remedy.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                codeSpent:
                  summary: Every guess against this code is used up
                  value: { error: otp_attempts_exhausted, message: Too many attempts — request a new code, status: 429 }
                ipBusy:
                  summary: The caller's IP is over the write limit
                  value: { error: rate_limited, message: Too many requests, status: 429 }
        '503':
          description: >
            Send step only: the WhatsApp provider did not take the code. The send still counts
            against this mobile's budget; retry after the header says.
          headers:
            Retry-After:
              schema: { type: integer, minimum: 0 }
              description: Seconds to wait before asking for another code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example:
                error: service_unavailable
                message: We couldn't send your code on WhatsApp. Please try again in a minute.
                status: 503
  /auth/staff-login:
    post:
      tags: [Identity & Access]
      summary: Staff/admin sign-in, step one (email + password)
      security: []
      operationId: staffLogin
      description: >
        Issues **no tokens**. A correct password answers `{ mfa, challenge }`: `mfa: totp` means
        present an authenticator code to `staffLoginVerify`; `mfa: enrol` means the account has no
        authenticator yet and must call `staffLoginEnrol` then `staffLoginEnrolConfirm`. The
        challenge is valid for five minutes.


        Every refusal before the password is proven (unknown email, consumer account, no password,
        wrong password) is the same 401. Refuses with **403** when the `staffLoginEnabled` flag is
        off, checked *after* the password so the refusals cannot be told apart by anyone who has not
        passed it. Administrators are exempt from that flag. Five consecutive misses (password or
        code) lock the account for 15 minutes: while locked, every attempt on that account answers
        **429** `staff_sign_in_locked`, whatever the password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffLoginRequest' }
      responses:
        '200':
          description: Password accepted; second factor required
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/staff-login/verify:
    post:
      tags: [Identity & Access]
      summary: Staff/admin sign-in, step two (authenticator or recovery code)
      security: []
      operationId: staffLoginVerify
      description: >
        A six-digit code from the enrolled authenticator (each code works once) or one unused
        recovery code. Success issues tokens and the refresh cookie. A wrong code is 401 and counts
        toward the lock; `staff_sign_in_expired` (401) means start again from the password.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCodeRequest' }
      responses:
        '200':
          description: Authenticated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/staff-login/enrol:
    post:
      tags: [Identity & Access]
      summary: Start authenticator setup on first sign-in
      security: []
      operationId: staffLoginEnrol
      description: >
        For a challenge answered `mfa: enrol`. Returns a new secret to scan (as `otpauthUri`) or
        type in. Calling it again replaces the unconfirmed secret. 409 once an authenticator is
        confirmed: only an administrator's reset clears it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffEnrolRequest' }
      responses:
        '200':
          description: Secret to add to an authenticator app
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffTotpEnrolment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/staff-login/enrol/confirm:
    post:
      tags: [Identity & Access]
      summary: Confirm the new authenticator and sign in
      security: []
      operationId: staffLoginEnrolConfirm
      description: >
        The first code from the newly added authenticator. Success confirms it, issues tokens and
        returns `recoveryCodes`: ten single-use codes shown this once and never again.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCodeRequest' }
      responses:
        '200':
          description: Authenticated; carries `recoveryCodes`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /auth/staff-invite/redeem:
    post:
      tags: [Identity & Access]
      summary: Redeem a back-office invite and set your own password
      security: []
      operationId: redeemStaffInvite
      description: >
        The one route on which a back-office password is chosen, and it is chosen by the person who
        will use it. `addStaff` creates the account with **no usable password** and issues a
        single-use, expiring invite link returned once to the creator. Until it is redeemed the
        account cannot obtain a token on any login path.


        Redeeming is **not** a login: it returns no session and no account details.


        Every failure - unknown, wrong, expired, already redeemed, account since archived - answers
        the same 401 with the same message. Distinguishing them would turn this route into an
        oracle, and the legitimate holder's remedy is the same in every case.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffInviteRedeem' }
      responses:
        '204': { description: Password set. Sign in normally. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/refresh:
    post:
      tags: [Identity & Access]
      summary: Rotate the refresh token
      security: []
      operationId: refreshSession
      description: >
        Exchange a valid refresh token for a new access token and a new refresh token. The presented
        token arrives in the `__Host-draazy_rt` cookie, not in the body, and the replacement is
        returned the same way — so this call must be made with credentials
        (`fetch(…, { credentials: 'include' })`) and there is nothing for the client to persist.


        Refresh tokens are **single-use**: the presented one is revoked and a replacement is set.
        Replaying a spent token fails with 401 and revokes the whole family — clients should treat
        that as session loss and send the user back to sign-in. One exception, and it is the reason
        the client no longer has to coordinate tabs itself: a token spent within the last few seconds
        is a lost race rather than a theft, and is answered by rotating the family's current live
        token instead of burning it.


        A request with no cookie is answered 401, not 422: an absent session and a spent one leave
        the client on the same recovery path. Because the cookie is the credential, this endpoint
        takes no bearer token. Any 401 from here also expires the `__Host-draazy_session` marker,
        so a client that is told "no session" stops being told it has one.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshRequest' }
      responses:
        '200':
          description: Rotated — new access token issued and the refresh cookie replaced.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /auth/logout:
    post:
      tags: [Identity & Access]
      summary: Invalidate current session
      operationId: logout
      description: >
        Revokes the caller's whole refresh-token family and clears both the `__Host-draazy_rt`
        cookie and the `__Host-draazy_session` marker.
      responses:
        '204': { description: Logged out }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /auth/me:
    get:
      tags: [Identity & Access]
      summary: Get current user profile
      operationId: getMe
      responses:
        '200':
          description: Current user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Self' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [Identity & Access]
      summary: Update own profile
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated user
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Self' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: Name changes are locked while the account is verified (`NAME_LOCKED_WHILE_VERIFIED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /properties:
    get:
      tags: [Catalog & Search]
      summary: List / search properties
      description: Full-text + faceted search. N+1-safe; owner contact is masked.
      security: []
      operationId: searchProperties
      parameters:
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/DealIntent' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string }, description: 'Locality *slug* (matches PropertySummary.localitySlug, not the display name). Also matches listings within 2 km of the locality''s pin.' }
        - { name: bhk, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: furnishing, in: query, schema: { $ref: '#/components/schemas/Furnishing' } }
        - name: possession
          in: query
          description: >
            Exact match on possession state. Listings with no recorded possession are
            never returned by this facet.
          schema: { $ref: '#/components/schemas/PropertyPossession' }
        - name: q
          in: query
          schema: { type: string, maxLength: 120 }
          description: |
            Free text over **title, locality, society and property type only** — the four things
            already printed on the card this query returns. Matched word by word, every word
            required somewhere, capped at the first six words.

            Owner name and owner mobile are matched by the moderation search
            (`listPropertiesForModeration`) and must not be added here: this endpoint needs no
            login, so those axes would make it an owner directory keyed by phone number.
        - name: status
          in: query
          description: >
            Can only *narrow within* approved on this anonymous endpoint — the public floor
            (`approved`, non-archived) is unconditional, so any other value yields an empty page
            rather than unapproved rows. Use `listPropertiesForModeration` to search every status.
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        - name: rank
          in: query
          description: >
            Which ranking to apply when no explicit `sort` is given. `relevance` (the default)
            orders by featured, verifications, RERA, freshness and completeness; `newest` orders by
            recency alone; `pricePerSqft` orders by price divided by area converted to square feet
            with unstated areas last; `verified` puts owner-verified / ownership-verified listings
            before the default ranking.


            Separate from `sort` because neither is a column order, and `sort` is deliberately
            restricted to a whitelist of indexed columns so a client cannot probe or force a scan on
            an arbitrary one. Passing a ranking through `sort` would mean either widening that
            whitelist or having the value silently dropped. An explicit `sort` wins over `rank`
            either way: paid placement and merit both yield to an order the buyer actually chose.
          schema: { type: string, enum: [relevance, newest, pricePerSqft, verified], default: relevance }
        - name: types
          in: query
          description: >
            Property types, OR'd, case-insensitive. One list rather than the UI's separate
            residential and commercial chip groups — both narrow the same column, and which drawer
            a chip was in is not the server's concern.
          schema: { type: array, maxItems: 16, items: { type: string } }
        - name: bhks
          in: query
          description: >
            Bedroom counts, OR'd. A token is a whole number, or `Nplus` for an open top (`3plus` =
            three or more), because the UI's top chip is genuinely open-ended and matching it as an
            equality would hide every 4BHK from a buyer who asked for "3+".


            Named `bhks`, not `bhk`, because the single-valued `bhk` above already exists on this
            endpoint. Two parameters sharing a name with different arity is not merely ambiguous:
            the scalar binds first, so the multi-select either fails to parse or quietly degrades
            into an equality against the literal string "2,3". Same for `furnishings`.
          schema: { type: array, maxItems: 16, items: { type: string } }
        - name: furnishings
          in: query
          description: Furnishing states, OR'd. Plural for the reason given on `bhks`.
          schema: { type: array, maxItems: 16, items: { $ref: '#/components/schemas/Furnishing' } }
        - name: localities
          in: query
          description: Locality *slugs*, OR'd. The multi-select counterpart of `locality`.
          schema: { type: array, maxItems: 16, items: { type: string } }
        - name: societies
          in: query
          description: Society slugs, OR'd.
          schema: { type: array, maxItems: 16, items: { type: string } }
        - name: ids
          in: query
          description: >
            Listing slugs or UUIDs, OR'd. Batches what would otherwise be one `GET /properties/{id}`
            per card (recently viewed, a visit's listing title) into one search; the public floor
            still applies, so an id that is not live simply drops out.
          schema: { type: array, maxItems: 16, items: { type: string } }
        - name: amenities
          in: query
          description: >
            Amenity tokens, **AND'd** — the one list here that is not a union. A buyer ticking
            "lift" and "parking" has stated two requirements, not offered two alternatives, and
            returning a listing with only one of them wastes the visit that discovers the difference.
          schema: { type: array, maxItems: 16, items: { type: string } }
        - name: facing
          in: query
          description: >
            Compass-facing values, OR'd and case-normalised. Facing is a stated claim, so listings
            with no facing are excluded when this facet is sent rather than counted as unstated.
            A cardinal also matches the two corners beside it (north matches north-east and
            north-west): the wizard offers cardinals only, and older listings may state a corner.
          schema: { type: array, maxItems: 16, items: { type: string, enum: [east, west, north, south, north-east, north-west, south-east, south-west] } }
        - name: landUse
          in: query
          description: >
            Plot zoning, OR'd. Matters because the wrong answer here is not a disappointment but a
            dead purchase: agricultural land cannot be built on by a non-agriculturist.
          schema: { type: array, maxItems: 16, items: { type: string, enum: [residential, commercial, industrial, agricultural, mixed] } }
        - name: room
          in: query
          description: Flatmate room shape, OR'd — a private room, or a bed in a shared one.
          schema: { type: array, maxItems: 16, items: { type: string, enum: [single, shared] } }
        - name: tenants
          in: query
          description: >
            Accepted tenant types, OR'd — **plus every listing that stated no preference at all**.
            An owner who left the field blank has refused nobody, and reading silence as refusal
            would hide most of the inventory from the filter meant to narrow it.
          schema: { type: array, maxItems: 16, items: { type: string, enum: [family, bachelor-male, bachelor-female, company] } }
        - name: construction
          in: query
          description: >
            Possession states, OR'd — the multi-select counterpart of `possession`. When both are
            sent they AND, which is what a caller sending both asked for.

            `no.such.possession` is reserved and matches nothing. A client whose own controls over
            this column contradict each other sends it to say so: omitting the param instead means
            "not filtered", which would answer an impossible filter with the whole catalogue, and a
            present-but-empty `construction=` is indistinguishable from an absent one on the wire.
          schema:
            type: array
            maxItems: 16
            items:
              anyOf:
                - $ref: '#/components/schemas/PropertyPossession'
                - { type: string, enum: [no.such.possession] }
        - name: availableFrom
          in: query
          description: >
            Move-in window, **cumulative**: a date predicate on `availableOn` in IST — `now` is on or
            before today, `15` within 15 days, `30` within 30 days. A tenant who can wait a month can
            also take a flat that is free today. Listings with no stated date match no bucket.
          schema: { type: string, enum: [now, '15', '30'] }
        - name: pets
          in: query
          description: >
            `true` restricts to pet-friendly listings. `false` is treated as "not asked", not as
            "show me the ones that forbid pets" — nobody performs that search.
          schema: { type: boolean }
        - name: ownerVerified
          in: query
          description: Restrict to listings whose owner holds the ID verified badge. Only ever narrows.
          schema: { type: boolean }
        - name: ownershipVerified
          in: query
          description: Restrict to listings whose ownership paperwork checked out. Only ever narrows.
          schema: { type: boolean }
        - name: rera
          in: query
          description: >
            Restrict to RERA-registered listings. A boolean even though the column holds the
            registration number itself, because the yes/no is the only question the filter asks.
          schema: { type: boolean }
        - name: food
          in: query
          description: >
            `veg` / `jain` keep only listings whose owner stated that food rule for a residential
            rent; `nonveg` excludes listings stated as `veg` or `jain` (unstated ones stay). Other
            values are ignored.
          schema: { type: string, enum: [veg, jain, nonveg] }
        - name: shell
          in: query
          description: Commercial shell type, OR'd from the owner wizard's JSONB form details.
          schema: { type: array, maxItems: 16, items: { type: string, enum: [bareShell, warmShell, furnished] } }
        - name: preLeased
          in: query
          description: >
            `true` restricts commercial sale listings to rows whose tenancy status is leased.
            `false` is a no-op.
          schema: { type: boolean }
        - name: na
          in: query
          description: Land NA conversion status, OR'd from the owner wizard's JSONB form details.
          schema: { type: array, maxItems: 16, items: { type: string, enum: [agricultural, deemed, sanctioned] } }
        - { name: minArea, in: query, description: 'Inclusive lower bound in square feet after converting the stored `area_unit`. Unstated areas are kept and counted into `unstatedElements`, as for `minAge`.', schema: { type: number, minimum: 0 } }
        - { name: maxArea, in: query, description: 'Inclusive upper bound in square feet after converting the stored `area_unit`. Unstated areas are kept and counted into `unstatedElements`, as for `minAge`.', schema: { type: number, minimum: 0 } }
        - { name: minBaths, in: query, description: 'Inclusive lower bound on bathrooms. Values below 1 are ignored; unstated bathrooms are kept and counted into `unstatedElements`, as for `minAge`.', schema: { type: integer, minimum: 0 } }
        - { name: minPhotos, in: query, description: 'Inclusive lower bound on the number of photos (the reels feed asks for 3). Values below 1 are ignored.', schema: { type: integer, minimum: 0 } }
        - name: minAge
          in: query
          description: >
            Inclusive lower bound on construction age in years. A listing that never stated its age
            is **kept** when either age bound is set, and counted into `unstatedElements` — it is
            not read as zero. Excluding it would be the larger lie: most of the catalogue is silent
            here, so a bound that deleted the silent rows would answer a nudge of the slider by
            discarding the majority of the inventory it was meant to narrow. The strict reading —
            "and I mean a *stated* age in this range" — is deliberately not offered; the disclosure
            count is how a caller tells the two populations apart.
          schema: { type: integer, minimum: 0 }
        - name: maxAge
          in: query
          description: >
            Inclusive upper bound on construction age. The UI's top of range is an open "25+", which
            it expresses by simply omitting this. Unstated ages are kept and counted into
            `unstatedElements`, as for `minAge`.
          schema: { type: integer, minimum: 0 }
        - { name: minFloor, in: query, description: 'Inclusive lower bound on floor number. Unstated floors are kept and counted into `unstatedElements`, as for `minAge`.', schema: { type: integer } }
        - { name: maxFloor, in: query, description: 'Inclusive upper bound on floor number. Unstated floors are kept and counted into `unstatedElements`, as for `minAge`.', schema: { type: integer } }
        - name: minDeposit
          in: query
          description: >
            Inclusive lower bound on the security deposit, in rupees. Rent-side only in the UI, but
            not gated on `deal` here: the column is simply null on sale listings, so a sale search
            that sent it would be answered by the unstated rule below rather than by a special case.
            A listing that never published a deposit is **kept** and counted into `unstatedElements`
            — it has not thereby published a zero, and reading it as one would drop every silent
            rental into every low-deposit search, which is the number a tenant is least able to
            absorb being wrong about.
          schema: { type: integer, format: int64, minimum: 0 }
        - { name: maxDeposit, in: query, description: 'Inclusive upper bound on the security deposit, in rupees. Unstated deposits are kept and counted into `unstatedElements`, as for `minDeposit`.', schema: { type: integer, format: int64, minimum: 0 } }
        - name: nearLat
          in: query
          description: >
            Latitude of a "near me / near this landmark" centre. Required together with `nearLng`
            and `nearRadiusKm`; any one alone is ignored, because a centre without a radius and a
            radius without a centre are both incomplete questions and neither has a safe default.
          schema: { type: number, minimum: -90, maximum: 90 }
        - name: nearLng
          in: query
          description: Longitude of the search centre. See `nearLat`.
          schema: { type: number, minimum: -180, maximum: 180 }
        - name: nearRadiusKm
          in: query
          description: >
            Search radius in kilometres, **clamped to 50**. Clamped rather than rejected: a caller
            asking for a wider circle than we serve has asked a reasonable question badly, and the
            widest circle we do serve is a better answer than a `400`. The ceiling exists because
            the radius sizes a bounding box, and an unbounded one spans the planet — which would
            turn this anonymous endpoint into a full-table scan available on request. Fifty
            kilometres already reaches past every locality in the catalogue.
          schema: { type: number, minimum: 0, maximum: 50 }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged property summaries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SearchEnvelope'
                  - type: object
                    properties:
                      unstatedElements:
                        type: integer
                        format: int64
                        example: 74
                        description: >
                          How many of the matched listings are silent on a column this request
                          filtered on (`minArea`/`maxArea`, `minBaths`, `minAge`/`maxAge`,
                          `minFloor`/`maxFloor`, `minDeposit`/`maxDeposit`). Those rows are admitted
                          by the bounds rather than deleted by them, so this is the number that
                          keeps "matched your range" and "never said" from reading as one. A row
                          silent on two tracked fields is counted once, so this is the size of a subset
                          of `totalElements`, never a sum. Zero when none of these bounds was
                          sent. Declared here and not on `SearchEnvelope` because the flatmates feed
                          shares that envelope and offers none of the filters.
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertySummary' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /properties/featured:
    get:
      tags: [Catalog & Search]
      summary: Featured listings
