            linkedAccounts: { type: integer }
            contactsUsed: { type: integer }
            enquiries: { type: integer }
            pausedDuringWindow: { type: boolean, description: The listing was not publicly live at some point in the guarantee window. }
        transaction:
          type: [object, 'null']
          description: The order behind the row; null only on a dispute matched to no order. Refund fields are null until a refund is due.
          properties:
            paid: { type: integer, description: The order price in rupees. }
            paidAt: { type: [string, 'null'], format: date-time }
            orderStatus: { type: string }
            invoiceNo: { type: [string, 'null'], description: Null for an order that never activated. }
            refundReason: { type: [string, 'null'], enum: [paid_after_cancel, listing_gone, amount_mismatch, customer_request, gateway_dashboard, null] }
            refundAmount: { type: [integer, 'null'] }
            refundDueAt: { type: [string, 'null'], format: date-time }
            refundState: { type: [string, 'null'], enum: [queued, retrying, sent, confirmed, null], description: '`sent` once the gateway took it, `confirmed` once the gateway reports the money back.' }
            refundSettledAt: { type: [string, 'null'], format: date-time }
            gatewayRefund: { type: [string, 'null'], description: The gateway's refund id. }
            refundAttempts: { type: integer, description: Refunds the gateway reported failed. }
            refundTriedAt: { type: [string, 'null'], format: date-time, description: The last send the gateway refused. }
    LegalNotices:
      type: object
      description: The notices the footer and refund copy publish; the `legal` admin setting.
      properties:
        grievanceOfficer:
          type: object
          properties:
            name: { type: string, maxLength: 80 }
            email: { type: string, format: email, maxLength: 120 }
    SocietyAdminEdit:
      type: object
      description: >
        A correction to one society's facts. Every field is optional and an omitted field is left
        alone, because the four facts are corrected one at a time from different evidence and a full
        restatement would let a stale form revert the three the operator did not touch.


        `adminNote` is the exception that makes the rest work: an explicit `null` — or a blank
        string, which is what an emptied textarea sends — clears the note. Omission cannot express
        that, which is why the field is nullable rather than merely optional.
      properties:
        registration:
          type: boolean
          nullable: true
          description: Whether the society is registered.
        conveyance:
          type: boolean
          nullable: true
          description: Whether conveyance of the land to the society has been completed.
        maintenancePerSqft:
          type: number
          nullable: true
          minimum: 0
          maximum: 100
          description: >
            Monthly maintenance in **rupees per square foot**, typically 1 to 8 in Pune. Capped
            because the adjacent mental model is the monthly bill, and a four-digit figure here is a
            units mistake rather than an expensive society.
          example: 3.5
        adminNote:
          type: string
          nullable: true
          description: >
            Free text for whoever reads this row next — why a fact was corrected, who confirmed it,
            what is still unverified. Never leaves the back office.
      example:
        conveyance: true
        maintenancePerSqft: 3.5
        adminNote: Conveyance deed seen 2026-08; registration number still unconfirmed.
    SocietyAdminView:
      type: object
      description: >
        A society as the back office sees it. Deliberately not `Society`: the public shape must
        never carry `adminNote`, and the way to guarantee that is for the two to be different types
        rather than for one of them to be filtered.
      required: [slug, name, registration, conveyance]
      properties:
        slug:
          type: string
          description: The society's public alias, and the handle this route is addressed by.
        name:
          type: string
        registration:
          type: boolean
        conveyance:
          type: boolean
        maintenancePerSqft:
          type: number
          nullable: true
          description: Rupees per square foot per month. Null when nobody has recorded one.
        adminNote:
          type: string
          nullable: true
          description: Null when there is no note. A cleared note is null, never an empty string.
