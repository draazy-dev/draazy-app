          description: No such locality
  /localities/resolve:
    post:
      tags: [Catalog & Search]
      summary: The locality a Google place pick is
      security: []
      operationId: resolveLocality
      description: >
        A locality exists because someone picked it from Google Places, never because it was typed.
        Found by Place ID when we already hold it; otherwise the place is verified server-side, and a
        dormant curated row of the same name within 2.5 km is brought back (taking Google's name),
        or a new row is minted (slug is the name, suffixed -2, -3 on a clash). The place must be a
        locality, sub-locality or neighbourhood inside the Pune Metropolitan Region (lat 18.25-18.95,
        lng 73.30-74.35), and not the city itself. A same-named live row within 2.5 km is returned
        rather than duplicated. Public, with its own per-IP limit (10/min) ahead of the general
        write budget. A row staff retired is never reopened by a pick: its place is refused.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LocalityResolve' }
      responses:
        '200':
          description: The locality, now live
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalitySummary' }
        '422':
          description: Not a locality Google knows ("Pick the locality from the suggestions.") outside the served area ("Pick a locality in Pune."), or retired ("That area isn't open for new listings.")
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
        '503':
          description: The place lookup is down; retrying later can succeed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /localities/search:
    get:
      tags: [Catalog & Search]
      summary: Search live localities by name
      security: []
      operationId: searchLocalities
      description: >
        For the picker when Google suggestions are unavailable. Only live localities (never retired
        ones); names starting with `q` come first. An empty `q` returns an empty list.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Part of the locality name }
        - { name: limit, in: query, schema: { type: integer, minimum: 1, maximum: 20, default: 10 } }
      responses:
        '200':
          description: Matching localities
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocalitySummary' }
  /societies:
    get:
      tags: [Catalog & Search]
      summary: Browse societies (each one a Google place; retired catalogue rows are excluded)
      security: []
      operationId: listSocieties
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text search over name, builder and the locality's words (baner-road is "baner road") }
        - { name: locality, in: query, schema: { type: string }, description: Filter by locality slug (or within 2 km of its pin) }
        - name: hasListings
          in: query
          schema: { type: boolean }
          description: >
            When true, keep only societies with at least one live (approved, unarchived) listing.
            Omitted or false returns the whole directory — false is not the inverse, because
            "societies with nothing listed" is an ops question rather than a public one.
        - name: sort
          in: query
          schema: { type: string }
          description: >
            A column, e.g. `occupancy,desc` (`name`, `occupancy`, `year`, `units`; anything else
            falls back to `name,asc`), or one of three computed orderings, best first, direction
            ignored: `relevance` (min(homes, 3) + average/5), `rating` (average, then
            review count) and `homes` (live listings). Name breaks ties. Computed
            orderings rank the whole filtered set before paging, so page 2 continues page 1.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Societies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Society' }
    post:
      tags: [Catalog & Search]
      summary: Add a society the catalogue does not have
      operationId: mintSociety
      description: >
        The only way a society enters the catalogue: a Google Place pick. The `placeId` is the
        society's identity and is verified server-side (name, pin and place types come from Google,
        never from the client), so there are no typed names and no look-alike duplicates. A place
        that is an area rather than a building, or that Google does not know, is a `422`.


        **Two success codes, and the difference is the point.** `201` for a society that did not
        exist, `200` when the place already has one -- both hand back the same canonical row,
        so a client that ignores the distinction still behaves correctly. But collapsing them would
        make the screen say "Added" to somebody who has just re-found a society that has been on
        Draazy for two years, which is both wrong and quietly alarming: it suggests the catalogue
        is empty.


        Signing in is required, and not as a formality. The row records who added it, which is what
        an operator reviewing `/admin/society-candidates` needs in order to ask a question about it,
        and what makes one account minting fifty societies a visible pattern rather than a suspicion.


        What arrives here is a live `community` society, public at once; ops merges duplicates later.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyCreate' }
      responses:
        '200':
          description: Already on Draazy -- the existing canonical row, unmodified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Society' }
        '201':
          description: Added as a live society
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Society' }
        '422':
          description: >-
            `placeId` missing, blank or not a Place ID (letters, digits, `-` and `_`, at most 255),
            `lat`/`lng` out of range, `name` carrying contact details, unknown to Google, an area (neighbourhood, city, ...) rather
            than a building ("Pick your building, not an area."), a shop, restaurant, bank or office
            ("Pick your building, not a shop or office."), a pin or Google location outside the cities
            we serve ("We only list societies in cities we serve."), an unknown `mintOrigin`, or
            Google could not be reached or is not configured ("Adding societies is temporarily
            unavailable.").
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429':
          description: >-
            The member has used today's 20 Google lookups. Only a place Draazy does not already hold
            costs one, so re-adding a known society never hits this. Back-office accounts are exempt.
          headers:
            Retry-After: { schema: { type: integer }, description: Seconds until the budget frees up }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /societies/resolve:
    get:
      tags: [Catalog & Search]
      summary: The society a Google place already has, or similar ones nearby
      security: []
      operationId: resolveSociety
      description: >
        Called after a Google Place pick, before offering to add it. `society` is the live row whose
        `placeId` matches, following a merge to its survivor; retired (archived) rows never match.
        When there is no match and `lat`/`lng` are given, `candidates` lists up to three societies
        within 250 m whose name resembles `name`, so the member can bind an existing one instead of
        minting a duplicate. A hit has no candidates.
      parameters:
        - { name: placeId, in: query, required: true, schema: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9_-]+$' } }
        - { name: name, in: query, schema: { type: string, maxLength: 160 }, description: The picked place's name, used to rank candidates }
        - { name: lat, in: query, schema: { type: number, minimum: -90, maximum: 90 } }
        - { name: lng, in: query, schema: { type: number, minimum: -180, maximum: 180 } }
      responses:
        '200':
          description: The match and/or nearby candidates
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyResolve' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /societies/top:
    get:
      tags: [Catalog & Search]
      summary: The home page's society rail
      security: []
      operationId: topSocieties
      description: Up to eight societies with live homes, most homes first, ties by name.
      responses:
        '200':
          description: Society cards
          content:
            application/json:
              schema:
                type: array
                maxItems: 8
                items: { $ref: '#/components/schemas/SocietyCard' }
  /societies/{slug}:
    get:
      tags: [Catalog & Search]
      summary: Society hub detail (curated + community merged)
      security: []
      operationId: getSociety
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Society detail
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
  /societies/{slug}/brief:
    get:
      tags: [Catalog & Search]
      summary: Society name, specs and rating for a listing page or a search chip
      security: []
      operationId: getSocietyBrief
      parameters:
        - { name: slug, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Society brief
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyBrief' }
        '404': { $ref: '#/components/responses/NotFound' }
  /page-views:
    post:
      tags: [Engagement]
      summary: Report a batch of page views
      security: []
      operationId: recordPageViews
      description: >
        Draazy's entire analytics intake. There is no third-party tag on the site, so everything
        `/admin/analytics/*` reports is built from what this endpoint was told -- which is the
        deliberate trade: the platform sees less than a commercial analytics product would, and no
        ad network sees Indian house-hunters' browsing at all.


        **202, and empty.** The client is reporting something that already happened; it is not
        asking a question and there is nothing useful to hand back. Answering `200` with a body
        would invite a client to wait for it, and a beacon that blocks a page transition on an
        analytics write is a beacon that costs the user the thing being measured.


        **Batched by design.** Up to 50 events per call, so a session posts a handful of times
        rather than once per navigation. Every field is a shape, not an identity: `path` is the
        route, `referrerHost` is a host and never a full URL with its query string, `device` is one
        of three buckets. No IP address, no fingerprint, no user agent.


        Unauthenticated, and it accepts a token if one is present. That is what makes the
        anonymous-to-signed-in funnel measurable at all -- refusing anonymous events would leave the
        platform able to count only the people who already converted. `sessionId` is generated by
        the client and is the only thread between two events; it is pattern-constrained rather than
        free text so it cannot be used to smuggle a payload into the analytics tables.


        Best-effort by nature: a blocked or failed beacon means the visit is simply absent from the
        reports rather than estimated.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PageViewBatchCreate' }
      responses:
        '202':
          description: Accepted for recording. No body.
        '422': { $ref: '#/components/responses/ValidationError' }
  /client-errors:
    post:
      tags: [Engagement]
      summary: Report a browser-side crash
      security: []
      operationId: recordClientError
      description: >
        The crash screen's report. Unauthenticated, and it accepts a token if one is present so the
        row can carry the user's role. Always 204 for a valid body: whether the error was new,
        merged into an existing one or dropped by the daily cap of new distinct errors is not
        revealed. Rate-limited per caller like every write.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ClientErrorReport' }
      responses:
        '204': { description: Recorded or deliberately ignored. No body. }
        '413': { description: Body larger than 16 KB }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /help/feedback:
    post:
      tags: [Engagement]
      summary: Say whether a help article helped
      security: []
      operationId: recordHelpFeedback
      description: >
        The "Was this helpful?" control at the foot of every help centre article.


        **Write-only for readers.** The one read is `GET /admin/help-feedback`, for the people who
        maintain the articles. These are notes to them, not a public rating. Serving them back would turn a maintenance signal into a
        review system -- a reader judging an article by its score, an early run of three votes
        becoming a verdict the article cannot shake, and a free-text box on an anonymous endpoint
        becoming a surface that publishes whatever is typed into it.


        **Unauthenticated, and it accepts a token if one is present.** The help centre is what
        people read before they have an account -- how to sign up, what the platform is, whether
        there is brokerage. Requiring a session would collect verdicts only from readers the
        writing had already worked on, and the articles most worth fixing are the ones whose
        readers never got that far.


        **202, and empty.** The widget has already switched to its thank-you state from its own
        local record; nothing it renders waits on this. `slug` identifies a Markdown article
        compiled into the frontend bundle, so the server cannot tell a real slug from a typo and
        does not pretend to. `lang` is recorded separately because an article can read clearly in
        English and badly in Marathi, and one combined rate would describe neither.


        Voting again replaces the reader's earlier verdict and comment (the reader is the account,
        else the `voter` id, else the caller's IP).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/HelpFeedbackCreate' }
      responses:
        '202':
          description: Accepted for recording. No body.
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/data-export:
    get:
      tags: [Identity & Access]
      summary: Everything Draazy holds about me
      operationId: exportMyData
      description: >
        The subject-access request, answered in one call rather than by an email to support that
        somebody has to remember to action.


        The response describes itself. Each dataset carries a `describes` sentence saying in plain
        words what the rows are, a `rowCount`, a `truncated` flag, and a `withheld` map naming any
        column removed and why. `excluded` names the tables left out entirely, with reasons. A
        person exercising this right should not have to reverse-engineer a database schema to
        understand the answer, and an export that silently omitted a column would be a worse answer
        than one that says which column it omitted.


        **Redaction is stated, not implied.** `redactionRule` says how other people's identifiers
        were handled -- an export of your enquiries necessarily touches the owners you contacted,
        and their phone numbers are not yours to receive. `rowLimit` and `truncated` say the same
        thing about volume: a capped export is honest about being capped.


        `schemaVersion` exists so a person who exports twice a year apart can tell whether the shape
        changed underneath them.


        Rate-limited alongside the platform's other writes despite being a read -- it assembles many
        tables per call, and it is a request nobody legitimately makes twice a minute.
      responses:
        '200':
          description: The full export
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DataExport' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/societies/following:
    get:
      tags: [Engagement]
      summary: Societies the caller follows
      description: >
        Most recently followed first. Paged rather than a bare array: nothing caps how many
        societies one person may follow. Rows carry only what the follow toggle and the dashboard
        panel draw.
      operationId: listFollowedSocieties
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Followed societies
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FollowedSociety' }
  /me/societies/{slug}/follow:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    put:
      tags: [Engagement]
      summary: Follow a society
      operationId: followSociety
      responses:
        '204': { description: Followed }
    delete:
      tags: [Engagement]
      summary: Unfollow a society
      operationId: unfollowSociety
      responses:
        '204': { description: Unfollowed }
  /bootstrap:
    get:
      tags: [Catalog & Search]
      summary: The public reference data every page render needs
      security: []
      operationId: getBootstrap
      responses:
        '200':
          description: >-
            Flags, geo policy, the city roster, Draazy's own prices, the listing policy, the
            Move-in Pack, the plan catalogue, the live listing counts by deal and category
            (`counts`, the home category tiles) and the whole-catalogue trust headlines
            (`trustStats`) and the home flatmate panel (`flatmatePulse`), in one read. Every section answers every caller
            identically, so the response is cached per instance and by the browser
            (`PublicReadCacheFilter`, cross-cutting.md §9). Each section projects one block of the
            admin-only settings document and nothing beside it: `fees`, `permissions`,
            `adminFlags` and each blacklist entry's operator `note` are never published.


            **flags**: only explicitly-set booleans; absent means enabled. **movePack**: absent
            means off, so a missing or malformed row answers `enabled: false` with no prices.
            **geo**: overrides the client merges over its built-in city geometry; a fresh install
            answers `{}`. None of the settings sections fail on bad configuration: each falls back
            to its default.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Bootstrap' }
  /cities/waitlist:
    post:
      tags: [Catalog & Search]
      summary: Join city waitlist
      security: []
      operationId: joinCityWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityWaitlistRequest' }
      responses:
        '201': { description: Added to waitlist }
        '422': { $ref: '#/components/responses/ValidationError' }
  /fees:
    get:
      tags: [Catalog & Search]
      summary: Current fee structure, one entry per deal intent
      security: []
      operationId: getFees
      responses:
        '200':
          description: >-
            Fee structure. Spec fix S24: an array, one entry per deal intent, not a single object.
            `platform_fees` is keyed by deal and the `Fees` schema itself carries a `deal` field, so
            a single object could never say which deal it described. A cost-transparency surface
            wants both sides at once, and an array needs no query parameter.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Fees' }
  /me/listings:
    get:
      tags: [Listings]
      summary: My posted properties
      description: >-
        One slim row per listing — what the My Listings card, its chips and the quality score draw.
        `pendingLeads` is the count of the owner's open contact requests on that listing and
        `dealStatus` its deal outcome, so the panel needs no contact-request or deal read. The
        full record is `GET /me/listings/{id}`.
      operationId: myListings
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged listing rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/OwnerListingCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Listings]
      summary: Create new listing
      operationId: createListing
      description: >-
        Bounds and consistency are 422 field errors (see `ListingFields`). Posting is paced: past the
        daily limit the call is `429` and `Retry-After` / `retryAfterSeconds` is the time until the
        oldest post in the 24-hour window ages out. Replaying a create the same owner made in the last
        ten minutes (same normalised title, address, type, deal and price on a non-archived listing) is
        `409 duplicate_submission` and carries `existingId`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Created (status = pending) — identity and status; the full record is `GET /me/listings/{id}`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingWriteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The same listing was posted a moment ago (`duplicate_submission`); `existingId` is that listing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: duplicate_submission, message: You just posted this listing. Open it from your dashboard instead of posting it again., status: 409, existingId: 6f1c1c0e-6a39-4d1d-9a0b-2f9c5f0f8b11 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/listings/quota:
    get:
      tags: [Listings]
      summary: My listing slots
      description: >-
        The wizard paywall's two numbers: the owner's ceiling and the slots they hold. The same
        `allowance` and `used` as `ListingEntitlement`, without that read's contact and
        agreement sections.
      operationId: myListingSlots
      responses:
        '200':
          description: Ceiling and slots held
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingSlots' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/listings/duplicate-check:
    post:
      tags: [Listings]
      summary: Have I already listed this property?
      operationId: checkOwnDuplicate
      description: >-
        Asked by the listing wizard before it submits, and answered **only** against the caller's own
        listings. The server derives the comparison key from the address exactly as `createListing`
        will — the picked live locality for the slug, then `AddressKey` for the normalised line — so the
        pre-check and the write cannot disagree about what counts as the same doorway.


        This exists because the check used to happen in the browser, against whatever listings that
        browser's local store happened to hold. On a live API that is the seeded demo catalogue, so
        the wizard could refuse a real owner over a fixture and then offer to open an id the server
        had never issued.


        Two signals, OR'd, and the same two `listDuplicateCandidates` uses on the ops side: the
        electricity meter number, and the normalised address within a resolved locality. A listing
        the catalogue could not place has no locality slug, so it matches nothing on address — two
        listings nobody could file are not known to be in the same place. A tax ID (`pmcPropertyId`)
        is **not** a signal here; there is no such column, and declaring the field would read as
        coverage the server does not have.


        `POST` rather than `GET` because the body carries a meter number, which is the one identifier
        on a listing that names a real-world utility account — a query string would put it in the
        access log and the browser history. Nothing is written.


        Always `200`. "Yes, here is the one you already have" is an answer, not a refusal: there is
        no listing yet for the server to reject, and a `409` here would train clients to treat the
        routine outcome as an error and skip the call.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingDuplicateCheck' }
      responses:
        '200':
          description: Whether the caller already has this unit listed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingDuplicateVerdict' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/listings/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Single listing detail
      operationId: getMyListing
      responses:
        '200':
          description: Listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update listing (foundation-field changes cost a re-review)
      description: >-
        Partial update; only the fields present are applied. Every **foundation** field — the set a
        buyer can search on — earns a moderator's attention when its value actually changes, but not
        the same amount of it (Q14).


        Changing `locality`, `propertyType`, `bhk` or `deal` changes what the listing fundamentally
        *is*, so leaving it in search would return a wrong answer (a 2BHK under 3BHK, a rental under
        sale). The response comes back with `status: pending` and the listing is off search until a
        moderator re-approves it.


        Changing `price`, `furnishing`, `possession`, `address`, `societyId`, `electricityMeterNo`,
        `description`, `amenities`, `images`, `video`, `reraId` or `plottedProject`, moving the pin
        more than 500 m, or changing `carpetArea` by 20% or more, leaves the listing the same property,
        so the worst case is a briefly out-of-date value. The response keeps `status: approved`, the
        listing stays in search, and `recheckPending` comes back true with `recheckReason` naming the
        fields. Description, amenities, photos, video, address and RERA id are re-checked on purpose
        (anti bait-and-switch), so they do **not** publish instantly. The back office reads what
        changed as `recheckChanges`. A PATCH that does both is treated as the first: the
        full re-moderation covers the attribute change too, so no separate re-check is raised.


        Every other field (title, deposit, maintenance, availability, floor, facing, age, tenants,
        pets, pincode, other form answers) publishes immediately and raises nothing.


        Only a listing that is pending, approved, paused or flagged can be edited: one that is
        rejected, sold, rented or archived answers `409 listing_not_editable`. A foundation edit on a
        flagged listing sends it back to `pending`, as it does for a live one.


        Bounds and consistency (422, per field): see `ListingFields`. Photo urls are de-duplicated in
        first-seen order. `bhk` is never stored for commercial, plot or farm land; deposit and the
        rent-only answers are never stored for a `buy` listing.
      operationId: updateListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated listing — identity, status and the re-check verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingWriteResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The listing is rejected, sold, rented or archived (`listing_not_editable`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing_not_editable, message: This listing is closed and can no longer be edited., status: 409 }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Take a listing down
      operationId: archiveListing
      description: >
        **A soft archive, not a delete**, and the response is what says so: this answers with the
        row's `id`, `status` and `archived: true` rather than a `204`. The row survives, drops
        out of search and off the public detail page, and stays reachable to its owner and to
        moderation.


        Returning that much is the point. The owner's dashboard needs to redraw the card in its
        archived state immediately, and a `204` would force a re-read of a listing that public
        search can no longer return. It is also the honest shape: nothing was destroyed, so claiming
        "no content" would misdescribe what happened. The full record is not echoed back; no caller
        reads it.


        Enquiries, visits and moderation history that already reference this listing keep pointing
        at a real row. That is the reason for the archive rather than a hard delete -- a buyer's
        past conversation should not lose the flat it was about because the owner rented it out.


        A listing the caller does not own is a `404`, not a `403`: whether a stranger's listing id
        exists is not information this route owes an unrelated caller.


        Refused with `409 listing_has_open_work` while the listing is under offer, has an offer
        waiting on the owner, a pending rental/sale confirmation, or a paid service in progress.
        Chats about the listing become read-only (`listingDeleted` on the conversation).
        Thirty days after the delete, a nightly job clears the listing's photos (from storage too),
        description, address and form details; the row keeps only what history needs. Until then
        support can restore it.
      responses:
        '200':
          description: 'The archived listing — `id`, `status` and `archived: true`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingWriteResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Something is still open on the listing (`listing_has_open_work`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing_has_open_work, message: An offer on this listing is waiting for your answer. Accept or decline it before deleting the listing., status: 409 }
  /me/listings/{id}/card:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: One of my listings as its My Listings row
      description: >-
        The row a client re-reads after an action that moved it (a deal closed, a draft sent for
        review), instead of the whole list. Same shape as an item of `GET /me/listings`.
      operationId: getMyListingCard
      responses:
        '200':
          description: The row
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerListingCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/listings/{id}/confirm-available:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: Confirm this listing is still available
      description: >-
        The owner's answer to the freshness nudge. Stamps `lastConfirmedAt` to now, which is the
        entire write — the active/aging/stale/dormant state is derived from that instant on every
        read, so a listing that had gone dormant is visible again immediately.


        Deliberately narrow. It does **not** change `status`, so answering the nudge can never take
        a live listing out of search; it does **not** clear a pending re-check, so an owner cannot
        dismiss a moderator's queue entry by confirming availability; and it does **not** restore an
        archived listing. Those are the three ways a well-meant "also do the obvious thing" would
        turn the most-repeated owner action on the platform into a footgun.


        No request body — the path says the only thing this call can say, and the only date that
        matters is the server's. Idempotent: confirming an already-fresh listing simply re-stamps,
        because the owner cannot see which of their listings the badge currently considers stale.
      operationId: confirmListingAvailable
      responses:
        '200':
          description: The listing row, with `lastConfirmedAt` updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerListingCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/listings/{id}/pause:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: Pause a live listing
      description: >-
        Owner-scoped pause for a live approved listing. Paused listings leave public search, counts,
        sitemap-style discovery and similar-listing surfaces, but the detail URL still resolves so a
        held link can explain that the owner paused the listing. A paused listing does not count
        against the free-tier ceiling, so pausing frees the slot for another listing.
      operationId: pauseMyListing
      responses:
        '200':
          description: 'The listing row with `status: paused`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerListingCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/listings/{id}/resume:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: Resume an owner-paused listing
      description: >-
        Owner-scoped resume for a listing paused by its owner. Resuming returns the listing to
        `approved` without re-moderation; edits that require re-moderation move the listing back to
        `pending` instead, so only an unchanged paused listing can use this shortcut. Refused with
        `422 listing_quota_exhausted` when the owner already has their free live listing(s) and the
        listing has no active listing pass.
      operationId: resumeMyListing
      responses:
        '200':
          description: 'The listing row with `status: approved`'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerListingCard' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: '`listing_quota_exhausted` — pause another listing or buy a listing pass for this one'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/managed-properties:
    get:
      tags: [Listings]
      summary: My managed properties (private records, newest first)
      description: >-
        Owner-scoped "single-player" property records that live outside the searchable
        marketplace until published. Self-scoped by the JWT; no `x-roles`.
      operationId: myManagedProperties
      responses:
        '200':
          description: Managed properties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedProperty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [Listings]
      summary: Register a managed property (private)
      operationId: registerManagedProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPropertyCreate' }
      responses:
        '201':
          description: Created (visibility = private)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/managed-properties/{id}:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Single managed property (owner)
      description: 404 (never 403) when the record is not the caller's, so another owner's record is never confirmed.
      operationId: getManagedProperty
      responses:
        '200':
          description: Managed property
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Listings]
      summary: Update managed property (partial)
      operationId: updateManagedProperty
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedPropertyUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Delete managed property (owner)
      operationId: deleteManagedProperty
      responses:
        '204': { description: Deleted }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/managed-properties/{id}/publish:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: Publish a managed property into the marketplace
      description: >-
        Spawns a normal pending listing and links back to it. Idempotent — a record already
        published is returned unchanged with its `publishedListingId` set.
      operationId: publishManagedProperty
      responses:
        '200':
          description: Published
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/managed-properties/{id}/listing:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    post:
      tags: [Listings]
      summary: List a private home through the full listing wizard
      description: >-
        The same body and checks as `POST /me/listings` (pacing, photos, quota, moderation), and
        the new listing is linked to this record in the same transaction. 404 (never 403) when the
        record is not the caller's; 409 when it is already listed.
      operationId: publishManagedPropertyWithListing
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingCreate' }
      responses:
        '201':
          description: Created (status = pending) — identity and status, as `POST /me/listings`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ListingWriteResult' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: This home is already listed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/managed-properties/{id}/rent-tracking:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    delete:
      tags: [Listings]
      summary: Stop rent tracking (owner)
      description: >-
        Turns rent tracking off and clears the tenant name, mobile, rent and due day. Receipts
        already recorded are kept, because each is an issued tax document.
      operationId: stopManagedRentTracking
      responses:
        '200':
          description: The updated record
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedProperty' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/tracked-rent:
    get:
      tags: [Listings]
      summary: Rent an owner tracks against the caller's mobile (tenant)
      description: >-
        Every rented managed property whose tenant mobile is the caller's own, so a tenant who signs
        up after the owner named them is linked without an invite step. Receipts are only those
        recorded since the caller was named as the tenant.
      operationId: listMyTrackedRent
      responses:
        '200':
          description: Tracked homes, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TrackedRent' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/managed-properties/{id}/rent-receipts:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
    get:
      tags: [Listings]
      summary: Manual rent receipts for one managed property (newest month first)
      description: >-
        Rent the owner recorded as received outside Draazy — cash or a bank transfer we never
        saw. Draazy collects no rent and has no rail that could: this is the owner's own
        assertion, kept because a receipt is a tax document, and nothing here is evidence that
        money moved through the platform.


        404 (never 403) when the property is not the caller's, so another owner's record is never
        confirmed.
      operationId: managedPropertyRentReceipts
      parameters:
        - name: months
          in: query
          required: false
          description: >-
            How many recent months to return. A page size, so out-of-range values are clamped to
            1..24 rather than rejected — a client asking for 5000 means "all of them".
          schema: { type: integer, minimum: 1, maximum: 24, default: 6 }
      responses:
        '200':
          description: Recent receipts, newest `rentMonth` first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ManagedRentReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Listings]
      summary: Record one month's rent as received
      description: >-
        Mints an immutable receipt for `rentMonth`. The body carries the month and nothing else:
        amount, tenant, landlord and property address are snapshotted server-side from the owned
        property and the caller's own user row, because a rent receipt is a tax document and "the
        browser said so" is not a provenance for one. The snapshot is what lets a receipt handed
        over in August keep saying what it said in August after the rent is raised.


        Requires a property that is marked rented, carries a positive `monthlyRent` and names a
        tenant — otherwise 422. At most one receipt per property per month, enforced by a unique
        index, so a repeat is a deterministic 409 rather than a second document for one payment.
      operationId: recordManagedPropertyRentReceipt
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ManagedRentReceiptCreate' }
      responses:
        '201':
          description: Receipt created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ManagedRentReceipt' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals/{propId}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
    get:
      tags: [Listings]
      summary: Deal status for a property
      operationId: getDeal
      responses:
        '200':
          description: Deal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Deal' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/deals/{propId}/reserve:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Mark property under offer
      operationId: reserveDeal
      description: >
        Marks the property under offer (deal state: available → reserved → closed/reopened).
      externalDocs:
        description: Deals, offers & finalization flow
        url: docs/flows/consumer/deals-offers-finalization.md
      responses:
        '200':
          description: Reserved
          links:
            closeThisDeal: { $ref: '#/components/links/CloseThisDeal' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/deals/{propId}/close:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Close deal (sold/rented)
      operationId: closeDeal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DealCloseRequest' }
      responses:
        '200': { description: Closed }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals/{propId}/reopen:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Listings]
      summary: Reopen property
      operationId: reopenDeal
      description: >
        Optional body `{availableOn}` (same validation as a listing create: today to today + 365 days
        for rent, today + 5 years for sale, IST)
        sets the date the home is free again. For a rent listing with a future date the active tenancy
        ends the day before it, rather than today, so the next tenant can be added from that date.
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                availableOn: { type: string, format: date, nullable: true }
      responses:
        '200': { description: Reopened }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/deals/{propId}/parties:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Listings]
      summary: Under-offer parties
      operationId: listParties
      responses:
        '200':
          description: Parties
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DealParty' }
  /me/offers:
    get:
      tags: [Listings]
      summary: Offers on my properties
      operationId: offersOnMine
      description: >
        Newest first, owner-scoped, paged. Every row here is written by a *buyer*, so the collection
        grows with demand for the listing rather than with anything its owner did - the owner an
        unpaged read punishes is the successful one. No `sort` parameter: the order is fixed
        server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged offers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Offer' }
  /offers/mine:
    get:
      tags: [Listings]
      summary: My submitted offers
      operationId: myOffers
      description: >
        Newest first, caller-scoped, paged - the mirror of `offersOnMine` over the same table. Paged
        in step with it so the response shape does not depend on which side of a negotiation the
        caller is on. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged offers
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Offer' }
  /offers:
    post:
      tags: [Listings]
      summary: Submit offer
      operationId: submitOffer
      description: >
        Buyer submits a price offer on a listing. The owner then accepts / declines /
        counters via `respondOffer` (negotiation loop).
      externalDocs:
        description: Deals, offers & finalization flow
        url: docs/flows/consumer/deals-offers-finalization.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferCreate' }
      responses:
        '201':
          description: Offer submitted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Offer' }
          links:
            respondToOffer: { $ref: '#/components/links/RespondToOffer' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /offers/{id}/respond:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Listings]
      summary: Accept / decline / counter an offer
      operationId: respondOffer
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OfferResponse' }
      responses:
        '200': { description: Responded }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /visits:
    get:
      tags: [Listings]
      # Caller-scoped to prevent disclosure of other visitors' names, mobiles, addresses, and times.
      summary: Visits the caller booked
      operationId: listVisits
      description: >
        Newest first, caller-scoped, paged - the mirror of `myVisitRequests` over the same table.
        Paged in step with it so the response shape does not depend on which end of a visit the
        caller is on. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { name: propertyId, in: query, schema: { type: string, format: uuid }, description: "Only the caller's visits to this listing — what the property page needs." }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged visits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Visit' }
    post:
      tags: [Listings]
      summary: Schedule visit
      operationId: scheduleVisit
      description: >
        In person only. A visit spends one owner contact from the same allowance as `POST /contacts/request`,
        unless the caller already has a counted contact request or visit on this listing; booking your own
        listing is free. Cancelling before the owner first confirms gives it back; after that it stays spent.
        A closed listing (paused, rented or sold) is `409 listing_not_live`, exactly as for a contact
        request; a listing that is not visible at all is `404`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitCreate' }
      responses:
        '201':
          description: Scheduled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Visit' }
        '409':
          description: >
            The listing is closed (`listing_not_live`), the caller already has a live visit on it, or the
            caller cancelled a visit on it in the last 24 hours (`recently_withdrawn`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing_not_live, message: This listing is not live right now, status: 409 }
        '422':
          description: >
            Invalid body (`validation_failed`), no owner contacts left (`contact_quota_exhausted`), or
            `contactPendingMax` contacts and visits still wait for an owner's reply (`contact_pending_limit`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ValidationProblem' }
              example: { error: contact_quota_exhausted, message: You have used all your owner contacts. Buy a contact pack, or refer a friend to earn more., status: 422 }
  /me/visit-requests:
    get:
      tags: [Listings]
      summary: Visit requests on my properties
      operationId: myVisitRequests
      description: >
        Newest first, owner-scoped, paged. A booking here is made by a *visitor*, so the collection
        grows with demand for the listing rather than with anything its owner did. No `sort`
        parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged visit requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Visit' }
  /visit-requests/{id}/status:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Listings]
      summary: Confirm / cancel visit
      operationId: updateVisitStatus
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /visits/{id}/slot:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Listings]
      summary: Reschedule visit to a new slot
      operationId: rescheduleVisit
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VisitSlotUpdate' }
      responses:
        '200': { description: Rescheduled }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /properties/{id}/status:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Approve / reject listing
      operationId: setPropertyStatus
      description: >
        **Approving a listing with no `localitySlug` is refused with 409.** Publishing one puts a
        listing live that is absent from locality search facets, from its locality landing page, from
        saved-search alerts and from its society's home list — while its owner is told it is now
        visible to buyers. The remedy is for the owner to pick the locality from the suggestions.


        Only approval is blocked. Rejecting an unfiled listing, or sending one back to `pending`, is
        allowed: a listing that is obviously spam must be disposable without first being carefully
        filed, or a curation rule becomes a moderation deadlock. There is no override — one would
        reduce this back to the warning it replaced.
      x-roles: [staff, manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyStatusUpdate' }
      responses:
        '200': { description: Updated }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Approval refused - missing locality, incomplete checklist, stale expectedStatus, or owner_not_confirmed on a staff-posted listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /properties/{id}/outreach:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Prepare a WhatsApp message chasing this listing's owner
      operationId: prepareOwnerOutreach
      description: >
        Renders one of the approved templates against this listing, its owner and the calling staff
        member, records it, and returns a `wa.me` link that opens WhatsApp with the message already
        typed out.


        **The status is always `prepared`, and that is not a placeholder.** The send is WhatsApp
        click-to-chat from the staff member's own device — a real mechanism, needing no Business
        Solution Provider and no template approval, but one this server cannot witness. It knows the
        message was composed and handed to a human. Reporting `sent` would be the platform asserting
        delivery in the very record meant to be the evidence for it.


        The caller supplies a template id and nothing else. A request carrying the message body
        would let any staff account send arbitrary text to a member of the public over the
        platform's name, which is a materially larger power than choosing from a library. Variables
        are substituted server-side from the database; a placeholder with no value is left standing
        as literal text, so the gap is visible in the preview rather than silently swallowed.


        `409` when the owner has no mobile on file, because there is nowhere to send it. `400` for
        an unknown or retired template id.


        Carries `postOnBehalf:write` rather than `properties:moderate`: this puts a message on a
        member of the public's personal phone in the platform's name — the same power, aimed at the
        same people, as creating a listing under their number.
      x-roles: [staff, manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [templateId]
              properties:
                templateId:
                  type: string
                  description: An id from `GET /admin/message-templates`.
                  example: wa-photos
      responses:
        '200':
          description: The prepared message and the link that sends it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PreparedMessage' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
    get:
      tags: [Moderation]
      summary: What this listing's owner has already been told
      operationId: listOwnerOutreach
      description: >
        Newest first. The reason this endpoint exists is collision: before it, two staff members
        chasing the same owner on the same morning had no way to discover each other, because the
        console counted reminders in the browser's own copy of the data and the WhatsApp panel
        recorded nothing at all.


        Ordering is by preparation time and is dependable to the message rather than to the
        transaction, which matters because the question being asked is "what was this owner told
        last?".
      x-roles: [staff, manager, admin]
      responses:
        '200':
          description: The messages prepared for this listing's owner, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OutreachEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/outreach/{messageId}/sent:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
      - { name: messageId, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Moderation]
      summary: Attest that a prepared WhatsApp message was sent
      operationId: markOwnerOutreachSent
      description: >
        A staff attestation, not a delivery receipt: the staff member pressed send in their own
        WhatsApp. Idempotent. When the message carries this listing's claim link, the listing's
        progress moves to `link_sent`. `404` when the message does not belong to this listing.
      x-roles: [staff, manager, admin]
      responses:
        '200':
          description: The message, now `sent`
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OutreachEntry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/flag:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Flag listing
      description: A non-blank `reason` is required (422 field error otherwise). The owner is notified.
      operationId: flagProperty
      x-roles: [staff, manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Flagged }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Moderation]
      summary: Clear flag
      operationId: clearFlag
      x-roles: [staff, admin]
      responses:
        '204': { description: Cleared }
  /properties/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Archive listing (soft-delete)
      operationId: archiveProperty
      # No x-roles: dual audience (owner deletes own, staff takes down); guard is owner-or-staff server-side.
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived listing
      operationId: restoreProperty
      # No x-roles: dual audience, see archiveProperty.
      responses:
        '200': { description: Restored (status reset to pending) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The owner deleted it more than 30 days ago and its content is gone (`listing_content_purged`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /properties/{id}/split:
    parameters: [ { $ref: '#/components/parameters/PropertyUuid' } ]
    post:
      tags: [Listings]
      summary: Let this flat room by room
      description: >
        Owner-only, rent-only, once-only. The whole-flat listing keeps existing. Rooms start at
        `identity` tier and unbadged while the parent listing is pending; they are promoted to
        `owner` tier when Ops approves the flat — the badge is earned from the parent's approval,
        never asserted by the act of splitting.
      operationId: splitFlat
      externalDocs: { description: Behaviour, url: docs/flows/consumer/list-property-wizard.md }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatSplitRequest' }
      responses:
        '201':
          description: Split created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatSplitResult' }
        '404': { description: Unknown listing, or one the caller does not own - the same body for both }
        '409':
          description: '`already_split`, `not_splittable` (sale listing), or blocked by the host-eligibility guardrails.'
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Listings]
      summary: Stop letting this flat room by room
      description: Refused once anyone has moved in — deleting the rooms would erase a live tenancy.
      operationId: unsplitFlat
      responses:
        '204': { description: Split withdrawn }
        '404': { description: Unknown listing, one the caller does not own, or no split to withdraw }
        '409': { description: Someone has already moved in (`occupied`) }
  /properties/{id}/admin:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Admin update of property fields
      description: >
        Admin field-level update. NOTE — the source contract reuses
        `PATCH /properties/{id}`; disambiguated here from the public getter to
        avoid method/verb collision (documented assumption).
      operationId: adminUpdateProperty
      # Correcting another user's listing: the verification or moderation desk.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ListingUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        # The one path that edits a listing the caller does not own: without a documented
        # failure, "id does not exist" is undefined behaviour.
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /properties/{id}/photos/takedown:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Take one photo off a listing (moderation desk)
      description: >
        Removes the photo from the gallery and cover, re-indexes the duplicate-photo hashes, deletes the
        stored file when no other listing uses it, audits `listing.photo.takedown` and tells the owner
        in-app. When no photo is left the listing goes back to needs-info. Refused on the caller's own listing.
      operationId: takedownPropertyPhoto
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [photo, reason]
              properties:
                photo: { type: string, description: The photo URL exactly as it appears in the gallery. }
                reason: { type: string, enum: [not_the_property, people_visible, contact_info, other] }
      responses:
        '200':
          description: The listing without the photo
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { description: Reason is not one of the listed codes }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/rera-check:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Record the MahaRERA lookup for a listing's RERA ID (verification or moderation desk)
      description: >
        Sets the result, audits `property.rera.check` and ticks the derived "RERA ID checked on MahaRERA"
        checklist line only for `verified`. `not_found` or `mismatch` blocks approval (409
        `rera_check_failed`). Refused on the caller's own listing and when the listing quotes no RERA ID (409).
      operationId: recordPropertyReraCheck
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [result]
              properties:
                result: { type: string, enum: [verified, not_found, mismatch] }
      responses:
        '200':
          description: Updated case file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
        '400': { description: Result is not one of the listed values }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The listing quotes no RERA ID, or is not under review }
  /users:
    get:
      tags: [Moderation]
      summary: List all users (admin)
      operationId: listUsers
      x-roles: [staff, manager, admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: role, in: query, schema: { $ref: '#/components/schemas/Role' } }
        # Owners and buyers only; back-office accounts are listed under Team & Access.
        - { name: customers, in: query, schema: { type: boolean, default: false } }
        - { name: q, in: query, schema: { type: string } }
        # Separate columns: an account can be suspended *and* archived, and a moderator works the
        # suspended ones still live. Unknown status is 422 so a typo'd dropdown fails loudly.
        - { name: status, in: query, schema: { type: string, enum: [active, suspended, archived] } }
        - { name: flagged, in: query, schema: { type: boolean } }
        - { name: archived, in: query, schema: { type: boolean, default: false } }
        - name: counts
          in: query
          schema: { type: boolean, default: false }
          description: >
            Adds `counts` (`all`, `active`, `suspended`, `archived`) to the page: the whole
            filtered set under `role`, `customers` and `q`, ignoring `status`, `flagged`, `archived` and
            paging. `all` excludes archived accounts. The console asks only when the role or search
            changes, not on a page flip.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged users
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminUserRow' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Update user
      operationId: adminUpdateUser
      # Manager/admin only: editing another person's profile is not a routine ops action.
      x-roles: [manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserRow' }
        '409':
          description: Name changes are locked while the target account is verified (`NAME_LOCKED_WHILE_VERIFIED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/kyc-profile:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Correct a KYC applicant's name or email
      description: >
        For the KYC desk (`identity:write`): fix the account's name or email to match the document
        under review. Only accounts that have submitted identity verification; audited as `user.update`.
      operationId: kycUpdateUser
      x-roles: [staff, manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/User' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Email already in use, or name locked while verified (`NAME_LOCKED_WHILE_VERIFIED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}/archive:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Archive user (soft-delete)
      operationId: archiveUser
      x-roles: [manager, admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Archived }
        '409':
          description: >-
            Refused by the last-administrator floor (D200): this account is the only one left that
            can still manage back-office access, so archiving it would lock the platform out of its
            own back office with no in-product recovery. Give another active administrator
            `users:write` first.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/restore:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Restore archived user
      operationId: restoreUser
      x-roles: [manager, admin]
      responses:
        '200': { description: Restored }
  /users/{id}/suspend:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Suspend a user
      description: >-
        Stops the account obtaining a session: it stays in the directory, visibly
        marked, where the colleagues investigating it can see it. That is what distinguishes it from
        `archive`, which is the soft delete and hides the account from every read path on the
        platform.


        Existing sessions are ended as well as future ones refused. Refusing only at sign-in would
        leave the suspended person holding a valid access token until it expired, so the refresh
        family is revoked and the window closes to the access-token TTL.


        Idempotent: suspending a suspended account is a no-op, not a conflict.


        A manager may suspend staff accounts only; suspending a buyer or owner is admin-only (403).
        While an owner is suspended their listings are hidden from search and the property page, and
        take no new visits or contact requests; reactivating brings them back.
      operationId: suspendUser
      x-roles: [manager, admin]
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200': { description: Suspended }
        '403':
          description: >-
            You cannot suspend your own account. It is the one moderation action that removes the
            ability to undo itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Refused by the last-administrator floor (D200) — the same guard `archive` carries, for
            the same reason: this is the only account left that can manage back-office access.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/reactivate:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Lift a suspension
      description: >-
        Returns a suspended account to `active`. Idempotent for an account that is already active,
        and deliberately refuses an archived one: that state belongs to `restore`, which carries a
        guard this route does not.
      operationId: reactivateUser
      x-roles: [manager, admin]
      responses:
        '200': { description: Reactivated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The account is archived, not suspended. Restore it instead.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/{id}/badge:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Grant or withdraw the ID verified badge by hand
      description: >-
        The badge is normally earned through the identity-review queue. This route exists for the
        people that funnel cannot reach — a company account, someone whose documents an
        manager or administrator has checked off-platform.


        Granting and withdrawing are both immediate, and both are audited with the reason. Nobody
        can change the badge on their own account. Withdrawing a badge earned through an approved
        identity case is refused with 409: act on the case instead, so the record and the badge
        cannot disagree.


        Approval or withdrawal propagates to every listing the person owns, so the badge on their
        profile and the badge buyers see on their flats can never disagree.
      operationId: setUserBadge
      x-roles: [manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserBadgeRequest' }
      responses:
        '200':
          description: Badge granted or withdrawn; the updated row.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserRow' }
        '400':
          description: Reason is shorter than 10 or longer than 300 characters after trimming.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '403':
          description: The caller tried to change the badge on their own account.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Already verified, or an earned-badge withdrawal.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}/flag:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Raise or lower the internal review flag
      description: >-
        A note between back-office colleagues, never shown to the account holder and never returned
        on `GET /auth/me`. Flagging changes nothing the platform does — the person still signs in,
        their listings still show. It records that somebody noticed something and could not yet act
        on it, so the next moderator inherits the suspicion instead of rediscovering it.


        A reason is required to raise a flag and is enforced by a database constraint as well as
        here: a flag nobody can read the reason for is a smear the next moderator cannot act on.
        Clearing a flag forgets the reason; the history stays in the audit log.
      operationId: setUserFlag
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UserFlagRequest' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminUserRow' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /users/{id}/timeline:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: What this person has done, newest first
      description: >-
        Account creation, enquiries sent, visits booked, services requested, properties listed, and
        the moderation actions taken against the account — one chronological list, capped at the
        newest 50 events.


        Deliberately not paged. The ordering is across a union of six sources, so two rows written in
        the same millisecond in different tables have no defined order between them and a cursor
        could skip or repeat one. This answers "who is this" while an operator decides what to do;
        a full history belongs in an export.


        Every entry is joined on a real foreign key, never on a phone number. Entries carry facts,
        not sentences: `kind` and `status` are what the client words the line from, and `label` is
        whatever the source row already calls itself — a property title, a service type, an audit
        action. The server does not own English.


        `users:read`, and not audited: it exposes no contact detail, so logging every click of the
        modal would bury the reads that do.
      operationId: getUserTimeline
      x-roles: [admin]
      responses:
        '200':
          description: Newest first, at most 50
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/UserTimelineEntry' }
        '404': { $ref: '#/components/responses/NotFound' }
  /users/{id}/permissions:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: Read one back-office account's permission document
      operationId: getBackOfficePermissions
      x-roles: [manager, admin]
      responses:
        '200':
          description: The stored document and the access it actually resolves to
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackOfficeAccess' }
        '404': { $ref: '#/components/responses/NotFound' }
    put:
      tags: [Moderation]
      summary: Replace one back-office account's permission document
      operationId: replaceBackOfficePermissions
      description: >
        Replaces the document wholesale — a merge could not express "take this away", which is the
        operation this endpoint exists for. **The document may only ever narrow.** What the account
        can do afterwards is the *intersection* of this list with the compiled-in baseline for its
        role, so a name the role cannot hold adds nothing; it is refused at write time (422) rather
        than stored to look meaningful. An empty list is legal and deliberate: it means "this
        account may reach no guarded back-office route", which is a different statement from having
        no document at all. Deleting the document (restoring the role baseline) is not offered
        here — see `back_office_permissions` in V65.
      x-roles: [manager, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/BackOfficePermissionsRequest' }
      responses:
        '200':
          description: Stored. The body reports the outcome, not the request.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/BackOfficeAccess' }
        '403':
          description: >-
            An administrator cannot edit their own permissions. Otherwise the one account that can
            reach this endpoint could never be narrowed by anybody but itself.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >-
            Refused by the last-administrator floor (D200): the function list would remove the only
            remaining administrator's ability to manage back-office access. Nothing was written.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            The list names something this server does not enforce, or something the target's role
            can never hold. Nothing was written — resend without it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /users/staff:
    post:
      tags: [Moderation]
      summary: Add staff member
      operationId: addStaff
      x-roles: [manager, admin]
      description: >
        Creates an ops staff or manager account. Administrators are singleton per environment and are
        created only by the startup bootstrap. Managers can create staff only. **The account cannot authenticate yet**: it is created
        with **no usable password**, and a single-use,
        expiring invite link is returned once to the creator. They choose their own credential via
        `redeemStaffInvite`; until then the account is refused on every login path, including the
        OTP one — a passwordless account with a mobile number is not thereby reachable. There is no
        `password` field on this request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StaffCreate' }
      responses:
        '201':
          description: Created, and unable to sign in until activated (see above)
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`; the body contains the one-time invite link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffCreateResponse' }
  /users/{id}/reset-2fa:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Clear a colleague's authenticator
      operationId: resetStaffTwoFactor
      description: >
        For a lost phone. Clears the authenticator and its recovery codes and ends every session;
        the holder sets up a new one at their next sign-in. Audited. Refused on yourself (403) and
        on accounts that do not sign in with a password (409).
      x-roles: [manager, admin]
      responses:
        '200': { description: Reset }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /users/{id}/reissue-invite:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Send a colleague a fresh set-password invite
      operationId: reissueStaffInvite
      description: >
        For a forgotten password or an expired invite. Supersedes any open invite, returns the new
        invite link once and ends every session; the old password stops working until the
        new invite is redeemed. Audited. Refused on yourself (403) and on accounts that do not sign
        in with a password (409).
      x-roles: [manager, admin]
      responses:
        '200':
          description: Invite link created
          headers:
            Cache-Control:
              schema: { type: string }
              description: Always `no-store`; the body contains the one-time invite link.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffInviteResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/verification/identity:
    get:
      tags: [Moderation]
      summary: Get own identity-verification status
      operationId: getIdentityVerification
      # No x-roles: the caller's own verification; /me/** self-scoping is the guard.
      description: >
        The caller's **opt-in** identity verification (L2 "Verified" badge). Always 200:
        someone who never submitted reads `status: none`. Absence of the badge never blocks
        browsing, posting or contacting owners (ADR-019).
      responses:
        '200':
          description: Verification status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityVerification' }
    post:
      tags: [Moderation]
      summary: Submit a government ID + live selfie for manual review
      operationId: submitIdentityVerification
      # No x-roles: the caller's own submission; /me/** self-scoping is the guard.
      description: >
        Live-captured photos of one government ID (Aadhaar front+back, PAN front, driving
        licence front, passport front, or voter ID front+back) plus a selfie, taken in the app camera and compressed client-side to
        under 1000000 bytes each. `claims` carries what the on-device OCR read (document number,
        name, date of birth) so the reviewer can confirm rather than retype it — the server does
        not trust it. Staff review the case in the ops queue; approval flips the caller's
        `verified` badge. A resubmission replaces the previous pending or rejected case. Images
        are deleted 7 days after the decision; only the last 4 digits, name and date of birth
        remain.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [docType, consent, front, selfie]
              properties:
                docType: { $ref: '#/components/schemas/IdentityDocType' }
                consent: { type: boolean, description: Must be `true` — the caller agreed to the ID being stored for review. }
                consentLanguage: { type: string, enum: [en, hi, mr], default: en, description: Language of the consent notice accepted by the caller. }
                claims:
                  type: string
                  description: JSON-encoded `IdentityClaims` as read by the on-device OCR. Optional.
                liveness: { type: string, enum: [passed, bypassed, unavailable], description: Optional on-device liveness result. }
                challenge: { type: string, description: 'Token from `POST /me/verification/identity/challenge`. Optional; approval needs the reviewer to confirm the pose only when one was signed.' }
                front: { type: string, format: binary, description: JPEG of the document front. }
                back: { type: string, format: binary, description: 'JPEG of the document back — required for `aadhaar` and `voter_id`, refused for `pan`, `driving_licence`, and `passport`.' }
                selfie: { type: string, format: binary, description: JPEG of the live selfie. }
      responses:
        '202':
          description: Submitted — the case is queued for review; `status` is `pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityVerification' }
        '400': { description: 'Consent missing, `back` missing for a two-sided document, `claims` unparseable, or `identity_challenge_invalid` (the pose challenge is expired, tampered, or for another user).' }
        '409':
          description: >
            This document is already verified on another account (one identity = one badge,
            ADR-009b), or the caller is already verified.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: identity_already_registered, message: This document is already verified on another account, status: 409 }
        '413': { description: A file is not strictly smaller than 1000000 bytes }
        '415': { description: A file is not a JPEG/PNG }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: Three submissions in 24 hours; `retryAfter` on the status says when the window opens.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: rate_limited, message: Too many attempts. Try again later., status: 429 }
    delete:
      tags: [Moderation]
      summary: Withdraw identity-verification consent
      operationId: withdrawIdentityVerification
      description: >
        DPDP consent withdrawal. Deletes the caller's identity case and captured images; if the
        case was verified, the Verified property badge is withdrawn. Idempotent: no existing case still
        returns 204.
      responses:
        '204': { description: Withdrawn, or there was no identity case to withdraw. }
  /me/verification/identity/challenge:
    post:
      tags: [Moderation]
      summary: Get a signed selfie pose challenge
      operationId: issueIdentityChallenge
      description: >
        The server picks the pose (`left`, `right` or `smile`) the selfie must show and signs it to
        the caller for 15 minutes. Send `token` back as `challenge` on submit; the reviewer checks
        the photo against the pose.
      responses:
        '200':
          description: Challenge issued.
          content:
            application/json:
              schema:
                type: object
                required: [token, pose, expiresAt]
                properties:
                  token: { type: string }
                  pose: { type: string, enum: [left, right, smile] }
                  expiresAt: { type: string, format: date-time }
  /me/verification/identity/dispute:
    post:
      tags: [Moderation]
      summary: Open a dispute for an identity document already in use
      operationId: openIdentityDocumentDispute
      description: >
        Lets a signed-in caller ask support to investigate the latest document already-in-use
        conflict recorded by the submit endpoint in the last 24 hours. The request does not accept a
        document number, so it cannot be used to probe whether someone else's document is registered.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityDisputeRequest' }
      responses:
        '201':
          description: Dispute ticket opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityDisputeResponse' }
        '400': { description: '`note` is longer than 500 characters.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: >
            No recent submit conflict is available, or this caller already has an open identity dispute.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                noRecentConflict:
                  value: { error: identity_no_recent_conflict, message: No recent identity conflict is available to dispute, status: 409 }
                openDispute:
                  value: { error: identity_dispute_open, message: An identity dispute is already open, status: 409 }
  /me/verification/identity/appeal:
    post:
      tags: [Moderation]
      summary: Appeal a rejected identity check
      operationId: openIdentityAppeal
      description: >
        Lets a signed-in caller ask for a second look at their own rejected identity check. Opens an
        `identity_appeal` support ticket (routed to the ops queue) and a staff appeal; a different
        reviewer than the one who rejected decides it. Only one appeal can be open at a time.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityAppealRequest' }
      responses:
        '201':
          description: Appeal opened.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityAppeal' }
        '400': { description: '`note` is missing or longer than 500 characters.' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '409':
          description: The identity check is not rejected, its photos are gone, it was already reviewed on appeal, or an appeal is already open.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              examples:
                notAllowed:
                  value: { error: identity_appeal_not_allowed, message: Only a rejected identity check can be appealed, status: 409 }
                open:
                  value: { error: identity_appeal_open, message: An appeal is already open, status: 409 }
  /moderation/identity-reviews:
    get:
      tags: [Moderation]
      summary: Identity-verification review queue (staff)
      operationId: listIdentityReviews
      x-roles: [staff, admin]
      description: >
        Submitted cases filtered by `status` (default `pending`, oldest first). `status=decided` lists verified, rejected and revoked cases, newest decision
        first, narrowed by `outcome`. `status=appeal` lists rejected cases with an open appeal, oldest
        first. Every filter is applied in the database before paging. Rows
        carry only what a queue line shows; claims, images and warnings are the detail read.
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: status, in: query, schema: { type: string, enum: [pending, verified, rejected, revoked, decided, appeal] } }
        - { name: q, in: query, description: Applicant name contains, or mobile contains the typed digits (3+), schema: { type: string } }
        - { name: docType, in: query, schema: { type: string, enum: [aadhaar, pan, driving_licence, passport, voter_id] } }
        - { name: claim, in: query, description: Fresh (30-minute) claim held by the caller, by nobody, or by someone else, schema: { type: string, enum: [mine, unclaimed, others] } }
        - { name: overdue, in: query, description: Submitted more than 48 hours ago, schema: { type: boolean, default: false } }
        - { name: outcome, in: query, description: With `status=decided` only, schema: { type: string, enum: [verified, rejected, revoked] } }
        - { name: sort, in: query, description: "Defaults: oldest for pending and appeal, newest otherwise", schema: { type: string, enum: [oldest, newest] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Queue page
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/IdentityReviewRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /moderation/identity-reviews/summary:
    get:
      tags: [Moderation]
      summary: Identity queue tab counts (staff)
      operationId: identityReviewSummary
      x-roles: [staff, admin]
      responses:
        '200':
          description: Counts
          content:
            application/json:
              schema:
                type: object
                required: [pending, overdue, mine, decided, appeals]
                properties:
                  pending: { type: integer, format: int64 }
                  overdue: { type: integer, format: int64, description: Pending for more than 48 hours }
                  mine: { type: integer, format: int64, description: Pending cases the caller currently holds }
                  decided: { type: integer, format: int64 }
                  appeals: { type: integer, format: int64, description: Rejected cases with an open appeal }
  /moderation/identity-reviews/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: One identity case with signed image URLs (staff)
      operationId: getIdentityReview
      x-roles: [staff, admin]
      description: >
        The case with short-lived signed URLs for the document and selfie images, the OCR claims,
        and `warnings` — other accounts whose confirmed or claimed document hash, or name+DOB
        key, matches this one. Images are gone once `filesPurgedAt` is set.
      responses:
        '200':
          description: Case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityReview' }
        '404': { $ref: '#/components/responses/NotFound' }
  /moderation/identity-reviews/{id}/claim:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Claim a pending identity case (staff)
      operationId: claimIdentityReview
      x-roles: [staff, admin]
      description: >
        Assigns a pending case to the caller for 30 minutes. Re-claiming your own fresh claim is
        idempotent and does not extend `claimedAt`. A fresh claim by another reviewer returns
        `409 identity_case_claimed`; a fourth fresh claim by the same reviewer returns
        `409 identity_case_claim_limit`; stale claims can be taken over. Claiming is optional:
        unclaimed pending cases may still be decided directly.
      responses:
        '200':
          description: Claimed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityClaimState' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Case is not pending, another reviewer has a fresh claim, or the caller already holds three fresh claims.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: identity_case_claimed, message: This case is claimed by Ops Admin, status: 409 }
    delete:
      tags: [Moderation]
      summary: Release an identity-case claim (staff)
      operationId: releaseIdentityReviewClaim
      x-roles: [staff, admin]
      description: >
        Releases the caller's fresh claim. A stale claim can be released by any reviewer; a fresh
        claim held by somebody else returns `409 identity_case_claimed`. Admins may pass
        `force=true` to release any pending case claim; this is audited as
        `identity.claim.force_released`.
      parameters:
        - { name: force, in: query, required: false, schema: { type: boolean, default: false } }
      responses:
        '204': { description: Released }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: No claim exists, case is not pending, or another reviewer has a fresh claim.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: identity_case_claimed, message: This case is claimed by Ops Admin, status: 409 }
  /moderation/identity-reviews/{id}/approve:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Approve an identity case (staff)
      operationId: approveIdentityReview
      x-roles: [staff, admin]
      description: >
        The reviewer confirms the document number, name and date of birth they read off the
        image. The server normalises and checks the number's format (Aadhaar Verhoeff checksum,
        PAN pattern, DL pattern), stores an HMAC of it as the dedup key and keeps only the last 4
        digits. The confirmed name is NFC-normalised, stripped, rejected if it contains control or
        format characters, Unicode separators are collapsed, and `users.name`
        is overwritten with that legal name even if the profile name is otherwise locked while
        verified. Flips the applicant's `verified` badge, propagates it to their listings, and
        notifies them in-app and on WhatsApp. The decision is final: no second reviewer is
        required.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityApproveRequest' }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityReview' }
        '400': { description: '`identity_pose_unconfirmed` — the case has a pose challenge and `poseConfirmed` was not true.' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Case is not pending, another reviewer has a fresh claim, the confirmed document is
            already verified on another account, or (`identity_number_mismatch`) the number
            differs from the applicant's entry and `numberOverride` was not true.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: identity_already_registered, message: This document is already verified on another account, status: 409 }
        '422': { $ref: '#/components/responses/ValidationError' }
  /moderation/identity-reviews/{id}/reject:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Reject an identity case (staff)
      operationId: rejectIdentityReview
      x-roles: [staff, admin]
      description: >
        Records a reason the applicant sees on their status screen and in the notification, so
        the retake fixes the actual problem. The applicant may resubmit within their attempt
        budget.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityRejectRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityReview' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Case is not pending, or another reviewer has a fresh claim }
        '422': { $ref: '#/components/responses/ValidationError' }
  /moderation/identity-reviews/{id}/appeal/uphold:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Uphold a rejection that was appealed (staff)
      operationId: upholdIdentityAppeal
      x-roles: [staff, admin]
      description: >
        Keeps the case rejected, closes the appeal ticket and tells the applicant in-app and on
        WhatsApp. Needs the same permission as the other identity decisions, and the caller must be
        not be the applicant (`403 identity_appeal_own_case`); the reviewer who rejected the case may decide it.
      responses:
        '200':
          description: Upheld
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityAppeal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The case has no open appeal (`identity_appeal_none`).' }
  /moderation/identity-reviews/{id}/appeal/reopen:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Reopen a rejected case for a fresh review after an appeal (staff)
      operationId: reopenIdentityAppeal
      x-roles: [staff, admin]
      description: >
        Returns the case to `pending` with its decision, claim and rejection reason cleared and its
        submit time restarted, so it re-enters the queue. The user's attempt counters are untouched.
        Same decider rule as uphold. Refused with `409 identity_appeal_not_allowed` once the photos
        were purged.
      responses:
        '200':
          description: Reopened
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityAppeal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The case has no open appeal (`identity_appeal_none`), or its photos were purged (`identity_appeal_not_allowed`).' }
  /moderation/identity-reviews/{id}/revoke:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Revoke a verified identity badge (staff)
      operationId: revokeIdentityReview
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/IdentityRevokeRequest' }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/IdentityReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Case is not verified }
        '422': { $ref: '#/components/responses/ValidationError' }
  /webhooks/cashfree/payment:
    post:
      tags: [Rentals & Payments]
      summary: Cashfree Payment Gateway webhook (provider → backend)
      operationId: cashfreePaymentWebhook
      security: []
      description: >
        Server-to-server callback from the Cashfree PG delivering the **terminal** payment
        outcome (`PAYMENT_SUCCESS_WEBHOOK` / failure) for subscription and
        service-order payments (ADR-017). This is the source of truth for payment state —
        the synchronous `201` on the initiating call is only `pending`. Authenticity is
        verified via the HMAC-SHA256 signature over `x-webhook-timestamp + rawBody`.
        Handlers must verify the signature, be idempotent (dedupe on `orderId`), and always
        return 200.
      parameters:
        - { name: x-webhook-signature, in: header, required: true, schema: { type: string } }
        - { name: x-webhook-timestamp, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PaymentWebhook' }
      responses:
        '200': { description: Acknowledged (always 200 on receipt) }
  /webhooks/whatsapp:
    get:
      tags: [Engagement]
      summary: WhatsApp webhook subscribe handshake (Meta → backend)
      operationId: whatsappWebhookSubscribe
      security: []
      description: >
        Meta's one-off verification when the callback URL is saved. Echoes `hub.challenge` as
        text only when `hub.mode` is `subscribe` and `hub.verify_token` matches
        `WHATSAPP_WEBHOOK_VERIFY_TOKEN`. Answers 404 while the webhook is unconfigured.
      parameters:
        - { name: hub.mode, in: query, required: true, schema: { type: string } }
        - { name: hub.verify_token, in: query, required: true, schema: { type: string } }
        - { name: hub.challenge, in: query, required: true, schema: { type: string, pattern: '^[A-Za-z0-9_-]{1,64}$' } }
      responses:
        '200':
          description: The challenge, echoed
          content:
            text/plain:
              schema: { type: string }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: WhatsApp webhook (Meta → backend)
      operationId: whatsappWebhook
      security: []
      description: >
        Server-to-server callback from the WhatsApp Cloud API, trusted only when
        `X-Hub-Signature-256` is the HMAC-SHA256 of the raw body under the app secret. A reply
        that is exactly STOP (or UNSUBSCRIBE, CANCEL…) opts that number out of every non-OTP
        WhatsApp message; START opts it back in, ordered by Meta's message timestamp. A `failed`
        delivery status is recorded in the provider ledger. A forged signature is only logged, and
        answered 200 like an unreadable body; a failure to store an opt-out answers 500 so Meta retries.
      parameters:
        - { name: X-Hub-Signature-256, in: header, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { type: object, additionalProperties: true }
      responses:
        '200': { description: Acknowledged }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/verification:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: Get property review thread
      operationId: getPropertyVerification
      # No x-roles: owner<->ops clarification thread, owner is a participant; guard is participant-or-staff.
      responses:
        '200':
          description: Review thread
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
    post:
      tags: [Moderation]
      summary: Initiate property review
      operationId: initPropertyVerification
      # No x-roles: the owner submits their own listing; guard is participant-or-staff.
      parameters:
        - name: markRead
          in: query
          description: >
            Also marks the other side's case-file messages read, so opening the review modal is one
            write rather than an open followed by `markVerificationRead`.
          schema: { type: boolean, default: false }
      responses:
        '201': { description: Initiated }
  /properties/{id}/verification/messages:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Add message to review
      operationId: addVerificationMessage
      # No x-roles: both sides of the thread post here; guard is participant-or-staff.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerificationMessageCreate' }
      responses:
        '201':
          description: Updated case; normal messages do not change lifecycle. Owner replies to needs_info resubmit; staff clarification requests become needs_info with reasonCode other and body as reasonNote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /properties/{id}/verification/read:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Mark review messages read
      operationId: markVerificationRead
      # No x-roles: either participant marks their own side read; guard is participant-or-staff.
      responses:
        '204': { description: Marked }
  /properties/{id}/verification/decision:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Verify or reject a property without publishing it
      description: Approval records verification only. Pending listings stay pending; live rechecks stay live. Requires properties verify grant and a reviewer who neither owns nor posted the listing.
      operationId: verificationDecision
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PropertyVerificationDecisionRequest' }
      responses:
        '200':
          description: Decision recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: owner_not_confirmed when a staff-posted listing has not been confirmed by its owner (checked before the case lookup); stale_decision when `expectedStatus` no longer matches the listing or its case (refresh and retry).
  /properties/{id}/verification/start:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Explicitly start verification without regressing a later stage
      operationId: startPropertyVerification
      x-roles: [staff, admin]
      responses:
        '200':
          description: Updated case
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /me/listings/{id}/opened:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Record the authenticated owner's opening of a staff-posted listing
      operationId: recordOwnerListingOpened
      description: >
        Fired by the sign-in screen when the owner arrives through a claim link
        (`/signin?claim={id}`). The first open is kept and shows staff an `opened` flag on
        `progress`. Opening is not confirming: the step only moves on `confirmOwnerListing`.
        Nothing is recorded for archived or owner-posted listings.
      responses:
        '204': { description: Recorded idempotently }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/listings/{id}/confirm:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Owner confirms a listing staff posted on their behalf
      operationId: confirmOwnerListing
      description: >
        The owner's explicit "Yes, this is my property", sent once they have completed the listing
        in the wizard. Moves a staff-posted listing from
        `link_sent`/`created` to `owner_confirmed`; publication of a staff-posted listing is refused
        with `409 owner_not_confirmed` until this has happened. Idempotent: a repeat call keeps the
        first confirmation. Notifies the staff member who posted the listing.
      responses:
        '204': { description: Confirmed (or already confirmed) }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            `not_staff_posted` when the owner posted the listing themselves, `conflict` when it
            is archived or no longer waiting for review, or `listing_incomplete` when it still lacks
            what a new listing must carry (area, BHK and bathrooms for a home, floors for a flat,
            locality, pincode, price, deposit and move-in date for a rental, possession for a sale,
            three photos); the message names what is missing.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /properties/{id}/verification/checklist:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    patch:
      tags: [Moderation]
      summary: Tick or untick one verification checklist line (admin)
      operationId: setVerificationChecklist
      description: >
        Addresses the line by its `item` text rather than an id: the items are seeded from a fixed
        per-deal list and the column is immutable, so the text is as stable as a surrogate key and
        survives a client holding a cached case file. One line per call, deliberately — the console
        ticks items as the reviewer works down the list, and a whole-list PUT would make every tick
        a last-write-wins race against a second reviewer on the same case.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ChecklistUpdate' }
      responses:
        '200':
          description: Updated case file
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/verification/ownership:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: Ownership evidence and gate status
      operationId: getOwnershipVerification
      description: >
        The documentary case file behind the Verified property badge, plus `missingKinds` — which
        of the facts the deal requires has no current document. A rental needs one of
        `address_proof` (a current electricity bill or property-tax receipt in the lister's name)
        or `title_proof` (Index II, share certificate, 7/12, 8A or Property Card); a sale needs
        `title_proof`. `title_support` (a sale deed), legacy `owner_identity`, `authority_proof` and `site_presence` are recordable as supporting
        evidence and never gate. Deliberately NO `x-roles`: like the
        review thread this sits beside, the listing
        owner is a participant, and an owner who cannot see which document is missing has no way to
        send it. Guard is participant-or-staff, and a stranger gets 404 rather than 403.
        A non-staff caller sees `kind`, `current` and the dates but NOT `docType` or `documentId`:
        which government ID an individual holds is personal data under the DPDP Act.
      responses:
        '200':
          description: Gate status and recorded evidence
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
    post:
      tags: [Moderation]
      summary: Grant the Verified property badge (staff)
      operationId: verifyOwnership
      description: >
        Accept the recorded evidence and grant the badge. Fails with 400 naming the missing facts if
        any the deal requires has no current document. The badge's expiry is derived from the evidence:
        the earliest expiry among the documents relied on, or never when all of them are registry or
        identity records. Re-running on an already-verified listing extends the expiry; running it
        after a lapse is a fresh transition and announces again.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Verified
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Moderation]
      summary: Withdraw the Verified property badge (staff)
      operationId: revokeOwnershipVerification
      description: >
        Withdraw a badge that should not have been granted — forged evidence, or a document that
        turned out to belong to a different flat. Distinct from a lapse, which needs no call at all.
        The recorded evidence is left in place on purpose: it is the record of what was accepted and
        by whom, which is exactly what an investigation into a wrongly granted badge needs to read.
        Idempotent.
      x-roles: [staff, admin]
      parameters:
        - name: reason
          in: query
          required: true
          schema: { type: string, minLength: 1 }
          description: >
            Why the badge was withdrawn, recorded on the audit entry. Required, as it is for every
            other reversal in the product — stripping a public trust claim with no stated reason
            leaves the next investigator nothing to go on. A query parameter rather than a body
            because DELETE bodies are dropped by several proxies and clients, and a reason that
            silently vanishes in transit is worse than one never sent.
      responses:
        '200':
          description: Withdrawn
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /properties/{id}/verification/ownership/evidence:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Record one ownership document (staff)
      operationId: recordOwnershipEvidence
      description: >
        Record a document ops has sighted or received. Recording never grants the badge on its own —
        the gate is a judgement about a set of documents taken together, and a system where
        uploading the third file silently promotes a listing is one where nobody decided anything.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnershipEvidenceCreate' }
      responses:
        '201':
          description: Recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /properties/{id}/verification/ownership/documents:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: The owner's uploaded documents for this listing (staff)
      operationId: listOwnershipDocuments
      description: >
        The listing's document vault as the reviewer sees it — what the owner uploaded in their
        Dashboard document vault, newest first, as metadata only. A file is opened through
        `getOwnershipDocumentUrl`, which signs a short-lived link on click. Evidence recorded with
        `recordOwnershipEvidence` cites one of these by `documentId`. Staff/admin only; the owner
        reads the same vault at `GET /me/documents/{propId}`.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Documents, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/verification/ownership/documents/{docId}/url:
    parameters:
      - { $ref: '#/components/parameters/PropertyId' }
      - { name: docId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Moderation]
      summary: Sign one of the owner's listing documents (staff)
      operationId: getOwnershipDocumentUrl
      description: >
        Same gate as `listOwnershipDocuments` and audited per open, since each call hands out a scan
        of an identity document. A file that is not in this listing's vault is 404.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUrl' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /properties/{id}/verification/ownership/request:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Ask for the Verified property badge (owner)
      operationId: requestOwnershipVerification
      description: >
        The owner asks for the badge from their document vault once the papers are uploaded. A live
        or paused listing joins the Re-check Queue and stays live; a pending one is already under
        review. Idempotent while a request is open; clears an earlier decline. 404 to anyone but the
        owner; 409 when the badge is already held, the listing is not pending/live/paused, the vault
        holds no document for it, or the owner never submitted an ID check (`identity_required`; an ID
        still in review is enough).
      responses:
        '200':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /properties/{id}/verification/ownership/decline:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    post:
      tags: [Moderation]
      summary: Decline an open badge request (staff)
      operationId: declineOwnershipVerification
      description: >
        Answer the owner's badge request without granting it. The listing's status is untouched; the
        owner is notified with the reason. 409 when no request is open.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1, maxLength: 300 }
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnershipVerification' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/property-reviews:
    get:
      tags: [Moderation]
      summary: My listings under review
      operationId: listMyPropertyReviews
      description: >
        The caller's own verification case files, most recently updated first. Carries no `x-roles`
        and needs none: the query is scoped to the caller's user id, so there is no row it can
        return that the caller does not already own, and a user with no listings gets an empty page
        rather than a 403.


        It exists instead of N calls to `getPropertyVerification` because the owner dashboard
        renders a verification chip and an unread badge on every listing card at once — without it,
        a twenty-listing dashboard is twenty requests, and nineteen of them 404.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged case files for the caller's listings, most recently updated first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ReviewBadge' }
  /reports/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Moderation]
      summary: Triage a report
      operationId: triageReport
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportTriage' }
      responses:
        '200':
          description: Triaged
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/properties/summary:
    get:
      tags: [Moderation]
      summary: Moderation headline counts
      operationId: propertyModerationSummary
      description: >
        The console's KPI strip, counted by the database over every listing.


        A separate operation rather than a field on `listPropertiesForModeration`, because only one
        of the two pages. The queue read is clamped to 100 rows, and the console used to fold its
        counters out of whatever that returned — so "Total", "Pending" and "Flagged" all silently
        meant "of the newest hundred", and stopped moving at exactly the backlog size that makes
        them worth reading. An undrained queue looked identical to a calm one.


        Takes no filters, deliberately. These are the platform's totals, not the current query's: a
        moderator narrowed to one locality still needs to know that four hundred listings are
        waiting overall, and a strip that followed the filters would be a second rendering of the
        table's own row count.


        `total` covers every un-archived listing, `sold` and `rented` included — a closed deal is
        still inventory. `archived` is the one counter outside that floor. `recheck` counts the
        stays-live queue (Q14), which raises none of the other counters because those listings are
        approved and in search. There is no `Under Review` counter: `PropertyStatus` has no such
        value.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Counts over the whole table
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyModerationSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/properties/lookup:
    get:
      tags: [Moderation]
      summary: Command-palette property search
      operationId: lookupPropertiesForOps
      description: Six fields per hit (id, slug, title, locality, owner name, status); the queue row carries about forty.
      x-roles: [staff, manager, admin]
      parameters:
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged hits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertyLookupRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/properties/duplicates:
    get:
      tags: [Moderation]
      summary: Listings that look like the same doorway, grouped
      operationId: listDuplicateClusters
      description: >
        The duplicates desk. Clusters are **derived on every request** from the same three signals
        the intake probe uses — a shared electricity meter, a shared address key within one
        locality, and a shared photograph — never stored. There is no `duplicateOf` column and no
        `duplicateFlag`: a duplicate is a relation between two rows, and writing it onto one of them
        would go stale the moment either is edited.


        Guarded by `properties:read` rather than a permission of its own. Everything in the response
        body is a listing the same caller may already read one at a time; what is added is the
        relation between them, which is strictly less than the rows themselves.


        Unpaged, and that is the reason for the report envelope. A truncated *list* is obviously
        partial — the operator sees rows and infers more. A truncated *clustering* is not: if the
        ceiling falls between two members of a genuine pair, that pair does not render as a partial
        cluster, it does not render at all, and the desk looks like a **cleaner** catalogue than it
        is. `truncated` exists so the console can say so out loud instead.


        Same-owner clusters are included and flagged, not filtered — see `sameOwner`.
      x-roles: [staff, admin]
      responses:
        '200':
          description: The desk as it stands, dismissals already removed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DuplicateClusterReport' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/properties/duplicates/merge:
    post:
      tags: [Moderation]
      summary: Keep one listing of a cluster, archive the rest
      operationId: mergeDuplicateCluster
      description: >
        Guarded by `properties:moderate`, not by a duplicates-specific atom: this archives listings,
        which is what that permission governs everywhere else it happens. Reaching the decision from
        the duplicates desk does not make it a smaller act than reaching it from the queue.


        The losers are named explicitly rather than inferred from the cluster, because the
        operator's screen and the server's derivation are two moments apart. A listing that joined
        the cluster in between is one the operator never saw, and inferring the losers would archive
        it on their behalf.


        `204`, with no body. The caller's next move is to re-read the desk — the merge changes which
        clusters exist, and returning the merged one would be returning the thing that no longer
        does.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateMergeRequest' }
      responses:
        '204': { description: Archived }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/properties/duplicates/dismiss:
    post:
      tags: [Moderation]
      summary: Record that a cluster is a coincidence
      operationId: dismissDuplicateCluster
      description: >
        "These are not the same flat." Guarded by `properties:moderate` although no listing is touched,
        because the effect is that a set of listings stops being shown to every future moderator —
        a suppression, and suppressions are writes. The read atom was the wrong instinct.


        The server derives the signature from the ids in the body rather than accepting one, so the
        verdict is recorded against the set that was actually on screen. A cluster that has since
        gained a member is a different set, and correctly comes back unanswered.


        Idempotent: a double-click, and two operators reaching the same verdict, both return `204`
        rather than one of them hitting the unique index.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DuplicateDismissRequest' }
      responses:
        '204': { description: Dismissed, or already dismissed }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /admin/properties/owner-standing:
    get:
      tags: [Moderation]
      summary: How much listing allowance one owner has left
      operationId: getOwnerStanding
      description: >
        The lookup an operator does **before** posting a listing on somebody's behalf, keyed by the
        owner's mobile number rather than by a user id -- because at the moment the question is
        asked, the owner may not have an account at all. That is the ordinary case for a
        post-on-behalf: somebody rang the office.


        Guarded by the post-on-behalf **write** permission even though it only reads, and that is
        deliberate rather than an oversight. The number an operator types is the whole input, so a
        read permission here would let anyone holding it probe arbitrary phone numbers for whether
        they belong to a Draazy owner and how many flats they list. The only people who need the
        answer are the people already allowed to act on it.


        **200 even for a number with no account**, carrying `known: false` and the default
        allowance. A `404` would answer the probing question just as clearly as a `200` would, and
        the operator's real question -- "may I post this one?" -- has an answer either way.
      parameters:
        - { name: mobile, in: query, required: true, schema: { type: string }, description: "The owner's mobile number, as given over the phone" }
      responses:
        '200':
          description: >
            Where this number stands. `overAllowance` is the single field the composer branches on;
            `held` and `allowance` are there so the operator can explain the answer to the person
            on the call.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerListingStanding' }
        '403': { $ref: '#/components/responses/Forbidden' }

  /admin/properties/{id}:
    parameters: [ { $ref: '#/components/parameters/PropertyId' } ]
    get:
      tags: [Moderation]
      summary: One listing for the desk, whole
      operationId: getPropertyForModeration
      description: >
        The full record behind a `listPropertiesForModeration` row, by id or slug and at any status
        including archived: what the review modal, the View modal and a `?review=` deep link read.
        Owner contact is raw, on the same `properties:read` entitlement as the queue. The row
        carries the same `signals` and `ownerReplied`. 404 for an unknown listing.
      x-roles: [staff, admin]
      responses:
        '200':
          description: The listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PropertyModerationRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }

  /admin/properties:
    get:
      tags: [Moderation]
      summary: Listing moderation queue
      operationId: listPropertiesForModeration
      description: >
        Listings of every status including archived, newest first. The moderation writes
        (`setPropertyStatus`, `flagProperty`, `clearFlag`, `adminUpdateProperty`)
        all address a listing by id and shipped without any read that could produce one for an
        unapproved listing: `searchProperties` pins `status='approved' AND archived=false`
        unconditionally — it takes no principal, so it cannot relax for staff — and `myListings` is
        scoped to the caller's own account. Unlike `searchProperties`, `status` here *widens*.


        **Owner contact is raw here, not masked.** The desk reading this queue exists to ring owners
        whose listings are stuck, and a moderator denied the number here gets it from somewhere this
        platform cannot log. A mask would never stand between the owner and staff, only between the
        disclosure and the audit trail.


        This is not the contact gate relaxing. The gate (`owner|approved|pending|declined|none`) is
        the owner's decision about one seeker, and no back-office role satisfies it. What applies
        here is `properties:read`, granted per account and revocable per account.
      x-roles: [staff, admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/DealIntent' } }
        - { name: type, in: query, schema: { type: string } }
        - { name: locality, in: query, schema: { type: string }, description: 'Locality *slug*, as on searchProperties' }
        - { name: bhk, in: query, schema: { type: integer, minimum: 0 } }
        - { name: minPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: maxPrice, in: query, schema: { type: integer, minimum: 0 } }
        - { name: furnishing, in: query, schema: { $ref: '#/components/schemas/Furnishing' } }
        - { name: possession, in: query, schema: { $ref: '#/components/schemas/PropertyPossession' } }
        - name: q
          in: query
          schema: { type: string }
          description: |
            Free text over title, locality, **owner name, owner mobile and listing id**.

            Wider than the shopper-facing `q` on `searchProperties`, and deliberately a separate
            predicate rather than the same one behind a role check. A desk works from what the
            caller can say out loud: their name, or more reliably their number, because Indian
            names are transliterated inconsistently enough that Rajesh/Rajeshh is an ordinary
            support call. The public search must never gain those two axes — `?q=98234` without a
            login would answer "which owners' numbers start 98234 and what does each of them own",
            which is the directory the masked mobile on a listing card exists to prevent.

            The id is matched as **text, by substring**, so the tail of a uuid pasted out of a chat
            message resolves; an exact-uuid match would reject every one of those.
        - name: status
          in: query
          description: Narrow to one moderation status. Omit for every status.
          schema: { $ref: '#/components/schemas/PropertyStatus' }
        - name: archived
          in: query
          description: >
            Tri-state. Omit for both live and archived listings; `true` for archived only; `false`
            for live only. A separate axis from `status` — archiving preserves the moderation state
            the listing was archived from.
          schema: { type: boolean }
        - name: recheck
          in: query
          description: >
            Tri-state. `true` is the stays-live re-check queue (Q14): listings whose owner edited
            `price`, `furnishing` or `possession`, which are waiting for a moderator *while still
            approved and still in search*. `false` excludes them; omit for both. A third axis, for
            the same reason `archived` is one — a re-check does not move `status`, so
            `status=pending` cannot surface it, and `flagged` is not a substitute because flagging
            takes the listing off search, which is exactly the cost this outcome exists to avoid.
            `recheckReason` on each item names the fields to look at. A badge-only entry is left to
            `badge`. This route alone may also sort by `recheckRequestedAt` / `ownershipRequestedAt`.
          schema: { type: boolean }
        - name: badge
          in: query
          description: >
            Tri-state. `true` is open Verified-badge requests from owners' document vaults, at any
            status; `false` excludes them; omit for both.
          schema: { type: boolean }
        - name: featured
          in: query
          description: >
            Tri-state. `true` is the curated shelf; `false` everything else; omit for both. Backed
            by the `featured` column, so it narrows the catalogue rather than a page — which is the
            reason it exists. The console's Featured tab evaluated this in the browser over the
            hundred listings it had already fetched, and on a 322-listing catalogue that rendered
            the tab **empty** while the summary tiles beside it, from `propertyModerationSummary`,
            said five.
          schema: { type: boolean }
        - name: postedByAdmin
          in: query
          description: >
            Tri-state. `true` is listings the concierge desk created on an owner's behalf via
            `createListingOnBehalf`; `false` owner-posted; omit for both. Filters the
            `posted_by_admin` column and not `adminPipeline.postedByStaff` — the two are written
            together, but the latter is a staff id inside a free-form map, and a queue should not
            depend on the shape of a blob.
          schema: { type: boolean }
        - name: unconfirmed
          in: query
          description: >
            Tri-state. `true` is listings whose owner has gone quiet — freshness `stale` or
            `dormant`, meaning no confirmation of availability for longer than the aging threshold.
            `false` is `active` or `aging`; omit for both. A *freshness* axis, not a status one: the
            rows it returns are approved, un-archived and live in search right now, earning
            impressions on a promise of availability nobody has renewed, which is precisely why the
            desk needs to enumerate them.


            Deliberately not an exact-tier filter (`freshness=stale`). The queue's question is "who
            should we ring", and the answer spans two tiers while excluding a third — `aging`
            listings already get an automated nudge, so putting them in a human's queue buries the
            calls that matter. A per-tier filter for the catalogue view remains a separate question.
          schema: { type: boolean }
        - name: progress
          in: query
          description: >
            Where a pending, un-archived listing waits; the four values partition that queue and match
            the step and flags on `progress`. `awaiting_confirmation`: staff-posted, owner has not
            confirmed. `ready`: nobody has opened the review. `in_review`: review open. `needs_info`:
            waiting on the owner. Any other value is a 400.
          schema: { type: string, enum: [awaiting_confirmation, ready, in_review, needs_info] }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged listings, every status
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PropertyQueueRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Moderation]
      summary: Post a listing on an owner's behalf
      operationId: createListingOnBehalf
      description: >
        Creates a listing **owned by the person named in `ownerMobile`**, not by the operator making
        the call. The back-office wizard must not call `createListing`, which attributes the
        listing to the authenticated caller — against a real server that would have made every
        phoned-in listing the operator's: invisible in the owner's own listings, uneditable by them,
        and gating buyers onto the office's number. Attribution is the whole feature, hence a
        separate operation rather than a flag.


        If no account holds that number one is provisioned, with `mobileVerified` **false** — an
        operator typing a number they were told over the phone has proved nothing, and the owner
        earns the flag on their own first sign-in. An existing account is adopted as-is; `ownerName`
        is ignored for it, because an operator's transcription must not overwrite what the owner
        typed themselves.


        The listing is born `pending` like any other. Owner contact comes back raw, which here is
        barely a disclosure: the operator typed that number into this very request a moment ago.
        Masking it on the way out would have hidden a value from the only person who already had it,
        and left this response disagreeing with the queue the listing lands in.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OnBehalfListingCreate' }
      responses:
        '201':
          description: The created listing
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Property' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/enquiries:
    get:
      tags: [Moderation]
      summary: Demand board — contact requests across the marketplace
      operationId: listEnquiriesForOps
      description: >
        Every contact request on the platform, newest first. The back office's demand board.


        **There is no `enquiries` table.** The console's Enquiries page ran on a mock collection that
        was a client-side union of contact requests, chat threads, visits and deals under a `kind`
        discriminator. Three of those are real and get a route each — this one,
        `listVisitsForOps`, `listDealsForOps`, plus `getConversationForModeration` for chats. The
        fourth, `call`, never existed anywhere but in the mock: the platform places no calls and
        records none.


        **Read-only, deliberately.** The mock offered *mark responded* and *close* on a row. Every
        row here belongs to two other people — a contact request is the owner's to approve, a visit
        is the participants' to move, a deal is the owner's to close — and there is no column for
        "an operator considers this handled". The two actions are dropped rather than reproduced by
        letting ops write the owner's decision field.


        Requester mobiles are in full on the list; opening one row (`revealEnquiryForOps`) is audited.
      x-roles: [staff, admin]
      parameters:
        - name: status
          in: query
          description: Narrow to one status. Omit for the whole board.
          schema: { type: string, enum: [pending, approved, declined] }
        - { $ref: '#/components/parameters/BoardSearch' }
        - { $ref: '#/components/parameters/BoardDays' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged contact requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/OpsEnquiry' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/enquiries/summary:
    get:
      tags: [Moderation]
      summary: Demand board totals and funnel
      operationId: getEnquiryBoardSummary
      description: >
        Per-status counts for the three tabs (`all` is the total), GMV over every deal, and the funnel
        (enquiries, visits, closed deals, locality table) computed server-side so the console no longer sums
        a truncated window of rows. `days` and `deal` narrow the funnel only.
      x-roles: [staff, admin]
      parameters:
        - { $ref: '#/components/parameters/BoardDays' }
        - { name: deal, in: query, schema: { $ref: '#/components/schemas/DealIntent' } }
      responses:
        '200':
          description: Board summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminEnquirySummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/enquiries/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: One enquiry, audited
      operationId: revealEnquiryForOps
      description: The same row the list returns; writes an audit entry, as opening one person's record does.
      x-roles: [staff, admin]
      responses:
        '200':
          description: The enquiry
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsEnquiry' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/visits:
    get:
      tags: [Moderation]
      summary: Demand board — site visits across the marketplace
      operationId: listVisitsForOps
      description: >
        Every site visit on the platform, newest first. Read-only for the same reason as
        `listEnquiriesForOps`; visitor mobiles are in full here and on `revealVisitForOps`.
      x-roles: [staff, admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [scheduled, confirmed, completed, cancelled] }
        - { $ref: '#/components/parameters/BoardSearch' }
        - { $ref: '#/components/parameters/BoardDays' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged visits
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/OpsVisit' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/visits/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: One visit, audited
      operationId: revealVisitForOps
      description: The same row the list returns; writes an audit entry, as opening one person's record does.
      x-roles: [staff, admin]
      responses:
        '200':
          description: The visit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsVisit' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/deals:
    get:
      tags: [Moderation]
      summary: Demand board — deals across the marketplace
      operationId: listDealsForOps
      description: >
        Every deal on the platform, newest first — the funnel's floor, and the rows the board's GMV
        tile sums. `agreedPrice` is null until a deal closes, so GMV is a sum over closed deals by
        construction. Read-only; counterparty mobiles are in full here and on `revealDealForOps`,
        preferring the number an owner typed on an off-platform close.
      x-roles: [staff, admin]
      parameters:
        - name: status
          in: query
          schema: { type: string, enum: [active, reserved, closed] }
        - name: deal
          in: query
          schema: { $ref: '#/components/schemas/DealIntent' }
        - { $ref: '#/components/parameters/BoardSearch' }
        - { $ref: '#/components/parameters/BoardDays' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged deals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/OpsDeal' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/deals/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: One deal, audited
      operationId: revealDealForOps
      description: The same row the list returns; writes an audit entry, as opening one person's record does.
      x-roles: [staff, admin]
      responses:
        '200':
          description: The deal
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OpsDeal' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/reviews:
    get:
      tags: [Moderation]
      summary: Review moderation queue
      operationId: listReviewsForModeration
      description: >
        Reviews of every status, newest first, as slim queue rows. The counterpart `setReviewStatus` shipped without
        this, so a moderator could act on a review only if they already had its id — in practice,
        only ones that had been reported. Reviews are post-moderated (published on write), so the
        useful filters are `rejected` (what has been taken down) and no filter at all.
      x-roles: [staff, manager, admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - name: status
          in: query
          description: Narrow to one moderation status. Omit for the whole queue.
          schema: { type: string, enum: [pending, published, rejected] }
        - name: q
          in: query
          description: Case-insensitive match on the review text, the author's name or the target id.
          schema: { type: string }
        - name: counts
          in: query
          schema: { type: boolean, default: false }
          description: Add the whole-queue totals (`all`, `pending`, `published`, `rejected`) for the status chips; the console asks on first load and after a decision only.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged moderation rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ReviewModerationRow' }
  /reviews/{id}/status:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Moderation]
      summary: Publish or take down a review
      operationId: setReviewStatus
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewStatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/notes/{entityType}/{entityId}:
    parameters:
      - name: entityType
        in: path
        required: true
        description: The kind of thing the note is about.
        schema: { type: string, enum: [property, user, review, report, service_request] }
      - name: entityId
        in: path
        required: true
        description: >
          The target's id. Not resolved against its table - a note about a listing that is archived
          an hour later is exactly the note worth keeping.
        schema: { type: string }
    get:
      tags: [Moderation]
      summary: Internal notes on one entity (admin/staff)
      operationId: listInternalNotes
      description: >
        Newest first. Any member of staff or admin may read any note - deliberately
        inter-transparent, because notes are how one shift hands a case to the next. The one
        exception is `service_request`: staff read those only on the request's own desk (D44),
        so another desk gets 403 and an unknown request 404.
      x-roles: [staff, admin]
      # A bare array, not a PageEnvelope. Per api-standards.md 5.1 the envelope is for collections
      # that grow with the platform; this one grows with a single case's history.
      responses:
        '200':
          description: Notes, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/InternalNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    post:
      tags: [Moderation]
      summary: Add an internal note (admin/staff)
      operationId: addInternalNote
      description: >
        The author is taken from the authenticated principal. There is no author field on the body:
        an author who can name themselves can also name somebody else. A `service_request` note
        is desk-scoped for staff, as on the list.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InternalNoteCreate' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/InternalNote' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /reports:
    get:
      tags: [Moderation]
      summary: All listing reports (admin)
      operationId: listReports
      x-roles: [staff, admin]
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          description: Filter to one triage state. Omitted returns the whole queue.
          schema: { type: string, enum: [open, reviewing, actioned, dismissed] }
        - name: reason
          in: query
          description: >
            Filter to one complaint code. Validated against the union of every target vocabulary —
            the four single-record kinds — because a caller may
            filter by reason without also naming a target type.
          schema: { type: string }
        - name: targetType
          in: query
          description: Filter to one reportable kind. Omitted returns every kind.
          schema: { $ref: '#/components/schemas/ReportTargetType' }
        - name: q
          in: query
          description: Case-insensitive match on the report id, target id, reason code or note.
          schema: { type: string }
        - name: sinceDays
          in: query
          description: Only reports filed in the last N IST calendar days, today included (1 = since IST midnight).
          schema: { type: integer, minimum: 1 }
        - name: counts
          in: query
          schema: { type: boolean, default: false }
          description: >-
            Add the queue totals: `undecided.property|user|post` (open + reviewing, whole table, for the
            tab badges) and `status.all|open|reviewing|actioned|dismissed` (within `targetType`, for the
            status chips). The console asks on first load and after a decision only.
      responses:
        '200':
          description: Paged reports; each row carries `targetReportCount`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Report' }
    post:
      tags: [Moderation]
      summary: Report a listing
      description: An account may file 10 reports per hour; the 11th is a 429 with `Retry-After`.
      operationId: createReport
      # No x-roles: any signed-in user must be able to report abuse.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReportCreate' }
      responses:
        '201':
          description: Reported
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Report' }
        '404': { description: A `user` report whose target is not a user }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/erasure:
    post:
      tags: [Account]
      summary: Ask to be erased (DPDP right to erasure)
      description: >
        D177. Files a request under DPDP Act 2023 s.12(3). Nothing is erased here - erasure is the
        one destructive act on this platform that the person it was done to cannot appeal, because
        afterwards there is no account to appeal from, so a tapped button or a stolen session must
        not reach it in one hop. An admin decides the request; see
        `PATCH /admin/erasure-requests/{id}`.


        Deliberately **no x-roles**: the right is the subject's, and gating it behind ops would
        turn a statutory entitlement into a favour. The subject is taken from the principal and
        there is no body field naming a target - an erasure endpoint that accepted one would be a
        single-request account-deletion attack on any user whose id leaked.
      operationId: requestErasure
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureCreate' }
      responses:
        '201':
          description: Filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '409':
          description: A request is already awaiting a decision
    get:
      tags: [Account]
      summary: My erasure requests
      description: >
        Pending and rejected requests only - not a filter, but a consequence: a completed request
        no longer carries a subject id, so there is nothing left to scope the query by.
      operationId: myErasureRequests
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged erasure requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ErasureRequest' }
  /admin/erasure-requests:
    get:
      tags: [Admin]
      summary: Erasure request queue (admin)
      operationId: listErasureRequests
      # Admin, not staff - one rung above every other moderation power here. Listing takedowns and
      # user suspensions are reversible; an executed erasure is not, by anybody.
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - name: status
          in: query
          schema: { type: string, enum: [pending, completed, rejected] }
      responses:
        '200':
          description: Paged erasure requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ErasureRequest' }
  /admin/erasure-requests/{id}:
    patch:
      tags: [Admin]
      summary: Carry out or refuse an erasure request (admin)
      description: >
        `execute` pseudonymises the identity root and sweeps the tables that duplicate identity
        outside it, in one transaction, and records what was removed and what was kept.
        `reject` refuses with a required reason - DPDP s.8(7) permits retention where another law
        requires it, so a subject with a live registered rent agreement or an unsettled payment is
        a case where the platform must say no and say why. Both are terminal.
      operationId: decideErasureRequest
      x-roles: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string } }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ErasureDecision' }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErasureRequest' }
        '409':
          description: Already decided
  /admin/flatmate-reviews:
    get:
      tags: [Moderation]
      summary: Flatmate host-verification queue (ops)
      description: >
        Tenant-tier posts, contested addresses and flat splits whose parent listing is still
        pending. Owner-tier posts are vetted through the listing's own documents and never appear.


        Rows are cards: the agreement file, the host's number and the registration particulars are in
        the detail (`GET /admin/flatmates/{id}`), which a card never needs.
      operationId: listFlatmateReviews
      externalDocs: { description: Behaviour, url: docs/flows/ops/service-queues.md }
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, approved, rejected] } }
        - { name: flagged, in: query, schema: { type: boolean } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged reviews
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateReviewRow' }
  /admin/flatmate-reviews/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Decide a flatmate host verification
      description: >
        A rejection requires a reason — the host is always told why.


        Approving a `tenant` claim requires the flat owner's OTP-confirmed consent; without it the
        call is refused with 422. A tenant who sub-lets without the owner's consent gives that owner
        a ground for eviction under the Maharashtra Rent Control Act 1999, so the platform will not
        vouch for the arrangement. The post itself is unaffected and stays live at `identity` tier.


        Approving a `tenant` claim also needs the host to be ID verified (`verified` on the user) and
        the reviewer's structured `checks`: the name and the address on the document match, plus the
        document's date — `validTill` (after today) for a `rent_agreement`, `issuedOn` (not in the
        future, at most 90 days old) for an `electricity_bill`. Anything missing is a single 422 that
        names it. The badge runs to `min(validTill, today + 11 months)` for an agreement and to
        `today + 11 months` for a bill, after which the sweep lapses it.


        A decided review is terminal: the same verdict again is an idempotent 200, a different one
        is a 409. A staffer may not decide the review of a post they authored or a group they belong
        to (403).
      operationId: decideFlatmateReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateReviewDecisionRequest' }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateReview' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Already decided with a different verdict }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/flatmate-reviews/{id}/document-url:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: Open the evidence document of a flatmate review
      description: >
        A short-lived signed link to the rent agreement or electricity bill the host filed, read from
        the host's personal vault. Open while the review is pending and for 30 days after it is decided;
        after that it is 403 `document_access_expired`. A staffer who authored the post or belongs to
        the group is refused (403). Every open is audited as `flatmate.review.document.open`. Legacy
        reviews that carry an inline `dataUrl` instead of a vault document answer 404 here and keep
        serving the file in the review detail.
      operationId: openFlatmateReviewDocument
      responses:
        '200':
          description: Signed link
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateReviewDocumentUrl' }
        '403': { description: Party to the post, or `document_access_expired` }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/flatmate-reviews/{id}/revoke:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Moderation]
      summary: Revoke an approved Verified property badge
      description: >
        Turns an `approved` review into `rejected` with the given reason, removes the badge from the
        post, tells the host and audits `flatmate.review.revoke`. The host may file fresh evidence.
        A review that is not approved is 409 `not_approved`; a staffer who is a party to the post is
        refused (403).
      operationId: revokeFlatmateReview
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, maxLength: 300, description: Shown to the host. }
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateReview' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'The review is not approved (`not_approved`).' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/rent-agreements/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Move a rent agreement along its status ladder
      description: >
        `draft → e-sign-pending → registered → active → expired`, one rung at a time. A draft may
        reach `registered` directly, because most Leave & License registration in Maharashtra still
        happens in person at the sub-registrar and never touches e-sign. Any status may be moved to
        `expired`. Nothing moves backwards and nothing leaves `expired` — a registration cannot be
        un-made by editing a row, and a tenancy that ran its term is re-registered as a new
        document. An illegal move is a 422 naming the rungs that are legal from here.


        Ops-only, and that is the point: `registered` and `active` are read as evidence by the
        flatmate trust sweep, which grants a host the Verified property badge with no further human in
        the loop. So those two rungs need all of:
        a row produced by a completed rent-agreement service request, with the registered copy that
        request's final upload linked (the evidence — a typed link is no longer accepted);
        a caller on that request's desk (or an admin) who is not a side of it — requester, co-fill
        party or listing owner — and not a signatory on this row (owner, or the tenant's mobile);
        and a caller who is not the operator who uploaded the registered copy (four eyes).
        `registered`/`active` also need a tenant who proved the number by OTP — the non-owner
        requester, or an accepted co-fill invitee; a mobile typed on the form is refused with 422.
        A row no service request produced is an admin's to retire (`expired`) and nobody's to
        register. Two checkers deciding one row at once are serialised on a row lock. Guarded by
        `registrations:write`, not the maker's `services:write`, so an admin can scope the two
        halves of the check onto different accounts.
      operationId: transitionRentAgreement
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status:
                  type: string
                  enum: [draft, e-sign-pending, registered, active, expired]
                  description: The rung to move to. Must be reachable from the current one.
      responses:
        '200':
          description: Moved — the row as the checker sees it.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RentAgreementRecord' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The service request behind this agreement is not completed.
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/flatmates/moderation:
    get:
      tags: [Moderation]
      summary: The flatmate moderation queue
      description: >
        What is waiting to be let out. Since D72 a seeker post, room or group starts `pending` and
        is invisible on every consumer surface until a moderator decides; this is where that backlog
        is seen. Oldest first, because a queue served newest-first starves the person who has been
        waiting longest.


        Distinct from `/admin/flatmate-reviews`, which is the **verification** queue — "has this
        host proved what they claimed". An unbadged post and an unvetted post are different things.


        Several kinds may be asked for in one call (`kind=post,room,group`). Each kind is its own
        table, but the page is global: one page never holds more than `size` rows, merged in age
        order across kinds (and across the `recheck` set), and `totalElements` is the sum.


        The author's mobile is deliberately absent. Deciding whether a post may be published does
        not require ringing the person, and a number on every row of a paged staff screen is a bulk
        contact list one screenshot away from leaving the building.
      operationId: listFlatmateModerationQueue
      parameters:
        - name: kind
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { type: string, enum: [post, room, group] }
            default: [post]
          description: Which boards to page through, comma-joined.
        - name: modStatus
          in: query
          style: form
          explode: false
          schema:
            type: array
            items:
              oneOf:
                - $ref: '#/components/schemas/FlatmateModStatus'
                - type: string
                  enum: [recheck]
          description: >
            Defaults to `pending`, which is the queue. Any other states are accepted, comma-joined,
            so a team can review its own past decisions (`approved,live` is everything public).


            `recheck` is a selector, not a state, and may ride beside real states
            (`pending,recheck`): it pages the posts that stayed published but had their photos, note, rent or address edited since a moderator
            last read them, oldest edit first. Those rows keep whatever `modStatus` they had — going
            dark on every edit is the behaviour this exists to avoid — so they would otherwise be
            buried under `approved`.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged queue
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateModerationRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/flatmates/moderation/summary:
    get:
      tags: [Moderation]
      summary: Cards waiting on each tab of the flatmate moderation desk
      description: >
        The true size of the `pending`, `published` and `hidden` tabs, so a tab label does not report
        the length of whatever window the browser downloaded. `pending` counts awaiting posts, rooms and
        groups, re-checks, group applications, and badge claims whose post is not itself awaiting
        (those share the post's card).
      operationId: getFlatmateModerationSummary
      responses:
        '200':
          description: Counts per tab
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateModerationSummary' }
  /admin/flatmates/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Moderation]
      summary: One flatmate seeker post, room or group, in full, for the moderation desk
      description: >
        What the desk's review popup opens. The id is resolved across seeker posts, rooms and groups,
        like `PATCH /admin/flatmates/{id}/moderation`. Exactly one of `room`, `group` or `post` is
        present, matching `item.kind`; `review` is the verification case when the post claimed a
        tier that needs one. Mobiles are in full, except a landlord's consent number.
      operationId: getFlatmateModerationDetail
      responses:
        '200':
          description: The post
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateModerationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Moderation]
      summary: Correct a flatmate post's core fields from the moderation desk
      description: >
        `flatmates:write`. Omitted fields are left as they are. `rent` is a room's share, a group's
        rent and a seeker's budget; `moveIn` is a room's available-from date, a hunting group's
        move-in-by and a seeker's move-in. A field the kind does not have is 422. Audited as
        `flatmate.adminUpdate`; the post is not sent back for review. Refused (403) on an item the
        caller authored or whose group they belong to.
      operationId: editFlatmateAsModerator
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                title: { type: [string, 'null'], maxLength: 120 }
                note: { type: [string, 'null'], maxLength: 600 }
                rent: { type: [integer, 'null'], minimum: 1, maximum: 10000000 }
                deposit: { type: [integer, 'null'], minimum: 0, maximum: 10000000 }
                localities:
                  type: [array, 'null']
                  minItems: 1
                  maxItems: 3
                  items: { type: string, maxLength: 80 }
                moveIn: { type: [string, 'null'], format: date }
      responses:
        '200':
          description: The post after the edit
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateModerationDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Locality of a room split from a flat (`SPLIT_ROOM`) — edit the property }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/flatmates/{id}/moderation:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Moderate a flatmate seeker post, room or group
      description: >
        Admin moderation axis only. It must never write a group application's owner decision, and
        a `flagged` / `removed` post must disappear from every consumer feed, the map and the alert
        matcher — not merely change a label.


        A note is required to flag or remove, and to restore a removed or rejected item
        (400). An `expired` item accepts only `removed`; anything else is a 409 because only the
        host's renewal revives it. A staffer may not moderate an item they authored or whose group
        they belong to (403).
      operationId: moderateFlatmatePost
      externalDocs: { description: Behaviour, url: docs/flows/ops/flatmate-moderation.md }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modStatus]
              properties:
                modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
                note: { type: string, description: Internal note, never exposed to consumers. Required to hide or restore. }
      responses:
        '200': { description: Moderated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: The item has expired and the verdict is not `removed` }
  /admin/group-applications:
    get:
      tags: [Moderation]
      summary: Flatmate group applications
      operationId: listGroupApplications
      description: Newest first unless `sort` says otherwise. Paged — a platform-wide board with no per-caller scoping.
      parameters:
        - name: modStatus
          in: query
          style: form
          explode: false
          schema:
            type: array
            items: { $ref: '#/components/schemas/FlatmateModStatus' }
          description: Optional, comma-joined. Absent means every state.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
        - { $ref: '#/components/parameters/Sort' }
      responses:
        '200':
          description: Paged applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/GroupApplication' }
  /admin/group-applications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Moderation]
      summary: Moderate a group application
      operationId: decideGroupApplication
      description: >
        Writes only `modStatus`, never the owner's accept or decline. A note is required to hide, and
        to restore a removed or rejected application (400). Refused (403) to the applicant, a member of the applying group and the
        listing's owner. Restoring an application the owner had accepted is a 409 once another group
        holds the flat or when its group is no longer live.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [modStatus]
              properties:
                modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
                note: { type: string }
      responses:
        '200':
          description: Moderated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupApplication' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: Restoring an accepted application another group has replaced, or whose group is not live }
  /contacts/status:
    get:
      tags: [Leads & Contact]
      summary: Check contact status for a property
      operationId: contactStatus
      parameters:
        - { name: propertyId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Contact status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactStatus' }
  /contacts/request:
    post:
      tags: [Leads & Contact]
      summary: Request owner's contact (requires sign-in)
      operationId: requestContact
      description: >
        Requires only a signed-in mobile-OTP account (L1) — identity verification is **not**
        a prerequisite (ADR-019). Returns `401` if unauthenticated. Returns
        `403 verification_required` **only** when the target owner has opted into
        "verified contact only" and the caller has no ID verified badge (L2). Returns
        `422 contact_quota_exhausted` when the caller has used every owner contact their free
        allowance, contact packs and referrals allow — see `GET /me/entitlements`. Returns `409 listing_not_live`
        when the listing is paused, rented or sold, and `404` when it is archived, not approved or its owner is suspended. A request counts against the allowance from the moment it is made until
        the owner declines it or it lapses after `contactReplyDays`, whatever happens to the listing meanwhile.
        A visit booked on the same listing (`POST /visits`) shares that one contact. An owner asking for
        contact on their own listing gets `409 own_listing` and nothing is created.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContactRequestCreate' }
      externalDocs:
        description: Contact-gate & leads flow (badge-not-gate)
        url: docs/flows/consumer/contact-gate-leads.md
      responses:
        '200':
          description: Requested — the owner is notified; contact unlocks now or on approval.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContactStatus' }
              examples:
                approved:
                  summary: Contact approved
                  value: { status: approved, verifiedContactOnly: false, verificationRequired: false }
                pendingOwner:
                  summary: Awaiting owner approval
                  value: { status: pending, verifiedContactOnly: false, verificationRequired: false }
          links:
            checkStatus: { $ref: '#/components/links/CheckContactStatus' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: The listing is closed (paused, rented or sold) - `listing_not_live` - it is the caller's own (`own_listing`), or the caller withdrew a request for it less than 7 days ago (`recently_withdrawn`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing_not_live, message: This listing is not live right now, status: 409 }
        '403':
          description: Owner accepts verified contacts only — get ID verified to proceed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: verification_required, message: This owner only accepts verified contacts, status: 403 }
        # 422, not 403 (a 403 invites a login, and signing in again conjures no contacts) and not
        # 429 (that promises the request works if you wait; this quota is a lifetime total).
        '422':
          description: No owner contacts left (`contact_quota_exhausted`), or `contactPendingMax` requests still wait for a reply (`contact_pending_limit`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: contact_quota_exhausted, message: You have used all your owner contacts. Buy a contact pack, or refer a friend to earn more., status: 422 }
  /me/contact-requests:
    get:
      tags: [Leads & Contact]
      summary: View incoming contact requests (owner)
      operationId: myContactRequests
      description: >
        Newest first, owner-scoped. Paged: this collection grows with inbound demand rather than with
        the owner's own actions, so a popular listing is exactly what makes it large.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ContactRequest' }
  /me/contact-requests/{reqId}:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    patch:
      tags: [Leads & Contact]
      summary: Approve / decline contact request
      operationId: respondContactRequest
      description: >-
        A decline is always allowed; approving needs the listing to be publicly live, else `409 listing_not_live`.
        `409` also covers an expired or already answered request.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Expired or already answered, or approving while the listing is not live (`listing_not_live`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: listing_not_live, message: This listing is not live so its contact cannot be shared, status: 409 }
  /properties/{id}/photo-requests:
    parameters:
      - name: id
        in: path
        required: true
        schema: { type: string }
        description: Listing slug or UUID.
    post:
      tags: [Leads & Contact]
      summary: Ask the owner for more photos of a listing
      operationId: requestPhotos
      description: >
        Always `200` for a repeat tap - it is a no-op rather than an error, and the client
        tells the two apart from `created`. Asking again within 7 days of withdrawing is `409 recently_withdrawn`. Nested under the listing rather than sitting at
        `/photo-requests` because the listing is the only thing being asked about.
      responses:
        '200':
          description: The request, whether this call created it or found it already open
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoRequestCreateResult' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Withdrawn by the caller less than 7 days ago (`recently_withdrawn`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/photo-requests:
    get:
      tags: [Leads & Contact]
      summary: View incoming photo requests (owner)
      operationId: myPhotoRequests
      description: >
        Newest first, owner-scoped. Paged for the same reason as `myContactRequests`: this collection
        grows with inbound demand rather than with the owner's own actions. Use
        `myPendingPhotoCount` for the "waiting on you" badge - counting one page under-reports.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/PhotoRequest' }
  /me/photo-requests/{reqId}:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    patch:
      tags: [Leads & Contact]
      summary: Resolve / decline a photo request
      operationId: decidePhotoRequest
      description: >
        One endpoint rather than two verbs (`/resolve`, `/decline`) so the "already answered" rule
        lives in one place - the same shape `respondContactRequest` took for the same reason. A
        request against someone else's listing is `404`, never `403`, which would confirm the row
        exists.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PhotoRequestDecision' }
      responses:
        '200':
          description: The answered request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PhotoRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/requests:
    get:
      tags: [Leads & Contact]
      summary: Requests inbox (received or sent)
      operationId: myRequests
      description: >
        Every kind of request - contact, visit, photo, document, flatmate interest, group application - merged into
        one list. `received` is what reached the caller as the recipient: pending first (most recently
        reminded first), then anything accepted, declined or expired in the last 90 days that the caller has
        not cleared; a withdrawn request never shows. `sent` is what the caller asked, pending first, plus
        anything decided in the last 30 days that the caller has not cleared. `party` is always the other
        side and never carries a mobile.
      parameters:
        - name: box
          in: query
          schema: { type: string, enum: [received, sent], default: received }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/RequestItem' }
        '400':
          description: Unknown `box` (`invalid_box`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: invalid_box, message: "box must be 'received' or 'sent'", status: 400 }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/requests/{kind}/{id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [contact, visit, photo, document, flatmate, group, offer] }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    delete:
      tags: [Leads & Contact]
      summary: Withdraw a pending request, or clear a decided one
      operationId: removeMyRequest
      description: >
        With `box=sent` (the default) the caller must be the requester. A pending request is withdrawn the way
        its own kind withdraws (a contact request returns its credit; a visit is cancelled; a document request
        is marked withdrawn; a flatmate interest is deleted). A decided one is only hidden from the caller's
        sent box. With `box=received` the caller must be the recipient and the request must be decided; it is
        only hidden from the caller's received box. Repeating the call is a no-op. Someone else's request, or
        one that does not exist, is `404`.
      parameters:
        - name: box
          in: query
          schema: { type: string, enum: [received, sent], default: sent }
      responses:
        '204': { description: Withdrawn or cleared }
        '400':
          description: Unknown `box` (`invalid_box`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: >
            Sent: the recipient answered the request before the withdrawal landed, so it can no longer be
            withdrawn (`conflict`, or `already_decided` for a flatmate interest). Received: the request is
            still pending, so it must be accepted or declined before it can be cleared.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /me/requests/{kind}/{id}/reminders:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [contact, visit, photo, document, flatmate, group, offer] }
      - name: id
        in: path
        required: true
        schema: { type: string, format: uuid }
    post:
      tags: [Leads & Contact]
      summary: Remind the recipient of a pending request
      operationId: remindMyRequest
      description: >
        Requester only, pending requests only (anything else is `404`). Allowed a day after sending and then
        at most once a day per request; it never extends the request's expiry. The recipient is notified at
        most once a day across all reminders - the rest are recorded without a notification.
      responses:
        '201':
          description: Reminder recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestReminderResponse' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409':
          description: Too soon (`reminder_too_soon`); `nextReminderAt` says when the next one is allowed.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: reminder_too_soon, message: You can send another reminder after 5 Jun, 9:30 AM., status: 409, nextReminderAt: '2026-06-05T04:00:00Z' }
  /me/lead-notes:
    get:
      tags: [Leads & Contact]
      summary: The owner's private notes on their leads
      operationId: myLeadNotes
      description: >
        Unpaged deliberately: a note exists only where the owner typed one, so this collection grows
        with the owner's own effort rather than with inbound demand - unlike `myContactRequests`,
        which is paged for precisely that reason.
      responses:
        '200':
          description: All notes this owner has written
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LeadNote' }
  /me/lead-notes/{leadKey}:
    parameters:
      - name: leadKey
        in: path
        required: true
        schema: { type: string, maxLength: 200 }
        description: The owner's opaque handle for one lead.
    put:
      tags: [Leads & Contact]
      summary: Write or clear a lead note
      operationId: saveLeadNote
      description: >
        `PUT` because the lead key is chosen by the caller and the write is idempotent. Clearing both
        fields deletes the note and returns `204` - the absence of a note and an empty note are the
        same state, so there is no body to return.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LeadNoteUpsert' }
      responses:
        '200':
          description: The stored note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LeadNote' }
        '204': { description: Note cleared }
        '422': { $ref: '#/components/responses/ValidationError' }
  # No `GET /enquiries`: nothing writes an `enquiries` row — the contact-request surface replaced
  # it — so the operation could only return an empty page, a worse admin surface than none.
  /messages:
    get:
      tags: [Leads & Contact]
      summary: Current user's conversations (in-app inbox)
      operationId: myMessages
      description: >
        Most recent first. Paged: an owner's inbox grows with inbound enquiries rather than with
        their own activity, so it is demand-driven and uncapped.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged conversations
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Conversation' }
    post:
      tags: [Leads & Contact]
      summary: Start a conversation (e.g. owner-buyer chat after contact-gate)
      description: >-
        Requires an existing relationship: the caller holds an approved contact request against a
        listing the counterparty owns, or the counterparty holds one against a listing the caller
        owns; an owner-confirmed visit on that listing counts the same way. Staff and admin may
        always open a thread.


        Without that rule this operation is a mobile-enumeration oracle -- a distinguishable answer
        for "registered" and "not registered" turns the endpoint into a way to test a list of phone
        numbers against the user base, and an unsolicited-message channel to anyone whose number
        leaked from anywhere else. The refusal is therefore identical in both cases.
      operationId: startConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationCreate' }
      responses:
        # 200 as well as 201: starting a conversation that already exists returns the existing one
        # rather than forking the thread, and the status says which happened.
        '200':
          description: The conversation already existed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /messages/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Leads & Contact]
      summary: Conversation detail with message thread
      operationId: getConversation
      responses:
        '200':
          description: Conversation
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/stream:
    get:
      tags: [Leads & Contact]
      summary: Stream message realtime events
      operationId: streamMessages
      description: >
        Authenticated SSE stream for message, read, delivered, typing and presence invalidation events, plus
        `notification` when the caller's unread notification count may have changed. Clients
        fetch the relevant conversation or count after receiving an event; payloads carry ids only.
      responses:
        '200':
          description: "Server-sent events: `message`, `read`, `delivered`, `typing`, `presence`, `notification`."
          headers:
            X-Accel-Buffering:
              schema: { type: string, enum: ['no'] }
            Cache-Control:
              schema: { type: string, enum: [no-cache] }
          content:
            text/event-stream:
              schema:
                type: string
                example: "event: message\ndata: {\"conversationId\":\"...\"}\n\n"
        '401': { $ref: '#/components/responses/Unauthorized' }
  /messages/unread-count:
    get:
      tags: [Leads & Contact]
      summary: Total unread messages across unmuted threads
      operationId: unreadConversationCount
      responses:
        '200':
          description: Count
          content:
            application/json:
              schema:
                type: object
                properties:
                  count: { type: integer }
  /messages/{id}/reply:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Send a message in a conversation
      operationId: replyConversation
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ConversationMessageCreate' }
      responses:
        '200':
          description: Existing message for the same clientId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }
        # A conversation the caller is not a participant in is a 404, not a
        # 403 -- confirming that a thread exists is itself the disclosure.
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /messages/{id}/photos:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Send a photo in a conversation
      operationId: sendConversationPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: JPEG or PNG, max 8 MB }
                clientId: { type: [string, 'null'], maxLength: 120, description: Caller-generated idempotency key scoped to this author and conversation }
                caption: { type: [string, 'null'], maxLength: 1000 }
      responses:
        '200':
          description: Existing message for the same clientId
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConversationMessage' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '415': { $ref: '#/components/responses/UnsupportedMediaType' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /messages/{id}/read:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Mark a conversation as read
      operationId: readConversation
      responses:
        '204': { description: Marked read }
        '404': { $ref: '#/components/responses/NotFound' }  # Slice-12 spec fix S48
  /messages/{id}/typing:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Publish a typing indicator
      operationId: typingConversation
      responses:
        '204': { description: Typing signal accepted }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{id}/state:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Leads & Contact]
      summary: Archive or mute one thread for the caller
      operationId: updateConversationState
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                archived: { type: boolean }
                muted: { type: boolean }
      responses:
        '204': { description: Updated }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{id}/items/{messageId}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
      - { name: messageId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Leads & Contact]
      summary: Hide one message for the caller only
      operationId: deleteConversationMessageForMe
      responses:
        '204': { description: Hidden }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/{id}/block:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Leads & Contact]
      summary: Block the counterparty in a pair thread
      operationId: blockConversationCounterparty
      responses:
        '204': { description: Blocked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Leads & Contact]
      summary: Unblock the counterparty in a pair thread
      operationId: unblockConversationCounterparty
      responses:
        '204': { description: Unblocked }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/flatmate-groups/{groupId}:
    parameters:
      - { name: groupId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Leads & Contact]
      summary: Open a flatmate group's thread
      operationId: openFlatmateGroupConversation
      description: >
        Finds or creates the group's one thread. Current members (host included) only; anyone else,
        a member who left or was removed included, gets `404`. Read, reply, attach and mark-read then
        use the ordinary `/messages/{id}` paths.
      responses:
        '200':
          description: The group thread, without messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/flatmate-requests/{requestId}:
    parameters:
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Leads & Contact]
      summary: Open the chat between a flatmate host and requester
      operationId: openFlatmateRequestConversation
      description: >
        Finds or creates the pair thread between the requester and the host of an accepted flatmate
        request. A group host may also open it while a join request is still pending, to vet the
        requester before deciding; the requester can reply once it exists. Anyone else, the requester
        while pending, and either party once declined gets `404`.
        No listing is attached, so both mobiles stay masked. Read, reply, attach and mark-read then use
        the ordinary `/messages/{id}` paths.
      responses:
        '200':
          description: The pair thread, without messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /messages/requests/{kind}/{requestId}:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [visit, offer] } }
      - { name: requestId, in: path, required: true, schema: { type: string } }
    post:
      tags: [Leads & Contact]
      summary: Open the chat between a listing owner and a visitor or buyer they said yes to
      operationId: openLeadRequestConversation
      description: >
        Finds or creates the listing thread between the owner and the visitor of a confirmed visit, or
        the buyer of an accepted offer. Either party may open it; anyone else, an undecided or declined
        request, a suspended listing or an archived counterparty gets `404`. No message is sent. Read,
        reply, attach and mark-read then use the ordinary `/messages/{id}` paths.
      responses:
        '200':
          description: The listing thread, without messages
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/finalization-requests:
    get:
      tags: [Leads & Contact]
      summary: Pending finalization requests (owner)
      operationId: myFinalizationRequests
      description: >
        Newest first, counterparty-scoped, pending only, paged. Every row is a proposal a buyer aimed
        at the caller, so the collection grows with inbound demand. No `sort` parameter: the order is
        fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FinalizationRequest' }
  /finalization/{propId}/request:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    post:
      tags: [Leads & Contact]
      summary: Request to finalize deal (buyer, maker step)
      operationId: requestFinalization
      description: >
        Maker step of the maker-checker finalization (buyer). The owner then accepts
        (checker step) — the deal-verified moment (L3) where hard KYC / mobile-match may be
        required of both parties (ADR-009a/019). Track via `finalizationStatus`.
      externalDocs:
        description: Deals, offers & finalization flow
        url: docs/flows/consumer/deals-offers-finalization.md
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FinalizationCreate' }
      responses:
        '200':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationRequest' }
          links:
            trackStatus: { $ref: '#/components/links/FinalizationStatus' }
  /finalization/{propId}/status:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Leads & Contact]
      summary: My finalization status
      operationId: finalizationStatus
      responses:
        '200':
          description: Status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FinalizationRequest' }
        '204': { description: No finalization request has ever been made on this property }
    delete:
      tags: [Leads & Contact]
      summary: Cancel my finalization request (buyer)
      operationId: cancelFinalization
      responses:
        '204': { description: Cancelled }
  /finalization/requests/{reqId}/accept:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    post:
      tags: [Leads & Contact]
      summary: Accept finalization (owner, checker step)
      description: >
        Accepting closes the property's deal and auto-declines every other pending
        finalization request on it, in one transaction. For rent deals it also proposes
        the tenancy to the tenant, exactly as closing the deal directly does.
      operationId: acceptFinalization
      responses:
        '200': { description: Accepted }
  /finalization/requests/{reqId}/decline:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    post:
      tags: [Leads & Contact]
      summary: Decline finalization (owner)
      operationId: declineFinalization
      responses:
        '200': { description: Declined }
  /me/finances/{propId}/transactions:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Transactions list (owner)
      operationId: listTransactions
      # Paged: a ledger accrues on a schedule and is never culled, so its size tracks how long the
      # property was held, not anything the caller did. No `Sort` — the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged transactions
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Transaction' }
    post:
      tags: [Rentals & Payments]
      summary: Add transaction
      operationId: addTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
  /me/finances/{propId}/transactions/{txnId}:
    parameters:
      - { $ref: '#/components/parameters/PropId' }
      - { name: txnId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Rentals & Payments]
      summary: Update transaction
      operationId: updateTransaction
      # TransactionUpdate has no required fields, so an absent key means "leave it alone" — fixing a
      # typo in `note` must not oblige the client to resend type, amount and date.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Transaction' }
        '404': { description: No such transaction on this property }
    delete:
      tags: [Rentals & Payments]
      summary: Delete transaction
      operationId: deleteTransaction
      responses:
        '204': { description: Deleted }
  /me/finances/{propId}/basis:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    put:
      tags: [Rentals & Payments]
      summary: Set ownership basis
      operationId: setBasis
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/OwnershipBasis' }
      responses:
        '200': { description: Saved }
  /me/finances/{propId}/summary:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Income / expense / net summary
      operationId: financeSummary
      # The period is the client's question and the aggregate is the server's answer, so the window
      # belongs in the request — without it the endpoint can only ever answer "all time".
      parameters:
        - name: period
          in: query
          description: >
            Window the totals are computed over. `year` is the Indian financial year (1 April -
            31 March), not the calendar year - that is the year an owner files against.
          schema: { type: string, enum: [all, month, quarter, year], default: all }
      responses:
        '200': { description: Summary, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceSummary' } } } }
  /me/finances/{propId}/overview:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Basis, dues and cashflow in one read
      operationId: financeOverview
      parameters:
        - name: months
          in: query
          description: How many months of cashflow, ending with the current month.
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
      responses:
        '200': { description: Overview, content: { application/json: { schema: { $ref: '#/components/schemas/FinanceOverview' } } } }
        '404': { description: No such property, or not the caller's }
  /me/rentals:
    get:
      tags: [Rentals & Payments]
      summary: My self-declared rentals (as tenant)
      operationId: myRentals
      # Unpaged, deliberately: a person rents one home at a time, so the count is bounded by how
      # often they move rather than by anything they can do to the platform (api-standards.md §5.1).
      responses:
        '200':
          description: Rentals, most recent lease first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantRental' }
    post:
      tags: [Rentals & Payments]
      summary: Record a rental
      operationId: addRental
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantRentalCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantRental' }
  /me/rentals/{rentalId}:
    parameters:
      - { name: rentalId, in: path, required: true, schema: { type: string } }
    patch:
      tags: [Rentals & Payments]
      summary: Update a rental
      operationId: updateRental
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantRentalUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantRental' }
        '404': { description: No such rental for this caller }
    delete:
      tags: [Rentals & Payments]
      summary: Delete a rental
      operationId: deleteRental
      responses:
        '204': { description: Deleted }
        '404': { description: No such rental for this caller }
  /me/tenancies:
    get:
      tags: [Rentals & Payments]
      summary: My tenancies (as tenant), including ones awaiting my confirmation
      operationId: myTenancies
      responses:
        '200':
          description: Tenancies, pending first, then active, then ended. Declined ones are omitted.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Tenancy' }
  /me/tenancies/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Rentals & Payments]
      summary: Confirm a tenancy a landlord named me on (tenant)
      description: >
        Turns a `pending` tenancy `active`. Only the signed-in account whose verified mobile matches
        the mobile the landlord entered when closing the deal may confirm. 404 -- never 403 -- for
        any other caller, so a tenancy id is never confirmed to exist to a stranger. 409 when the
        tenancy is no longer pending.
      operationId: confirmTenancy
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenancy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/tenancies/{id}/decline:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Rentals & Payments]
      summary: Decline a tenancy a landlord named me on (tenant)
      description: >
        Turns a `pending` tenancy `declined`. The deal stays closed. Same caller rules as confirm:
        404 for anyone but the named tenant, 409 when the tenancy is no longer pending.
      operationId: declineTenancy
      responses:
        '200':
          description: Declined
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Tenancy' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/tenant-profile:
    get:
      tags: [Rentals & Payments]
      summary: My tenant profile
      operationId: getTenantProfile
      responses:
        '200': { description: Profile, content: { application/json: { schema: { $ref: '#/components/schemas/TenantProfile' } } } }
    put:
      tags: [Rentals & Payments]
      summary: Update tenant profile
      operationId: updateTenantProfile
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantProfileUpdate' }
      responses:
        '200':
          description: Saved (returns computed score)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenantProfile' }
  /tenant-profiles/verified:
    post:
      tags: [Rentals & Payments]
      summary: Which of these people are ID verified (batch badge)
      description: >
        Which of these people hold the ID verified badge. Requires a relationship with each person -- a tenancy either way round, or an accepted contact
        request against one of the caller's listings -- and returns `false`, never an error or a
        reason, for every entry that does not qualify, is not registered, or holds no badge. The
        answer has the same length and order as `mobiles`, and each `mobile` is the string the
        caller supplied, unchanged. At most 50 entries; a larger batch is 400.
      operationId: tenantsVerified
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenantVerifiedQuery' }
      responses:
        '200':
          description: One flag per supplied number, in the order supplied
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TenantVerified' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /properties/{propId}/tenancy-declarations:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Rentals & Payments]
      summary: Stays claimed on this listing
      description: >
        Returns every declaration on the listing when the caller owns it -- the owner's inbox --
        and only the caller's own declaration otherwise. One route rather than two because the two
        sides read the same record and differ by a row filter, not by shape. Paged, because the
        owner's side is inbound demand: each row is written by a different stranger. A caller who
        does not own the listing has at most one row and always receives it on page 0.
      operationId: listTenancyDeclarations
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Declarations visible to the caller
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Rentals & Payments]
      summary: Declare that you lived in this listing
      description: >
        Creates a `pending` claim for the caller. 409 when the caller owns the listing, when a
        brokered tenancy already records the stay, or when the caller has already declared one --
        a second claim is the same claim again, which is what makes a revocation mean anything.
      operationId: declareTenancy
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TenancyDeclarationCreate' }
      responses:
        '201':
          description: Claim recorded, awaiting the owner
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /tenancy-declarations/{id}/confirm:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Rentals & Payments]
      summary: Confirm a claimed stay (listing owner)
      description: >
        The owner agrees the stay happened, which is the moment the claim becomes evidence and the
        declarant becomes eligible to review the listing. Idempotent, and re-confirmable after a
        revocation. 404 -- never 403 -- for any caller who does not own the listing, so a
        declaration id is never confirmed to exist to a stranger.
      operationId: confirmTenancyDeclaration
      responses:
        '200':
          description: Confirmed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tenancy-declarations/{id}/revoke:
    parameters:
      - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
    post:
      tags: [Rentals & Payments]
      summary: Reject or withdraw a claimed stay (listing owner)
      # POST, not DELETE: "claimed, agreed, withdrawn" is the trail an abuse investigation needs,
      # and the surviving row holds the unique slot so the claimant cannot simply declare again.
      description: >
        The owner disagrees with a claim, or takes back a confirmation they already gave. The
        declaration is retained in `revoked` state rather than deleted. 404 for any caller who does
        not own the listing.
      operationId: revokeTenancyDeclaration
      responses:
        '200':
          description: Revoked
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TenancyDeclaration' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/documents/{propId}:
    parameters: [ { $ref: '#/components/parameters/PropRef' } ]
    get:
      tags: [Documents]
      summary: Documents for property (owner)
      operationId: listDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
    post:
      tags: [Documents]
      summary: Upload document (multipart)
      description: PDF, JPEG/JPG, PNG or HEIC/HEIF; the uploaded file must be strictly smaller than 1000000 bytes.
      operationId: uploadDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Sale Deed }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSummary' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/{propId}/{docId}:
    parameters:
      - { $ref: '#/components/parameters/PropRef' }
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove document (owner)
      operationId: deleteDocument
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/documents/{docId}/url:
    parameters: [ { name: docId, in: path, required: true, schema: { type: string } } ]
    get:
      tags: [Documents]
      summary: Sign one of my vault documents (owner)
      operationId: getDocumentUrl
      description: >
        Owner-scoped across the property, personal and managed-property vaults. A file that is not
        the caller's, or that belongs to a service request, is 404. Called when a file is opened.
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUrl' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/documents/personal:
    get:
      tags: [Documents]
      summary: Personal KYC documents (owner)
      description: >-
        The caller's own KYC papers. `personal` is a literal segment that out-ranks the
        `{propId}` template, so a property can never be addressed here. Self-scoped; no `x-roles`.
      operationId: listPersonalDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
    post:
      tags: [Documents]
      summary: Upload personal KYC document (multipart)
      description: PDF, JPEG/JPG, PNG or HEIC/HEIF; the uploaded file must be strictly smaller than 1000000 bytes.
      operationId: uploadPersonalDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Aadhaar }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSummary' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/personal/{docId}:
    parameters:
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove personal KYC document (owner)
      operationId: deletePersonalDocument
      description: >
        Also withdraws the copies of this paper filed on service requests still awaiting payment.
        Copies on requests already paid or with staff stay as the record.
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/documents/managed/{managedId}:
    parameters:
      - { name: managedId, in: path, required: true, schema: { type: string, format: uuid } }
    get:
      tags: [Documents]
      summary: Documents for a managed property (owner)
      description: >-
        The papers on a property the caller tracks privately in the Owner Hub — a sale deed, an
        index-II, a society NOC — which may never have been listed. A separate vault from
        `/me/documents/{propId}`, not another way into it: those files are shareable with buyers
        through the request/grant flow and these are never shared. `managed` is a literal segment
        that out-ranks the `{propId}` template, so a property can never be addressed here.
        Self-scoped; no `x-roles`. Unknown or someone else's record answers `404`, never `403`.
      operationId: listManagedDocuments
      responses:
        '200':
          description: Documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Documents]
      summary: Upload managed-property document (multipart)
      description: >-
        Same allowlist, size cap and scanner pass as the listing vault. `propertyId` on the response
        carries the managed record's id, not a listing id.
      operationId: uploadManagedDocument
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [category, file]
              properties:
                category: { type: string, example: Sale Deed }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentSummary' }
        '404': { $ref: '#/components/responses/NotFound' }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
  /me/documents/managed/{managedId}/{docId}:
    parameters:
      - { name: managedId, in: path, required: true, schema: { type: string, format: uuid } }
      - { name: docId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Documents]
      summary: Remove managed-property document (owner)
      description: >-
        Deleting the managed record itself also removes its papers, because the foreign key
        cascades; this route is for removing one file while keeping the record.
      operationId: deleteManagedDocument
      responses:
        '204': { description: Removed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/photos:
    post:
      tags: [Listings]
      summary: Upload a listing photo (multipart)
      description: >-
        Store one image in the public bucket and return its permanent CDN URL, which the client puts
        into a listing's `images`. Unscoped by property: in the create-listing wizard the photos are
        chosen before the property exists. Image-only (JPEG/JPG or PNG) because the object is
        world-readable — no PDF, SVG, HEIC, WebP or AVIF; the browser converts a HEIC photo to JPEG
        before sending it. Metadata (EXIF, XMP, IPTC, comments, APP3/APP11, MPF) and anything after
        the image's end marker are removed before storage, and a file that cannot be parsed to its end
        marker is refused 415. Uploaded bytes must be strictly
        smaller than 1000000 bytes. At most 100 uploads per account in any 24 hours (429 after). An
        upload no listing, room or avatar shows 7 days later is deleted. Self-scoped; no `x-roles`.
      operationId: uploadPhoto
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema:
                type: object
                required: [url]
                properties:
                  url: { type: string, format: uri }
        '413': { description: Payload too large }
        '415': { description: Unsupported media type }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /me/documents/requests:
    get:
      tags: [Documents]
      summary: Buyer document-access requests (owner inbox)
      operationId: myDocumentRequests
      description: >
        Newest first, owner-scoped, paged. Every row is written by a prospective *buyer* asking to
        see the paperwork, so the list grows with demand for the listing rather than with anything
        its owner did. No `sort` parameter: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentRequest' }
  /me/document-requests:
    get:
      tags: [Documents]
      summary: My document-access requests (requester)
      operationId: myDocumentAsks
      description: >
        Newest first, requester-scoped, paged — the buyer's half of `/me/documents/requests`. A
        sibling path rather than a member of `/me/documents`, because everything under that prefix
        is scoped to listings the caller *owns* and this is scoped to rows the caller *wrote*.

        The share token is never returned on any signed-in route. The signed-in buyer reads `status`,
        `expiresAt` and `sharedDocumentCount`, then opens
        `/me/document-requests/{reqId}/documents` with their JWT instead.
      parameters:
        - { name: propertyId, in: query, schema: { type: string, format: uuid }, description: "Only the caller's asks on this listing — what the property page needs." }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/DocumentRequest' }
  /me/document-requests/{reqId}/documents:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    get:
      tags: [Documents]
      summary: Documents my granted request unlocked (requester)
      operationId: myGrantedDocuments
      description: >
        The same documents `/documents/shared` returns, reached by a different proof. That route is
        anonymous and authenticated by an unguessable token in a URL fragment, because its audience
        is a lawyer or a banker with no account here. This one is authenticated by the caller's JWT,
        because its audience is the buyer who wrote the request and is already signed in.

        It exists because the share token is never returned to the signed-in buyer: a grant only reached the buyer
        if the owner forwarded the link, so a buyer whose owner never did saw the status `granted`
        and had no way to open anything. The fix is not to hand the buyer the token — that would
        make their own request list a bearer credential — but to give them a read that needs no
        forwardable credential at all.

        Requester-scoped: `reqId` is accepted only once the row's requester is the caller. A request
        against a listing the caller *owns* is a 404 here too; those files are at
        `/me/documents/{propId}`, and a second door into them would be a second authorisation rule
        to keep correct.

        Unknown, foreign, never-granted and lapsed all answer 404 — deliberately not the opaque 401
        `/documents/shared` uses. That opacity exists so an anonymous prober cannot learn whether a
        token was ever real; there is nothing to conceal from a caller already authenticated as the
        one person entitled to know.
      responses:
        '200':
          description: The documents this grant unlocked. Empty if the owner granted a category
            they have not uploaded a file for.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '404': { description: Unknown, not the caller's, not granted, or lapsed }
  /me/document-requests/{reqId}/documents/{docId}/url:
    parameters:
      - { $ref: '#/components/parameters/ReqId' }
      - { name: docId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Documents]
      summary: Sign one document of my granted request (requester)
      operationId: myGrantedDocumentUrl
      description: >
        Requester-scoped exactly like `myGrantedDocuments`: the grant must be the caller's own,
        granted and unexpired, and `docId` one of the files it unlocks. Anything else is 404.
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUrl' }
        '404': { $ref: '#/components/responses/NotFound' }
  /documents/requests:
    post:
      tags: [Documents]
      summary: Request document access (buyer)
      operationId: requestDocumentAccess
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DocumentRequestCreate' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentRequest' }
  /me/documents/requests/{reqId}:
    parameters: [ { $ref: '#/components/parameters/ReqId' } ]
    patch:
      tags: [Documents]
      summary: Grant / decline document access (owner)
      operationId: respondDocumentRequest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200': { description: Updated }
  /documents/shared:
    get:
      tags: [Documents]
      summary: View shared documents via link token
      description: |
        Public but token-scoped. The `X-Share-Token` header IS the authorisation — there is no
        session, and the link is meant to be forwarded to a lawyer or a bank officer who has no
        Draazy account.

        Treat it as a bearer credential: whoever holds the string can read the owner's title deeds
        until the grant expires (7 days from the grant). It must never be written to an access log,
        an error report or an analytics event.

        **The token is a header, never a query parameter.** It used to be `?token=…`, which
        made every share link itself a bearer credential — copied into browser history and
        bookmarks, written to any proxy or CDN access log, and forwarded verbatim when the recipient
        pasted it into a chat. The query parameter has been removed outright rather than deprecated:
        no client had ever built a link carrying one, so there was no compatibility window, and a
        still-live bearer-in-URL path is the vulnerability rather than a migration aid. A stale
        `?token=…` URL fails closed with the same 401 as any other bad credential.

        The intended caller is the web client's `/shared-documents` route, which carries the token
        in the URL **fragment** and puts it on this header. A fragment is never transmitted to a
        server, so it cannot appear in an access log or in `Referer`.

        Server-side the older defences still stand behind it: the container access-log pattern is
        pinned to exclude query strings and responses carry `Referrer-Policy: no-referrer`.
        Every failure — missing, unknown, declined, expired — is the same 401, deliberately, so the
        endpoint cannot be used as an oracle for which tokens were ever real.
      security: []
      operationId: getSharedDocuments
      parameters:
        - name: X-Share-Token
          in: header
          required: true
          schema: { type: string }
          description: Bearer credential for one grant. Do not log, store or forward.
      responses:
        '200':
          description: Shared documents
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/DocumentSummary' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /documents/shared/url:
    get:
      tags: [Documents]
      summary: Sign one shared document (share token)
      operationId: getSharedDocumentUrl
      security: []
      description: >
        Same authorisation as `/documents/shared`: the `X-Share-Token` header is the proof, and
        a missing, unknown, declined or expired token is the same 401. `docId` must be one of the
        files that token unlocks, otherwise 404. Called when a file is opened, so no signed link is
        minted for files nobody opens.
      parameters:
        - { name: X-Share-Token, in: header, required: true, schema: { type: string } }
        - { name: docId, in: query, required: true, schema: { type: string } }
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUrl' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /tickets:
    get:
      tags: [Services & Support]
      summary: All service requests (admin/staff)
      operationId: listTickets
      x-roles: [staff, admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
        - name: status
          in: query
          schema: { type: string }
          description: >
            One status for customers. Staff/admin may pass a comma-separated list, e.g.
            `assigned,in-progress,changes-requested,approved`; `awaiting-payment` still matches no
            staff queue rows.
        - { name: priority, in: query, schema: { type: string, enum: [low, medium, high, urgent] } }
        - name: q
          in: query
          schema: { type: string }
          description: Contains-match, case-insensitive, over the id, subject, service, customer, detail and mobile.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Ticket rows. Notes, `value` and `quotedValue` come with `getTicket`.
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/TicketRow' }
    # No x-roles: a customer raising a request is the point of the queue; only working it is staff-only.
    post:
      tags: [Services & Support]
      summary: Create service request
      operationId: createTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/CustomerTicket' }
  /tickets/summary:
    get:
      tags: [Services & Support]
      summary: Ticket counts per status for one desk (admin/staff)
      operationId: getTicketSummary
      x-roles: [staff, admin]
      parameters:
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
      responses:
        '200':
          description: Counts for the same scope as `listTickets`, whatever page it is on
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TicketSummary' }
  /tickets/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: One ticket with its notes (admin/staff)
      operationId: getTicket
      x-roles: [staff, admin]
      responses:
        '200':
          description: The ticket in full
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Services & Support]
      summary: Update ticket (admin/staff)
      operationId: updateTicket
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TicketUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Ticket' }
  /tickets/{id}/notes:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Add internal note (admin/staff)
      operationId: addTicketNote
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema:
                type: object
                properties:
                  by: { type: string }
                  text: { type: string }
                  at: { type: string, format: date-time }
  /support/tickets:
    get:
      tags: [Services & Support]
      # The caller's own tickets only: an admin view of every support conversation is either an
      # unbounded dump of names and mobiles, or a shape that changes with the caller's role.
      summary: My support tickets
      operationId: listSupportTickets
      responses:
        '200':
          description: Support tickets
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupportTicketSummary' }
    post:
      tags: [Services & Support]
      summary: Create support ticket
      operationId: createSupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SupportTicketCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
  /support/tickets/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Support ticket detail with messages
      description: A desk member with `tickets:write` opening someone else's ticket also clears the desk's `awaitingReply` flag.
      operationId: getSupportTicket
      responses:
        '200':
          description: Ticket
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/tickets/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Reply to support ticket
      operationId: replySupportTicket
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        # Returns the message: a bare `'201': Replied` leaves a client with no way to render the
        # message it had just sent without re-fetching the whole ticket.
        '201':
          description: Sent
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportMessage' }
        '404': { $ref: '#/components/responses/NotFound' }
  /support/tickets/{id}/read:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Mark support ticket read (the caller's own side)
      operationId: markSupportTicketRead
      responses:
        '204': { description: Marked }
        '404': { $ref: '#/components/responses/NotFound' }  # Slice-12 spec fix S48
  /support/tickets/{id}/close:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Close a support ticket (desk)
      description: >-
        Marks the ticket closed and tells the customer. Closing an already-closed ticket is a no-op.
      operationId: closeSupportTicket
      x-roles: [staff, admin]
      responses:
        '200':
          description: Closed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SupportTicket' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/support-tickets:
    get:
      tags: [Services & Support]
      summary: Platform-wide support queue (paged)
      operationId: adminSupportTickets
      x-roles: [staff, admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - name: awaitingReply
          in: query
          schema: { type: boolean }
          description: >-
            Omit for everything. `true` narrows to tickets whose newest message is from the customer
            and nobody on the desk has read -- the working queue. `false` is the complement.
        - name: counts
          in: query
          schema: { type: boolean, default: false }
          description: Add the three tab totals (`awaiting`, `answered`, `all`) over the whole table; the desk asks on first load and refresh only.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Support tickets, newest first; `counts` (`awaiting`, `answered`, `all`) only with `counts=true`
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminSupportTicket' }
  /service-waitlist:
    post:
      tags: [Services & Support]
      summary: Join the waitlist for a service that has not launched
      description: >
        "Tell me when this launches", from a stranger (D4). Anonymous, and the third unauthenticated
        body-write on the platform after `/cities/waitlist`.


        Answers 201 whether or not a row was written, and returns no body. An id would be a
        reference the caller can never resolve — it cannot read `GET /tickets` — and any
        acknowledgement that distinguished "recorded" from "already on the list" would confirm to a
        stranger whether the number they typed is registered. There is deliberately no `GET`: the
        rows are a page of unverified phone numbers, readable only by ops on the guarded ticket
        routes.


        There is no free-text field, also deliberately. `service` is a slug checked server-side, and
        the subject and team are derived from it, so nothing a stranger typed reaches a screen a
        person reads and acts on.
      security: []
      operationId: joinServiceWaitlist
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceWaitlistJoin' }
      responses:
        '201': { description: Recorded, or silently deduplicated }
        '400': { $ref: '#/components/responses/BadRequest' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429':
          description: >
            Too many signups for this mobile within the hour. Capped against the table under an
            advisory lock rather than in memory, because a budget that resets on deploy is not a
            budget — and it is the only one of the three controls on this route (IP rate limit, bot
            challenge, per-mobile cap) that survives the other two being unconfigured.
  /demand-signals:
    post:
      tags: [Services & Support]
      summary: Record that somebody looked for a home the platform may not have
      description: >
        D10. What buyers and tenants asked for, as opposed to what owners listed. Three moments
        produce a signal: a search, a "notify me" submit, and a property view. The aggregate is the
        demand half of `GET /admin/supply-gap`.


        Anonymous, and that is the point rather than an oversight. Most of the people whose demand
        is worth measuring have no account yet - they are looking precisely because they have not
        found anything. A signal that only fired for signed-in visitors would report the population
        that already stayed, which is the one group the report does not need to hear from. When a
        session does exist the user id is attached, so repeat interest can be told apart from
        breadth of interest.


        There is deliberately no `GET`. A public read of this aggregate would let anyone enumerate,
        locality by locality, what Draazy is short of - a competitor's market research budget
        handed over for free. The write is open and the read is guarded; the asymmetry is the
        design, not an omission.


        No contact detail is accepted or stored. The only reader is a count, so a mobile number
        here would be data held on people who never opened an account, for a report that cannot use
        it. Where a relationship does exist the contact already lives on `saved_searches` or
        `city_waitlist`.


        Answers 202 with no body. Nothing is created that the caller can later address, and the
        client must not wait on it: a failed analytics write must never break a search or a
        property page. Capped per IP by the platform write rate limit.
      security: []
      operationId: recordDemandSignal
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DemandSignalCreate' }
      responses:
        '202': { description: Accepted. No body, and no id - there is nothing to address later. }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /service-requests:
    # Staff cannot find the requests the operations below act on without a list, and "every service
    # request on the platform" is an unbounded queue. Scope is role-derived.
    get:
      tags: [Services & Support]
      summary: Service requests - own for a customer, the whole queue for staff/admin
      operationId: listServiceRequests
      parameters:
        - { name: type, in: query, schema: { type: string }, description: Service type, e.g. rent-agreement }
        - { name: status, in: query, schema: { type: string } }
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
        - { name: ticketId, in: query, schema: { type: string } }
        - name: unassigned
          in: query
          schema: { type: boolean, default: false }
          description: >
            Only requests nobody has taken. A boolean rather than an assignee id: a filter that
            names an operator is a filter one operator can use to hide another's backlog. Ignored
            for a customer, who has no queue to triage.
        - name: overdue
          in: query
          schema: { type: boolean, default: false }
          description: >
            Only rent agreements past the desk's turnaround target (see ServiceRequestSla). Ignored
            for a customer.
        - name: mine
          in: query
          schema: { type: boolean, default: false }
          description: Only requests assigned to the caller. Ignored for a customer.
        - name: q
          in: query
          schema: { type: string }
          description: >
            The start of the requester's name or mobile number, or a whole request id. Anchored --
            "the start of the name" and "the start of the number" are how people actually look
            somebody up, and an unanchored search over every user on the platform is what this
            endpoint is shaped to avoid. A term that is not an id is tried as a name rather than
            refused, because it is one box serving three kinds of term. Ignored for a customer.
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Service requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ServiceRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
    post:
      tags: [Services & Support]
      summary: Create service request
      operationId: createServiceRequest
      description: >
        A free service is filed and done. A priced one is committed as `awaiting-payment` with no
        gateway order and no `paymentSessionId`: the client then records identities and uploads
        documents, and opens payment through `openServiceRequestCheckout`, which is where a rent
        agreement is checked for everything the Sub-Registrar will ask for. A rent agreement whose
        `details._state` breaks the leave-and-licence rules (term 1-60 months, lock-in and notice
        within the term, due day 1-28, increment 0-100%, start date from 30 days back to 180 ahead
        in IST, deed language English or Marathi, biometric visit at the property / licensor /
        licensee with slot any / morning / afternoon / evening and a preferred date from tomorrow
        to 90 days ahead, witness ages 18+, witness names when the witness section is filed on create,
        licensor capacity owner / co-owner / poa, POA registration fields, a distinct mobile per
        party, at most 3 co-owners and 6 tenants, and well-formed emails) is a `422`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
  /service-requests/queue:
    get:
      tags: [Services & Support]
      summary: A desk's service-request queue, as rows (staff/manager/admin)
      operationId: listServiceRequestQueue
      x-roles: [staff, manager, admin]
      description: >
        The rows a desk draws and nothing behind them: no thread, no files, no parties, no payment
        session and no timeline. `details` is cut down to the fields a row summarises (the scalar
        request fields plus a reduced `_state` carrying only the owner and tenant names, flat and
        terms). Open a row with `getServiceRequest`. Same scope and filters as `listServiceRequests`
        for back-office callers, which still reaches the full shape.
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: type, in: query, schema: { type: string }, description: Service type, e.g. rent-agreement }
        - { name: status, in: query, schema: { type: string } }
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
        - { name: ticketId, in: query, schema: { type: string } }
        - { name: unassigned, in: query, schema: { type: boolean, default: false } }
        - { name: overdue, in: query, schema: { type: boolean, default: false } }
        - { name: mine, in: query, schema: { type: boolean, default: false } }
        - { name: q, in: query, schema: { type: string }, description: Anchored start of the requester's name or mobile, or a whole request id }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Queue rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ServiceRequestQueueRow' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /service-requests/queue-summary:
    get:
      tags: [Services & Support]
      summary: Service request queue summary
      operationId: getServiceRequestQueueSummary
      x-roles: [staff, manager, admin]
      parameters:
        - { name: team, in: query, schema: { $ref: '#/components/schemas/Team' } }
      responses:
        '200':
          description: Live counts for the staff queue tabs
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceQueueSummary' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /service-requests/co-fill:
    post:
      tags: [Services & Support]
      summary: Create a co-filled request and invite the second party (requester only)
      operationId: createCoFillServiceRequest
      description: >
        `createServiceRequest` and `inviteServiceRequestParty` in one call, and deliberately not the
        same thing as calling them in sequence.


        A rent agreement is two people's paperwork, and the requester paying before the tenant has
        even agreed to be on it is the wrong order of events. Like the plain create, the request is
        priced and committed as `awaiting-payment` with **no** `payment_ref` -- invisible to the ops
        queue on exactly the same rule as any other unpaid rent agreement -- and the invitation is
        recorded against it. Checkout is opened later, by the requester, through
        `openServiceRequestCheckout`.


        Only for priced services. If the type resolves to a free one there is no deferred checkout to
        defer and the composition has no meaning, so it is a `400` rather than a silently completed
        request that the invitee then finds already finished.


        The invitation half behaves exactly as `inviteServiceRequestParty` does, including V107's
        pending row: the counterparty does not need an account yet, and the invitation binds itself
        to theirs the first time they sign in on that number.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CoFillServiceRequestCreate' }
      responses:
        '201':
          description: >
            Created and awaiting payment, with the invitation recorded. `parties` carries the
            invited side; while the number belongs to nobody yet it reads `pending: true` with a
            masked `mobile` and no `party` name.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '400':
          description: >
            Not a priced service type, or the role or mobile is not one this request can take. Also
            the answer if `request.details` carries identity numbers, on the same terms as the plain
            create.
        '409':
          description: >
            The number is the requester's own, or the side is already spoken for. Reported against
            the whole call: the request is rolled back with the invitation, so a co-fill that could
            not name its counterparty does not leave an orphaned unpaid row behind.
  /service-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Service request detail with timeline
      operationId: getServiceRequest
      responses:
        '200':
          description: Service request
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{id}/docs/{docId}/url:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
      - { name: docId, in: path, required: true, schema: { type: string } }
    get:
      tags: [Services & Support]
      summary: Sign one document of a service request
      operationId: getServiceRequestDocumentUrl
      description: >
        Minted when the file is opened, not with every read of the request. Visible on the same terms
        as `getServiceRequest` lists it: a request the caller cannot see, a file that is not on it, or
        another side's identity scan is a 404.
      responses:
        '200':
          description: Signed URL
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DocumentUrl' }
        '404': { $ref: '#/components/responses/NotFound' }
  /service-requests/{id}/status:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Services & Support]
      summary: Update status (staff)
      operationId: updateServiceRequestStatus
      x-roles: [staff, admin]
      description: >
        The three administrative moves ops may make by hand -- `assigned`, `in-progress` and
        `cancelled`. The three that mean something happened (`draft-shared`, `approved`,
        `completed`) are earned by it happening and are refused here.


        **A cancellation must carry a `note`.** `StatusUpdate` is shared by five operations, so the
        schema cannot mark it required; it is a `422` on this one. The reason is not filed away --
        it is posted to the customer's message thread and they are notified, because a customer who
        has paid for a rent agreement and finds a bare "Cancelled" chip has been told nothing.


        **Taking a request another operator is holding is a `409`.** `assigned -> assigned` is not a
        legal edge, but `in-progress -> assigned` and `changes-requested -> assigned` both are, so
        without this a colleague's matter could be taken silently. An admin may take it anyway:
        there is no release verb on this resource, and a matter held by somebody who has left the
        company has to be drainable by someone.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StatusUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{id}/messages:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Add message to service request
      operationId: addServiceRequestMessage
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/MessageCreate' }
      responses:
        '201':
          description: Added
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestMessage' }
  /service-requests/{id}/docs:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Upload / update document on request
      operationId: addServiceRequestDoc
      description: >
        The requester, a co-fill party or the desk. `draft` and `final-document` are refused (422):
        those files are filed only by the desk's own share and final-upload routes, and the
        registration checker and the customer's tracker both trust them as the desk's work. A co-fill
        party files only their own side's party papers: an invited tenant may not file `licensor-*`
        or `ownership-proof`, nor an invited owner `tenant-*` (403). A closed
        request (completed or cancelled) takes no more files (409).
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              properties:
                category: { type: string }
                file: { type: string, format: binary }
      responses:
        '201':
          description: Uploaded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '403':
          description: A co-fill party filing a category that belongs to the other side
        '409':
          description: >
            The request is closed. A request with no property is filed against the request alone,
            so the wizard's party papers upload before any listing exists.
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{id}/docs/from-vault:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: File one of the caller's own personal-vault papers on the request
      operationId: addServiceRequestDocFromVault
      description: >
        Reuses a paper the caller already keeps in `GET /me/documents/personal` without a
        re-upload: a vault row carries a signed URL rather than bytes, so the server files a new
        request document that shares the stored object. The same category and side rules as
        `addServiceRequestDoc` apply. Ops are refused (403); another person's vault row is 404.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VaultDocFiling' }
      responses:
        '201':
          description: Filed
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Document' }
        '403':
          description: Ops, or a co-fill party filing a category that belongs to the other side
        '404':
          description: No such request for this caller, or no such paper in their personal vault
        '409':
          description: The request is closed
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{id}/checklist:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Services & Support]
      summary: Document checklist for a request
      operationId: getServiceRequestChecklist
      description: >
        The named paperwork this request needs and how much of it has arrived. Readable by the
        requester or by the desk the request is on; anyone else gets `404`, because which service
        requests exist is not a fact this API confirms to people who are not on them.

        Derived at read time from the request's own documents — there is no checklist table and no
        status a desk ticks by hand, so an item is "done" if and only if a file exists under its
        `id` as the upload `category`. That is also how a client satisfies one: POST the file to
        `/service-requests/{id}/docs` with `category` set to the item `id`. Documents filed under
        anything else (the desk's `draft` and `final-document`, the `service-request` default) are
        on the request but are not checklist items and are not counted. `review` is the desk's
        verdict on the newest file (`reviewServiceRequestDocument`); a re-upload reads `pending`.

        Read-only, and deliberately carries no URLs: item completion is a fact about the request,
        while the bytes stay behind `getServiceRequest`, where the vault's own read rules live.
      responses:
        '200':
          description: Checklist
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestChecklist' }
        '404': { description: No such request, or not the caller's }
  /service-requests/{id}/checklist/{category}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
      - { name: category, in: path, required: true, schema: { type: string, example: licensor-0-pan } }
    put:
      tags: [Services & Support]
      summary: Verify or reject the newest paper filed under one checklist item (staff)
      operationId: reviewServiceRequestDocument
      x-roles: [staff, admin]
      description: >
        The operator holding the request (or an admin) gives a verdict on the file the checklist
        currently shows for `category`. `documentId` must be that file: a newer upload is a `409`,
        so nobody verifies a re-upload they have not seen. A rejection needs a `reason` (at most 300
        characters); the requester, and an accepted co-fill party whose side the paper is, are
        notified to re-upload. A rent agreement's draft and registered copy are refused (`409`)
        until every item reads `verified`; other request types are not gated.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [documentId, verdict]
              properties:
                documentId: { type: string }
                verdict: { type: string, enum: [verified, rejected] }
                reason: { type: [string, 'null'], maxLength: 300 }
      responses:
        '200':
          description: The checklist after the verdict
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequestChecklist' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '409':
          description: Not taken, held by a colleague, closed or unpaid, nothing filed, or a newer copy was uploaded
        '422': { $ref: '#/components/responses/ValidationError' }
  /service-requests/{id}/identities:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    put:
      tags: [Services & Support]
      summary: Record the parties' identity numbers (requester only)
      operationId: putServiceRequestIdentities
      description: >
        The requester replaces all rows except roles owned by an accepted co-fill party; including
        one of those roles is a `409` because the invited party records their own identity numbers.
        An accepted co-fill party may write only their own side (a tenant invitee the `tenant` rows),
        and that write replaces only that role. `witness` rows are indexed 0 and 1. Duplicate
        role/index pairs, Aadhaar numbers or PANs are `422`; duplicate messages never echo the
        number. No role annotation: the guard is participant identity -- staff and admin are refused,
        because a desk that could write these could also invent them. Once retention has blanked the
        numbers on a stalled open request (`identities.purged`), a co-fill party may refill their
        purged rows even after checkout opened, and while that purge is the latest identity event the
        requester's write adds `identities.recorded` to the timeline (D282).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestIdentities' }
      responses:
        '204':
          description: >
            Recorded. Deliberately empty -- echoing the numbers back onto a response nobody reads
            them from is the habit that made `details` a leak.
        '403':
          description: >
            The caller is staff or admin, or a co-fill party writing a role that is not theirs
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: >
            The request is completed or cancelled, so there is nothing left to draft from; or the
            caller is a co-fill party and checkout is already open and their rows were not purged, so their side is settled; or the
            requester tried to overwrite a role owned by an accepted co-fill party.
    get:
      tags: [Services & Support]
      summary: Read the parties' identity numbers (assigned operator only)
      operationId: getServiceRequestIdentities
      x-roles: [staff, admin]
      description: >
        The role list is the outer guard, not the real one: the server refuses every staff member
        except the one the request is assigned to, admins included. An admin who needs the numbers
        assigns the request to themselves first -- two visible moves if somebody else already holds
        it, since there is no `assigned` -> `assigned` transition -- and each one is a timeline entry
        and an audit row. The control is accountability, not prohibition. Every call -- successful or
        refused -- is written to `audit_log`.
      responses:
        '200':
          description: The parties on this request, owner first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ServiceRequestIdentity' }
        '403':
          description: The request is unassigned, or assigned to somebody else
        '404':
          description: No such request
  /service-requests/{id}/draft:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    # Multipart, matching /final-doc, because a draft agreement is a file — without a body,
    # "share draft for review" asks the customer to approve a document never transmitted.
    post:
      tags: [Services & Support]
      summary: Share draft for review (staff)
      operationId: shareServiceRequestDraft
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                note: { type: string, maxLength: 500 }
                checks:
                  type: array
                  items: { type: string, enum: [identity, title, poa, address, terms] }
                  description: >
                    A rent agreement's drafting checklist — typed ID numbers match the scans, the
                    ownership proof names the licensors, any power of attorney is checked, the flat
                    address matches the ownership proof, the draft's terms match the particulars.
                    Every key is required for a rent agreement (422 naming the rest) and recorded on
                    the `service-request.draft-shared` audit row; other request types ignore it.
                file: { type: string, format: binary }
      responses:
        '200':
          description: Shared
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '409': { description: 'Not the holder, a status that cannot share, or a rent agreement with a paper not yet verified' }
        '422': { description: 'A rent agreement''s drafting checklist is incomplete' }
  /service-requests/{id}/draft/decision:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Approve / reject draft
      operationId: decideServiceRequestDraft
      description: >
        Requester only. A rejection must carry a non-blank note — it is posted to the thread as the
        customer's message, and it is what the desk revises from. An approval needs the requester to
        have opened the version now shared (POST /service-requests/{id}/draft/opened).
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DecisionRequest' }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '400':
          description: Unknown decision, or a rejection with no reason
        '409':
          description: No draft awaits a decision, or the requester approved a version they never opened
  /service-requests/{id}/draft/otp:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Send or check an inline party's draft approval code
      operationId: approveInlineServiceRequestDraftParty
      description: >
        Requester only. For an inline-typed executing party on the current rent-agreement draft,
        call once with `partyKey` to send an OTP to the masked mobile shown on `draftApproval`,
        then again with `otp` to record that party's approval for this draft version.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DraftOtpRequest' }
      responses:
        '200':
          description: Code sent, or party approval recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DraftOtpResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: The `otp` was wrong, expired, or no code is outstanding.
        '403':
          description: Caller is not the requester
        '409':
          description: No draft awaits approval
  /service-requests/{id}/draft/opened:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Record that the requester opened the shared draft
      operationId: markServiceRequestDraftOpened
      description: >
        Anyone who can read the request may call it, but only the requester's open is recorded, as a
        draft.opened timeline entry once per shared version. The draft is a signed storage URL the
        server never sees fetched, so the client reports the open.
      responses:
        '204':
          description: Recorded, or a no-op for anyone but the requester or a version already opened
        '404':
          description: No such request for this caller
        '409':
          description: No draft is out for review
  /service-requests/{id}/cancel:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Cancel an unpaid request (requester only)
      operationId: cancelServiceRequest
      description: >
        Frees the one-unpaid-request slot for that desk. The rent-agreement wizard calls it when a
        customer edits the details after a failed attempt and files again. A request nobody cancels
        is retired by the sweep: once the abandoned-checkout TTL has passed since its checkout
        opened, or 30 days after its last change if checkout never opened.
      responses:
        '200':
          description: Cancelled
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '404':
          description: No such request for this caller -- another requester's row is invisible, not forbidden
        '409':
          description: The request is not awaiting payment, so there is nothing to release
  /service-requests/{id}/party-details:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    put:
      tags: [Services & Support]
      summary: Submit the invited party's half of the details (accepted invitee only)
      operationId: submitServiceRequestPartyDetails
      description: >
        The counterparty's one write on the agreement, and the reason co-fill is called co-fill.


        Before this route the invitee could read the matter and answer the invitation and nothing
        else, so a tenant's own particulars reached the desk by the requester typing them in on
        their behalf -- which is the same defect `putServiceRequestIdentities` exists to close on the
        identity numbers, one level up.


        **The guard is neither a role nor the requester, and it excludes both.** Staff are refused
        because a desk filling in a party's details makes a support action indistinguishable from
        that party's own statement. The requester is refused for the same reason from the other
        direction: they have `createServiceRequest` and their own `details`, and letting them post
        here would let one side of an agreement author the other side's half of it. Only somebody
        who holds an `accepted` invitation on this request may call it; a `pending` or merely
        `invited` party is refused, because accepting is the consent that makes them a party at all.


        `PUT`, and the body is merged rather than replacing the request's `details` wholesale --
        the two sides are filling different keys of one object and a replace would let whoever
        submits second erase the first. Within one side's own keys the last write wins, which is
        what a form being corrected needs. For a rent agreement only the caller's own side is kept
        -- `tenants` for the tenant; `ownerName`, `_state.owner` and `_state.coOwners` for the
        owner -- and every other key is dropped, so the invitee cannot restate the licensor, the
        flat, the terms or the witnesses the requester reviewed. A payload with none of its own
        side's rows is `422`; one that would move the priced terms is still `409`.


        Only before checkout. Once `payment_ref` exists the priced matter is bound to a gateway
        order and the details it was priced from must stop moving; the requester reopens it by
        cancelling and starting again, which is a visible act rather than a silent edit under a
        pending payment.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PartyDetailsUpdate' }
      responses:
        '200':
          description: >
            Merged. The whole request is returned rather than the details alone, so the submitting
            party sees the combined object they have just contributed to -- including the half the
            other side wrote.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '403':
          description: >
            The caller is the requester, or has not accepted the invitation. Deliberately `403` and
            not `404`: the caller can see this request, so pretending it does not exist would be
            both false and useless -- what they need to be told is that accepting comes first.
        '404':
          description: No such request for this caller
        '409':
          description: >
            The request is no longer awaiting payment, or checkout is already open. The details it
            was priced from are settled at that point.
  /service-requests/{id}/checkout:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Open checkout on a deferred priced request (requester only)
      operationId: openServiceRequestCheckout
      description: >
        The second half of `createCoFillServiceRequest`: binds the gateway order that route
        deliberately did not open, once there is something to pay for.


        The requester's alone. Not ops -- they have no business starting a customer's payment -- and
        not the invited party, who did not agree to the price and is not the one being charged.
        Anyone else on the request is refused `403`; anyone not on it at all is refused `404`, on the
        same silence every customer-scoped read on this resource keeps.


        Every priced request comes here: the plain create defers too.


        **A rent agreement must be registrable first.** Every licensor (the owner plus each
        `_state.coOwners` entry) and every licensee (`_state.tenants`, at least one) needs an
        identity row with an Aadhaar number for resident parties and a PAN card, Aadhaar card (or
        passport scan for `_state.*.residency` `nri` / `foreign`) and photo filed under
        `licensor-{i}-pan|aadhaar|passport|visa|photo` / `tenant-{j}-pan|aadhaar|passport|visa|photo`, plus
        `licensor-{i}-poa` where that licensor's `capacity` is `poa`; the flat needs
        `ownership-proof`; both witnesses (`witness` 0 and 1) need an identity row; and no two
        parties may share an Aadhaar number. Last, the deed's particulars must be stated: a monthly
        rent above zero, `terms.startDate`, `prop.flatNo|society|locality|pincode|area`, a residential
        `prop.propType`, every licensor's and licensee's name, age and address, and each witness's name,
        age and address. Parties with `_state.*.type: entity` are out of the self-serve flow and are
        refused here with the legal-desk quote message. Last, every `_state.tenants` entry must have confirmed through
        `confirmRentAgreementTenant` or be an accepted co-fill party's own number. Anything short is
        a `409` naming what is missing.


        **Every invitation must be answered first when invitations exist.** A plain request with no
        party rows skips the co-fill checks. A co-filled request needs at least one accepted party
        and no outstanding invitation. That rule is the point of the whole deferral: paying while an
        invitation is unanswered is exactly the premature commitment the plain create makes, and it
        would leave the requester holding an order for a matter the other side can still decline.


        A second call while an order is already open resumes that order -- a fresh session for the
        same gateway order, never a second order -- so a customer who closed the payment sheet can
        pay without being charged twice. Once the gateway says the order can no longer take a
        payment (expired, or already paid and awaiting its webhook) the call is a `409`.


        **A rent agreement names the declaration its requester accepted.** `declaration` must be
        the current version (`ra-decl-2026-09`) of the review step's authority-and-consent text; the
        audit log keeps who accepted it, when, and a SHA-256 of the exact English wording. Checked after
        readiness, so an incomplete request still says what it is missing. Other request types ignore it.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ServiceRequestCheckout' }
      responses:
        '200':
          description: >
            Checkout opened. The returned request carries the gateway reference the client hands to
            the payment sheet.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ServiceRequest' }
        '403':
          description: The caller is on this request but did not raise it
        '404':
          description: No such request for this caller
        '409':
          description: >
            Not awaiting payment, an open order that can no longer be resumed, nothing payable, an invitation is still
            outstanding, no invited party has accepted, required rent-agreement documents are
            missing (`Upload required documents before checkout: ...`), or required Aadhaar identity
            rows are missing (`Record Aadhaar numbers before checkout: ...`), or the deed's
            particulars are incomplete (`Complete the agreement before checkout: ...`), or a rent agreement's
            `declaration` is absent or not the current version (`Accept the declaration on the review step before checkout.`). All are "the request
            is not in a state where opening checkout means anything", which is what this file uses
            `409` for throughout.
  /service-requests/{id}/final-doc:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Services & Support]
      summary: Upload final document (staff)
      description: >
        Only from `approved`, and only by the operator holding the request or an admin (409
