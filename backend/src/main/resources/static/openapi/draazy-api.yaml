      operationId: cancelPendingSubscription
      description: >
        Cancels the caller's own pending orders so a fresh checkout can start. A payment that still lands
        on a cancelled order grants nothing and is refunded automatically.
      responses:
        '204': { description: Cancelled, or nothing was pending }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/subscription/orders/{orderId}:
    get:
      tags: [Billing & Growth]
      summary: Where my checkout order stands
      operationId: getSubscriptionOrderStatus
      description: >
        Polled by checkout after the payment window closes. `failed` means the newest attempt was declined
        or abandoned; the order stays payable until it expires, so the same checkout can retry it.
      parameters:
        - { name: orderId, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: Order status
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, enum: [paid, pending, failed, closed] }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/entitlements:
    get:
      tags: [Billing & Growth]
      summary: What I am entitled to (owner contacts, listing slots)
      operationId: getEntitlements
      # Contact and listing allowance in one response because they derive from the same subscription
      # and referrals. Separate from /me/subscription, whose pending purchase confers nothing.
      responses:
        '200': { description: Entitlements, content: { application/json: { schema: { $ref: '#/components/schemas/Entitlements' } } } }
  /me/payments:
    get:
      tags: [Billing & Growth]
      summary: My paid orders, newest first
      operationId: listMyPayments
      description: >-
        Listing passes, contact packs, rent agreements and agreement amendments the caller has paid,
        with their refund state. `refund` is set for passes and packs only; rent-agreement refunds
        follow their own flow. Send `X-Device-Id`; only a salted hash is stored.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200':
          description: Payments
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MyPayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/payments/{id}/refund:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Ask for a refund on a listing pass or contact pack
      operationId: requestPaymentRefund
      description: >-
        Re-checks eligibility. A pack is refundable within `packRefundDays` of payment while none of its
        contacts is used. A pass is refundable when its listing got at most `passGuaranteeMaxEnquiries`
        contact requests in its first `passGuaranteeDays` days, claimed from the end of that window until
        seven days after, once per `passGuaranteeEveryMonths` across accounts that share a user, device
        or payment instrument. Every refund is staff-approved: the order is frozen (a pack's contacts
        cannot be used, a pass stops covering its listing) until a decision. A repeat with the same
        `Idempotency-Key` returns the same state.
      parameters:
        - { $ref: '#/components/parameters/IdempotencyKey' }
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string, maxLength: 500 }
      responses:
        '200':
          description: Refund requested; the order is now `refund_pending`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyPayment' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: Not eligible. `reason` is one of the codes on `MyPayment.refund.reason`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: refund_not_eligible, message: Some of this pack's contacts are already used., status: 422, reason: not_eligible_used }
  /admin/refunds:
    get:
      tags: [Billing & Growth]
      summary: Refunds desk - customer requests, automatic system refunds and gateway disputes
      operationId: listRefunds
      description: >-
        Needs the `refunds` back-office function (admins always). `status` defaults to `pending_review`;
        `auto` lists the system's own refunds (failed, late or mismatched payment, pass for a closed
        listing) and `disputed` the open gateway disputes. An unknown status is a 400.
      x-roles: [staff, admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: status, in: query, schema: { type: string, enum: [pending_review, approved, rejected, auto, disputed], default: pending_review } }
        - name: counts
          in: query
          schema: { type: boolean, default: false }
          description: 'Add the tab totals (`pending_review`, `approved`, `rejected`, `auto`, `disputed`).'
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Refund rows
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/RefundDeskRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/refunds/{id}/approve:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Approve a refund request
      operationId: approveRefund
      description: >-
        Re-checks the facts as of the request, then queues the refund through the gateway; the order's
        entitlement is revoked for good. Locks the request, so concurrent decisions leave one.
        `409` when already decided or the gateway has an open dispute on the order; `422 refund_not_eligible`
        when the facts no longer hold, counting every enquiry up to now and any pause during the guarantee window.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundDeskRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422':
          description: The facts no longer qualify.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: refund_not_eligible, message: Some of this pack's contacts are already used., status: 422, reason: not_eligible_used }
  /admin/refunds/{id}/reject:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Reject a refund request and restore the entitlement
      operationId: rejectRefund
      description: >-
        The term is pushed out by the time the order spent frozen; if it would still have ended, the order
        expires instead. `409` when already decided or the gateway has an open dispute on the order.
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [reason]
              properties:
                reason: { type: string, minLength: 1 }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RefundDeskRow' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/referrals:
    get:
      tags: [Billing & Growth]
      summary: My referral code + rewards
      operationId: getReferrals
      description: >-
        Refreshes the caller's own network and device digests on every read, so a same-device
        redemption can be refused. Send `X-Device-Id` (opaque, at most 64 characters, a longer
        or blank value is ignored); only a salted hash is stored.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      responses:
        '200': { description: Referrals, content: { application/json: { schema: { $ref: '#/components/schemas/ReferralSummary' } } } }
  /referrals/redeem:
    post:
      tags: [Billing & Growth]
      summary: Redeem a referral code
      operationId: redeemReferral
      description: >-
        Allowed only within `referralSignupWindowHours` of account creation, before the account has
        any listing or contact request, while the `referralRewards` flag is on, and not from the
        referrer's own device. Every refusal is the same 409.
      parameters:
        - { $ref: '#/components/parameters/DeviceId' }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [code]
              properties:
                code: { type: string }
                shareChannel: { type: string, enum: [whatsapp, sms, email, copy, qr, other] }
      responses:
        '200': { description: Redeemed }
        '409': { description: 'Refused — one indistinguishable error for every reason: unknown or own code, already referred, outside the signup window, account already active, same device, or rewards switched off.' }
  /referrals:
    get:
      tags: [Billing & Growth]
      summary: Referral review queue (admin/ops fraud desk)
      operationId: listReferrals
      # Admin/ops only, and enforced: the queue carries both parties' mobile numbers plus the fraud
      # signals saying which of them we suspect. The decision endpoints below are guarded alike.
      x-roles: [staff, admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: status, in: query, schema: { type: string }, description: 'One status or a comma-separated set of pending, qualified, held, rewarded, rejected, clawed-back.' }  # Slice-13 spec fix S52
        - { name: risk, in: query, schema: { type: string, enum: [low, medium, high] } }
        - { name: q, in: query, schema: { type: string }, description: 'Matches the referrer or referred name, either mobile, or the referral id.' }
        - name: counts
          in: query
          schema: { type: boolean, default: false }
          description: 'Add the tab totals (`all`, `pending`, `held`, `highRisk`, `rewarded`, `refused`) over the whole table.'
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Referrals
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/approve:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Approve a referral (checker) - credits the referrer's reward ledger
      description: >
        Allowed from pending, held, qualified and rejected. The body is optional and so is `reason`, except
        that approving a rejected referral is an appeal and needs a non-blank `reason` (422 `VALIDATION_FAILED`
        without one); the reason is kept on the row and in the audit trail.
      operationId: approveReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      requestBody:
        required: false
        content:
          application/json:
            schema:
              type: object
              properties:
                reason: { type: string }
      responses:
        '200':
          description: Approved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /referrals/{id}/reject:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Reject a referral (checker)
      operationId: rejectReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Rejected
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  /referrals/{id}/clawback:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Billing & Growth]
      summary: Claw back a released referral reward - debits the ledger
      operationId: clawbackReferral
      x-roles: [staff, admin]  # Slice-13 spec fix S53
      requestBody:
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReasonRequest' }
      responses:
        '200':
          description: Clawed back
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Referral' }
  /me/saved:
    get:
      tags: [Engagement]
      summary: Saved properties
      operationId: listSaved
      description: >
        Newest-saved first. Paged: nothing caps how many listings a user may shortlist. Rows are
        shortlist cards; `available` is false once the listing is sold, rented or otherwise off the
        market. The shell's hearts read `/me/saved/keys` instead.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged saved list
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SavedCard' }
  /me/saved/keys:
    get:
      tags: [Engagement]
      summary: Saved property keys
      operationId: listSavedKeys
      description: The whole shortlist as keys, newest-saved first, unpaged — what the hearts and the count need.
      responses:
        '200':
          description: Saved keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedKey' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/saved/{propId}:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    put:
      tags: [Engagement]
      summary: Save a property
      operationId: savePropertyItem
      responses:
        '204': { description: Saved }
    delete:
      tags: [Engagement]
      summary: Unsave a property
      operationId: unsaveProperty
      responses:
        '204': { description: Removed }
  /me/flatmate-saves:
    get:
      tags: [Engagement]
      summary: Flatmate shortlist
      operationId: listFlatmateSaves
      description: >
        The caller's shortlisted rooms, groups and seeker posts, newest-saved first, as the same
        cards the flatmates feed renders. Heterogeneous like GET /flatmates/feed: discriminate by
        shape. A save whose target has since been deleted drops out of `content` while `total` still
        counts it -- the alternative is a page with holes in it.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged flatmate shortlist
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items:
                          allOf:
                            - oneOf:
                                - $ref: '#/components/schemas/FlatmateSeekerFeed'
                                - $ref: '#/components/schemas/FlatmateRoomFeed'
                                - $ref: '#/components/schemas/FlatmateGroupFeed'
                            - type: object
                              properties:
                                savedAt: { type: string, format: date-time, description: When the caller shortlisted it. }
  /me/flatmate-saves/keys:
    get:
      tags: [Engagement]
      summary: Flatmate shortlist keys
      operationId: listFlatmateSaveKeys
      description: >
        Every key the caller has saved, unpaged -- what the flatmates board needs to draw a bookmark
        filled or empty on any card it happens to show. Unpaged because a partial answer would render
        some of the caller's own saves as unsaved; bounded in practice by one person's taps, and by
        the row being two fields rather than a card.
      responses:
        '200':
          description: The caller's saved keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlatmateSaveKey' }
  /me/flatmate-saves/{kind}/{id}:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [room, group, post] }
        description: Which table `id` points at. In the path because the id alone does not say.
      - name: id
        in: path
        required: true
        description: The saved row's id -- a flatmate room, group or seeker post, per `kind`.
        schema: { type: string, format: uuid }
    put:
      tags: [Engagement]
      summary: Shortlist a flatmate post
      operationId: saveFlatmatePost
      responses:
        '204': { description: Saved }
        '400': { description: '`kind` is not one of room, group, post' }
        '404': { description: No row of that kind has that id }
    delete:
      tags: [Engagement]
      summary: Remove a flatmate post from the shortlist
      operationId: unsaveFlatmatePost
      responses:
        '204': { description: Removed }
        '400': { description: '`kind` is not one of room, group, post' }
  /me/saved-searches:
    get:
      tags: [Engagement]
      summary: Saved searches / alerts
      operationId: listSavedSearches
      responses:
        '200':
          description: Saved searches
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SavedSearch' }
    post:
      tags: [Engagement]
      summary: Create saved search / alert
      operationId: createSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '409': { $ref: '#/components/responses/Conflict' }
  /me/saved-searches/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Edit a saved search
      description: >
        Changes alert preferences and, for a listings alert, its filters. New filters need the
        `query` too, restart the new-match count, and 409 when another of the caller's alerts already
        has them; a flatmates alert's filters are a 400. Turn alerts off with `alertFrequency: off`.
      operationId: updateSavedSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SavedSearchUpdate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SavedSearch' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Engagement]
      summary: Delete saved search
      operationId: deleteSavedSearch
      responses:
        '204': { description: Removed }
  /me/recent-searches:
    get:
      tags: [Engagement]
      summary: Recent searches ("resume your search" rail)
      description: >-
        The signed-in caller's last six searches, newest first. Self-scoped by the JWT; there is no
        account identifier in the path or the body of either operation, so no parameter exists that
        could be changed to read another user's history.


        Distinct from `/me/saved-searches` despite the name. A saved search is a standing instruction
        with an alert frequency that survives until the user deletes it; a recent search is a
        byproduct of navigating, silently evicted six searches later. Nothing here changes alert
        semantics.


        Anonymous visitors are not served: their trail stays in the browser.
      operationId: myRecentSearches
      responses:
        '200':
          description: Recent searches, newest first (at most 6)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentSearch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Engagement]
      summary: Record a search (idempotent by URL)
      description: >-
        Records a search the caller just ran, or moves an existing entry back to the top. `PUT`
        because it is idempotent: the same search recorded twice leaves one entry with a newer
        timestamp.


        Entries are de-duplicated by the **normalized URL**, never by label — the label is what the
        user read, the URL is what the search was, and two different searches can render the same
        chip. Normalization lowercases the path and sorts the query parameters, so `?deal=rent&loc=x`
        and `?loc=x&deal=rent` are one entry. The label of an existing entry is refreshed on a touch.


        `url` must be a relative URL on one of our own search pages (`/listings`, `/flatmates`).
        Absolute, protocol-relative (`//host/...`), backslash-smuggled, over-long and off-site URLs
        are rejected with 422: the stored value is handed back to the browser as a link the account's
        own UI invites the user to click, so a permissive rule here would be a stored redirect.


        `at` is always server-generated and is never accepted from the client — a client that could
        set it could pin an entry to the top of its own rail forever.


        Returns the caller's whole rail after the write, including any eviction past the cap of six.
      operationId: recordRecentSearch
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RecentSearchCreate' }
      responses:
        '200':
          description: The caller's rail after the write, newest first (at most 6)
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/RecentSearch' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /properties/{propId}/reviews:
    parameters: [ { $ref: '#/components/parameters/PropId' } ]
    get:
      tags: [Engagement]
      summary: Reviews for a property/locality
      operationId: listReviews
      security: []
      description: >
        Every published review, newest first (unpaged: the per-target unique index bounds the
        list), with `summary` computed by the database over the same reviews.
      responses:
        '200':
          description: Reviews with the rating summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: Post a review
      operationId: createReview
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
  /reviews/{entityType}/{entityId}:
    parameters:
      - { name: entityType, in: path, required: true, schema: { type: string, enum: [society, locality, owner] } }
      - { name: entityId, in: path, required: true, schema: { type: string }, description: Slug or id of the target entity }
    get:
      tags: [Engagement]
      summary: Reviews for a society / locality / owner
      operationId: listEntityReviews
      security: []
      description: >
        Paged: a popular locality's reviews are bounded only by the city's user base. `summary`
        is computed by the database over every published review, not over the page returned. 404
        when the entity type is not one of the three, or when nothing of that kind exists under
        that identifier.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged reviews with the rating summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ReviewList' }
        '404': { $ref: '#/components/responses/NotFound' }
    post:
      tags: [Engagement]
      summary: Post a review for a society / locality / owner
      operationId: createEntityReview
      description: >
        For `owner`, the author must have a real relationship with that owner: an approved contact
        request or an accepted offer, closed deal or accepted finalization on one of their listings,
        a completed visit to one, or a tenancy with them. Reviewing yourself is refused too. Either
        failure is 422 `review_not_eligible`.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '422':
          description: Owner review refused (`review_not_eligible`) - the author is the owner or has no relationship with them
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /reviews/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    put:
      tags: [Engagement]
      summary: Edit your own review
      operationId: updateReview
      description: >
        Replaces the rating, text, categories and recommend of the caller's own review; the
        `context` badge, target and `createdAt` stay as first posted. 404 when the review is not
        the caller's or staff have rejected it.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ReviewCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Review' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Engagement]
      summary: Delete your own review
      operationId: deleteReview
      description: >
        Removes the caller's own review, after which they may review the target again. 404 when
        the review is not the caller's or staff have rejected it.
      responses:
        '204': { description: Deleted }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /flatmates/feed:
    get:
      tags: [Engagement]
      summary: Flatmates feed (tab-aware, mixed)
      description: >
        One feed per tab. `move-in` returns rooms plus groups that already hold an address;
        `team-up` returns solo seeker posts plus address-less groups. `people` is the seeker half
        of `team-up` on its own and `teams` is the hunting-group half. The list is sorted as one
        list — merging two pre-sorted lists would stack every room above every group.


        A signed-in caller who has saved at least three living-style answers (`/me/living-style`)
        also gets `matches` for the returned rows and a living-style term under `sort=match`. The
        answers are read from the caller's token on the server, never from the request.


        All board facets are filtered, ordered, and paged by the server.
      operationId: listFlatmateFeed
      security: []
      externalDocs: { description: Behaviour, url: docs/flows/consumer/flatmates.md }
      parameters:
        - { name: tab, in: query, schema: { $ref: '#/components/schemas/FlatmateTab' } }
        - { name: view, in: query, deprecated: true, description: Legacy tab alias; resolved to `tab`., schema: { $ref: '#/components/schemas/FlatmateTabLegacy' } }
        - name: q
          in: query
          description: >
            Free text over stored text only — a room's locality, society, note and flat type; a
            group's title, locality and note; a seeker's occupation and note. It is deliberately
            narrower than it reads: occupancy, gender and budget are facets with their own
            parameters, and matching them here as words would answer "girl in baner under 15k"
            twice, differently.


            Seeker names are not searchable because this public endpoint must protect privacy.
          schema: { type: string }
        - { name: locality, in: query, schema: { type: string } }
        - name: minBudget
          in: query
          description: >
            Inclusive per-head floor. Rooms are matched on their best achievable per-person price
            and groups on a stored `per_head`, so the bound means the same thing across kinds.
          schema: { type: integer, format: int64, minimum: 0 }
        - { name: maxBudget, in: query, description: Inclusive per-head ceiling. See `minBudget`., schema: { type: integer, format: int64, minimum: 0 } }
        - name: budget
          in: query
          deprecated: true
          description: >
            Single-value ceiling alias, folded into `maxBudget` so old deep links and saved alerts
            still resolve. Folded rather than kept beside it, because two parameters for one bound
            is how they come to disagree.
          schema: { type: integer, format: int64, minimum: 0 }
        - { name: gender, in: query, schema: { type: string, enum: [male, female] } }
        - { name: sharing, in: query, description: '`team-up` only — seats in the group.', schema: { type: integer, minimum: 1 } }
        - name: attachedBath
          in: query
          description: >
            `move-in` only. Takes the stored value, not the UI's boolean toggle: the column holds
            `attached` or `shared`, and sending `true` would filter on a word no row contains.
          schema: { type: string, enum: [attached, shared] }
        - { name: strictGender, in: query, description: 'With `gender`: drops rows open to any gender (rooms and posts `any`, groups with an `any` policy). Ignored without `gender`.', schema: { type: boolean, default: false } }
        - { name: roomType, in: query, description: '`move-in` rooms only match this type; `people` seekers match it or `any`; `teams` ignores it.', schema: { type: string, enum: [private, shared] } }
        - { name: furnishing, in: query, description: '`move-in` rooms only.', schema: { type: string, enum: [furnished, semi, unfurnished] } }
        - { name: gated, in: query, description: '`move-in` rooms in a gated community only. Any of attachedBath, roomType, furnishing or gated also drops housed groups from `move-in`.', schema: { type: boolean, default: false } }
        - { name: verifiedOnly, in: query, schema: { type: boolean, default: false } }
        - name: vibe
          in: query
          description: >
            Living-style filter on the post author's `/me/living-style` answers: repeated tokens
            `key:answer`, **OR** within a key (`vibe=pets:1&vibe=pets:2`) and **AND** across keys. Keys
            are food, smoking, pets, drinks, visitors and sleep; answer is 0-2. An author who has not
            answered a named key is excluded. Applies only to a signed-in caller with at least 3 answers
            and only for keys the caller has answered too (a stranger never filters on an answer they
            would not be shown);
            other tokens, and every token from a guest, are ignored. A malformed token or an unknown
            key is a 400. Answers are bind parameters.
          schema:
            type: array
            items: { type: string, pattern: '^(food|smoking|pets|drinks|visitors|sleep):[0-2]$' }
        - name: moveInDays
          in: query
          description: >
            Move-in window in days, **cumulative**: `30` also matches a room free today. `0` means
            available now. Matches rooms, seeker posts and hunting groups (`moveInBy`); an undated row always passes. Replaces the old `moveIn` bucket enum, which the browser had to
            translate into a date before it could compare anything. Clamped to 730 — the window is
            spent as `current_date + N`, and an unclamped one overflows the date type.
          schema: { type: integer, minimum: 0, maximum: 730 }
        - name: nearLat
          in: query
          description: >
            Latitude of a proximity centre. Required together with `nearLng` and `nearRadiusKm`;
            any one alone is ignored. Replaces the old `near=lat,lng` pair-in-a-string, which had
            to be parsed on both sides of the seam.
          schema: { type: number, minimum: -90, maximum: 90 }
        - { name: nearLng, in: query, description: Longitude of the search centre. See `nearLat`., schema: { type: number, minimum: -180, maximum: 180 } }
        - name: nearRadiusKm
          in: query
          description: >
            Radius in kilometres, **clamped to [0.5, 50]**. The ceiling is the reason given on
            `searchProperties` — the radius sizes a bounding box, and an unbounded one is a
            full-table scan available on request to an anonymous caller. The floor exists because a
            group's coordinates are withheld from its feed payload: an exact distance test with an
            arbitrarily small radius hands them back by bisection.
          schema: { type: number, minimum: 0, maximum: 50 }
        - { name: sort, in: query, schema: { type: string, enum: [verified, match, budget-low, budget-high, newest], default: verified } }
        - name: meLocalities
          in: query
          description: >
            `sort=match` only — the caller's own post's preferred localities. Compatibility is
            scored in SQL rather than over a downloaded page, so "best match" can order a result
            set larger than the browser holds. Ignored under every other sort. Capped at 12: each
            entry adds a predicate and a bind to both halves of the union.
          schema: { type: array, items: { type: string }, maxItems: 12 }
        - { name: meBudget, in: query, description: '`sort=match` only — the caller''s own budget.', schema: { type: integer, format: int64, minimum: 0 } }
        - { name: meGender, in: query, description: '`sort=match` only — the caller''s own gender.', schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Feed
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/SearchEnvelope'
                  - type: object
                    properties:
                      tabElements:
                        type: object
                        description: Every tab's total under the same facets, for the tab labels.
                        properties:
                          move-in: { type: integer, format: int64 }
                          people: { type: integer, format: int64 }
                          teams: { type: integer, format: int64 }
                      matches:
                        type: object
                        description: >
                          Living-style match percentage (0-100) for rows on this page, keyed
                          `room:<id>`, `group:<id>` or `post:<id>`. Only rows whose author shares
                          at least three answers with the caller appear; the caller's own rows and
                          every row for a guest or a caller without answers are omitted.
                        additionalProperties: { type: integer, minimum: 0, maximum: 100 }
                      content:
                        type: array
                        items:
                          oneOf:
                            - $ref: '#/components/schemas/FlatmateSeekerFeed'
                            - $ref: '#/components/schemas/FlatmateRoomFeed'
                            - $ref: '#/components/schemas/FlatmateGroupFeed'
  /flatmates/posts:
    post:
      tags: [Engagement]
      summary: Create a flatmate seeker post
      description: Requires only an L1 signed-in account (ADR-019). One live post per identity.
      operationId: createFlatmateSeekerPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateSeekerPostCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateSeekerPost' }
        '409': { description: A live post already exists for this identity (`already_live`) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/posts/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Engagement]
      summary: One seeker post
      operationId: getFlatmatePost
      security: []
      responses:
        '200':
          description: The post; `owned` when the caller wrote it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Engagement]
      summary: Update my flatmate seeker post
      operationId: updateFlatmateSeekerPost
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateSeekerPostCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateSeekerPost' }
        '403': { $ref: '#/components/responses/Forbidden' }
    delete:
      tags: [Engagement]
      summary: Remove my flatmate seeker post
      description: Backs both "Delete" and "Mark filled".
      operationId: deleteFlatmateSeekerPost
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/posts/{id}/interest:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Express interest in a flatmate seeker post
      operationId: flatmatePostInterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201': { description: Sent }
        '403': { description: The target opted into verified-only contact (`verification_required`) }
        '409': { description: Interest already expressed (`already_interested`) }
  /me/flatmate-posts:
    get:
      tags: [Engagement]
      summary: My own flatmate ad
      operationId: listMyFlatmatePosts
      description: >
        The ad the caller wrote, as its author sees it -- the seeker counterpart of
        `listMyFlatmateRooms`, and for the same reason that route gives: this is not the public feed
        narrowed. `listFlatmateSeekerPosts` is hard-floored to approved rows and publishes no
        contact, so an author whose post is still in moderation cannot find it there, and could not
        recognise it if they could -- the feed masks `mobile` to null on every row.


        Without this route a client has no way to answer "have I posted?", which is a question the
        product asks on every render of the board: the author gets a banner instead of a card, and
        their own ad is excluded from the results so they cannot express interest in themselves.
        Both behaviours were unreachable over HTTP until this existed.


        Paged for consistency with its two `/me/flatmate-*` siblings, though **the envelope can only
        ever hold one row**: `createFlatmateSeekerPost` refuses a second live ad (`already_live`) and
        a partial unique index enforces it. Taken-down ads are excluded -- unlike the room route,
        which shows withdrawn rooms, because the question this answers is "is one of mine live right
        now" and an archived ad would answer it wrongly.


        The row carries the caller's own `mobile` unmasked. That is the same decision
        `createFlatmateSeekerPost` already returns and not a new one: a seeker post carries its
        author's number only ever back to that author.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: The caller's live ad, or an empty page when they have not posted
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateSeekerPost' }
  /me/flatmate-posts/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    get:
      tags: [Engagement]
      summary: One of my flatmate ads
      operationId: getMyFlatmatePost
      description: >
        The caller's own live ad by id, for the edit form, with their own `mobile` unmasked. Another
        author's id, a taken-down ad and an unknown id all answer 404, so an id reveals nothing about
        who owns it.
      responses:
        '200':
          description: The ad
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateSeekerPost' }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/flatmate-rooms:
    get:
      tags: [Engagement]
      summary: Rooms I am hosting
      operationId: listMyFlatmateRooms
      description: >
        The host's own rooms, newest first -- the counterpart of the public feed, and the list the
        host dashboard is built from.


        Under `/me` rather than as a filter on `/flatmates/rooms`, because it is not the same
        resource narrowed: the public feed shows live rooms, and a host needs to see the ones they
        have withdrawn or filled as well. A `hostedByMe=true` parameter would have quietly changed
        what the feed's other filters mean.


        Paged, because nothing caps how many rooms one host may list.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: The caller's rooms, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRoomCard' }
  /me/owner-homes:
    get:
      tags: [Engagement]
      summary: Flats I own through a confirmed flatmate room
      operationId: listMyOwnerHomes
      description: >
        One item per private home the caller got by confirming a tenant's room (a managed record with
        a source address), newest first, each with the live rooms tenants have posted in that flat.
        A room appears only while the caller's number is its owner contact, the owner has confirmed it
        and it is not withdrawn. Tenants are first-name only; no phone number or surname.
      responses:
        '200':
          description: The caller's homes
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/OwnerHome' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/owner-homes/{managedId}/prefill:
    parameters:
      - name: managedId
        in: path
        required: true
        schema: { type: string }
    get:
      tags: [Engagement]
      summary: The listing wizard's starting answers for one of my homes
      operationId: getMyOwnerHomePrefill
      description: >
        Taken from the room that created the home, even if that room has since been withdrawn, and from
        the record's own facts (locality, society, bhk, furnishing) once the room is gone; the rest is
        null. 404 (never 403) for a record that is not the caller's or is not a flatmate home.
      responses:
        '200':
          description: Wizard answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerHomePrefill' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
  /flatmates/rooms/{id}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
    get:
      tags: [Engagement]
      summary: One room
      operationId: getFlatmateRoom
      security: []
      responses:
        '200':
          description: The room; `owned` when the caller hosts it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Engagement]
      summary: Withdraw a room I am hosting
      operationId: withdrawFlatmateRoom
      description: >
        The host's own exit. 204 and no body, unlike `archiveListing` next door -- a withdrawn room
        leaves the host's dashboard entirely rather than reappearing on it in a different state, so
        there is nothing for the client to redraw.


        Only the host may do this, and a room belonging to somebody else is a `404` rather than a
        `403` for the same reason it is on listings: an id's existence is not something this route
        confirms to a caller with no relationship to it.


        Seats already taken and interest already expressed keep their references; what changes is
        that the room stops being offered.
      responses:
        '204':
          description: Withdrawn
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Engagement]
      summary: Edit a room I am hosting
      operationId: updateFlatmateRoom
      description: >
        The whole room, not a sparse patch -- the same body `createFlatmateRoom` takes. A partial
        body would make "absent" and "cleared" the same wire value for `note`, `deposit` and
        `availableFrom`, and a host clearing a note is a thing that has to be expressible.


        `PATCH` rather than `PUT` because the server still owns the fields the body never carries:
        the verification tier is re-derived from what the host can prove, the address fingerprint is
        recomputed, and the moderation state is re-decided.


        **An edit re-enters the trust ladder rather than always returning to `pending`.** A post
        whose visibility was granted by a moderator (`identity` tier) leaves the board and waits to
        be read again. A post that publishes on an approved title deed (`owner`) or a declared
        agreement (`tenant`) stays live, because no moderator approved its copy in the first place
        and there is nothing for the edit to invalidate. An edit that drops the property or retracts
        the agreement claim lowers the tier, and that lands it in the queue on its own.


        Rooms created by splitting a flat are refused with `409 (split_room)`: their address belongs
        to the parent listing, so the listing is what to edit.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateRoomCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/rooms:
    post:
      tags: [Engagement]
      summary: Post a spare room
      description: L1 signed-in. Runs the anti-broker guardrails; a hard block returns `409` with the eligibility result.
      operationId: createFlatmateRoom
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateRoomCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '409':
          description: Blocked by the host-eligibility guardrails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/rooms/{id}/seats:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Reopen or close a room seat
      description: Seat-model rooms only. The verification tier is preserved, so a re-list needs no re-verification.
      operationId: setRoomSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatsOpen]
              properties:
                seatsOpen: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '409': { description: This room has no seat model (`not_seat_based`) }
  /flatmates/rooms/{id}/badge-request:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Request the Verified property badge on a room already posted
      description: >
        Tenant-hosted rooms only. Files a rent agreement or an electricity bill naming the flat owner, from
        the caller's personal document vault (category `Rent agreement` or `Electricity Bill`), for Ops
        review without touching the room's moderation status or any other field. The caller's ID check
        must be verified or in review (409 `identity_required` when never submitted); approval needs it
        verified. Idempotent: repeating it for a pending or approved review
        changes nothing, and a rejected review goes back to pending. Approval still needs the flat owner's
        OTP consent.
      operationId: requestRoomBadge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreementDoc]
              properties:
                agreementDoc:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid, description: A personal-vault Rent agreement or Electricity Bill document the caller owns. }
                    validFrom: { type: string, format: date, description: 'Agreement start as the host reads it. Required for a rent agreement.' }
                    validTill: { type: string, format: date, description: 'Agreement end, after validFrom and today. Required for a rent agreement; the reviewer confirms it.' }
      responses:
        '200':
          description: The room with its review state. Host-only evidence and review details are available on the owned detail read.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'Room is split (split_room), not tenant-hosted (not_tenant_hosted) or the caller never submitted an ID check (identity_required).' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}/badge-request:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Request the Verified property badge on a flat-holding group
      description: >
        The host of a tenant-hosted group that already holds its flat. Same body, evidence rules and
        idempotence as the room request. A group still hunting is 409 `hunting_group`; an owner-hosted one
        is 409 `not_tenant_hosted`; a host who never submitted an ID check is 409 `identity_required`.
      operationId: requestGroupBadge
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [agreementDoc]
              properties:
                agreementDoc:
                  type: object
                  required: [id]
                  properties:
                    id: { type: string, format: uuid, description: A personal-vault Rent agreement or Electricity Bill document the caller owns. }
                    validFrom: { type: string, format: date, description: 'Agreement start as the host reads it. Required for a rent agreement.' }
                    validTill: { type: string, format: date, description: 'Agreement end, after validFrom and today. Required for a rent agreement; the reviewer confirms it.' }
      responses:
        '200':
          description: The group with its review state.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: 'hunting_group, not_tenant_hosted or identity_required.' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/rooms/{id}/occupants:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Record how many people live in a room
      description: >
        Owner-split rooms only. The server clamps to `min(3, maxOccupants - siblings)` and echoes the
        clamped value, so a society cap can never be exceeded by editing one room.
      operationId: setRoomOccupants
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [occupants]
              properties:
                occupants: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated (clamped)
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRoom' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/groups:
    post:
      tags: [Engagement]
      summary: Create a flatmate group
      description: L1 signed-in. The verification tier is derived server-side from role + proof; the client can never self-assign a host badge.
      operationId: createFlatmateGroup
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateGroupCreate' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '409':
          description: Blocked by the host-eligibility guardrails
          content:
            application/json:
              schema: { $ref: '#/components/schemas/HostEligibility' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    get:
      tags: [Engagement]
      summary: One group
      operationId: getFlatmateGroup
      security: []
      responses:
        '200':
          description: The group; `owned` when the caller hosts it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateDetail' }
        '404': { $ref: '#/components/responses/NotFound' }
    delete:
      tags: [Engagement]
      summary: Remove a group I created
      operationId: deleteFlatmateGroup
      responses:
        '204': { description: Removed }
        '403': { $ref: '#/components/responses/Forbidden' }
    patch:
      tags: [Engagement]
      summary: Edit a group I created
      operationId: updateFlatmateGroup
      description: >
        The whole group, not a sparse patch -- the same body `createFlatmateGroup` takes, for the
        same reason the room edit takes a whole room: a partial body cannot distinguish an absent
        field from a cleared one.


        **`seatsTotal` moves here and only here.** `setGroupSeats` next door adjusts how many of the
        existing seats are open, which is the one-tap "a seat just went". This is the flat itself
        getting bigger or smaller. It cannot drop below the number of people already in the group --
        that is not an edit, it is an eviction, and no route means that.


        The verification tier, address fingerprint and moderation state are re-derived rather than
        accepted, and an edit re-enters the trust ladder rather than always returning to `pending`.
        See `updateFlatmateRoom` for what that means.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateGroupCreate' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}/seats:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Add or remove an open group seat
      description: The group grows or shrinks with its open seats, so seatsTotal and perHead move too and a public group is queued for a seats re-check. seatsTotal may not exceed 12 (400 otherwise).
      operationId: setGroupSeats
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [seatsOpen]
              properties:
                seatsOpen: { type: integer, minimum: 0 }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateGroup' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /flatmates/owner-consent:
    post:
      tags: [Engagement]
      summary: Request or confirm the flat owner's consent before the group exists
      description: >
        Taken when the group form asks for consent — before there is a group to attach it to.
        Two calls: once
        without `otp` to send the owner a code, again with it to record the consent. The row is
        keyed on (owner mobile, tenant, flat), so the recording call must name the flat: a group
        sends `title` and `locality`, a room sends `society` and `locality`. Without them the
        consent is refused rather than stored unscoped. `POST /flatmates/groups` and `POST
        /flatmates/rooms` read the row back at submit time rather than treating the request's
        `ownerConsent` declaration as verified consent — and they read it under the fingerprint the
        post is filed at, so a consent taken against an address the host then edits no longer
        matches.
      operationId: requestStandaloneOwnerConsent
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ownerMobile]
              properties:
                ownerMobile: { $ref: '#/components/schemas/Mobile' }
                otp: { type: string, minLength: 6, maxLength: 6 }
                title: { type: string, maxLength: 120, description: The group's title, as typed. Send with `otp` from the group form. }
                society: { type: string, maxLength: 120, description: The room's society. Send with `otp` from the room form. }
                locality: { type: string, maxLength: 80, description: The post's locality. Send with `otp`. }
      responses:
        '200':
          description: OTP sent, or consent recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ConsentResult' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401':
          description: >
            The `otp` was wrong, expired, or there is no code outstanding for that mobile. Only a
            wrong `otp` carries `attemptsRemaining`; its absence means the code is gone and the
            owner must be sent a new one.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
              example: { error: unauthorized, message: Incorrect OTP, status: 401, attemptsRemaining: 2 }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /flatmates/owner-notice:
    get:
      tags: [Engagement]
      summary: Read the WhatsApp notice a flat owner was sent about a tenant's room
      description: >
        Public but token-scoped. The `X-Owner-Notice-Token` header IS the authorisation: the owner has
        no account and opens the link from WhatsApp (`/owner-confirm#<token>`, a fragment, so the
        token never reaches a server log). Returns the tenant's first name and the room only, never
        either phone number. A missing, unknown or expired token, a room that was archived, or a
        room whose address or owner number changed since the notice, is the same 404.
      security: []
      operationId: getFlatmateOwnerNotice
      parameters:
        - name: X-Owner-Notice-Token
          in: header
          required: true
          schema: { type: string }
          description: Bearer credential for one notice. Do not log, store or forward.
      responses:
        '200':
          description: The notice
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateOwnerNoticeView' }
        '404':
          description: This link is no longer valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /flatmates/owner-notice/answer:
    post:
      tags: [Engagement]
      summary: The flat owner agrees or declines a tenant's room
      description: >
        Public but token-scoped, as `GET /flatmates/owner-notice`. `agree` records the owner's
        consent for that tenant and flat (the room's `ownerConsent` becomes true, as after an OTP
        consent), gives the owner an account when their number has none (unverified, until they sign
        in) and saves the flat as a private home on it; that never fails the answer. `decline` takes
        the room out of public view and puts it back in the moderation queue, flagged with the reason
        "Owner said no on WhatsApp", and creates nothing. The tenant is told in the app either way.
        The same answer twice is a 200 no-op; the opposite answer after one is recorded is a 409.
      security: []
      operationId: answerFlatmateOwnerNotice
      parameters:
        - name: X-Owner-Notice-Token
          in: header
          required: true
          schema: { type: string }
          description: Bearer credential for one notice. Do not log, store or forward.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [answer]
              properties:
                answer: { type: string, enum: [agree, decline] }
      responses:
        '200':
          description: The notice with its recorded status
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateOwnerNoticeView' }
        '404':
          description: This link is no longer valid.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '409':
          description: You've already answered.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422': { $ref: '#/components/responses/ValidationError' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /flatmates/rooms/{id}/interest:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Enquire about a room
      description: Carries the share intent, so the host learns how many people are moving in in the first line.
      operationId: flatmateRoomInterest
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201': { description: Sent }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { description: Not a seeker role, or the caller hosts this room }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Interest already expressed (`already_interested`), or no seat or space is left (`room_full`)" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}/join:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Ask to join a group
      description: Always creates a pending host-inbox request, whatever the group's `policy`; the requester becomes a member only when the host accepts it (`PATCH /me/flatmate-requests/{id}`).
      operationId: flatmateGroupJoin
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/FlatmateInterestCreate' }
      responses:
        '201':
          description: Requested
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRequest' }
        '409': { description: Group is full (`group_full`), already requested (`already_interested`), or the caller is already in or waiting on `settings.flatmates.maxGroupsPerPerson` groups (`group_limit`, 2 by default) }
        '422': { $ref: '#/components/responses/ValidationError' }
  /flatmates/groups/{id}/membership:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    delete:
      tags: [Engagement]
      summary: Leave a group I joined
      operationId: leaveFlatmateGroup
      description: >
        Removes the caller from the group, opens their seat again and tells the host. The caller's
        accepted request is deleted with it, so they may ask to join again later. The host cannot
        leave their own group (`409`); they delete it instead.
      responses:
        '204':
          description: Left
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /flatmates/groups/{id}/members/{memberId}:
    parameters:
      - { $ref: '#/components/parameters/GenericId' }
      - { name: memberId, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Engagement]
      summary: Remove a member from my group
      operationId: removeFlatmateGroupMember
      description: >
        Host only; anyone else gets `404`. The seat opens again, the removed person is told, and
        their request turns `declined`, so they cannot ask to join again. The host cannot remove
        themselves (`409`).
      responses:
        '204':
          description: Removed
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /flatmates/groups/{id}/apply:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    post:
      tags: [Engagement]
      summary: Apply to a listing as a whole group
      description: >
        The group's host commits the group to one flat. Distinct from `flatmateGroupJoin`, which is a
        stranger asking to join the group: here the group already exists and moves as a unit, so the
        person who answers is the listing's owner, not the host.


        The path carries the group and the body the listing, because the group is what the caller
        must own. Applying twice to the same listing is `409 already_applied` rather than a second
        row — an owner's inbox is a queue of decisions, and the same group cannot be waiting on the
        same flat twice.
      operationId: applyGroupToListing
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [listingId]
              properties:
                listingId: { type: string, description: The flat the group wants. Required — there is no sensible listing to default to. }
      responses:
        '201':
          description: Applied
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupApplication' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: This group has already applied to this listing (`already_applied`), the group withdrew an application here less than 7 days ago (`recently_withdrawn`; after that it is reopened as pending), or the listing already has an accepted group and takes no new applications }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/flatmate-groups:
    get:
      tags: [Engagement]
      summary: My flatmate groups
      operationId: listMyFlatmateGroups
      description: >
        Groups the caller created, newest first, paged, **including their moderation state** — which
        is the difference from the public `GET /flatmates/groups`. A host has to be able to see that
        their own group is pending or rejected; the public feed deliberately shows neither, so
        without this route a host's group would simply vanish from their view with no explanation.


        Caller-scoped, so no role beyond being signed in. No `sort`: the order is fixed server-side.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged groups
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateGroupCard' }
  /me/group-applications:
    get:
      tags: [Engagement]
      summary: Group applications on my listings (owner inbox)
      operationId: listMyGroupApplications
      description: >
        The mirror of `applyGroupToListing`: applications addressed to flats the caller owns, newest
        first, paged. Scoped by listing ownership rather than by who applied, so an owner sees every
        group waiting on them and never anybody else's queue.


        Separate from `listGroupApplications`, which is the admin moderation view over all of them.
        The two share a schema and no route, so no request is ambiguous about which axis it reads.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged applications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/GroupApplication' }
  /me/group-applications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Accept or decline a group's application to my listing
      operationId: decideMyGroupApplication
      description: >
        The owner's verdict, and **only** the owner's: `status` here is a different column from the
        `modStatus` that `decideGroupApplication` writes, so an admin can never answer on an owner's
        behalf and moderating a group can never look like accepting it.


        Accepting closes the listing to groups: every other pending application on it is declined (and
        its group notified) and a further acceptance is a 409. A moderator removing the accepted
        application lifts the block.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [status]
              properties:
                status: { type: string, enum: [accepted, declined] }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/GroupApplication' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Already answered, another group on this listing is already accepted, the application was taken down by moderation, or (on accept) the group is not live" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/flatmate-requests:
    get:
      tags: [Engagement]
      summary: My incoming flatmate requests (host inbox)
      operationId: listMyFlatmateRequests
      description: >
        Newest first, host-scoped, paged. The host writes none of these rows - each is a stranger
        answering their ad - so the inbox grows with the ad's reach. `status` filters before the
        page, so `totalElements` counts the matching requests rather than all of them. No `sort`
        parameter: the order is fixed server-side.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, declined] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged requests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRequest' }
  /me/flatmate-requests/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    patch:
      tags: [Engagement]
      summary: Accept or decline an incoming flatmate request
      operationId: decideFlatmateRequest
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [decision]
              properties:
                decision: { type: string, enum: [accepted, declined] }
      responses:
        '200':
          description: Decided
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { description: "Accepting would over-fill the ad (`group_full`, `room_full`), the request is already answered (`already_decided`), the requester is already in `settings.flatmates.maxGroupsPerPerson` groups (`group_limit`), or the host's ad is not live" }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/flatmate-interests:
    get:
      tags: [Engagement]
      summary: Flatmate interests I have sent (seeker outbox)
      operationId: listMyFlatmateInterests
      description: >
        The mirror of `listMyFlatmateRequests`: the same table read from the other end, so the same
        row shape, the same fixed newest-first order and the same `status` filter. That inbox lists
        what strangers sent to this account's ads; this lists what this account sent to theirs.


        The button state on the flatmates board comes from the server rather than `localStorage`, so an ask
        made on a phone is visible on a laptop and clearing site data does not hide it.
        This is the fact read from the place that actually holds it.


        **Nothing travels back toward the host.** `requesterMobile` on these rows is the caller's own
        number, because the caller is the requester -- the host's number is not in this payload and
        is not in the inbox's either. Contact in this feature is one-directional by design: the host
        decides, and accepting is what hands over a number.


        Not filtered to targets that are still live. A room taken down after the ask is still
        something this person did, and hiding the row would only make it look like the ask failed.
      parameters:
        - { name: status, in: query, schema: { type: string, enum: [pending, accepted, declined] } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged interests
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/FlatmateRequest' }
  /me/flatmate-interests/keys:
    get:
      tags: [Engagement]
      summary: Flatmate interest keys
      operationId: listMyFlatmateInterestKeys
      description: >
        Every ask the caller has sent, unpaged and unhydrated -- what the flatmates board and a flatmate
        detail page need to draw the interest button. Same bound as `listFlatmateSaveKeys`: one
        person's rate-limited asks, four fields each.
      responses:
        '200':
          description: The caller's interest keys
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/FlatmateInterestKey' }
  /flatmates/{kind}/{id}/living-style:
    parameters:
      - name: kind
        in: path
        required: true
        schema: { type: string, enum: [room, group, post] }
      - { $ref: '#/components/parameters/GenericId' }
    get:
      tags: [Engagement]
      summary: A listing author's living-style answers and the caller's match
      description: >
        Signed-in only, so the answers never reach the anonymous feed. Visible under the same rule
        as the detail endpoints: a public listing, or one the caller authors; anything else is
        404. **Reciprocal:** a caller who is not the author gets only the author's answers for keys
        the caller has also answered, and `answers: {}` with a null `match` while the caller has
        fewer than three answers. `match` is also null when the shared answers number fewer than
        three, and for the author's own listing, which returns their full answers. Per-caller
        rate limited (429).
      operationId: getFlatmateLivingStyle
      responses:
        '200':
          description: Answers and match
          content:
            application/json:
              schema: { $ref: '#/components/schemas/FlatmateLivingStyle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/NotFound' }
        '429': { $ref: '#/components/responses/TooManyRequests' }
  /flatmates/{kind}/{id}/interest:
    parameters:
      - name: kind
        in: path
        required: true
        description: Which board the target lives on. `flatmate` is a seeker post, and is spelled that way because it is the literal stored in the column.
        schema: { type: string, enum: [flatmate, room, group] }
      - { $ref: '#/components/parameters/GenericId' }
    delete:
      tags: [Engagement]
      summary: Withdraw an interest I sent
      operationId: withdrawFlatmateInterest
      description: >
        **Keyed by the target, not by the request id.** At the moment the button is pressed the
        client is holding the card -- a kind and a target id -- and not the id of the row it created,
        possibly in another session. Deleting by request id would force a `listMyFlatmateInterests`
        fetch purely to translate identifiers on every press. The row is unique on
        `(kind, target_id, requester_id)` and the requester is the token, so the triple is exactly as
        precise as an id.


        **The row is deleted, not marked withdrawn.** That same unique index means a retained row
        would lock the requester out of ever asking again, turning an undo into a lockout.


        **Only while pending.** Once the host has answered, they have acted on it -- and on a group
        they may have given up a seat. That is a `409`, not a `403`: the row is the caller's, it is
        its state that refuses.


        **The rate-limit budget is not refunded.** The notification already went out; refunding it
        would make withdrawal the cheapest way to buy another send.
      responses:
        '204':
          description: Withdrawn
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
  /flatmates/{kind}/{id}/renew:
    parameters:
      - { name: kind, in: path, required: true, schema: { type: string, enum: [room, group, post] } }
      - { $ref: '#/components/parameters/GenericId' }
    post:
      tags: [Engagement]
      summary: Renew my flatmate post for another 30 days
      operationId: renewFlatmatePost
      description: >
        Every room, group and seeker post leaves the public board 30 days after it was last
        published, edited or moderated (`modStatus: expired`), with a reminder 3 days before.
        Renewing restarts the clock and restores the state it expired from without a fresh review;
        an edit does the same but goes through the usual re-moderation. Renewing a post that has
        not expired just restarts its clock.
      responses:
        '204':
          description: Renewed
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /notifications:
    get:
      tags: [Engagement]
      summary: My notifications
      operationId: listNotifications
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Paged notifications
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/Notification' }
  /notifications/unread-count:
    get:
      tags: [Engagement]
      summary: My unread notification count
      operationId: notificationUnreadCount
      description: >
        Counts unread notifications due for delivery now. Deferred quiet-hours rows are excluded until
        their `deliver_after` has passed.
      responses:
        '200':
          description: Unread count
          content:
            application/json:
              schema:
                type: object
                required: [count]
                properties:
                  count: { type: integer, format: int64, example: 3 }
  /notifications/read:
    post:
      tags: [Engagement]
      summary: Mark notifications read (all or by ids)
      operationId: markNotificationsRead
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                ids:
                  type: array
                  items: { type: string }
      responses:
        '204': { description: Marked }
  /notifications/dismiss:
    post:
      tags: [Engagement]
      summary: Dismiss several notifications at once
      description: >
        One call for a collapsed inbox row. Another user's ids are skipped rather than 404, as on
        mark-read, so the batch cannot probe the id space.
      operationId: dismissNotifications
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [ids]
              properties:
                ids:
                  type: array
                  minItems: 1
                  maxItems: 100
                  items: { type: string }
      responses:
        '204': { description: Dismissed }
        '400': { $ref: '#/components/responses/BadRequest' }
  /notifications/{id}:
    parameters: [ { $ref: '#/components/parameters/GenericId' } ]
    delete:
      tags: [Engagement]
      summary: Dismiss a notification
      description: >
        Removes one notification from the caller's inbox. Server-side and permanent, so a dismissal
        syncs across the user's devices (replacing the client-side tombstone the http provider kept
        while this endpoint did not exist). User-scoped: another user's id is 404, never 403.
      operationId: dismissNotification
      responses:
        '204': { description: Dismissed }
        '404': { $ref: '#/components/responses/NotFound' }
  /me/living-style:
    get:
      tags: [Engagement]
      summary: My living-style answers
      description: Always 200; a user who has answered nothing gets an empty `answers` and a null `updatedAt`.
      operationId: getLivingStyle
      responses:
        '200':
          description: Answers
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivingStyle' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    put:
      tags: [Engagement]
      summary: Replace my living-style answers
      description: >
        Replaces the whole set; any subset of the twelve keys may be answered. An unknown key, or a
        value that is not an integer 0-2, is a 400. An empty `answers` deletes the stored row.
      operationId: updateLivingStyle
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LivingStyleUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LivingStyle' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '401': { $ref: '#/components/responses/Unauthorized' }
  /me/notification-preferences:
    get:
      tags: [Engagement]
      summary: My notification & communication preferences
      description: >
        Always 200. A user who has never saved settings has preferences -- they are the defaults --
        so this never 404s, and no client has to carry its own copy of those defaults to render the
        settings screen.
      operationId: getNotificationPreferences
      responses:
        '200':
          description: Preferences
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
    put:
      tags: [Engagement]
      summary: Save notification & communication preferences
      description: >
        A whole-document write: the settings screen shows all six controls at once, so the client
        sends what it is looking at and every field is required. An omitted field is a 422 naming
        it, rather than a silent "keep" (which would make this a PATCH) or a silent "reset" (which
        would switch a user's match alerts back on because a serialiser dropped a false).
      operationId: updateNotificationPreferences
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/NotificationPreferencesUpdate' }
      responses:
        '200':
          description: Saved
          content:
            application/json:
              schema: { $ref: '#/components/schemas/NotificationPreferences' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /me/push-subscriptions:
    post:
      tags: [Engagement]
      summary: Register this browser for push notifications
      operationId: upsertPushSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/PushSubscriptionCreate' }
      responses:
        '204': { description: Registered }
        '409': { description: The endpoint is registered to another account with different keys }
        '422': { $ref: '#/components/responses/ValidationError' }
    delete:
      tags: [Engagement]
