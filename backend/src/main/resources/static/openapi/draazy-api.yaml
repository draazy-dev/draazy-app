    AdminKpis:
      type: object
      description: >
        The ops scorecard. Counts exclude soft-deleted rows. `pendingModeration` is listings
        awaiting a moderation decision (`status=pending`); the abuse-report queue is counted
        separately as `openReports` and is deliberately not folded in - the two queues are worked
        by different people against different SLAs, so one combined number would be a figure
        neither desk could act on.
      properties:
        totalListings: { type: integer }
        activeListings: { type: integer }
        pendingModeration: { type: integer }
        openReports:
          type: integer
          description: >
            D68. Abuse reports still awaiting a decision (`open` or `reviewing`). A claimed but
            undecided report still counts as outstanding work, because it is.
        totalUsers: { type: integer }
        newUsers7d: { type: integer }
        dealsClosed30d: { type: integer }
        revenue30d:
          # 3.1 spelling of a nullable $ref: `nullable: true` beside an `allOf` was the 3.0 idiom
          # and says nothing in 3.1, and a type array cannot express it — the null has to be a branch.
          anyOf:
            - { $ref: '#/components/schemas/Money' }
            - { type: 'null' }
          # Null for staff, populated for admin: this endpoint is [staff, admin] but /admin/finance
          # is [admin] only, so serving staff a revenue figure here contradicts the next operation.
          description: Draazy's net fees over the last 30 days (invoices less credit notes, pass-through excluded). **Null for staff** - admin only.
    AdminAnalyticsTraffic:
      type: object
      description: Arrivals for one window, from Draazy's own page-view table.
      properties:
        days: { type: integer, description: 'The window actually used, echoed so a clamped request is visible' }
        from: { type: string, format: date }
        to: { type: string, format: date }
        series:
          type: array
          description: One row per day.
          items:
            type: object
            properties:
              date: { type: string, format: date }
              sessions: { type: integer }
              pageviews: { type: integer }
              signups: { type: integer }
        sources:
          type: array
          description: >
            Channels derived from the referrer host. `direct` is honest about being a residue --
            it holds app switches, pasted links and stripped referrers as well as typed URLs.
          items:
            type: object
            properties:
              channel: { type: string, example: direct }
              sessions: { type: integer }
              sharePct: { type: number }
        devices:
          type: object
          description: Session counts by device bucket. Three buckets, because that is all the beacon reports.
          properties:
            mobile: { type: integer }
            tablet: { type: integer }
            desktop: { type: integer }
        identity:
          type: array
          description: Anonymous against signed-in sessions by week -- the split the funnel turns on.
          items:
            type: object
            properties:
              week: { type: string, format: date, description: Week-starting date }
              anonymous: { type: integer }
              signedIn: { type: integer }
    AdminAnalyticsEngagement:
      type: object
      description: How deep the visits went, for one window.
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        weeks:
          type: array
          items:
            type: object
            properties:
              week: { type: string, format: date }
              sessions: { type: integer }
              avgSessionMinutes:
                type: [number, 'null']
                description: >
                  **Null, never zero, when there were too few sessions to average honestly.** A
                  zero here would draw a line reading "engagement collapsed" for a week in which
                  nobody visited, and somebody would act on it.
              bounceRatePct:
                type: [number, 'null']
                description: Null on the same terms as `avgSessionMinutes`, and for the same reason.
        topPages:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              views: { type: integer }
              anonViews:
                type: integer
                description: >
                  Beside the total rather than folded into it: a page only signed-in users reach
                  and a page anonymous users bounce off are different problems with the same count.
    AdminAnalyticsFunnel:
      type: object
      description: Weekly marketplace stage counts for one window.
      required: [days, from, to, weeks]
      properties:
        days: { type: integer }
        from: { type: string, format: date, description: First IST day included }
        to: { type: string, format: date, description: First IST day excluded }
        weeks:
          type: array
          items:
            type: object
            required: [week, posted, approved, contacts, visits, deals]
            properties:
              week: { type: string, format: date, description: The Monday the week starts on }
              posted: { type: integer, format: int64 }
              approved: { type: integer, format: int64 }
              contacts: { type: integer, format: int64, description: Contact requests sent }
              visits: { type: integer, format: int64, description: Visits booked }
              deals: { type: integer, format: int64, description: Deals closed }
    AdminAnalyticsFlatmates:
      type: object
      description: Flatmate throughput per IST week, host replies over the window, and live supply against demand by locality.
      required: [days, from, to, weeks, replies, localities]
      properties:
        days: { type: integer }
        from: { type: string, format: date, description: First IST day included }
        to: { type: string, format: date, description: First IST day excluded }
        weeks:
          type: array
          items:
            type: object
            required: [week, rooms, groups, seekers, requests, matches, replyRatePct]
            properties:
              week: { type: string, format: date, description: The Monday the week starts on }
              rooms: { type: integer, format: int64, description: Rooms posted, including ones later withdrawn or rejected }
              groups: { type: integer, format: int64 }
              seekers: { type: integer, format: int64, description: Seeker posts made }
              requests: { type: integer, format: int64, description: Requests sent to a host; open-group joins are not requests }
              matches: { type: integer, format: int64, description: Requests and group applications accepted that week }
              replyRatePct: { type: [integer, 'null'], description: Requests sent that week answered within 48h; null when none is old enough to judge }
        replies:
          type: object
          required: [sent, replyRatePct, acceptRatePct, medianReplyHours, unansweredNow]
          properties:
            sent: { type: integer, format: int64 }
            replyRatePct: { type: [integer, 'null'], description: 'Of requests sent in the window that are answered or older than 48h, the share answered within 48h.' }
            acceptRatePct: { type: [integer, 'null'], description: Of answered requests, the share accepted. }
            medianReplyHours: { type: [number, 'null'] }
            unansweredNow: { type: integer, format: int64, description: Requests pending past 48h right now; unwindowed. }
        localities:
          type: array
          description: Live now and unwindowed, largest demand-over-supply gap first, at most 20.
          items:
            type: object
            required: [locality, supply, demand]
            properties:
              locality: { type: string }
              supply: { type: integer, format: int64, description: Live rooms and non-hunting groups in the locality }
              demand: { type: integer, format: int64, description: Live seeker posts and hunting groups naming the locality }
    AdminAnalyticsSurfers:
      type: object
      description: The anonymous-to-signed-in funnel for one window.
      properties:
        days: { type: integer }
        from: { type: string, format: date }
        to: { type: string, format: date }
        totalSessions: { type: integer }
        anonSessions: { type: integer }
        signedInSessions: { type: integer }
        signups: { type: integer }
        anonSharePct: { type: number }
        conversionRatePct: { type: number }
        pages:
          type: array
          items:
            type: object
            properties:
              path: { type: string }
              views: { type: integer }
              anonViews: { type: integer }
        dropOff:
          type: array
          description: >
            Where sessions end. The actionable half of the report -- an exit from the signup screen
            is a funnel problem, an exit from a listing detail page usually is not.
          items:
            type: object
            properties:
              path: { type: string }
              exits: { type: integer }
              sharePct: { type: number }
    PricingInsightRow:
      type: object
      description: One locality's asking prices, from live listings alone.
      properties:
        slug: { type: string }
        name: { type: string }
        avgActualRatePerSqft:
          type: [number, 'null']
          description: Average asking rate of live buy flats carrying an area. Null with fewer than three.
        avgRent: { type: [number, 'null'], description: Average monthly rent of live rent flats. Null with fewer than three. }
        rentalYieldPct: { type: [number, 'null'], description: Annual rent over buy price per sqft; null unless both sides have three samples. }
        buyCount: { type: integer }
        rentCount: { type: integer }
        totalListings: { type: integer }
    SlaSummary:
      type: object
      description: >
        Moderation turnaround against the promised target. Nulls are serialised rather than omitted:
        a window with nothing reviewed must be able to say "no data", and an absent key is
        indistinguishable from a key the client forgot to read.
      properties:
        targetHours: { type: integer, description: The turnaround the platform promises owners }
        reviewedCount: { type: integer }
        avgHoursToReview: { type: [number, 'null'] }
        medianHoursToReview:
          type: [number, 'null']
          description: >
            Beside the mean, because one listing left for a fortnight drags the average past target
            while most owners were served within the hour -- and acting on that average would be
            acting on the wrong problem.
        breachedCount: { type: integer }
        slaRatePct: { type: [number, 'null'], description: Share of reviewed listings that met the target }
        pendingCount: { type: integer }
        pendingBreachingCount:
          type: integer
          description: Still waiting and already past target -- owners currently being let down.
        worstPending:
          type: array
          description: The longest-waiting listings, named so somebody can pick one up.
          items:
            type: object
            properties:
              id: { type: string }
              title: { type: string }
              hoursWaiting: { type: number }
        ticketPickup:
          allOf: [{ $ref: '#/components/schemas/SlaTrack' }]
          description: >
            How long a service request waits before a named person owns it. Measured from the first
            audit row that set an assignee, not from `tickets.assignee_id` -- that column holds the
            *current* owner, so a ticket picked up within the hour and later handed back to the pool
            reads as never picked up at all.
        ticketDelivery:
          allOf: [{ $ref: '#/components/schemas/SlaTrack' }]
          description: >
            Creation to the first `resolved` or `closed`. Both count: a desk that closes a request
            without resolving it has finished with it, and recognising only `resolved` would leave
            those outstanding for ever.
        conciergeToLive:
          allOf: [{ $ref: '#/components/schemas/SlaTrack' }]
          description: >
            A staff-posted listing's creation to the first status change that put it live --
            specifically to `approved`, not merely to the first decision. One bounced back for a
            missing document and approved a week later went live on the second row.
        flatmateReview:
          allOf: [{ $ref: '#/components/schemas/SlaTrack' }]
          description: >
            A flatmate room, group or seeker post's creation to its first moderation decision out of
            `pending`; a later takedown of a live post is not review turnaround. Outstanding counts
            pending posts from creation and open re-checks from the edit that raised them. Target 24h.
    SlaTrack:
      type: object
      description: >
        One turnaround measurement: how long a class of work took, how much of it is still waiting,
        and how that compares to the target. The same shape `SlaSummary`'s own top-level fields
        carry for listing review -- those stay flat because they were on the wire first, and
        renaming them to buy symmetry would break a screen to move a bracket.


        Nulls mean nothing has been completed, and are serialised for the reason the parent gives:
        `0` hours reads as instantaneous and `100` percent reads as a flawless record, and both are
        claims about a team that has done nothing yet.
      properties:
        targetHours:
          type: integer
          description: >
            The policy this track is judged against, served rather than assumed so that "breached"
            means the same thing on the server that computed it and on the screen that colours it.
        completedCount: { type: integer }
        avgHours: { type: [number, 'null'] }
        medianHours:
          type: [number, 'null']
          description: Beside the mean, for the reason `medianHoursToReview` gives.
        breachedCount: { type: integer }
        slaRatePct: { type: [number, 'null'] }
        outstandingCount:
          type: integer
          description: >
            Still waiting right now. Unwindowed, like `pendingCount`: a backlog is present tense,
            and a `?days=` filter would drop the oldest items -- the ones the figure exists for.
        outstandingBreachingCount: { type: integer }
    OwnerListingStanding:
      type: object
      description: How much listing allowance one phone number has left, for a post-on-behalf decision.
      properties:
        mobile: { type: string, description: 'Echoed back, so a mistyped digit is visible in the answer' }
        known: { type: boolean, description: Whether this number belongs to a Draazy account at all }
        allowance: { type: integer, description: How many live listings this owner may hold }
        held: { type: integer, description: How many they hold now }
        overAllowance: { type: boolean, description: The single field the composer branches on }
        pending: { type: integer, description: How many of their listings are awaiting a moderator now }
    HelpFeedbackCreate:
      type: object
      description: >
        One reader's current verdict on one help article. Voting again replaces it, so one reader
        counts once per article and language.
      required: [slug, lang, helpful]
      properties:
        slug:
          type: string
          maxLength: 120
          pattern: '^[a-z0-9-]+$'
          description: >
            The article, by the slug its Markdown frontmatter declares. There is no articles table
            to point at -- help content is compiled into the frontend bundle at build time -- so the
            server cannot tell a real slug from a typo and does not pretend to. **Pattern-constrained
            anyway**: this is the join key a future back-office screen groups and links on, and a
            slug that can contain a slash or a quote is one that arrives somewhere as a path or a
            fragment of markup later.
        lang:
          type: string
          enum: [en, hi, mr]
          description: >
            Which translation was on screen. Recorded separately from the slug because an article
            can read clearly in English and badly in Marathi; one combined helpful-rate would
            average those into a number describing neither, and would send a writer to rewrite prose
            that is already fine.
        helpful:
          type: boolean
          description: >
            The verdict. Required rather than defaulted -- a missing field filed as `false` would
            record "the client forgot to send this" as "this article did not help", the one wrong
            answer that looks exactly like a real one.
        comment:
          type: string
          maxLength: 500
          description: >
            Optional reason, asked for only after a no, and usually absent. Never rendered to
            another reader: it is a note to whoever maintains the article, not a public review.
            Bounded rather than forbidden -- the sentence a confused reader types is the most useful
            thing this endpoint collects, and the cap is only so an anonymous route cannot be used
            to store an arbitrary document.
        voter:
          type: string
          pattern: '^[0-9a-fA-F-]{36}$'
          description: >
            The browser's random id, so signed-out readers behind one shared IP count separately.
            Ignored when signed in.
    PageViewBatchCreate:
      type: object
      description: >
        A flush of everything one tab has seen since the last one. Batched rather than one request
        per view because `WriteRateLimitFilter` allows 120 mutating requests a minute per caller,
        shared with everything real the visitor does -- a per-view beacon's first casualty would be
        the enquiry they tried to send afterwards, refused with a 429 because telemetry had already
        spent the budget.
      required: [sessionId, events]
      properties:
        sessionId:
          type: string
          pattern: '[A-Za-z0-9_-]{8,64}'
          description: >
            An opaque tab-scoped token the client mints. **Format-constrained rather than merely
            length-bounded**: without a pattern this is a 64-character free-text field on an
            unauthenticated endpoint -- somewhere a careless client parks an email address and a
            hostile one parks anything at all. Token characters only means whatever arrives cannot
            be personal data even by accident.


            On the batch rather than on each event, because a flush comes from one tab and a tab is
            one session by construction.
        events:
          type: array
          minItems: 1
          maxItems: 50
          description: >
            The views, oldest first, though nothing depends on the order. Capped at 50 -- far above
            a real flush and far below a payload worth sending to be expensive.
          items:
            type: object
            required: [path, device, agoMs]
            properties:
              path: { type: string, maxLength: 200, description: 'The matched route pattern, not the visited URL -- no ids, no query string' }
              referrerHost: { type: [string, 'null'], maxLength: 120, description: Host only. A full referrer would carry the previous page's query string with it. }
              device: { type: string, enum: [mobile, tablet, desktop] }
              agoMs:
                type: integer
                minimum: 0
                description: >
                  How long before this flush the view happened. **Relative, not an absolute
                  timestamp, and that is the point.** A browser clock is routinely minutes out and
                  occasionally years out; day buckets are cut on IST, so a skewed clock files a view
                  under the wrong day rather than degrading gracefully, and a hostile client could
                  backdate a flood into any month it liked. An offset is anchored to the server's
                  clock on arrival, so the worst a wrong client manages is misreporting how long ago
                  something happened within its own flush.


                  Negative is rejected -- "in the future" is a broken or hostile client and saying
                  so is more useful than accepting it. Implausibly large is clamped rather than
                  rejected, because a tab left idle for hours and flushed on unload is a real
                  session that should be counted.
    DataExport:
      type: object
      description: >
        Everything Draazy holds about one person, assembled in one call. The response describes
        itself on purpose: somebody exercising a subject-access right should not have to
        reverse-engineer a database schema to read the answer.
      properties:
        generatedAt: { type: string, format: date-time }
        subjectId: { type: string, description: The account this export is about }
        schemaVersion:
          type: integer
          description: >
            So a person who exports twice a year apart can tell whether the shape changed underneath
            them, rather than guessing from a diff.
        redactionRule:
          type: string
          description: >
            In plain words, how other people's identifiers were handled. An export of your enquiries
            necessarily touches the owners you contacted, and their phone numbers are not yours to
            receive -- stating the rule is the difference between a redaction and an omission.
        rowLimit: { type: integer, description: The per-dataset cap; `truncated` says where it bit }
        datasets:
          type: array
          items:
            type: object
            properties:
              domain: { type: string, example: listings }
              name: { type: string, example: enquiries }
              describes: { type: string, description: 'One sentence saying what these rows are, in plain words' }
              rowCount: { type: integer }
              truncated: { type: boolean, description: True when `rowLimit` cut the set -- a capped export is honest about being capped }
              withheld:
                type: object
                additionalProperties: { type: string }
                description: >
                  Column name to the reason it was removed. An export that silently dropped a column
                  would be a worse answer than one that names it.
              rows:
                type: array
                items: { type: object, additionalProperties: true }
        excluded:
          type: array
          description: Tables left out entirely, with reasons.
          items:
            type: object
            properties:
              name: { type: string }
              reason: { type: string }
    DemandSignalCreate:
      type: object
      required: [kind]
      properties:
        kind:
          type: string
          enum: [search, alert, view]
          description: >
            Which moment produced the signal. Constrained rather than free text: an unrecognised
            kind would be a row the report has to invent a weight for.
        localitySlug:
          type: string
          maxLength: 120
          pattern: '^\s*$|^[a-z0-9]+(-[a-z0-9]+)*$'
          description: >
            Where they were looking. Not a foreign key, and not required - a signal for a place the
            platform does not cover is the most valuable row this endpoint can produce, and a
            missing one still counts toward "people are searching". Must be slug-shaped, so
            scanner payloads cannot appear in the supply-gap report as places.
        deal: { type: string, enum: [buy, rent] }
        bhk: { type: string, maxLength: 40, description: As typed in the filter, not normalised. }
        propertyId:
          type: string
          format: uuid
          description: Set on a view. Absent on a search, which by definition has no one property.
    SupplyGapRow:
      type: object
      description: >
        Counts only. There is no revenue, no conversion and no per-person detail here, and that is a
        constraint rather than an accident - the underlying table holds no contact detail, so
        nothing richer could honestly be derived from it.
      properties:
        localitySlug:
          type: string
          description: Absent on the single row aggregating signals that carried no locality.
        localityName:
          type: string
          description: >
            Absent (NON_NULL) rather than null when the slug has no row in `localities`, so the
            shape of the response does not advertise that a field is being withheld. An absent name
            means the demand is for somewhere Draazy does not yet cover.
        supply: { type: integer, format: int64, description: Live approved listings in this locality. }
        searches: { type: integer, format: int64 }
        alerts: { type: integer, format: int64 }
        views: { type: integer, format: int64, description: Reported for context; not counted in demand. }
        repeatSeekers:
          type: integer
          format: int64
          description: >
            Signed-in people who searched this locality three or more times in the window.
            Knowingly an undercount, and deliberately so: without an account there is nothing that
            distinguishes one person searching three times from three people searching once. The
            browser report it replaces claimed otherwise, by stamping every anonymous search with
            the same literal user id and then counting it as a repeat visitor.
        demand:
          type: integer
          format: int64
          description: Weighted total - alerts x5, searches x2. Views are not demand.
        demandPerListing:
          type: number
          format: double
          description: >
            `demand / (supply + 1)`, one decimal. Rows are ordered by it, descending, with the
            no-locality row last.
    CityWaitlistDemandRow:
      type: object
      description: >
        One city somebody asked Draazy to launch in. Counts only - see the endpoint description
        for why no contact detail appears here.
      required: [city, requests, lastRequestedAt]
      properties:
        city:
          type: string
          description: >
            A spelling somebody actually typed, not an invented canonical form. Rows are grouped by
            `lower(city)` - the same key the uniqueness index uses, so "Mumbai" and "mumbai" are one
            city here for the same reason they are one signup there - and one of the real
            submissions is picked for display. Title-casing the key, or mapping it through an alias
            table, would print a spelling nobody used; this column is free text precisely because
            these are cities the curated roster has no entry for.
        requests:
          type: integer
          format: int64
          description: Distinct people who asked for this city, all time.
        lastRequestedAt:
          type: string
          format: date-time
          description: >
            The most recent ask. How a city with an old flurry is told apart from one filling up
            now, which two equal `requests` counts cannot say on their own.
    AdminFinance:
      type: object
      properties:
        mrr:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                Monthly run rate of the **active** paid subscription book, normalised so a yearly
                plan contributes a twelfth and a quarterly plan a third. Forward-looking, so not a
                slice of `month`.
        plans:
          type: array
          description: The active subscription book itemised. Sums to `mrr` by construction.
          items:
            type: object
            properties:
              name: { type: string, example: Owner Plus }
              audience: { type: string, example: owner }
              billingCycle: { type: string, enum: [monthly, quarterly, yearly] }
              termDays: { type: [integer, 'null'], description: Fixed term of a pass or pack; null for cycle-billed plans. }
              price:
                allOf:
                  - $ref: '#/components/schemas/Money'
                  - description: The sticker price for one billing cycle, **not** normalised.
              active: { type: integer, format: int64 }
              monthlyValue:
                allOf:
                  - $ref: '#/components/schemas/Money'
                  - description: What these subscriptions contribute to `mrr`.
        month:
          type: object
          description: >
            The current Indian calendar month, read from invoices and credit notes. Always
            `collected - refunded - passThrough = net`.
          properties:
            collected: { $ref: '#/components/schemas/Money' }
            refunded: { $ref: '#/components/schemas/Money' }
            passThrough:
              allOf:
                - $ref: '#/components/schemas/Money'
                - description: Stamp duty and registration collected for the government, net of any refunded.
            net:
              allOf:
                - $ref: '#/components/schemas/Money'
                - description: Draazy's own fees less refunded fees. Can be negative.
            payments: { type: integer, format: int64, description: Invoices issued this month. }
        attention:
          type: object
          description: Money waiting on a staff decision, as counts and rupee totals.
          properties:
            refundRequests: { type: integer, format: int64, description: Subscription refund requests pending review. }
            refundRequestAmount: { $ref: '#/components/schemas/Money' }
            serviceRefunds: { type: integer, format: int64, description: Service-request refunds requested and not yet decided. }
            serviceRefundAmount: { $ref: '#/components/schemas/Money' }
            openDisputes: { type: integer, format: int64, description: Open gateway payment disputes. }
            openDisputeAmount: { $ref: '#/components/schemas/Money' }
    AdminFinanceSeriesPoint:
      type: object
      description: One month of Draazy's fees, split by source.
      properties:
        month:
          type: string
          format: date
          description: The first day of the bucket, on the Indian calendar.
        subscriptions: { $ref: '#/components/schemas/Money' }
        services:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: Fees on paid service requests and their amendments; pass-through excluded.
        refunds:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: Fees given back on credit notes, as a positive figure. Net is `subscriptions + services - refunds`.
    AdminProviderHealth:
      type: object
      properties:
        provider: { type: string, enum: [zeptomail, whatsapp, cashfree] }
        live: { type: boolean, description: false when the mock implementation is wired }
        ok24h: { type: integer, format: int64 }
        failed24h: { type: integer, format: int64 }
        skipped24h: { type: integer, format: int64 }
        ok7d: { type: integer, format: int64 }
        failed7d: { type: integer, format: int64 }
        lastOkAt: { type: string, format: date-time, nullable: true }
        lastFailureAt: { type: string, format: date-time, nullable: true }
        lastFailureDetail: { type: string, nullable: true, description: vendor error code, never free text }
    AdminProviderCall:
      type: object
      properties:
        id: { type: string, format: uuid }
        provider: { type: string, enum: [zeptomail, whatsapp, cashfree] }
        operation: { type: string, description: 'email, otp, identity-decision, create-order, refund or webhook' }
        outcome: { type: string, enum: [ok, failed, skipped] }
        recipient: { type: string, nullable: true, description: 'A ten-digit mobile in full, or ***@domain.' }
        reference: { type: string, nullable: true, description: payment order id, or the email subject }
        detail: { type: string, nullable: true, description: vendor error code or webhook payment status }
        durationMs: { type: integer, nullable: true }
        createdAt: { type: string, format: date-time }
    AdminHelpFeedbackArticle:
      type: object
      properties:
        slug: { type: string }
        lang: { type: string, enum: [en, hi, mr] }
        helpful: { type: integer, format: int64 }
        notHelpful: { type: integer, format: int64 }
        comments: { type: integer, format: int64, description: verdicts that carry a written reason }
        lastAt: { type: string, format: date-time, nullable: true }
    AdminHelpFeedbackComment:
      type: object
      properties:
        id: { type: string, format: uuid }
        slug: { type: string }
        lang: { type: string, enum: [en, hi, mr] }
        helpful: { type: boolean }
        comment: { type: string, description: 'reader free text, up to 500 characters; untrusted' }
        createdAt: { type: string, format: date-time }
    AdminFinanceTransaction:
      type: object
      description: One invoice or credit note.
      properties:
        id:
          type: string
          format: uuid
          description: The `invoices` or `credit_notes` row, so a figure on this screen is traceable to its document.
        date: { type: string, format: date, description: When the document was issued, on the Indian calendar. }
        number: { type: string, example: INV-FY2627-000123, description: The invoice or credit-note number. }
        party:
          type: string
          description: >
            The customer's name. **Never a mobile number**: `/admin/enquiries` exists for the case
            where an operator needs to reach somebody, and it audits the reveal.
        kind: { type: string, enum: [subscription, service, refund] }
        amount:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: The gross the customer paid; negative for a credit note.
        fee:
          allOf:
            - $ref: '#/components/schemas/Money'
            - description: >
                Draazy's own fee inside `amount` (the taxable value); negative for a credit note. The
                rest is stamp duty and registration passed on to the government.
    AdminSettings:
      type: object
      description: Platform configuration document (SSOT for fees, feature flags and RBAC).
      properties:
        contactUnlockLimit: { type: integer }
        kycBadgeEnabled: { type: boolean, description: Whether the opt-in identity-verification (ID + selfie) badge flow is available (ADR-019). }
        listingExpiryDays: { type: integer }
        maintenanceMode: { type: boolean }
        site:
          type: object
          description: Branding / support contact block.
          additionalProperties: true
        fees:
          type: object
          description: Platform fee configuration (INR); read by the billing layer.
          properties:
            listingPass: { type: integer }
            contactPack: { type: integer }
            rentAgreementPlatform: { type: integer }
            contactReplyDays: { type: integer, minimum: 1, maximum: 30, example: 7 }
            contactPendingMax: { type: integer, minimum: 1, maximum: 100, example: 10 }
            packRefundDays: { type: integer, minimum: 0, maximum: 30, example: 7, description: '0 switches the pack refund off.' }
            passGuaranteeDays: { type: integer, minimum: 0, maximum: 30, example: 7, description: '0 switches the pass guarantee off.' }
            passGuaranteeMaxEnquiries: { type: integer, minimum: 0, maximum: 50, example: 0 }
            passGuaranteeEveryMonths: { type: integer, minimum: 1, maximum: 36, example: 12 }
          additionalProperties: true
        legal:
          $ref: '#/components/schemas/LegalNotices'
        movePack:
          type: object
          additionalProperties: true
        listings:
          type: object
          description: >-
            Listing content rules, published in the `listingPolicy` section of `GET /bootstrap`. `maxPhotos` must be a whole number in
            [3, 20]; anything else is a `422` and nothing is saved.
          properties:
            maxPhotos: { type: integer, minimum: 3, maximum: 20, example: 10 }
          additionalProperties: true
        flatmates:
          type: object
          description: >-
            Flatmate rules. `maxGroupsPerPerson` counts groups a person is in plus group requests still
            pending; it must be a whole number in [1, 10], anything else is a `422` and nothing is saved.
          properties:
            maxGroupsPerPerson: { type: integer, minimum: 1, maximum: 10, example: 2 }
          additionalProperties: true
        geo:
          type: object
          description: >
            Coverage and locality-search policy — where each city centres and how far it extends,
            whether search is fenced to those bounds, and which places to hide from every suggestion
            box.


            Listed here as documentation, not as a constraint: `additionalProperties: true`
            throughout, because `PUT /admin/settings` deep-merges any top-level key and binding this
            block to a closed shape would drop whatever the Maps panel adds next. It went undeclared
            for a long time for exactly that reason, and the omission read as "the server does not
            know about geo" when in fact it stores and merges it like everything else.


            The public projection of this block is the `geo` section of `GET /bootstrap`, which is narrower in one respect: it
            withholds each blacklist entry's free-text reason. That note is moderator prose about a
            named building and is served **only** here.
          additionalProperties: true
        flags:
          type: object
          description: Feature toggles.
          additionalProperties: { type: boolean }
        adminFlags:
          type: object
          additionalProperties: { type: boolean }
        permissions:
          type: object
          description: >
            Per-team capability allow-list (team-or-`admin` -> [capability, ...]), enforced server-side
            since D67 was wired. It narrows the role guards and can never widen them: every capability
            check is composed onto the `x-roles` check that was already there, so no value here admits
            a caller a role would refuse. An absent, malformed or non-object document falls back to the
            role guards alone; within a well-formed document an unlisted team or an unlisted capability
            is a denial, and `"*"` means all. Editing this changes access control - the four
            capabilities are `view_dashboard` (GET /admin/dashboard, GET /admin/analytics),
            `view_service_requests` (the ops branch of GET /service-requests), `update_ticket`
            (PATCH /tickets/{id}, POST /tickets/{id}/notes) and `export_csv`, which is stored but
            enforces nothing because the platform has no export endpoint (D5 - exports render in the
            browser).
          additionalProperties: true
    ContentItem:
      type: object
      description: An FAQ as the admin console edits it, keyed by `{type}` in the path (`faqs`, the only managed list).
      properties:
        id: { type: string, format: uuid }
        type: { type: string, enum: [faqs] }
        archived: { type: boolean }
        question: { type: [string, 'null'] }
        answer: { type: [string, 'null'] }
        category: { type: [string, 'null'] }
        # list rows omit it unless `?translations=true`
        translations: { $ref: '#/components/schemas/ContentTranslations' }
    ContentItemWrite:
      type: object
      description: >
        Create or update payload for an FAQ. `question` is required on create;
        on PATCH an absent field is left unchanged.
      properties:
        question: { type: string, maxLength: 300 }
        answer: { type: string, maxLength: 4000 }
        category: { type: string, maxLength: 60 }
    AuditEntry:
      type: object
      properties:
        id: { type: string }
        actor: { type: string }
        actorName: { type: string, description: 'Resolved name, or the raw actor handle when no account matches.' }
        actorRole: { $ref: '#/components/schemas/Role' }
        action: { type: string, example: property.approve }
        entity: { type: string, example: property }
        entityId: { type: string }
        checker: { type: [string, 'null'], description: 'Reserved and always null today: the decider is `actor`.' }
        at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true }
    ClientErrorReport:
      type: object
      required: [reference, kind, path]
      description: >
        A browser-side failure. Every string is scrubbed (emails, numbers, tokens, query strings) and
        truncated server-side; the whole body may not exceed 16 KB.
      properties:
        reference: { type: string, format: uuid, description: The id the crash screen showed the user. }
        kind: { type: string, enum: [render, error, unhandledrejection] }
        scope: { type: string, maxLength: 100 }
        path: { type: string, pattern: '^/', description: 'Route the user was on; the query string is dropped.' }
        name: { type: string, maxLength: 100, example: TypeError }
        message: { type: string, maxLength: 1000 }
        stack: { type: string, maxLength: 8000 }
        componentStack: { type: string, maxLength: 2000 }
        build: { type: string, maxLength: 64 }
        lastTraceId: { type: string, maxLength: 128, description: The traceId of the last API response the page saw. }
        context:
          type: object
          properties:
            viewport: { type: string, example: 390x844 }
            online: { type: boolean }
            userAgent: { type: string, description: Browser family only. }
            deployEnv: { type: string }
    ErrorEventSummary:
      type: object
      required: [id, source, occurrences, firstSeen, lastSeen]
      properties:
        id: { type: string, format: uuid }
        source: { type: string, enum: [api, job, web] }
        errorType: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        path: { type: [string, 'null'] }
        occurrences: { type: integer }
        firstSeen: { type: string, format: date-time }
        lastSeen: { type: string, format: date-time }
        lastTraceId: { type: [string, 'null'] }
        resolvedAt: { type: [string, 'null'], format: date-time }
    ErrorEventDetail:
      allOf:
        - $ref: '#/components/schemas/ErrorEventSummary'
        - type: object
          properties:
            fingerprint: { type: string }
            level: { type: string }
            stack: { type: [string, 'null'] }
            httpMethod: { type: [string, 'null'] }
            httpStatus: { type: [integer, 'null'] }
            build: { type: [string, 'null'] }
            userRole: { type: [string, 'null'] }
            lastUserId: { type: [string, 'null'], format: uuid }
            context: { type: object, additionalProperties: true }
            resolvedBy: { type: [string, 'null'], format: uuid }
    StaffActivityEntry:
      type: object
      # AuditEntry with the actor resolved to a person. `metadata` is filled for admins only, the same
      # boundary as /admin/audit-log; for managers the key is absent.
      required: [id, actorRole, action, entity, at]
      properties:
        id: { type: string, description: The audit row's id, so the feed can be reconciled against the audit log. }
        actorName: { type: string, description: 'Resolved name, or the raw actor handle when no account matches — a deleted account still has to appear.' }
        actorRole: { type: string, enum: [staff, manager, admin] }
        action: { type: string, example: user.suspend }
        entity: { type: string, example: user, description: The kind of record acted on; the console's category. }
        entityId: { type: [string, 'null'] }
        at: { type: string, format: date-time }
        metadata: { type: object, additionalProperties: true, description: 'Context such as a from/to diff; present only for admins.' }
    StaffActivityCount:
      type: object
      required: [entity, count]
      properties:
        entity: { type: string, example: user }
        count: { type: integer, format: int64 }
    StaffLeaderboardEntry:
      type: object
      # Volume, not performance. An audit row records that something was done, not that it was worth
      # doing — filing the same number under "performance" is not something the data can support.
      required: [actor, name, role, total]
      properties:
        actor: { type: string }
        name: { type: string }
        role: { type: string, enum: [staff, manager, admin] }
        team: { type: [string, 'null'] }
        total: { type: integer, format: int64 }
    StaffActivitySummary:
      type: object
      required: [total, staffCount, byEntity, actions, leaderboard]
      properties:
        total: { type: integer, format: int64, description: Every matching row in the window. }
        staffCount: { type: integer, format: int64, description: Distinct actors in the window — the honest reading of "active staff". }
        byEntity:
          type: array
          description: The split by kind of record acted on, busiest first.
          items: { $ref: '#/components/schemas/StaffActivityCount' }
        actions:
          type: array
          description: The action vocabulary actually present in the window, so the filter offers verbs that exist.
          items: { type: string }
        leaderboard:
          type: array
          description: The busiest actors, capped server-side.
          items: { $ref: '#/components/schemas/StaffLeaderboardEntry' }
    TeamPerformanceResponse:
      type: object
      required: [windowDays, staff, queues]
      properties:
        windowDays: { type: integer, enum: [7, 30] }
        staff:
          type: array
          items: { $ref: '#/components/schemas/TeamPerformanceStaffMember' }
        queues:
          type: array
          items: { $ref: '#/components/schemas/TeamPerformanceQueueMetric' }
    MyWork:
      type: object
      required: [windowDays, staff, queues]
      properties:
        windowDays: { type: integer, enum: [7, 30] }
        staff:
          type: array
          items: { $ref: '#/components/schemas/MyWorkStaff' }
        queues:
          type: array
          items: { $ref: '#/components/schemas/MyWorkQueue' }
    MyWorkStaff:
      type: object
      required: [name, functions, handled, byFunction]
      properties:
        name: { type: string }
        functions:
          type: array
          items: { type: string }
        handled: { type: integer, format: int64 }
        byFunction:
          type: object
          additionalProperties: { type: integer, format: int64 }
    MyWorkQueue:
      type: object
      required: [function, open, oldestWaitingSince]
      properties:
        function: { type: string, example: propertyVerification }
        open: { type: integer, format: int64 }
        oldestWaitingSince: { type: [string, 'null'], format: date-time }
    TeamPerformanceStaffMember:
      type: object
      required: [id, name, functions, handled, byFunction]
      properties:
        id: { type: string }
        name: { type: string }
        functions:
          type: array
          items: { type: string }
        handled: { type: integer, format: int64 }
        byFunction:
          type: object
          additionalProperties: { type: integer, format: int64 }
    TeamPerformanceQueueMetric:
      type: object
      required: [function, open, oldestWaitingSince, medianDecisionMinutes]
      properties:
        function: { type: string, example: propertyVerification }
        open: { type: integer, format: int64 }
        oldestWaitingSince: { type: [string, 'null'], format: date-time }
        medianDecisionMinutes:
          type: [number, 'null']
          format: double