        gender: { type: string, enum: [male, female], description: 'The first pick is free and the same value again is a no-op. A different value is 409 unless changeGender is true, which spends one of 2 changes, then 409 (contact support); ID-verified profiles get 409. The flatmates gender gate reads it.' }
        changeGender: { type: boolean, description: 'Opt in to spend a gender change. The flatmates first-pick prompt omits it, so a gender set on another device answers 409 instead of being overwritten.' }
        shareActivityStatus: { type: boolean, description: Share online/last-seen activity with message counterparties who also share theirs. }
        shareReadReceipts: { type: boolean, description: Share pair-thread read receipts with counterparties who also share theirs. }

    PropertySummary:
      type: object
      description: Lightweight card projection for search/lists (no gated contact).
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        propertyType: { $ref: '#/components/schemas/PropertyTypeLabel' }
        bhk: { type: number, example: 3 }
        price: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        area: { type: number, example: 1180 }
        areaUnit:
          type: string
          enum: [sqft, sqyd, sqm, guntha, acre, hectare]
          example: sqft
        furnishing: { $ref: '#/components/schemas/Furnishing' }
        possession: { $ref: '#/components/schemas/PropertyPossession' }
        landUse:
          type: string
          enum: [residential, commercial, industrial, agricultural, mixed]
          nullable: true
        room:
          type: string
          enum: [single, shared]
          nullable: true
        tenants:
          type: array
          items: { type: string, enum: [family, bachelors, bachelor-male, bachelor-female, company, anyone] }
        availableFrom:
          type: string
          enum: [now, '15', '30']
          nullable: true
          description: Derived live from `availableOn` in IST; null beyond 30 days or when no date is stated.
        availableOn:
          type: string
          format: date
          nullable: true
        pets: { type: boolean }
        locality: { type: string, example: Koregaon Park }
        localitySlug:
          type: string
          example: koregaon-park
          description: >-
            Curated locality key (FK to Locality.slug) and the value the `locality` search filter
            matches on. `locality` above is the human display name and is NOT unique or stable —
            never key off it. Absent when the listing's locality could not be resolved to a curated
            locality (owner free-text that matched nothing); such listings are invisible to locality
            filters until curated during moderation.
        societyName:
          type: string
          example: Skyline Heights
          description: >-
            The bound society's current catalogue name, derived on the server and absent when no
            society is bound. Present even when the society has since been retired from the catalogue,
            so the owner's edit form can still show what the listing is bound to; `societySlug` is
            what routes to the society page.
        city: { type: string, example: Pune }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        coverImage: { type: string, format: uri }
        verified: { type: boolean }
        ownerVerified:
          type: boolean
          description: >
            The owner of this listing has passed identity verification (ID + selfie review).
            Denormalised from the owner onto every listing they hold, so a card can show the trust
            signal without a second read. Carried on the **card**, not only on detail, because search
            results are where a buyer chooses what to open — a badge visible only after the click
            cannot influence the choice it exists to influence, which would make "verified owners get
            more enquiries" an unbacked promise. Distinct from `verified` (a moderator's verdict on
            the *listing*) and from `ownershipVerified` (a verdict on the *paperwork*): never collapse
            the three into one badge, or a listing will claim a check its owner never took.
        ownershipVerified:
          type: boolean
          description: >
            This listing's ownership paperwork has been verified and has not expired. Independent of
            `ownerVerified` — either can be true alone.
        reraId: { type: string }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        dealStatus:
          type: string
          enum: [active, reserved, closed]
          description: >
            Deal outcome mirrored from the owner-scoped deal (D110), readable on public cards and
            detail. `reserved` badges a listing "under offer" while it stays `approved` and still
            takes offers; `closed` accompanies a terminal `sold`/`rented` status.
        createdAt: { type: string, format: date-time }
        featured:
          type: boolean
          description: >
            The owner's listing was verified in the last 7 days — featured is a reward for verifying
            ownership, derived on every read so it lapses on its own and nobody can set it by hand.
            Present on the card because that is where the badge renders.
    Property:
      allOf:
        - $ref: '#/components/schemas/PropertySummary'
        - type: object
          properties:
            description: { type: string }
            priceUnit: { type: string, enum: [total, per-month], example: per-month }
            societySlug:
              type: string
              example: skyline-heights
              description: >-
                The society this home is actually in (FK to Society.slug), or absent when the owner
                never named one. The slug and not `society_id`, because the slug is the society's public
                key everywhere else — `GET /societies/{slug}`, the hub route, the client's own catalogue
                — so a UUID would tell a client that a society exists while giving it no way to name
                one. Carried on the card and not only on detail because a society filter and a
                "N homes in this building" count are computed over a page of results. Absent is a real
                and common answer and must be read as "not known", never as any particular society:
                before D19 the client filled the gap by hashing the listing id into a society list,
                which printed one real building's builder, tower count and occupancy under another
                building's listing.
            lastConfirmedAt:
              type: string
              format: date-time
              nullable: true
              description: >
                When the owner last confirmed this listing is still available (`POST
                /me/listings/{id}/confirm-available`). The input to the freshness badge, and the only
                part of it that is stored rather than derived — everything else about staleness is a
                function of this instant and the clock, so an owner who answers the nudge is back to
                "active" immediately with nothing to recompute.


                `null` means nobody has ever confirmed this listing, which is different from confirming
                it long ago. Clients fall back to `createdAt` in that case, which is what the badge has
                always effectively shown; the distinction is kept in the field rather than erased by
                backfilling, so a listing whose owner answers stays distinguishable from one that has
                only ever been posted.
            qualityScore:
              type: integer
              minimum: 0
              maximum: 100
              nullable: true
              description: >
                How complete this listing is, 0–100 — photos, description, verifications, the fields a
                buyer needs and the amenity list. Computed by the database as a generated column, so it
                can never disagree with the listing beneath it and never needs a recompute after an
                edit.


                It is served, and not merely used for ranking, because it is also what the owner's own
                dashboard shows them: the same number that decides where a listing places is the number
                they are asked to improve, and two separate figures for that would be an invitation to
                distrust both.


                `null` only on an instance that has been written but not read back; every read path
                returns a number. Absent rather than `0` in that case, because a zero on a complete
                listing is a wrong answer where no answer is an honest one.
            freshness:
              type: string
              enum: [active, aging, stale, dormant]
              description: >
                How recently the owner confirmed availability, derived from `lastConfirmedAt` (falling
                back to `createdAt`) against the server clock at request time.


                Derived per request and never stored: it is a function of the clock, so any persisted
                tier is correct only at the instant it was written. Sent alongside the timestamp rather
                than instead of it — the timestamp is what a card renders ("confirmed 2 days ago"), the
                tier is what decides tone and ranking. It is served rather than re-derived by each
                client because it also governs whether a listing is shown at all, and a visibility rule
                the browser evaluates is a rule anything reading the API directly does not have.
            maintenance: { $ref: '#/components/schemas/Money' }
            negotiable: { type: boolean }
            ownership: { type: string, description: Owner-declared ownership type. }
            loanAvailable: { type: boolean, description: Whether the owner says a home loan is available. }
            agreementDuration: { type: string, description: Owner-declared rental agreement duration. }
            # Promoted out of `formDetails`, which is owner/staff only — without it a public viewer
            # is shown a client-side default ("None", "1 month") in place of the listing's own terms.
            lockIn: { type: string, description: 'Lock-in period in months, as the owner stated it.' }
            noticePeriod: { type: string, description: 'Notice period in months, as the owner stated it.' }
            foodPref: { type: string, description: 'Food rule the owner stated for a rental (e.g. veg, jain, any); absent when unstated.' }
            bestTimeToCall: { type: string, enum: [anytime, morning, afternoon, evening], description: 'When the owner prefers calls; absent when unstated.' }
            furniture:
              type: array
              description: Furniture and appliances explicitly selected by the owner.
              items: { type: string }
            carpetArea: { type: number }
            builtUpArea: { type: number }
            superBuiltUpArea: { type: number }
            floor: { type: integer }
            totalFloors: { type: integer }
            facing: { type: string }
            # Split out of `facing` in V19. A home has a compass direction and a view at the same
            # time; offering both through one control could only ever record one of the two.
            overlooking: { type: string }
            # Absent must stay absent: substituting `bhk - 1` for bathrooms prints a guess as fact.
            # Counts, not enums — `0` is a real answer, and not the same as omitted.
            bathrooms: { type: integer, minimum: 0 }
            parking: { type: integer, minimum: 0 }
            balconies: { type: integer, minimum: 0 }
            landUse:
              type: string
              enum: [residential, commercial, industrial, agricultural, mixed]
              nullable: true
              description: >
                Permitted zoning for a plot or farm land; `null` for anything with a building on it.
                A flat has no land use of its own, only the use its society was sanctioned for.
            ageYears:
              type: integer
              minimum: 0
              nullable: true
              description: >
                Age of the construction in years. `null` means the owner never said, which is
                emphatically not zero — a range filter that read unstated as brand-new would float
                every lazy listing above the honest ones. No upper bound: Pune has Peth houses older
                than any ceiling worth hard-coding.
            room:
              type: string
              enum: [single, shared]
              nullable: true
              description: >
                Flatmate room shape — a private room, or a bed in a shared room. `null` for
                everything that is not a flatmate share.
            tenants:
              type: array
              items: { type: string, enum: [family, bachelor-male, bachelor-female, company] }
              description: >
                Who the owner will rent to. A list rather than a single value because "family or
                company, no bachelors" is the ordinary position and no enum expresses it.


                **Empty means no stated preference, and matches every `tenants` filter.** An owner
                who did not answer has not refused anybody; treating silence as refusal would hide
                most of the inventory from the filter meant to narrow it.
            availableFrom:
              type: string
              enum: [now, '15', '30']
              nullable: true
              description: >
                Move-in bucket, derived live from `availableOn` in IST (≤ today `now`, ≤ +15 days
                `15`, ≤ +30 days `30`, otherwise null). Filtering on it is cumulative — see the
                `availableFrom` query parameter.
            availableOn:
              type: string
              format: date
              nullable: true
              description: The date the owner stated the home is free from; the stored truth.
            availableDate:
              type: string
              format: date
              nullable: true
              description: Equal to `availableOn`; kept for display clients.
            pets:
              type: boolean
              nullable: true
              description: >
                Pets allowed, as the owner answered it. Null is unstated and must render as a
                question to put to the owner, never as "not allowed" — the wizard asks, so silence
                is not an answer, and inventing one costs an owner the enquiries they would take.
                The pet-friendly filter matches true only.
            amenities:
              type: array
              items: { type: string }
            images:
              type: array
              items: { type: string, format: uri }
            floorPlan: { type: string, format: uri }
            video:
              type: string
              pattern: '^[A-Za-z0-9_-]{11}$'
              description: Normalised YouTube video id for the walkthrough.
            address: { type: string }
            pincode: { type: string }
            societyId: { type: string, format: uuid }
            formDetails:
              $ref: '#/components/schemas/ListingFormDetails'
            electricityMeterNo:
              type: string
              description: >-
                The unit's electricity meter number (V79). Present only on the owner's own
                `/me/listings` views and on the staff moderation surfaces; absent entirely from the
                public listing response, because a meter number names a live utility account and is
                one of the few values here a stranger could act on rather than merely read.
            views: { type: integer, description: Denormalized view counter }
            enquiries: { type: integer, description: Denormalized enquiry counter }
            featured: { type: boolean }
            flagReason: { type: [string, 'null'], description: Admin moderation flag; empty when unflagged }
            recheckPending:
              type: boolean
              description: >
                A stays-live moderation re-check is queued on this listing (Q14). Raised when the
                owner edits `price`, `furnishing` or `possession` on an approved listing: the edit
                is waiting for a moderator, but the listing keeps `status: approved` and stays in
                search. Distinct from a `pending` status, which is what the identity-changing
                foundation fields (`locality`/`propertyType`/`bhk`/`deal`) still cost. Cleared when
                a moderator sets any status on the listing, and superseded (dropped) if a later edit
                reverts it to `pending`.
            recheckReason:
              type: [string, 'null']
              example: price, furnishing
              description: >
                Which fields raised the pending re-check, accumulated across edits until a moderator
                clears it. Empty when `recheckPending` is false.
            recheckChanges:
              type: array
              description: >
                Back office only. What the owner's edit changed, one entry per field kept since the
                re-check was raised: the first `before` and the latest `after`, as display-agnostic
                strings (photos as a count, long text cut to 300 characters). Absent when no re-check
                is pending; cleared with it.
              items:
                type: object
                required: [field, before, after]
                properties:
                  field: { type: string, example: price }
                  before: { type: string, example: '30000' }
                  after: { type: string, example: '36000' }
            recheckRequestedAt:
              type: [string, 'null']
              format: date-time
              description: >
                When the re-check was first queued — the queue's age. Set once, at the first
                unreviewed edit, and deliberately *not* refreshed by later ones, so an owner cannot
                edit their way back to the front of the queue. Absent when `recheckPending` is
                false. This is what makes the stays-live outcome auditable: `recheckPending` says a
                re-check is owed, only this says it has been owed for eleven days, and an undrained
                queue is otherwise indistinguishable from an empty one. Sort on it client-side —
                `sort` is clamped to the catalogue's shared whitelist (createdAt/price/area/bhk),
                and widening that would expose the column to the public search too.
            resubmittedAt:
              type: [string, 'null']
              format: date-time
              description: >
                When an owner last sent an existing listing back to moderation after the first
                submission. Present on the owner's own listing views; absent on public reads and
                before the first resubmission. The dashboard uses it to restart the pending-review
                SLA clock after a rejection fix, a stays-live re-check edit or a reopened deal.
            ownershipRequestedAt: { type: [string, 'null'], format: date-time, description: 'Open Verified-badge request from the owner''s document vault. Owner/staff only.' }
            ownershipDeclinedReason: { type: [string, 'null'], description: 'Why staff last declined a badge request. Owner/staff only.' }
            archived: { type: boolean, description: Soft-delete flag. A separate axis from status - absent on the public detail read; meaningful on /me/listings and /admin/properties. }
            docsCount: { type: integer }
            owner:
              type: object
              description: Owner summary; contact number masked unless the reader is entitled to it.
              required: [id]
              properties:
                id: { type: string }
                name: { type: string }
                mobile:
                  type: string
                  description: >-
                    Masked (e.g. `98XXXXX210`) by default. Raw for a seeker who has passed the
                    contact gate on this listing, and raw on the moderation desk
                    (`listPropertiesForModeration` and the operations that return a listing from it)
                    for a caller holding `properties:read` — two different entitlements that happen
                    to render the same, which is why this is one field and not two.
                verified: { type: boolean }
            commercial:
              type: object
              nullable: true
              description: >
                Everything a commercial listing answers that a home does not, lifted verbatim out of
                `formDetails` so a public viewer can see it — that map is owner/staff only.


                **Absent for every property type but commercial**, and absent rather than an
                all-empty object: a residential detail response should not carry the concept at all.
                Before this existed the detail page had no owner answers to render and fell through
                to a tier-keyed guess, publishing "Warm Shell · Power Backup · Washrooms" on every
                commercial rental regardless of what was entered. A consumer of this object must
                render only what it states and say nothing where it is empty.


                Values are strings because that is how the wizard stores them and how
                `ListingFormDetails` validates them; parsing here would invent a second vocabulary
                for the same answers. Empty string means the owner left it blank.


                The physical specs are scoped by use-profile in the wizard — `seatCount` for a
                workspace, `frontage` for retail, `floorLoad`/`clearHeight`/`sanctionedPower`/
                `dockCount` for industrial — so only the chosen profile's fields are ever non-empty.
              properties:
                commercialType:
                  type: string
                  enum: ['', office, shop, retail, warehouse, industrial, coworking]
                  description: >-
                    Use profile. `coworking` is retired from the wizard and accepted only so live
                    listings published under it remain readable and re-savable.
                shellType:
                  type: string
                  enum: ['', bareShell, warmShell, furnished]
                  description: Fit-out level. Sets the price and is the first filter an enquiry applies.
                washrooms: { type: string, enum: ['', '1', '2', '3', '4+'] }
                camCharges:
                  type: string
                  description: >-
                    Common-area maintenance in rupees per sq.ft. per month. The single maintenance
                    figure for a commercial listing — `monthlyMaintenance` and the rent-side
                    maintenance mode are residential-only and describe the same cost.
                powerBackup: { type: boolean }
                pantry: { type: boolean }
                suitableFor:
                  type: array
                  description: Businesses the owner will let to. Distinct from the residential `tenants`.
                  items: { type: string }
                fixtures:
                  type: array
                  description: Fit-out items present, as the owner selected them.
                  items: { type: string }
                fitOutMonths:
                  type: string
                  description: Rent-free / fit-out period in months. Rent listings only.
                escalationPct:
                  type: string
                  description: Annual rent escalation, in percent. Rent listings only.
                tenancyStatus:
                  type: string
                  enum: ['', vacant, leased]
                  description: Whether the asset is vacant or sold with a tenant in place. Buy listings only.
                inPlaceRent:
                  type: string
                  description: Monthly rent the sitting tenant pays. Buy listings, leased only.
                leaseExpiry:
                  type: string
                  description: 'Date the sitting tenant''s lease ends, `YYYY-MM-DD`. Buy listings, leased only.'
                seatCount: { type: string, description: Workstations. Workspace profiles only. }
                frontage: { type: string, description: Shopfront width in feet. Retail profiles only. }
                floorLoad: { type: string, description: Permissible floor load in tonnes per sq.m. Industrial only. }
                clearHeight: { type: string, description: Clear internal height in feet. Industrial only. }
                sanctionedPower: { type: string, description: Sanctioned electrical load in KVA. Industrial only. }
                dockCount: { type: string, description: Loading docks. Industrial only. }
            land:
              type: object
              nullable: true
              description: >
                Everything an open plot or farm land answers that a building does not, lifted
                verbatim out of `formDetails` so a public viewer can see it — that map is
                owner/staff only, so a buyer used to be shown none of the facts they decide on.


                **Absent for every property type but land**, and absent rather than an all-empty
                object. Open plots and farm land are asked different questions — `openSides` and
                `plotZone` for a plot; `waterSource`, `electricity` and `roadAccess` for a farm —
                so only the chosen branch's fields are ever set. `naStatus`, `otherRights` and the
                measurements are asked of both. Render only what is stated; say nothing where it
                is empty.


                Measurements are strings because that is how the wizard stores them and how
                `ListingFormDetails` validates them. For the zoning a buyer *filters* on, read the
                top-level `landUse` — `plotZone` is the owner's label for the same fact.
              properties:
                plotZone:
                  type: string
                  enum: ['', Residential (R1), Residential (R2), Commercial (C-1), Industrial (I-1), Public / Semi-public, Mixed-Use, Agriculture Zone, Green Zone / No-Development Zone, Residential, Commercial, Industrial, Agricultural]
                  description: Sanctioned zoning as the owner stated it. Open plots only; farm land is agricultural by definition. The four bare labels are retired from the wizard and kept for listings published under them.
                waterSource: { type: string, description: 'Borewell, canal, municipal and so on. Farm land only.' }
                openSides: { type: string, description: Sides of the plot that are open. Open plots only. }
                roadWidth: { type: string, description: Width of the approach road in feet. }
                plotLength: { type: string, description: Plot length in feet. }
                plotWidth: { type: string, description: Plot width in feet. }
                cornerPlot: { type: boolean }
                boundaryWall: { type: boolean }
                naStatus:
                  type: string
                  enum: ['', agricultural, deemed, sanctioned]
                  description: Non-agricultural conversion as the owner stated it. `sanctioned` requires an NA Order upload.
                otherRights:
                  type: string
                  enum: ['', clear, mortgage, tenancy, minor, dispute, unknown]
                  description: What the 7/12's Other Rights column records. Anything but `clear` is an encumbrance a buyer must check.
                buyerEligibility:
                  type: string
                  enum: ['', agriculturist, permission, converted, unknown]
                  description: Who may lawfully buy the parcel under s.63 of the Bombay Tenancy Act. Farm land for sale only.
                electricity: { type: boolean, description: Electricity connection on site. Farm land only. }
                roadAccess: { type: boolean, description: Motorable road access. Farm land only. }
                naSanctioned: { type: boolean, description: Retired in favour of `naStatus`. Present only on listings published before the change. }
                satbara: { type: boolean, description: Retired in favour of `otherRights`. Present only on listings published before the change. }
            progress:
              allOf: [ { $ref: '#/components/schemas/ListingProgress' } ]
              description: Present on the owner's own reads and staff reads; absent on public reads.
            adminPipeline:
              type: object
              nullable: true
              description: >
                Admin post-on-behalf onboarding pipeline (staff-created listings).


                **Absent for every audience but staff.** This says which listings the platform
                manufactured rather than received, and names the staff member who did it — it is for
                the desk that does the work. Consumer and owner surfaces omit the key entirely
                rather than sending an empty object, because an empty object would still disclose
                that such a thing exists.


                Also absent, even for staff, on listings the owner posted themselves: there is no
                hand-back to report on, and an object of all-false flags would put the listing on the
                board as work that never completes.
              properties:
                postedByAdmin: { type: boolean }
                postedByStaff:
                  type: [string, 'null']
                  description: >
                    User id of the staff member who created the listing. An id rather than a name so
                    a colleague changing their display name does not silently rewrite history.
                reminderCount:
                  type: integer
                  description: >
                    How many chasers have gone to this owner: a count over the outbound messages
                    themselves, not a column, so it cannot drift from the messages actually
                    prepared. See `listOwnerOutreach` for what those messages were.


                    `0` on the response to `createListingOnBehalf`, which is correct rather than
                    unimplemented: nobody can have chased an owner about a listing that did not
                    exist a moment ago. Everywhere else this object appears, the count is real —
                    and everywhere it would not be, the whole object is absent instead.
    PropertyModerationSummary:
      type: object
      description: >
        Moderation KPI counts over the whole `properties` table. Every counter except `archived` is
        floored to un-archived rows.
      required: [total, approved, pending, flagged, featured, recheck, archived, badgeRequests, unconfirmed]
      properties:
        total:
          type: integer
          description: Every un-archived listing, `sold` and `rented` included — a closed deal is still inventory.
        approved: { type: integer, description: Live and in search. }
        pending:
          type: integer
          description: >
            Awaiting a first moderation decision. `pending` is the only spelling of that state;
            `PropertyStatus` has no `Under Review`.
        flagged: { type: integer, description: Taken out of search by a moderator. }
        featured: { type: integer, description: Live listings whose ownership was verified in the last 7 days. }
        recheck:
          type: integer
          description: >
            Live or paused listings with a stays-live re-check owed (Q14), badge-only entries
            excluded (those are `badgeRequests`). Counted apart because these
            rows are live, un-archived and in search, so they raise none of the other counters —
            a moderator watching `pending` would never learn the queue existed.
        archived:
          type: integer
          description: Soft-deleted. The one counter that is not a subset of `total`.
        badgeRequests: { type: integer, description: Open Verified-badge requests. }
        unconfirmed: { type: integer, description: Live listings whose owner has not confirmed availability recently. }

    PropertyModerationRow:
      allOf:
        - $ref: '#/components/schemas/Property'
        - type: object
          required: [signals, ownerReplied]
          properties:
            signals: { $ref: '#/components/schemas/ListingSignals' }
            ownerReplied: { type: boolean, description: The owner has sent a case-file message the desk has not read }

    PropertyQueueRow:
      type: object
      description: >-
        A queue row: what the table, its chips and the quality score read, and nothing else. The
        owner's number is kept because the row prints it for the call. The whole listing is
        `getPropertyForModeration`.
      required: [id, status, recheckPending, featured, archived, ownerVerified, ownershipVerified, views, enquiries, docsCount, photoCount, descLength, amenityCount, signals, ownerReplied]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        propertyType: { type: string }
        bhk: { type: number }
        price: { type: integer }
        area: { type: number }
        areaUnit: { type: string }
        furnishing: { type: string }
        locality: { type: string }
        localitySlug: { type: string }
        city: { type: string }
        coverImage: { type: string }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        progress: { $ref: '#/components/schemas/ListingProgress' }
        createdAt: { type: string, format: date-time }
        lastConfirmedAt: { type: string, format: date-time }
        freshness: { type: string }
        resubmittedAt: { type: string, format: date-time }
        ownershipRequestedAt: { type: string, format: date-time }
        recheckPending: { type: boolean }
        recheckReason: { type: string }
        recheckChanges:
          type: array
          description: What the owner's edit changed, as `[{field, before, after}]` strings; absent when none.
          items:
            type: object
            required: [field, before, after]
            properties:
              field: { type: string }
              before: { type: string }
              after: { type: string }
        recheckRequestedAt: { type: string, format: date-time }
        featured: { type: boolean }
        archived: { type: boolean }
        ownerVerified: { type: boolean }
        ownershipVerified: { type: boolean }
        views: { type: integer }
        enquiries: { type: integer }
        docsCount: { type: integer }
        photoCount: { type: integer }
        descLength: { type: integer }
        amenityCount: { type: integer }
        facing: { type: string }
        floor: { type: integer }
        ageYears: { type: integer }
        deposit: { type: integer }
        availableFrom: { type: string }
        availableOn: { type: [string, 'null'], format: date }
        possession: { type: string }
        owner:
          type: object
          description: Raw mobile, on `properties:read`.
          properties:
            id: { type: string }
            name: { type: string }
            mobile: { type: string }
            verified: { type: boolean }
        adminPipeline:
          type: object
          description: Staff-posted listings only.
          properties:
            postedByAdmin: { type: boolean }
            postedByStaff: { type: string }
            reminderCount: { type: integer }
        signals: { $ref: '#/components/schemas/ListingSignals' }
        ownerReplied: { type: boolean, description: The owner has sent a case-file message the desk has not read }

    ListingSignals:
      type: object
      required: [possibleBroker, hardBlock, conflict, items]
      properties:
        possibleBroker:
          type: boolean
          description: True when any hard broker signal fired, or at least two soft broker signals fired.
        hardBlock:
          type: boolean
          description: True when a hard broker signal fired; the reviewer sees it as a warning and one staff approval still decides.
        conflict:
          type: boolean
          description: True when this listing has an unresolved cross-owner duplicate conflict.
        items:
          type: array
          items: { $ref: '#/components/schemas/ListingSignalItem' }

    ListingSignalItem:
      type: object
      required: [code, severity, detail]
      properties:
        code:
          type: string
          enum: [photo_match_other_account, brokerage_reports, many_societies, broker_wording, copied_description, many_localities_30d, duplicate_conflict]
        severity: { type: string, enum: [hard, soft] }
        detail: { type: string }

    DuplicateClusterReport:
      type: object
      description: >
        One rendering of the duplicates desk. Not a page — see `truncated` for why a clustering
        cannot be paged the way a list can.
      required: [clusters, scanned, truncated]
      properties:
        clusters:
          type: array
          items: { $ref: '#/components/schemas/DuplicateCluster' }
          description: Derived clusters, dismissals already removed.
        scanned:
          type: integer
          description: How many signal-carrying listings were actually clustered.
        truncated:
          type: boolean
          description: >
            The scan hit its ceiling, so `clusters` is not the whole answer. Reported rather than
            swallowed because a truncated clustering degrades **silently**: a pair split by the
            ceiling does not render as a partial cluster, it vanishes, and the desk looks cleaner
            than the catalogue is.

    DuplicateCluster:
      type: object
      description: >
        One derived group of listings that look like the same doorway. Computed per request and not
        stored, so `id` is a signature over its members rather than a row id.
      required: [id, reason, sameOwner, hints, listings]
      properties:
        id:
          type: string
          description: >
            SHA-256 over the members' sorted ids, lowercase hex. Doubles as the render key and as
            what a dismissal is recorded against — a derived cluster has no other stable identity,
            and keying on the member set is what makes a cluster that gained a member correctly
            come back unanswered.
          example: 3f2a9c1e7b40d85a6c1f0e2d9b7a4c83f15e6d2a90b3c47581ed6f2a3c9b0d41
        reason:
          type: string
          enum: [address, image, address+image]
          description: >
            Which arm fired. Sorted and joined, so the value is deterministic — an earlier
            derivation joined in encounter order and emitted both `address+image` and
            `image+address`, which the console had to carry two labels for.


            A cluster's reason is the union over its **pairs**, not a property of any one pair:
            {A,B} matching on address and {B,C} on photos yields one `address+image` cluster in
            which no single pair matched on both.
        sameOwner:
          type: boolean
          description: >
            Every listing here belongs to one account. Surfaced rather than filtered out, and
            labelled as such on the card: same-owner collisions are usually an owner who forgot they
            had already posted, which is a nudge rather than a moderation case.
        hints:
          type: array
          items: { $ref: '#/components/schemas/DuplicateClusterHint' }
          description: Staff-only soft cues for this already-derived cluster; never create-time duplicate arms.
        listings:
          type: array
          items: { $ref: '#/components/schemas/DuplicateClusterListing' }
          description: The members, newest first.

    DuplicateClusterListing:
      type: object
      description: One member of a cluster, as the side-by-side card prints it; the whole listing is `getPropertyForModeration`.
      required: [id, status, verified]
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        price: { type: integer }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        coverImage: { type: string }
        locality: { type: string }
        pincode: { type: string }
        verified: { type: boolean }
        createdAt: { type: string, format: date-time }
        owner:
          type: object
          description: Raw mobile, on `properties:read`.
          properties:
            id: { type: string }
            name: { type: string }
            mobile: { type: string }
            verified: { type: boolean }

    DuplicateClusterHint:
      type: object
      required: [code, severity, detail]
      properties:
        code: { type: string, enum: [same_society_bhk_area] }
        severity: { type: string, enum: [soft] }
        detail: { type: string }

    DuplicateMergeRequest:
      type: object
      description: "\"Keep this one, archive the others.\""
      required: [keepId, dropIds]
      properties:
        keepId:
          type: string
          format: uuid
          description: The listing that stays live.
        dropIds:
          type: array
          minItems: 1
          items: { type: string, format: uuid }
          description: >
            The listings to archive. Named explicitly rather than inferred from the cluster: the
            operator's screen and the server's derivation are two moments apart, and a listing that
            joined in between is one they never saw.

    DuplicateDismissRequest:
      type: object
      description: "\"These are not the same flat.\""
      required: [ids]
      properties:
        ids:
          type: array
          minItems: 2
          items: { type: string, format: uuid }
          description: >
            The cluster's members as the operator saw them. The signature is derived from these
            rather than accepted from the caller, so the verdict is recorded against the set that
            was actually on screen.

    Locality:
      type: object
      required: [slug, name, city, archived, liveListings, indexable]
      properties:
        slug: { type: string, example: koregaon-park }
        name: { type: string, example: Koregaon Park }
        city: { type: string, example: Pune }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        archived: { type: boolean, description: Retired; still listed only while live listings remain }
        liveListings: { type: integer, description: Approved, unarchived listings bound to this slug }
        indexable: { type: boolean, description: At least 3 live listings; otherwise the page is noindex and left out of the sitemap }
        avgRent: { type: [integer, 'null'], description: Average monthly rent of live rent flats (INR); null below 3 samples }
        ratePerSqft: { type: [integer, 'null'], description: Average asking rate of live sale flats (INR/sqft); null below 3 samples }
        fromPrice: { type: [integer, 'null'], description: Lowest live asking price, rent or sale (INR) }
        forSale: { type: integer, description: Live sale listings; with forRent, sums to liveListings }
        forRent: { type: integer, description: Live rent listings }
        fromSale: { type: [integer, 'null'], description: Lowest live sale price (INR) }
        fromRent: { type: [integer, 'null'], description: Lowest live monthly rent (INR) }
    LocalitySummary:
      type: object
      required: [slug, name, city]
      properties:
        slug: { type: string, example: baner }
        name: { type: string, example: Baner }
        city: { type: string, example: Pune }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
    LocalityResolve:
      type: object
      required: [placeId, name]
      description: What the client says the picked place is; only the local-dev lookup trusts it.
      properties:
        placeId: { type: string, minLength: 1, maxLength: 300, pattern: '^[A-Za-z0-9_-]+$' }
        name: { type: string, minLength: 1, maxLength: 160 }
        lat: { type: [number, 'null'], minimum: -90, maximum: 90 }
        lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
        types: { type: array, maxItems: 20, items: { type: string, maxLength: 60 }, description: Google place types }
    OnBehalfListingCreate:
      type: object
      required: [ownerMobile, listing]
      description: >
        Body of `createListingOnBehalf`. A wrapper around the ordinary `ListingCreate` rather than a
        parallel shape, so the listing an operator types and the listing an owner types are validated
        identically.
      properties:
        ownerMobile:
          $ref: '#/components/schemas/Mobile'
        ownerName:
          type: string
          maxLength: 120
          description: >
            Used only if the account has to be created. Ignored for an existing account — an
            operator's transcription of a name heard over the phone must not overwrite what the
            owner typed themselves.
        listing:
          $ref: '#/components/schemas/ListingCreate'
    OpsEnquiry:
      type: object
      description: >
        One contact request on the ops demand board. Not `ContactRequest`: that is the owner's view
        of their own inbox. The mobile is in full on the list and on the audited detail.
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyTitle: { type: string, nullable: true, description: Null if the listing is gone }
        locality: { type: string, nullable: true, description: Locality slug }
        requesterName: { type: string, nullable: true }
        requesterMobile: { type: string, nullable: true }
        status: { type: string, enum: [pending, approved, declined] }
        createdAt: { type: string, format: date-time }
    OpsVisit:
      type: object
      description: One site visit on the ops demand board.
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyTitle: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        visitorName: { type: string, nullable: true }
        visitorMobile: { type: string, nullable: true }
        slot: { type: string, format: date-time }
        mode: { type: string, enum: [in-person] }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled] }
        createdAt: { type: string, format: date-time }
    OpsDeal:
      type: object
      description: >
        One deal on the ops demand board. `agreedPrice` and `closedAt` are null until the deal
        closes, so a GMV sum over this collection counts closed deals by construction.
      properties:
        id: { type: string, format: uuid }
        propertyId: { type: string, format: uuid }
        propertyTitle: { type: string, nullable: true }
        locality: { type: string, nullable: true }
        deal: { $ref: '#/components/schemas/DealIntent' }
        counterpartyName:
          type: string
          nullable: true
          description: Null for an off-platform close against a number that belongs to no account
        counterpartyMobile: { type: string, nullable: true }
        agreedPrice: { type: integer, nullable: true, description: Whole INR, set on close }
        status: { type: string, enum: [active, reserved, closed] }
        closedAt: { type: string, format: date-time, nullable: true }
        createdAt: { type: string, format: date-time }
    Society:
      type: object
      description: A directory, search or follow-list card. Provenance and admin fields live on the admin routes.
      properties:
        id: { type: string, format: uuid, description: Bound onto a listing by the wizard }
        slug: { type: string, example: kumar-pinnacle }
        name: { type: string }
        builder: { type: string }
        localitySlug: { type: string }
        lat: { type: number }
        lng: { type: number }
        year: { type: integer, description: Year built / possession }
        rera: { type: [string, 'null'], description: MahaRERA registration id; empty if none }
        listingCount: { type: integer }
        avgRating:
          type: [number, 'null']
          description: >-
            Average published rating, computed on read. Null — not 0 — when the society has no
            reviews: no rating is not a rating of zero, and a card rendering 0.0 for an unreviewed
            society states something false about it. On the directory as well as the hub because
            the cards show a star; resolving it per card would be one request per row.
        reviewCount:
          type: integer
          description: >-
            How many published reviews the average is over. Without it the average is unreadable —
            4.9 from one review is not 4.9 from two hundred.
    SocietyBrief:
      type: object
      description: What a listing page or a search chip shows about its society.
      properties:
        slug: { type: string }
        name: { type: string }
        builder: { type: string }
        units: { type: integer }
        towers: { type: integer }
        year: { type: integer }
        occupancy: { type: number }
        avgRating: { type: [number, 'null'], description: Weighted over the merge family; null when unreviewed }
        reviewCount: { type: integer }
    SocietyHome:
      type: object
      description: One of the six newest live homes on a society hub.
      properties:
        id: { type: string, format: uuid }
        slug: { type: [string, 'null'] }
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        bhk: { type: [number, 'null'] }
        price: { type: integer }
        area: { type: [number, 'null'] }
    SocietyCandidate:
      type: object
      description: A member-added society on the ops candidate queue.
      properties:
        slug: { type: string }
        name: { type: string }
        localitySlug: { type: [string, 'null'] }
        mintOrigin: { type: [string, 'null'], enum: [demand, listing, null] }
        createdAt: { type: string, format: date-time }
    LocalityAdminRow:
      type: object
      description: A row of the staff locality list.
      properties:
        slug: { type: string }
        name: { type: string }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        archived: { type: boolean }
        liveListings: { type: integer, format: int64 }
    SocietyDirectoryRow:
      type: object
      description: A row of the staff society directory.
      properties:
        slug: { type: string }
        name: { type: string }
        builder: { type: [string, 'null'] }
        localitySlug: { type: [string, 'null'] }
        year: { type: [integer, 'null'] }
        maintenancePerSqft: { type: [number, 'null'] }
    SocietyDetail:
      type: object
      description: The society hub. Counts and averages are computed over the merge family's live homes.
      properties:
        slug: { type: string }
        name: { type: string }
        builder: { type: string }
        localitySlug: { type: string }
        lat: { type: number }
        lng: { type: number }
        placeId: { type: [string, 'null'], description: Google Place ID for the approved society pin; null until one is recorded. }
        year: { type: integer }
        towers: { type: integer }
        units: { type: integer }
        occupancy: { type: number, description: Occupancy percentage (0-100) }
        maintenancePerSqft: { type: number }
        parkingRatio: { type: number }
        lifts: { type: integer }
        security:
          type: [string, 'null']
          example: 3-tier + CCTV
          description: >-
            Security arrangement, free text. Spec fix S25: was a boolean. "Gated", "3-tier + CCTV"
            and "Guard at gate only" are materially different to somebody choosing where to live,
            and a boolean discards that difference while pretending to answer the question.
        water: { type: string }
        power: { type: string }
        petPolicy: { type: string }
        vegPolicy: { type: string }
        rera: { type: [string, 'null'] }
        amenities: { type: array, items: { type: string } }
        listingCount: { type: integer }
        forSale: { type: integer }
        forRent: { type: integer }
        psf: { type: [integer, 'null'], description: Average asking INR/sqft of live sale homes }
        rentAvg: { type: [integer, 'null'], description: Average monthly rent of live rent homes }
        homes:
          type: array
          maxItems: 6
          items: { $ref: '#/components/schemas/SocietyHome' }
    SocietyCreate:
      type: object
      description: >
        A Google Place pick. Everything but `placeId` is a hint: the server stores Google's name and
        pin, and falls back to `name`/`lat`/`lng` only where Google is not configured (local dev).
      required: [placeId]
      properties:
        placeId: { type: string, minLength: 1, maxLength: 255, pattern: '^[A-Za-z0-9_-]+$', description: The Google Place ID; the society's identity }
        name: { type: string, maxLength: 160, example: Kumar Pinnacle, description: Hint only; must not carry contact details }
        localityLabel: { type: string, maxLength: 120, description: Human-readable locality as the member typed it }
        localitySlug: { type: string, maxLength: 120, description: 'A live locality picked from the suggestions; a slug that is not live is a 422' }
        lat: { type: [number, 'null'], minimum: -90, maximum: 90, description: Optional map pin; a missing pin does not block the mint, but one outside the served city is a 422 }
        lng: { type: [number, 'null'], minimum: -180, maximum: 180 }
        mintOrigin:
          type: string
          enum: [demand, listing]
          description: >-
            Which surface the caller is on. Optional: omitting it defaults to `listing`, so a client
            shipped before this field keeps working. The default under-reports demand rather than
            inventing it, which is the safe direction — fabricated demand would send an operator to
            source inventory in a building nobody asked about. An unrecognised value is a 422 rather
            than a silent discard, because a value that never matches `demand` downstream would
            leave the building sitting in the ops queue looking like supply forever.
    SocietyResolve:
      type: object
      required: [society, candidates]
      properties:
        society: { oneOf: [{ $ref: '#/components/schemas/Society' }, { type: 'null' }] }
        candidates:
          type: array
          maxItems: 3
          items: { $ref: '#/components/schemas/Society' }
    SocietyMerge:
      type: object
      description: >
        One duplicate society folded into the one that survives it. A pointer and not a move: every
        row referencing the duplicate stays where it is and the reads union the two together, which
        is what lets the merge be undone.
      required: [slug, name, intoSlug, intoName]
      properties:
        slug:
          type: string
          description: The society that was merged away. Absent from the directory while this stands.
        name: { type: string, example: Kumar Pinacle }
        intoSlug:
          type: string
          description: The society that survives, and the one this slug now resolves to.
        intoName: { type: string, example: Kumar Pinnacle }
        mergedAt: { type: string, format: date-time }
    SocietyDuplicateSuggestion:
      type: object
      description: >
        One society a queued candidate might be a second copy of. A hint an operator reads, not a
        decision anything acts on -- the merge it points at is a separate, explicit call.
      required: [slug, name, score]
      properties:
        slug: { type: string, example: kumar-pinnacle-wakad }
        name: { type: string, example: Kumar Pinnacle }
        localitySlug:
          type: string
          nullable: true
          description: Null for the many RERA rows that were imported without one.
        score:
          type: number
          format: double
          example: 0.75
          description: >-
            Shared distinctive name tokens over the distinct words in either name, plus 0.25 for
            sharing a locality. Not a probability, and deliberately on the wire rather than implied
            by the ordering -- a bare ranking hides how close second place was.
    SocietyMergeCreate:
      type: object
      required: [from, into]
      properties:
        from:
          type: string
          description: Slug of the duplicate — the society that stops standing on its own.
        into:
          type: string
          description: >-
            Slug of the survivor. Must not already be merged away itself: chains are refused rather
            than collapsed, because collapsing them cannot be undone.
    City:
      type: object
      properties:
        slug: { type: string, example: pune }
        name: { type: string, example: Pune }
        live: { type: boolean }
        listingCount: { type: integer }
    CityWaitlistRequest:
      type: object
      required: [mobile, city]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        city:
          type: string
          maxLength: 120
          pattern: '^\s*\p{L}[\p{L}\p{M} .''-]*$'
          description: A place name - letters, spaces, and . ' - only.
        email: { type: string, format: email }
    CityAdminUpdate:
      type: object
      required: [live]
      properties:
        live:
          type: boolean
          description: Whether the city is launched for shoppers.
    Fees:
      type: object
      description: Transparent fee/charges breakdown for a deal.
      properties:
        deal: { $ref: '#/components/schemas/DealIntent' }
        brokerage: { $ref: '#/components/schemas/Money' }
        platformFee: { $ref: '#/components/schemas/Money' }
        stampDuty: { $ref: '#/components/schemas/Money', description: 'Omitted when the duty is not a flat published figure and is computed per transaction instead — which is both deals: leave-and-licence duty is 0.25% of a consideration built from the rent, term and deposit, and sale duty is 5-7% of the higher of agreement value and ready reckoner rate. **Absent is not zero.** A client that renders a missing value as ₹0 is telling the customer the state waived a charge it did not.'}
        registration: { $ref: '#/components/schemas/Money', description: 'Omitted when the fee depends on the registering body (rent: ₹1,000 municipal / ₹500 rural). Present for `buy`, where it is 1% capped at ₹30,000. Absent is not zero.'}
        notes: { type: string }
    ListingFormDetails:
      type: object
      additionalProperties: false
      description: >-
        Supplemental owner-edit answers, visible only to the owner and authorized staff.
        Canonical listing fields and trust flags are not accepted here. Supplied objects replace
        the previous answers; omitted or null leaves them unchanged. Strings are single-line
        without control characters. Existing combined addresses are never split heuristically.
      properties:
        flatNumber: { type: string, maxLength: 20 }
        tower: { type: string, maxLength: 30 }
        society: { type: string, maxLength: 60 }
        street: { type: string, maxLength: 60 }
        landmark: { type: string, maxLength: 60 }
        commercialType:
          type: string
          enum: ['', office, shop, retail, warehouse, industrial, coworking]
          description: >-
            `coworking` is retired from the wizard but stays legal: listings published under it are
            still live, and a re-save that rejected it would force the owner to relabel.
        ownership:
          type: string
          enum: ['', Freehold, Leasehold, Co-operative Society, Power of Attorney, MIDC / Industrial Lease]
        loanAvailable: { type: boolean }
        agreementDuration: { type: string, maxLength: 80 }
        lockIn: { type: string, maxLength: 80 }
        noticePeriod: { type: string, maxLength: 80 }
        foodPref: { type: string, maxLength: 80 }
        petsPolicy: { type: string, maxLength: 80 }
        bestTimeToCall: { type: string, enum: ['', anytime, morning, afternoon, evening] }
        listerRelation: { type: string, enum: [owner, family], description: 'Whole-place lister relation; absent means owner.' }
        availableFrom: { type: string, maxLength: 10, description: 'ISO calendar date or empty; not the public availability bucket.' }
        possession: { type: string, maxLength: 80, description: 'Wizard handover choice, distinct from construction status.' }
        rentMaintMode: { type: string, maxLength: 80 }
        furniture: { type: array, maxItems: 30, items: { type: string, maxLength: 80 } }
        fixtures:
          type: array
          maxItems: 30
          items:
            type: string
            enum:
              - Server / UPS Room
              - Meeting Cabins
              - Reception Area
              - Conference Room
              - False Ceiling
              - Central AC
              - Main-Road Frontage
              - Display Windows
              - Rolling Shutter
              - Signage Space
              - Mezzanine Floor
              - Customer Washroom
              - Loading Bay / Dock
              - High Ceiling
              - 3-Phase Power
              - Wide Truck Access
              - Crane / Gantry Support
              - Covered Yard
        suitableFor:
          type: array
          maxItems: 30
          items:
            type: string
            enum: [Office, Retail, Restaurant, Clinic, Showroom, Warehouse, Bank / ATM, Gym / Studio]
        preferredTenants: { type: array, maxItems: 30, items: { type: string, maxLength: 80 } }
        plotArea: { type: string, maxLength: 80 }
        floorsInHouse: { type: string, maxLength: 80 }
        washrooms:
          type: string
          enum: ['', '0', '1', '2', '3', '4+']
        shellType:
          type: string
          enum: ['', bareShell, warmShell, furnished]
        powerBackup: { type: boolean }
        pantry: { type: boolean }
        camCharges: { type: string, maxLength: 80, description: 'Common-area maintenance, rupees per sq.ft per month. The only maintenance a commercial listing states.' }
        fitOutMonths:
          type: string
          enum: ['', '0', '1', '2', '3', '6']
        escalationPct: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        tenancyStatus:
          type: string
          enum: ['', vacant, leased]
        inPlaceRent: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        leaseExpiry: { type: string, maxLength: 10, description: 'ISO calendar date or empty.' }
        seatCount: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        frontage: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        floorLoad: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        clearHeight: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        sanctionedPower: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        dockCount: { type: string, pattern: '^$|^\d{1,9}(\.\d{1,2})?$' }
        plotLength: { type: string, maxLength: 80 }
        plotWidth: { type: string, maxLength: 80 }
        openSides: { type: string, maxLength: 80 }
        roadWidth: { type: string, maxLength: 80 }
        cornerPlot: { type: boolean }
        boundaryWall: { type: boolean }
        plotZone:
          type: string
          enum: ['', Residential (R1), Residential (R2), Commercial (C-1), Industrial (I-1), Public / Semi-public, Mixed-Use, Agriculture Zone, Green Zone / No-Development Zone, Residential, Commercial, Industrial, Agricultural]
          description: >-
            Sanctioned zoning, in the owner's vocabulary — the label a Zone Certificate carries.
            Translated on the way in into the top-level `landUse`, which is what the Land-use filter
            reads — so a label outside this list maps to nothing and publishes a plot that its own
            filter cannot find. The four bare labels are retired from the wizard and accepted only
            so plots published under them can be re-saved.
        naStatus:
          type: string
          enum: ['', agricultural, deemed, sanctioned]
          description: >-
            Whether the parcel has been converted to non-agricultural use. `deemed` is the
            conversion s.42B/42C of the Maharashtra Land Revenue Code grants without an order;
            `sanctioned` is an order the owner holds, and claiming it requires an NA Order upload.
        otherRights:
          type: string
          enum: ['', clear, mortgage, tenancy, minor, dispute, unknown]
          description: >-
            What the 7/12 extract's Other Rights column records. Anything but `clear` is an
            encumbrance that survives the sale, so the buyer must be told before they pay a token.
        buyerEligibility:
          type: string
          enum: ['', agriculturist, permission, converted, unknown]
          description: >-
            Who may lawfully buy the parcel. s.63 of the Bombay Tenancy and Agricultural Lands Act
            bars a non-agriculturist from buying agricultural land without Collector permission.
            Farm land for sale only.
        naSanctioned: { type: boolean, description: Retired in favour of `naStatus`. }
        waterSource: { type: string, maxLength: 80 }
        electricity: { type: boolean }
        roadAccess: { type: boolean }
        satbara: { type: boolean, description: Retired in favour of `otherRights`. }
    ListingFields:
      type: object
      properties:
        pincode: { type: string, pattern: '^$|^[1-9][0-9]{5}$' }
        carpetArea: { type: number, exclusiveMinimum: 0 }
        builtUpArea: { type: number, exclusiveMinimum: 0 }
        superBuiltUpArea: { type: number, exclusiveMinimum: 0 }
        availableFrom:
          type: string
          enum: ['', now, '15', '30']
          deprecated: true
          description: >-
            Legacy move-in bucket, accepted for one release and converted to a date (now = today,
            15 = today + 15, 30 = today + 30, IST). Ignored when `availableOn` is sent.
        availableOn:
          type: string
          pattern: '^$|^[0-9]{4}-[0-9]{2}-[0-9]{2}$'
          description: >-
            ISO date the home is free from (for a sale, the possession date). On create it must be today
            (IST) up to today + 365 days for rent or today + 5 years for sale; an update accepts any date
            up to the same limit so an echoed stale value does not fail an
            unrelated edit. Empty on update clears it; absent leaves it alone. Not a foundation
            edit, so it never re-enters moderation. A ready-to-move sale carries no date; it is cleared.
        pets:
          type: boolean
          nullable: true
          description: >-
            Owner-declared pet policy. Absent on an update leaves it alone; `clearPets` returns it
            to unstated.
        formDetails: { $ref: '#/components/schemas/ListingFormDetails' }
        title: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        propertyType: { $ref: '#/components/schemas/PropertyTypeLabel' }
        bhk: { type: number, description: Ignored (stored null) for commercial, plot and farm land. }
        price:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: >-
            Greater than 0; at most 10,000,000,000 (Rs 1,000 Cr) for a `buy` listing and 10,000,000
            (Rs 1 Cr) a month for `rent`.
        deposit: { $ref: '#/components/schemas/Money' }
        maintenance: { $ref: '#/components/schemas/Money' }
        negotiable: { type: boolean }
        area: { type: number, exclusiveMinimum: 0, description: Greater than 0 and at most 10,000 acres in whatever unit is stated. }
        areaUnit:
          type: string
          default: sqft
          enum: [sqft, sqyd, sqm, guntha, acre, hectare]
          description: >-
            Unit the stated area is measured in. Rendered verbatim beside the number, so it is an
            allowlist rather than free text. Absent means sq.ft. Only the units the wizard offers for the
            type are accepted: plot sqft, sqyd, sqm, guntha; farm land acre, guntha, hectare; anything
            else sqft.
        landUse:
          type: string
          enum: [residential, commercial, industrial, agricultural, mixed]
          description: >-
            Permitted zoning, for an open plot or farm land only. The wizard derives it from the
            owner's `plotZone` answer — farm land is never asked and is agricultural by definition.
            Absent leaves it unstated, which is correct for anything with a building on it: a flat
            has no land use of its own. Blank is not accepted; the column does not permit it. Sending it
            for any other type is a 422.
        furnishing: { $ref: '#/components/schemas/Furnishing' }
        locality: { type: string, description: 'Display name; must be a live locality (422 "Pick the locality from the suggestions."). The stored name is the locality''s canonical one.' }
        localitySlug: { type: string, description: 'The picked live locality. Wins over `locality`. On edit an unchanged retired binding is kept.' }
        city: { type: string }
        lat: { type: number, format: double, minimum: -90, maximum: 90 }
        lng: { type: number, format: double, minimum: -180, maximum: 180 }
        reraId: { type: string }
        possession: { $ref: '#/components/schemas/PropertyPossession' }
        tenants:
          type: array
          maxItems: 5
          items: { type: string, enum: [family, bachelors, bachelor-male, bachelor-female, company, anyone] }
        amenities: { type: array, items: { type: string } }
        images:
          type: array
          maxItems: 20
          items: { type: string, format: uri-reference }
          description: >-
            At most `GET /bootstrap`'s `listingPolicy.maxPhotos` (an admin setting, 10 by default); more is a `422`.
            URLs returned by `POST /me/photos`, exactly as returned. Any other URL, or one with a query or fragment added,
            is a `422` - except, on PATCH, a URL the listing already holds.
        floorPlan:
          type: string
          maxLength: 512
          description: >-
            The gallery photo the owner tagged as the floor plan, under the same upload rule as `images`. Not required to appear in `images`.
            On PATCH, omit to leave the stored plan alone; send an empty string to withdraw it.
        video:
          type: string
          pattern: '^$|^[A-Za-z0-9_-]{11}$'
          description: Optional normalised YouTube video id. Send an empty string on PATCH to withdraw it.
        description: { type: string }
        # The duplicate-detection inputs. None is required — a bulk meter has no number, a plot no
        # floor, a standalone building no society — so the rule reads what is present, else silent.
        address: { type: string, description: Street address; normalised server-side into a duplicate key }
        floor: { type: integer, minimum: 0, description: Which floor the unit is on (0 is Ground) }
        societyId:
          type: string
          pattern: '^$|^[0-9A-Fa-f]{8}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{4}-[0-9A-Fa-f]{12}$'
          description: >-
            The society this unit sits in (a uuid). On update, omitted or null keeps the current binding
            and an empty string removes it; the id is checked only when it differs from the current one,
            so a listing bound to a since-retired society stays editable.
        electricityMeterNo:
          type: string
          description: >-
            The unit's electricity meter number. Write-mostly: the duplicate probe reads it
            server-side, and it is returned only to the listing's owner and to staff, never on the
            public listing response.
        # The detail answers the posting wizard collects. facing and totalFloors exist on the read
        # side (`Property`) and must exist here too, or they read back empty forever.
        bathrooms: { type: integer, minimum: 0, description: Bathroom count. Omit rather than guess }
        parking: { type: integer, minimum: 0, description: Dedicated slots conveyed with the unit }
        balconies: { type: integer, minimum: 0, description: Balcony count }
        facing:
          type: string
          maxLength: 32
          description: >-
            Compass direction the main door or balcony faces. Deliberately not an enum: the column
            has no CHECK and existing rows hold values the wizard's four options do not cover, so
            constraining it here would reject bodies the database still accepts.
        overlooking:
          type: string
          maxLength: 32
          description: >-
            What the home looks out onto — garden, amenity, parking, main road. Split out of
            `facing` in V19, and unconstrained for the same reason: a home has a direction and a
            view independently, so one field could only ever hold one of the two.
        totalFloors: { type: integer, minimum: 1, description: Floors in the building }
        ageYears:
          type: integer
          minimum: 0
          description: >-
            Construction age in whole years. The wizard collects a band and sends its lower bound,
            which is lossless because the bands have distinct floors (0, 1, 5, 10, 15). Omitted for
            an under-construction property — that is a possession state, and `possession` carries
            it. Absent means unstated, which is not zero.
    ListingCreate:
      allOf:
        - $ref: '#/components/schemas/ListingFields'
        - type: object
          required: [title, deal, propertyType, price, locality, city]
    ListingUpdate:
      allOf:
        - $ref: '#/components/schemas/ListingFields'
        - type: object
          description: All fields optional on update (PATCH semantics).
          properties:
            clearMaintenance:
              type: boolean
              description: Removes a previously stated maintenance amount when true.
            clearPets:
              type: boolean
              description: >-
                Returns the pet policy to unstated when true. Needed because an absent `pets` means
                "leave it alone", so there is otherwise no way to take a claim back.
            clearLandUse:
              type: boolean
              description: >-
                Drops the stated zoning when true, for a plot re-typed to something that has none.
                The column admits no blank, so there is no value to send instead.
    ListingDuplicateCheck:
      type: object
      description: >-
        The subset of `ListingCreate` the duplicate rule actually reads. Same field names and same
        limits, deliberately: the server derives the comparison key from this body by the same calls
        the create makes, so any divergence here would mean the pre-check answered about a different
        property than the one about to be posted.


        Nothing is required — a wizard asks on every submission and most listings carry neither
        signal. With both absent the answer is `found: false` without a query, because there is
        nothing to compare.


        No `excludeId`: the only question this route answers is asked before a create, so there is
        never a listing to exclude. An edit does not ask it.
      properties:
        address: { type: string, maxLength: 300, description: Street address as typed; normalised server-side }
        locality: { type: string, description: 'Display name; matched to a live locality for the slug the address key is scoped by' }
        localitySlug: { type: string, description: 'The picked live locality; wins over `locality`' }
        city: { type: string }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        electricityMeterNo: { type: string, maxLength: 64 }
    ListingDuplicateVerdict:
      type: object
      required: [found]
      properties:
        found: { type: boolean, description: Whether the caller already has a live or in-review listing for this unit }
        existingId:
          type: string
          format: uuid
          nullable: true
          description: >-
            The caller's existing listing, when `found`. A real server id, which is the point — the
            browser-side check this replaced could only name ids from its own local store, so the
            "edit the one you have" link it offered pointed at nothing. Resolves through
            `getMyListing`. No slug is returned: listings are not given one on create, so it would be
            null for every listing this route can name.
    PropertyStatusUpdate:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [pending, approved, rejected]
          description: Moderation decision. Use flagProperty / archiveProperty for the other states.
        reason: { type: string, description: Recorded on the audit row; required by convention when rejecting }
        reasonCode:
          type: string
          nullable: true
          enum: [photos_not_real, duplicate, broker, wrong_details, locality_unclear, document_unreadable, name_mismatch, rera_not_found, rera_mismatch, other, null]
          description: Required when status is rejected. `other` also requires reason.
        expectedStatus:
          type: string
          nullable: true
          description: The status the caller last saw; 409 stale_decision if it changed. Required unless the listing is pending (or the call only clears an approved listing's re-check), so a concurrent second verdict cannot land on top of the first.
    Offer:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        from: { $ref: '#/components/schemas/Party' }
        amount: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, countered, accepted, declined, withdrawn] }
        message: { type: string }
        createdAt: { type: string, format: date-time }
        moveIn: { type: string, format: date }
        history:
          type: array
          description: Negotiation trail.
          items:
            type: object
            properties:
              amount: { $ref: '#/components/schemas/Money' }
              by: { type: string, enum: [buyer, owner] }
              at: { type: string, format: date-time }
    OfferCreate:
      type: object
      required: [propertyId, amount]
      properties:
        propertyId: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        message: { type: string }
        moveIn: { type: string, format: date }
    OfferResponse:
      type: object
      required: [action]
      properties:
        action: { type: string, enum: [accept, decline, counter] }
        counterAmount: { $ref: '#/components/schemas/Money' }
        message: { type: string }
    Visit:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        propertyTitle: { type: [string, 'null'], description: Null if the listing is gone }
        propertySlug: { type: [string, 'null'] }
        visitor: { $ref: '#/components/schemas/Party' }
        slot: { type: string, format: date-time }
        mode: { type: string, enum: [in-person] }
        status: { type: string, enum: [scheduled, confirmed, completed, cancelled, no-show] }
        createdAt: { type: string, format: date-time }
        note: { type: string, nullable: true, description: The visitor's message with the booking. }
    VisitCreate:
      type: object
      required: [propertyId, slot]
      properties:
        propertyId: { type: string }
        slot: { type: string, format: date-time, description: Must be in the future, or 422. }
        mode: { type: string, enum: [in-person], default: in-person }
        note: { type: string }
    VisitSlotUpdate:
      type: object
      required: [slot]
      properties:
        slot: { type: string, format: date-time, description: Must be in the future, or 422. }
    Deal:
      type: object
      description: A closed/closing deal aggregate (owner ↔ counterparty lifecycle).
      properties:
        id: { type: string }
        propertyId: { type: string }
        deal: { $ref: '#/components/schemas/DealIntent' }
        counterparty: { $ref: '#/components/schemas/Party' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [active, reserved, closed] }
        closedAt: { type: string, format: date-time }
    DealCloseRequest:
      type: object
      required: [agreedPrice, counterpartyMobile]
      properties:
        agreedPrice: { $ref: '#/components/schemas/Money' }
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        note: { type: string }

    StaffCreate:
      type: object
      required: [name, mobile, email, role]
      properties:
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: string, format: email }
        role: { type: string, enum: [staff, manager] }
        functions:
          type: array
          description: Function names from `GET /admin/function-catalogue`. Ignored for managers.
          items: { type: string, example: 'desk:rental' }
    StaffCreateResponse:
      type: object
      required: [user, inviteUrl]
      properties:
        user: { $ref: '#/components/schemas/User' }
        inviteUrl: { type: string, format: uri }
    StaffInviteResponse:
      type: object
      required: [inviteUrl]
      properties:
        inviteUrl: { type: string, format: uri }
    MessageTemplate:
      type: object
      description: >
        One piece of approved outreach copy. `body` arrives un-rendered, with `{placeholder}` tokens
        intact, so a console can preview it as the operator chooses; substitution happens on the
        server at send, from the listing and its owner, never from anything the client supplies.
      required: [id, channel, category, name, body]
      properties:
        id:
          type: string
          description: >-
            A slug, not a UUID, and deliberately: it is written by hand into outreach requests and
            read in the log, so it is meant to be legible.
          example: wa-photos
        channel: { type: string, enum: [whatsapp, sms, email] }
        category:
          type: string
          enum: [onboarding, reminder, notification, advice, verification]
          description: What the message is for, used to group the picker.
        name: { type: string, example: 'Photo request' }
        body:
          type: string
          description: >-
            The template text. Known placeholders are `{owner_name}`, `{owner_mobile}`, `{title}`,
            `{locality}`, `{price}`, `{listing_id}`, `{staff_name}` and `{claim_link}`. A token with
            no value is left standing as literal text rather than blanked, so an unresolved variable
            is visible in the preview instead of arriving at an owner as a missing word.
    PreparedMessage:
      type: object
      description: >
        A message the server has rendered, recorded, and handed back for a human to send.
      required: [id, body, status, handoffLink]
      properties:
        id: { type: string, format: uuid, description: The ledger row, as returned by `listOwnerOutreach`. }
        body:
          type: string
          description: The rendered text, exactly as it will appear on the owner's phone.
        status:
          type: string
          enum: [prepared, sent, failed]
          description: >-
            Always `prepared` today. `sent` and `failed` exist because the transmitter is a seam:
            substituting a Business Solution Provider for click-to-chat would change which of these
            a row can reach and nothing else about this contract. Until then the server declines to
            claim delivery it cannot observe.
        handoffLink:
          type: string
          format: uri
          description: >-
            A `wa.me` link addressed to the owner's own number, carrying the rendered body. Opening
            it is the send.
          example: 'https://wa.me/919876543210?text=Hi%20Ramesh...'
    OutreachEntry:
      type: object
      description: >
        One message prepared for this listing's owner. This log is what a colleague reads before
        picking up the phone, which is why `preparedBy` names a person rather than "the platform".
      required: [id, templateId, channel, body, status, preparedBy, preparedAt]
      properties:
        id: { type: string, format: uuid }
        templateId: { type: string, example: wa-photos }
        channel: { type: string, enum: [whatsapp, sms, email] }
        body: { type: string, description: The rendered text as it was at the time it was prepared. }
        status: { type: string, enum: [prepared, sent, failed] }
        preparedBy:
          type: string
          format: uuid
          description: The staff account that prepared it.
        preparedAt:
          type: string
          format: date-time
          description: >-
            Wall-clock time at insert, not transaction start, so two messages prepared in one unit of
            work still order against each other. Ordering is the point of this list.
    BackOfficeFunction:
      type: object
      required: [name, label, group, atoms]
      properties:
        name: { type: string, example: 'desk:rental' }
        label: { type: string, example: 'Rent Agreement' }
        group: { type: string, enum: [Verification, Listings, Service desks, Support, Content] }
        atoms:
          type: array
          items: { type: string, example: 'services:read' }
        desk: { type: [string, 'null'], example: rental }
    TeamMember:
      type: object
      required: [id, role, status, archived, functions]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        mobile: { type: string, example: '9000000000' }
        email: { type: [string, 'null'] }
        role: { type: string, enum: [staff, manager, admin] }
        status: { type: string, enum: [active, suspended, archived] }
        archived: { type: boolean, description: Soft-deleted; the console shows it as suspended. }
        createdAt: { type: string, format: date-time }
        functions:
          type: array
          items: { type: string, example: 'desk:rental' }
    TeamAssignee:
      type: object
      required: [id, desks]
      properties:
        id: { type: string, format: uuid }
        name: { type: [string, 'null'] }
        desks:
          type: array
          items: { type: string, example: rental }
    BackOfficePermissionsRequest:
      type: object
      required: [functions]
      properties:
        functions:
          type: array
          description: >-
            The function names to store, from `GET /admin/function-catalogue`. Empty leaves only
            always-on dashboard access for staff.
          items: { type: string, example: 'desk:rental' }
        permissions:
          type: array
          deprecated: true
          description: Legacy alias for `functions` during the console migration.
          items: { type: string }
    BackOfficeAccess:
      type: object
      description: >
        One back-office account's stored functions, derived atoms and desk scopes. `permissions` is
        a legacy alias of `functions` until the console migration is complete.
      required: [userId, role, scoped, functions, permissions, effective, desks]
      properties:
        userId: { type: string, format: uuid }
        role:
          $ref: '#/components/schemas/Role'
        scoped:
          type: boolean
          description: Whether a function document exists at all.
        functions:
          type: array
          description: Stored function names. Empty if the row is unreadable.
          items: { type: string }
        permissions:
          type: array
          deprecated: true
          description: Legacy alias of `functions`.
          items: { type: string }
        effective:
          type: array
          description: The atom set this account may actually use right now.
          items: { type: string }
        desks:
          type: array
          description: Desk scopes derived from stored functions. Empty for managers and admins.
          items: { $ref: '#/components/schemas/Team' }
    IdentityDocType:
      type: string
      enum: [aadhaar, pan, driving_licence, passport, voter_id]
      description: Which government ID was captured. `aadhaar` and `voter_id` need front and back; the others are single-sided.
    IdentityDisputeRequest:
      type: object
      properties:
        note: { type: [string, 'null'], maxLength: 500 }
    IdentityDisputeResponse:
      type: object
      required: [ticketId]
      properties:
        ticketId: { type: string, format: uuid }
    IdentityVerificationStatus:
      type: string
      enum: [none, pending, verified, rejected, revoked]
      description: '`none` — never submitted; `pending` — awaiting staff review; `rejected` or `revoked` — retake allowed within the attempt budget.'
    IdentityClaims:
      type: object
      description: >
        What the on-device OCR read off the document. Claims, not facts: the server stores only a
        keyed hash of `number` plus its last 4 digits, and the reviewer confirms every field against
        the image before approving.
      properties:
        number: { type: [string, 'null'], description: Document number as read, digits/letters only. On `IdentityReview` reads this carries only the last 4 characters — the full number is never stored. }
        name: { type: [string, 'null'] }
        dob: { type: [string, 'null'], format: date }
    IdentityVerification:
      type: object
      description: The caller's own identity-verification state. Never a gate (ADR-019).
      required: [status, attemptsRemaining]
      properties:
        status: { $ref: '#/components/schemas/IdentityVerificationStatus' }
        docType: { oneOf: [ { $ref: '#/components/schemas/IdentityDocType' }, { type: 'null' } ] }
        docLast4: { type: [string, 'null'], example: '1234', description: Last 4 characters of the confirmed document number; set on approval only. }
        submittedAt: { type: [string, 'null'], format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        rejectionReason: { oneOf: [ { $ref: '#/components/schemas/IdentityRejectionReason' }, { type: 'null' } ] }
        rejectionNote: { type: [string, 'null'], description: Free-text hint from the reviewer, shown to the applicant. }
        revokedAt: { type: [string, 'null'], format: date-time }
        revocationReason: { type: [string, 'null'], description: User-visible reason for a revoked badge. }
        attemptsRemaining: { type: integer, minimum: 0, description: Submissions left in the rolling 24-hour window (3 per window). }
        retryAfter: { type: [string, 'null'], format: date-time, description: When the next submission is allowed; null while attempts remain. }
        appeal: { oneOf: [ { $ref: '#/components/schemas/IdentityAppeal' }, { type: 'null' } ], description: The appeal still describing this case (open, or its outcome while the case sits in that state); null otherwise. }
        canAppeal: { type: boolean, description: The case is rejected, its photos are still stored and no appeal has been reviewed since. }
    IdentityAppealRequest:
      type: object
      required: [note]
      properties:
        note: { type: string, minLength: 1, maxLength: 500, description: Why the rejection was wrong. Anything shaped like an ID or phone number is redacted server-side. }
    IdentityAppeal:
      type: object
      required: [id, status, note, openedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [open, upheld, reopened, superseded] }
        note: { type: string }
        ticketId: { type: [string, 'null'], format: uuid, description: The `identity_appeal` support ticket carrying the conversation. }
        openedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
    IdentityRejectionReason:
      type: string
      enum: [blurry, cropped, mismatch, expired, not_holder, unsupported, other, not_reviewed]
      description: '`not_reviewed` is set only by the stale-pending sweep; staff cannot send it.'
    IdentityLiveness:
      type: string
      enum: [passed, bypassed, unavailable]
    IdentityReviewRow:
      type: object
      description: One queue line. The case itself — claims, images, warnings, account contact — is the detail read.
      properties:
        id: { type: string, format: uuid }
        status: { $ref: '#/components/schemas/IdentityVerificationStatus' }
        userName: { type: [string, 'null'] }
        userMobile: { $ref: '#/components/schemas/Mobile' }
        docType: { $ref: '#/components/schemas/IdentityDocType' }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        revokedAt: { type: [string, 'null'], format: date-time }
        approvedByName: { type: [string, 'null'], description: Reviewer who decided the case. }
        claimedByName: { type: [string, 'null'], description: Fresh claim holder; null when unclaimed or stale. }
        claimedByMe: { type: boolean }
        appeal: { type: boolean, description: An appeal against this rejection is open — the queue's "Appeal" tag. }
    IdentityClaimState:
      type: object
      description: Who holds the case after a claim; the caller already has the case from the detail read.
      properties:
        claimedByName: { type: [string, 'null'] }
        claimedByMe: { type: boolean }
    IdentityReview:
      type: object
      description: A verification case as the reviewer sees it.
      properties:
        id: { type: string, format: uuid }
        userId: { type: string, format: uuid }
        userName: { type: string }
        accountName: { type: [string, 'null'], description: Current `users.name`; approval will overwrite it with the confirmed holder name. }
        accountEmail: { type: [string, 'null'], description: Current `users.email`; editable from the case via `kycUpdateUser`. }
        accountGender: { type: [string, 'null'], enum: [male, female, null], description: 'Current `users.gender`, shown so the reviewer can correct it from the document on approval.' }
        userMobile: { $ref: '#/components/schemas/Mobile' }
        userRole: { $ref: '#/components/schemas/Role' }
        status: { $ref: '#/components/schemas/IdentityVerificationStatus' }
        docType: { $ref: '#/components/schemas/IdentityDocType' }
        claims: { $ref: '#/components/schemas/IdentityClaims' }
        holderName: { type: [string, 'null'], description: Confirmed on approval. }
        holderDob: { type: [string, 'null'], format: date, description: Confirmed on approval. }
        holderDobYearOnly: { type: boolean, description: True when the document showed only a birth year; `holderDob` is then YYYY-01-01. }
        liveness: { oneOf: [ { $ref: '#/components/schemas/IdentityLiveness' }, { type: 'null' } ] }
        livenessSource: { type: [string, 'null'], enum: [challenge, client, null], description: '`challenge` when the selfie answered a server-signed pose (see `livenessChallenge`); `client` when only the browser verdict exists.' }
        livenessChallenge: { type: [string, 'null'], enum: [left, right, smile, null], description: Pose the server asked the selfie to show; the reviewer must confirm it on approval. }
        numberOverridden: { type: boolean, description: The approver confirmed a number that differs from the applicant's entry. }
        attemptCount: { type: integer }
        submittedAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        reviewerName: { type: [string, 'null'] }
        approvedByName: { type: [string, 'null'], description: Reviewer who approved the badge. }
        rejectionReason: { oneOf: [ { $ref: '#/components/schemas/IdentityRejectionReason' }, { type: 'null' } ] }
        rejectionNote: { type: [string, 'null'] }
        revokedAt: { type: [string, 'null'], format: date-time }
        revokedByName: { type: [string, 'null'] }
        revocationReason: { type: [string, 'null'] }
        claimedByName: { type: [string, 'null'], description: Fresh claim holder; null when unclaimed or stale. }
        claimedByMe: { type: boolean }
        filesPurgedAt: { type: [string, 'null'], format: date-time, description: Set once the images were deleted (7 days after the decision). }
        images:
          type: object
          description: Short-lived signed URLs; present on the detail read only, and empty once purged.
          properties:
            front: { type: [string, 'null'], format: uri }
            back: { type: [string, 'null'], format: uri }
            selfie: { type: [string, 'null'], format: uri }
        warnings:
          type: array
          description: Detail read only — other accounts this case may collide with.
          items:
            type: object
            properties:
              kind: { type: string, enum: [same_document_verified, same_document_claimed, same_person_key] }
              userId: { type: string, format: uuid }
              userName: { type: string }
              userMobile: { type: string, description: In full }
              reviewId: { type: string, format: uuid }
        appeal: { oneOf: [ { $ref: '#/components/schemas/IdentityAppeal' }, { type: 'null' } ], description: The appeal still describing this case; null when none. }
        appealCanDecide: { type: boolean, description: An appeal is open and the caller is not the applicant. }
        appealCanReopen: { type: boolean, description: appealCanDecide and the photos are still stored; a purged case can only be upheld. }
    IdentityApproveRequest:
      type: object
      required: [number, name]
      properties:
        number: { type: string, description: Full document number as the reviewer reads it off the image. Hashed server-side; only the last 4 are stored. }
        name: { type: string, minLength: 2, maxLength: 80 }
        dob: { type: [string, 'null'], format: date, description: Full date of birth. Exactly one of `dob` or `birthYear` is required. }
        birthYear: { type: [integer, 'null'], minimum: 1900, description: Year-only documents store holderDob as YYYY-01-01 and holderDobYearOnly true. Exactly one of `dob` or `birthYear` is required. }
        poseConfirmed: { type: [boolean, 'null'], description: Required `true` when the case carries a `livenessChallenge` — the selfie shows the requested pose. }
        numberOverride: { type: [boolean, 'null'], description: 'Required `true` to approve a number that differs from the applicant''s entry; audited.' }
        gender: { type: [string, 'null'], enum: [male, female, null], description: 'Gender on the document. When present it replaces the applicant''s profile gender, which is otherwise locked; the change is in the approval audit.' }
    IdentityRejectRequest:
      type: object
      required: [reason]
      properties:
        reason: { $ref: '#/components/schemas/IdentityRejectionReason' }
        note: { type: [string, 'null'], maxLength: 300 }
    IdentityRevokeRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string, minLength: 10, maxLength: 300 }
    PaymentWebhook:
      type: object
      description: >
        Cashfree Payment Gateway callback payload (provider → backend), API version 2025-01-01
        (ADR-017). Authenticity is verified from `x-webhook-signature` over
        `x-webhook-timestamp + rawBody`; the body must be read raw, because re-serializing the JSON
        changes the bytes and therefore the digest. Handlers dedupe on `data.order.order_id` and
        always answer 200.
      properties:
        type:
          type: string
          enum:
            - PAYMENT_SUCCESS_WEBHOOK
            - PAYMENT_FAILED_WEBHOOK
            - PAYMENT_USER_DROPPED_WEBHOOK
          example: PAYMENT_SUCCESS_WEBHOOK
        event_time: { type: string, format: date-time }
        data:
          type: object
          properties:
            order:
              type: object
              properties:
                order_id: { type: string, description: Cashfree order id; the idempotency / dedup key. }
                order_amount: { type: string, example: '17000.00', description: 'Decimal rupees with paise, as sent by the provider.' }
                order_currency: { type: string, example: INR }
            payment:
              type: object
              properties:
                cf_payment_id: { type: string }
                payment_status: { type: string, enum: [SUCCESS, FAILED, PENDING, USER_DROPPED] }
                payment_amount: { type: string, example: '17000.00' }
                payment_group: { type: string, example: upi }
                payment_time: { type: [string, 'null'], format: date-time }
            error_details:
              type: [object, 'null']
              description: Present on PAYMENT_FAILED_WEBHOOK.
              properties:
                error_code: { type: string }
                error_description: { type: string }
                error_reason: { type: string, example: bank_declined }
                error_source: { type: string, enum: [bank, cashfree, user] }
    PropertyReview:
      type: object
      description: Moderation record for a listing under review.
      properties:
        progress: { $ref: '#/components/schemas/ListingProgress' }
        propertyId: { type: string }
        propertyStatus: { $ref: '#/components/schemas/PropertyStatus' }
        status: { $ref: '#/components/schemas/PropertyReviewStatus' }
        reviewer: { type: string }
        checklist:
          type: array
          items:
            type: object
            properties:
              item: { type: string }
              pass: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/VerificationMessage' }
        notes: { type: string }
        reasonCode: { $ref: '#/components/schemas/PropertyReviewReasonCode' }
        reasonNote: { type: [string, 'null'] }
        reraCheck:
          type: [string, 'null']
          enum: [verified, not_found, mismatch, null]
          description: Staff-only MahaRERA lookup result; null until checked or when no RERA ID is quoted.
        signals:
          oneOf:
            - $ref: '#/components/schemas/ListingSignals'
            - type: 'null'
          description: Staff-only broker/duplicate signals for the review modal.
        decidedAt: { type: string, format: date-time }

    PropertyReviewStatus:
      type: string
      enum: [in_review, needs_info, approved, rejected]
    PropertyReviewReasonCode:
      type: [string, 'null']
      enum: [photos_not_real, duplicate, broker, wrong_details, locality_unclear, document_unreadable, name_mismatch, rera_not_found, rera_mismatch, other, null]
    ListingProgress:
      type: [object, 'null']
      description: >
        Where an unfinished listing is on its way to live, derived from timestamped facts on the
        listing. Owner-posted (`owner`): submitted, in_review, live; a rejected listing falls back to
        submitted. Staff-posted (`staff`): created,
        link_sent, owner_confirmed, in_review, live. Detours are flags rather than steps. Null once
        the listing has left the funnel (paused, sold, rented, archived) and on public reads.
      required: [track, step, flags]
      properties:
        track: { type: string, enum: [owner, staff] }
        step: { type: string, enum: [submitted, created, link_sent, owner_confirmed, in_review, live] }
        flags:
          type: array
          description: >
            `needs_info` (waiting on the owner), `rejected`, `flagged`, `no_photos`, `opened` (owner
            opened the claim link but has not confirmed), `recheck`. The owner's own reads carry only
            `needs_info` and `rejected`.
          items: { type: string, enum: [needs_info, rejected, flagged, no_photos, opened, recheck] }
    VerificationMessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, minLength: 1, maxLength: 4000 }
        clarificationRequested:
          type: boolean
          default: false
          description: Explicit staff-only request on an unpublished owner-track listing. When true, the case becomes needs_info with reasonCode other and body as reasonNote. Owners cannot set true; ordinary messages never infer clarification.
    ChecklistUpdate:
      type: object
      description: One verification checklist line, ticked or unticked.
      required: [item]
      properties:
        item: { type: string, example: 'Property tax receipt' }
        pass:
          type: boolean
          default: false
          description: 'Omitted is treated as false — "not stated" and "not checked" are the same fact here.'

    OwnershipVerification:
      type: object
      description: Ownership gate status and the evidence behind it.
      properties:
        propertyId: { type: string }
        verified: { type: boolean, description: 'The badge — an ops verdict that has not lapsed.' }
        verifiedAt: { type: [string, 'null'], format: date-time, description: 'When ops last accepted a complete evidence set.' }
        verifiedUntil:
          type: [string, 'null']
          format: date-time
          description: >
            The earliest expiry among the documents the badge rests on. Null in two very different
            situations — never verified, and verified on documents that do not expire — so it is
            read together with `verified` rather than alone.
        missingKinds:
          type: array
          description: >
            Required facts with no current document. A rental reports `address_or_title_proof`
            when neither acceptable proof is current; a sale reports `title_proof`. `title_support`,
            `owner_identity`, `authority_proof` and `site_presence` are never listed here ? they are
            supporting evidence, not a gate.
          items: { type: string, enum: [title_proof, address_or_title_proof] }
        evidence:
          type: array
          items: { $ref: '#/components/schemas/OwnershipEvidence' }
        requestedAt: { type: [string, 'null'], format: date-time, description: 'The owner asked for the badge from their document vault; cleared by a grant or a decline.' }
        declinedAt: { type: [string, 'null'], format: date-time, description: 'Staff answered the last request without granting the badge.' }
        declinedReason: { type: [string, 'null'], description: 'What the owner must fix before asking again.' }

    OwnershipEvidence:
      type: object
      properties:
        id: { type: string }
        docType: { type: string, enum: [index_ii, satbara_7_12, eight_a_extract, property_card, share_certificate, sale_deed, tax_receipt, electricity_bill, aadhaar, pan, power_of_attorney, site_photos] }
        kind: { type: string, enum: [title_proof, address_proof, title_support, owner_identity, authority_proof, site_presence], description: 'Which fact this establishes: title (index_ii, satbara_7_12, eight_a_extract, property_card, share_certificate), address (electricity_bill, tax_receipt), supporting title (sale_deed), identity (aadhaar, pan), authority to list (power_of_attorney) or site presence (site_photos). Only title_proof and address_proof can gate the badge.' }
        documentId: { type: [string, 'null'], description: 'The vault row, when the proof was uploaded rather than sighted in person.' }
        subjectName:
          type: [string, 'null']
          description: >
            Whose authority was sighted, as the document spells it. Legacy identity rows may still
            carry it; new `aadhaar` and `pan` listing-evidence rows are refused.
        issuedAt:
          type: string
          format: date-time
          description: >
            When the document was issued or the photographs taken — NOT when ops reviewed it. Every
            expiry is measured from here, which is what stops a decade-old receipt minting a fresh
            badge.
        expiresAt: { type: [string, 'null'], format: date-time, description: 'Null for documents that do not go stale. Land records, electricity bills, property-tax receipts and site photos expire; property-tax receipts expire at the financial-year end of issue.' }
        current: { type: boolean, description: 'Whether it still proves what it proves, as at the moment this was read.' }

    OwnershipEvidenceCreate:
      type: object
      required: [docType, issuedAt]
      properties:
        docType: { type: string, enum: [index_ii, satbara_7_12, eight_a_extract, property_card, share_certificate, sale_deed, tax_receipt, electricity_bill, aadhaar, pan, power_of_attorney, site_photos] }
        documentId: { type: string, description: 'Optional — the documents-vault row this proof was uploaded to.' }
        issuedAt: { type: string, format: date-time, description: "The document's own date, read off the document." }
        subjectName:
          type: string
          maxLength: 120
          description: >
            Whose authority the document proves. Required for `power_of_attorney`; new `aadhaar`
            and `pan` listing-evidence rows are refused because account identity verification owns them.

    VerificationMessage:
      type: object
      properties:
        id: { type: string }
        from: { type: string, enum: [owner, ops] }
        body: { type: string }
        at: { type: string, format: date-time }
        read: { type: boolean }
        internal: { type: boolean, description: Staff-only; never true in an owner's copy. }
        clarificationRequested: { type: boolean, default: false }
    ReviewBadge:
      type: object
      description: >
        One listing's review state on the owner's dashboard card. No reviewer id or name, no listing copy
        and no progress: the card already holds the listing.
      properties:
        propertyId: { type: string }
        status: { $ref: '#/components/schemas/PropertyReviewStatus' }
        unread: { type: integer, description: Ops messages the owner has not opened., example: 2 }
        updatedAt: { type: string, format: date-time, description: Latest non-internal message, else the case's creation. }
        reasonCode: { $ref: '#/components/schemas/PropertyReviewReasonCode' }
        reasonNote: { type: [string, 'null'], description: Only while the case is needs-info or rejected. }
        lastMessage: { type: [string, 'null'], description: Most recent non-internal message body }
    ReportTargetType:
      type: string
      description: >-
        What kind of record a report is filed against. One schema for both the request and the
        response deliberately: the server validates writes and serialises reads from a single
        vocabulary, so two copies could only ever drift apart.
      enum: [property, user, review, post]
    Report:
      type: object
      properties:
        id: { type: string }
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: string }
        reason: { type: string }
        details: { type: string }
        status: { type: string, enum: [open, reviewing, actioned, dismissed] }
        createdAt: { type: string, format: date-time }
        targetReportCount:
          type: integer
          format: int64
          description: Reports ever filed against the same target; present on `GET /reports` rows only.
        targetName: { type: string, description: Name of the reported person; `GET /reports` rows about a user only }
        targetMobile: { type: string, description: Mobile of the reported person, in full; `GET /reports` rows about a user only }
        targetTitle: { type: string, description: Title of the reported listing, or the reported person's name }
    ReportTriage:
      type: object
      description: >
        S30 (slice 9). Moves a report through triage. `note` is an internal ops note, never shown
        to the reporter or the reported party.
      required: [status]
      properties:
        status: { type: string, enum: [open, reviewing, actioned, dismissed] }
        note: { type: string, maxLength: 2000 }
        enforcement:
          type: string
          enum: [none, hide_content, suspend_account]
          default: none
          description: >
            D68. What to actually do to the target, applied in the same transaction as the status
            change. Before this field existed, `actioned` was a word: the report changed state and
            the reported listing stayed live.


            Only legal alongside `status=actioned` - "dismissed, and also taken down" is not a
            decision anybody means. Supported per target type: `property` accepts `hide_content`
            (flags the listing, which removes it from every public read) and `post` accepts
            `hide_content` (marks the seeker post, room or group `removed`, which drops it from every
            public read and tells its author); `user` accepts
            `suspend_account` (the same soft-delete an admin drives from the users screen).
            `review` accepts `none` only - a review is taken down through
            `PATCH /reviews/{id}/status`, which also removes it from the rating average. It is
            refused with a message naming the endpoint to use instead, rather than accepted and
            silently discarded.
    ErasureCreate:
      type: object
      description: >
        D177. `reason` is optional and always will be - a statutory right is not conditional on
        explaining yourself, and a required field here would turn one into a negotiation.
      properties:
        reason: { type: string, maxLength: 2000 }
    ErasureDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [execute, reject] }
        note:
          type: string
          maxLength: 2000
          description: Required when rejecting. A refusal the subject cannot understand is one they cannot act on.
    ErasureRequest:
      type: object
      description: >
        **`subjectId` is deliberately absent from this schema.** The subject reads their own
        request and knows who they are; an admin decides on whether a live obligation exists, which
        the id does not answer either way. Putting it on the wire would make the admin queue a list
        of everybody who has asked to be forgotten, which is the shape this feature exists to avoid.
      properties:
        id: { type: string }
        subjectDigest:
          type: string
          description: >
            SHA-256 over a deployment-held pepper and the subject's UUID, lowercase hex. A
            verifier, not an index: given a UUID you can confirm a request concerned it; given the
            table you cannot enumerate who was erased. Survives completion, when `subjectId` is
            cleared from the row.
        status: { type: string, enum: [pending, completed, rejected] }
        reason: { type: string }
        requestedAt: { type: string, format: date-time }
        decidedAt: { type: string, format: date-time }
        decisionNote: { type: string }
        erased:
          type: string
          description: >
            JSON document of what was removed - table names and row counts, never values. Null
            until the request completes.
        retained:
          type: string
          description: >
            JSON document of what was kept and the statute requiring it, plus the categories this
            implementation is known not to reach. Written at execution rather than resolved at read
            time, so a request decided today still carries the reasoning it was decided under.
    ReviewStatusUpdate:
      type: object
      description: >
        S31 (slice 9). Takes a review down (`rejected`) or restores it (`published`). `pending` is
        deliberately absent: it is the pre-moderation state a review is created in, and moving a
        live review back to it would hide it with no record of a decision having been made.
      required: [status]
      properties:
        status: { type: string, enum: [published, rejected] }
        reason: { type: string, maxLength: 2000 }
    ReportCreate:
      type: object
      required: [targetType, targetId, reason]
      properties:
        targetType: { $ref: '#/components/schemas/ReportTargetType' }
        targetId: { type: string }
        reason: { type: string }
        details: { type: string }
    InternalNote:
      type: object
      description: >
        D29. One thing a member of staff wrote about a listing, a person, a review, a report or an
        assisted-service matter. Editable, unlike `ticket_notes` and the audit log: this is retained
        information about a case, not an audit record, and the audit trail of who changed what
        already exists elsewhere.
      properties:
        id: { type: string }
        entityType: { type: string, enum: [property, user, review, report, service_request] }
        entityId: { type: string }
        authorId:
          type: string
          description: >
            The real user id, taken from the principal on write and never client-supplied. The
            durable fact - it survives a rename.
        authorName:
          type: string
          description: >
            The author's display name, resolved from `users` at read time rather than copied onto
            the row. Falls back to the raw id when no account matches: a staff account can be
            archived and its notes stay, so an unresolved author is a real state and rendering it
            blank would make an authored note look anonymous.
        action:
          type: string
          description: >
            The maker-checker label the note was filed beside ("Approved", "Archived"). Absent for
            a note written on its own - an omitted label and an empty one are different claims.
        text: { type: string }
        createdAt: { type: string, format: date-time }
        updatedAt:
          type: string
          format: date-time
          description: >
            Served because the note is editable. A reader who cannot tell the text in front of them
            was rewritten last week is reading it as if it were contemporaneous.
    InternalNoteCreate:
      type: object
      description: >
        `text` is required. The browser-side store this replaces accepted a note with no text so
        long as it had an action label, which wrote a row that rendered as an empty bullet under a
        colleague's name. An action with nothing to say is the audit log's job.
      required: [text]
      properties:
        text: { type: string, maxLength: 4000 }
        action: { type: string, maxLength: 60 }
    ContactStatus:
      type: object
      description: Whether the caller may see a listing's contact, under the badge-not-gate model (ADR-019).
      properties:
        status: { type: string, enum: [owner, approved, pending, declined, expired, none], description: 'Gate state for this caller vs this listing: owner (viewer owns it), approved, pending, declined, expired (owner did not reply in time; the contact came back and asking again spends one), or none (no request yet).' }
        verifiedContactOnly: { type: boolean, description: True when the owner accepts verified contacts only — caller needs the L2 badge (ADR-019). }
        verificationRequired: { type: boolean, description: True when this specific request is blocked pending the caller's ID verified badge. }
        ownerHidesNumber: { type: boolean, description: 'True when the owner has opted to stay masked even after approving. The client should offer chat instead of a call; approval still stands (D5).' }
    ContactRequestCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        message: { type: string, maxLength: 1000 }
    ContactRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        requester: { $ref: '#/components/schemas/Party' }
        status:
          type: string
          enum: [pending, approved, declined, expired, withdrawn]
          description: expired is set once a request is left pending longer than `contactReplyDays`; it cannot be answered and the contact is returned.
        contact:
          type: [object, 'null']
          description: Present only after the gate is passed & owner grants.
          properties:
            name: { type: string }
            mobile: { $ref: '#/components/schemas/Mobile' }
        message: { type: [string, 'null'], description: The requester's note, if they left one. }
        createdAt: { type: string, format: date-time }
    PhotoRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        propertySlug: { type: string }
        propertyTitle: { type: string }
        requester:
          type: object
          description: >
            The person who asked. Not gated: this shape is only ever returned under `/me`, where the
            caller owns the listing being asked about.
          properties:
            name: { type: string }
            mobile: { $ref: '#/components/schemas/Mobile' }
        status: { type: string, enum: [pending, resolved, declined, withdrawn] }
        createdAt: { type: string, format: date-time }
    RequestItem:
      type: object
      properties:
        id: { type: string, format: uuid, description: The underlying request row. }
        kind: { type: string, enum: [contact, visit, photo, document, flatmate, group, offer] }
        state: { type: string, enum: [pending, accepted, declined, expired, withdrawn, countered], description: 'countered: an offer whose latest amount came from the owner, so the buyer answers next.' }
        status: { type: string, description: 'The kind''s own status, e.g. scheduled, confirmed, resolved, approved.' }
        party:
          type: object
          description: The other side - the requester in the received box, the recipient in the sent box. No mobile.
          properties:
            id: { type: string, format: uuid }
            name: { type: string }
            verified: { type: boolean }
        target:
          type: object
          properties:
            id: { type: string, format: uuid }
            type: { type: string, enum: [property, flatmate-post, room, group] }
            title: { type: [string, 'null'] }
            link: { type: [string, 'null'] }
        message: { type: [string, 'null'] }
        slot: { type: [string, 'null'], format: date-time, description: Visits only. }
        share: { type: [string, 'null'], enum: [solo, bring, match, null], description: 'Flatmate only: alone, bringing one more person, or wants a room-sharer.' }
        createdAt: { type: string, format: date-time }
        decidedAt: { type: [string, 'null'], format: date-time }
        reminders: { $ref: '#/components/schemas/RequestReminderResponse' }
    RequestReminderResponse:
      type: object
      properties:
        count: { type: integer, minimum: 0 }
        lastAt: { type: [string, 'null'], format: date-time }
        nextAt: { type: [string, 'null'], format: date-time, description: Sent box only; null once the request would have lapsed by then. }
    PhotoRequestCreateResult:
      type: object
      description: >
        `created` distinguishes a first ask from a repeat tap, which is why the operation can stay
        `200` in both cases instead of splitting into `201`/`409`.
      properties:
        created: { type: boolean }
        request: { $ref: '#/components/schemas/PhotoRequest' }
    PhotoRequestDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [resolved, declined] }
    LeadNote:
      type: object
      properties:
        leadKey: { type: string, maxLength: 200 }
        note: { type: string, maxLength: 2000 }
        followUpAt: { type: [string, 'null'], format: date-time }
        updatedAt: { type: string, format: date-time }
    LeadNoteUpsert:
      type: object
      description: Both fields optional; both empty clears the note and answers `204`.
      properties:
        note: { type: [string, 'null'], maxLength: 2000 }
        followUpAt: { type: [string, 'null'], format: date-time }
    # No `Enquiry` schema: its only operation is gone. See /enquiries above.
    FinalizationRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        initiator: { $ref: '#/components/schemas/Party' }
        counterparty: { $ref: '#/components/schemas/Party' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [pending, accepted, declined, cancelled] }
        createdAt: { type: string, format: date-time }
    FinalizationCreate:
      type: object
      # `propertyId` duplicates the {propId} path parameter and two sources invite disagreement:
      # the path wins, and a body value contradicting it is rejected with 422, not ignored.
      required: [counterpartyMobile, agreedPrice]
      properties:
        propertyId:
          type: string
          description: >
            Optional echo of the {propId} path parameter. If present it MUST equal the path
            value; a mismatch is a 422. The path is authoritative.
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        agreedPrice: { $ref: '#/components/schemas/Money' }
    Transaction:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        type: { type: string, enum: [income, expense] }
        category: { type: string, example: rent }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly], default: none }
    # A due carries its own due date: the server owns the recurrence, so a client recomputing it
    # re-implements the rules, which is how two answers to one question start to diverge.
    Due:
      type: object
      description: >
        A recurring transaction projected forward to its next occurrence. `nextDue` is derived
        server-side from the transaction's `date` and `recurring` interval.
      allOf:
        - $ref: '#/components/schemas/Transaction'
        - type: object
          properties:
            nextDue: { type: string, format: date, description: The next occurrence on or after today. }
            daysUntil: { type: integer, minimum: 0, description: Whole days from today to nextDue. }
    TransactionCreate:
      type: object
      required: [type, amount, date]
      properties:
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly], default: none }
    # The partial-update shape for the PATCH. Every field optional -
    # an absent key means "leave it alone", which is what PATCH means and what the UI sends.
    TransactionUpdate:
      type: object
      description: >
        Partial update. Only the fields present are changed; `amount` and `date` cannot be set to
        null once present, because a ledger row without either is not a transaction.
      properties:
        type: { type: string, enum: [income, expense] }
        category: { type: string }
        amount: { $ref: '#/components/schemas/Money' }
        date: { type: string, format: date }
        note: { type: string }
        recurring: { type: string, enum: [none, monthly, quarterly, yearly] }
    # The tenant's own record of a home they rent. Distinct from Tenancy, which is an agreement
    # this platform brokered; this is one it had nothing to do with, which is almost all of them.
    TenantRental:
      type: object
      description: >
        A rental the tenant recorded themselves. Nothing in it is verified -- no rent moves through
        the platform and no counterparty confirms any of it -- so it drives the tenant's own
        dashboard and their HRA estimate, and nothing else. It is deliberately excluded from the
        Rent Passport, which is a credential shown to a prospective landlord.
      properties:
        id: { type: string }
        address: { type: string, maxLength: 300 }
        monthlyRent: { $ref: '#/components/schemas/Money' }
        deposit:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: >
            Absent when the tenant did not say. Not defaulted to zero: "nothing" and "I do not
            remember" are different answers and the deposit panel renders them differently.
        leaseStart: { type: string, format: date }
        leaseEnd: { type: string, format: date, description: Absent while the lease is open. }
        status: { type: string, enum: [active, ended] }
        monthsPaid:
          type: integer
          minimum: 0
          description: >
            Rent instalments falling due between `leaseStart` and today (or `leaseEnd`, if it has
            passed). Derived server-side so that the April-to-March financial year is defined once.
            Named "paid" for the tenant's benefit, but it counts what the lease implies rather than
            transfers anyone observed.
        totalPaid:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: '`monthsPaid` x `monthlyRent`.'
        fyPaid:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: The same, restricted to the current Indian financial year.
    TenantRentalCreate:
      type: object
      required: [address, monthlyRent, leaseStart]
      properties:
        address: { type: string, minLength: 1, maxLength: 300 }
        monthlyRent:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: Whole INR, positive, at most 1,00,00,000 a month.
        deposit:
          allOf: [ { $ref: '#/components/schemas/Money' } ]
          description: Whole INR, at most 10,00,00,000. Omit when unknown.
        leaseStart:
          type: string
          format: date
          description: >
            May be in the future -- a lease signed for next month is a real fact, and the derived
            totals simply stay at zero until it begins.
        leaseEnd: { type: string, format: date, description: Must not precede leaseStart. }
    TenantRentalUpdate:
      type: object
      description: >
        Partial update. Only the fields present are changed; the numeric fields cannot be un-set
        once given.
      properties:
        address: { type: string, minLength: 1, maxLength: 300 }
        monthlyRent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        leaseStart: { type: string, format: date }
        leaseEnd: { type: string, format: date }
        status: { type: string, enum: [active, ended] }
    OwnershipBasis:
      type: object
      properties:
        purchasePrice: { $ref: '#/components/schemas/Money' }
        purchaseDate: { type: string, format: date }
        loanOutstanding: { $ref: '#/components/schemas/Money' }
        emi: { $ref: '#/components/schemas/Money' }
        currentValue: { $ref: '#/components/schemas/Money' }
    FinanceSummary:
      type: object
      properties:
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
        # Nullable: tenanted-days over days-in-window has no value for a listing never let, and 0.0
        # would assert "vacant throughout" — a failing property rather than an inapplicable question.
        occupancyRate:
          type: [number, 'null']
          format: float
          minimum: 0
          maximum: 1
          description: >
            Fraction of the requested window covered by an active tenancy, or null if the property
            has never had one.
    CashflowPoint:
      type: object
      properties:
        month: { type: string, example: 2025-01 }
        income: { $ref: '#/components/schemas/Money' }
        expense: { $ref: '#/components/schemas/Money' }
        net: { $ref: '#/components/schemas/Money' }
    FinanceOverview:
      type: object
      properties:
        basis:
          description: Null until the owner records purchase/valuation figures.
          oneOf:
            - { $ref: '#/components/schemas/OwnershipBasis' }
            - { type: 'null' }
        dues:
          type: array
          items: { $ref: '#/components/schemas/Due' }
        cashflow:
          type: array
          items: { $ref: '#/components/schemas/CashflowPoint' }
    Tenancy:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenant: { $ref: '#/components/schemas/Party' }
        owner: { $ref: '#/components/schemas/Party' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        endDate: { type: string, format: date }
        status:
          type: string
          enum: [pending, active, ended, terminated, declined]
          description: >
            `pending` is a tenancy the landlord proposed when closing a rent deal; it counts for
            nothing until the named tenant confirms it. `declined` never became a tenancy.
    TenancyDeclaration:
      type: object
      description: >
        A person's claim that they lived in a listing, and the owner's answer (D194). Only
        `confirmed` proves anything; `pending` is an unopposed assertion and `revoked` is one the
        owner has taken back. Carries the claimant's name and deliberately no mobile -- a number
        here would let anyone mint a contact reveal by simply asserting a relationship, which is
        the gate the platform's contact rules exist to hold.
      properties:
        id: { type: string }
        propertyId: { type: string }
        declarantId: { type: string }
        declarantName: { type: string }
        livedFrom:
          type: [string, 'null']
          format: date
          description: The claimant's own account of when the stay began. Not verified.
        livedTo:
          type: [string, 'null']
          format: date
        status: { type: string, enum: [pending, confirmed, revoked] }
        decidedAt:
          type: [string, 'null']
          format: date-time
          description: When the owner last answered; null while pending.
    TenancyDeclarationCreate:
      type: object
      description: >
        Both fields optional and neither trusted -- they are context so the owner can recognise a
        former tenant, not evidence. The owner is read from the listing and is deliberately not a
        field here: letting a claimant nominate their own confirmer is the same hole as having no
        confirmation step at all.
      properties:
        livedFrom: { type: [string, 'null'], format: date }
        livedTo: { type: [string, 'null'], format: date }
    # Mirrors what the UI collects, because four of the six trust-score inputs must have columns or
    # the score caps at half. `occupants` is an enum: "3" cannot express "Bachelor (Male)".
    TenantProfile:
      type: object
      description: >
        Read shape. `score` and `verified` are server-computed; see TenantProfileUpdate.
        `income` is shown only to an owner with an established relationship.
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        name: { type: string }
        occupation: { type: string, description: 'Free text, e.g. "Software Engineer".' }
        income: { $ref: '#/components/schemas/Money' }
        occupants:
          type: string
          enum: [family, bachelor_male, bachelor_female, company_lease]
          description: Who will occupy the home. Owners and societies screen on this directly.
        moveIn: { type: string, format: date, description: Earliest date the tenant can move in. }
        priorLandlord: { type: string, description: 'Reference contact, free text.' }
        about: { type: string, description: Tenant's own introduction. }
        score: { type: integer, minimum: 0, maximum: 100, readOnly: true, description: Computed trust score. }
        verified: { type: boolean, readOnly: true }
    # `score`, `verified` and `mobile` are absent rather than ignored: a tenant who could set them
    # would award themselves the badge owners screen on, or file against somebody else's number.
    TenantProfileUpdate:
      type: object
      properties:
        name: { type: string }
        occupation: { type: string }
        income: { $ref: '#/components/schemas/Money' }
        occupants: { type: string, enum: [family, bachelor_male, bachelor_female, company_lease] }
        moveIn: { type: string, format: date }
        priorLandlord: { type: string }
        about: { type: string }
    TenantVerifiedQuery:
      type: object
      required: [mobiles]
      description: >
        The numbers to ask about, as the caller holds them. Maximum 50; a larger batch is 400. An
        entry that is not a valid mobile is not an error -- it answers `false`.
      properties:
        mobiles:
          type: array
          maxItems: 50
          items: { type: string }
    TenantVerified:
      type: object
      description: >
        One answer. `mobile` is the caller's own input echoed back unchanged -- never a normalised,
        stored or masked number -- so a client can key its map on what it sent, and so this endpoint
        provably cannot emit a number the caller did not already hold. `verified` is `false` for an
        unregistered number, a registered one with no badge, and a person the caller has no
        relationship with, alike; there is no reason field, because the difference between those
        three IS the enumeration answer this endpoint refuses to give.
      properties:
        mobile: { type: string, description: The number exactly as supplied by the caller. }
        verified: { type: boolean, readOnly: true }

    ManagedProperty:
      type: object
      description: >-
        A private "single-player" property record (Owner Hub / Property Passport / rent tracker),
        held outside the searchable marketplace until published. `deal` is the catalogue buy|rent
        value (the front-end seam relabels it sale|rent); `publishedListingId` is null until the
        record is published, then the id of the spawned listing.
      properties:
        id: { type: string }
        title: { type: string }
        deal: { type: string, enum: [buy, rent] }
        propertyType: { type: string }
        bhk: { type: [number, 'null'] }
        price: { type: integer, format: int64, description: Amount in whole INR. }
        locality: { type: string }
        localitySlug: { type: [string, 'null'] }
        society: { type: [string, 'null'], readOnly: true, description: The bound society's name, derived from `societyId` on the server; null when none is bound. }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'], enum: [sqft, sqyd, sqm, guntha, acre, hectare, null] }
        furnishing: { type: [string, 'null'] }
        visibility: { type: string, description: Owner-scoped visibility; private until published. }
        status: { type: string }
        rented: { type: boolean, description: Owner rent-tracker — currently rented. }
        tenantName: { type: [string, 'null'] }
        tenantMobile: { type: [string, 'null'], example: '9876543201', description: The tenant's 10-digit mobile; links the tenant to this record. }
        monthlyRent: { type: [integer, 'null'], format: int64 }
        dueDay: { type: [integer, 'null'], description: Rent due day of month. }
        valuation: { type: [object, 'null'], additionalProperties: true, description: Opaque Rent-o-meter snapshot. }
        publishedListingId: { type: [string, 'null'], description: Id of the spawned listing once published. }
        sourceRoomId: { type: [string, 'null'], readOnly: true, description: The flatmate room whose owner confirmation created this private home; null for a record the owner made themselves, or once that room is deleted. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    ManagedPropertyCreate:
      type: object
      required: [deal, propertyType, price, locality]
      description: >-
        Server-owned fields are never accepted here — visibility/status (forced private/managed
        unless a listing is adopted) and owner (the caller).
      properties:
        title: { type: string, description: Optional; synthesized from bhk/type/locality when blank. }
        deal: { type: string, enum: [buy, rent] }
        propertyType: { type: string }
        bhk: { type: [number, 'null'] }
        price: { type: integer, format: int64, minimum: 0, description: Amount in whole INR. }
        locality: { type: string, description: 'Display name; must be a live locality (422 otherwise).' }
        localitySlug: { type: string, description: 'The picked live locality; wins over `locality`.' }
        societyId: { type: [string, 'null'], format: uuid, description: The catalogue society this record is in; its name is stored server-side. Unknown or retired is a 404. }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'], enum: [sqft, sqyd, sqm, guntha, acre, hectare, null], description: Defaults sqft when null. }
        furnishing: { type: [string, 'null'] }
        rented: { type: [boolean, 'null'], description: Rent-tracker; defaults false. }
        tenantName: { type: [string, 'null'], maxLength: 80, description: Required when `rented` is true. }
        tenantMobile: { type: [string, 'null'], description: "Indian mobile, optional +91. Required when `rented` is true and must not be the owner's own number; stored as the bare 10 digits." }
        monthlyRent: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 10000000, description: Defaults to price for a rent deal when omitted; above zero when `rented` is true. }
        dueDay: { type: [integer, 'null'], minimum: 1, maximum: 28 }
        valuation: { type: [object, 'null'], additionalProperties: true }
        publishedListingId:
          type: [string, 'null']
          description: >-
            Adopt an existing listing of the caller's rather than starting private. Publish runs the
            other way (record first, listing second) and so cannot attach a file to a listing that
            already exists. 404 when the listing is not the caller's; 409 when it already has a
            managed record.
    ManagedPropertyUpdate:
      type: object
      description: >-
        Partial update — only supplied fields are applied. The lifecycle fields
        (visibility/status/publishedListingId) move only through publish, never a client patch.
      properties:
        title: { type: [string, 'null'] }
        deal: { type: [string, 'null'], description: buy|rent }
        propertyType: { type: [string, 'null'] }
        bhk: { type: [number, 'null'] }
        price: { type: [integer, 'null'], format: int64, minimum: 0 }
        locality: { type: [string, 'null'] }
        localitySlug: { type: [string, 'null'], description: 'The picked live locality, or the record''s current binding.' }
        societyId: { type: [string, 'null'], description: 'Omitted or null keeps the current society; an empty string removes it; otherwise a catalogue society id (unknown or retired is a 404).' }
        area: { type: [number, 'null'] }
        areaUnit: { type: [string, 'null'], enum: [sqft, sqyd, sqm, guntha, acre, hectare, null] }
        furnishing: { type: [string, 'null'] }
        rented: { type: [boolean, 'null'], description: Any rent field in the patch re-checks the result; a rented record needs tenantName, tenantMobile and a monthlyRent above zero (422 otherwise). }
        tenantName: { type: [string, 'null'], maxLength: 80 }
        tenantMobile: { type: [string, 'null'], description: "Indian mobile, optional +91; must not be the owner's own number. Stored as the bare 10 digits." }
        monthlyRent: { type: [integer, 'null'], format: int64, minimum: 0, maximum: 10000000 }
        dueDay: { type: [integer, 'null'], minimum: 1, maximum: 28 }
        valuation: { type: [object, 'null'], additionalProperties: true }
    ManagedRentReceipt:
      type: object
      description: >-
        An immutable record that the owner received one month's rent outside Draazy's payment
        rail. Every field except `rentMonth` is a snapshot taken from the owned property and the
        owner's user row at the moment of recording, never re-derived on read — a receipt handed to
        a tenant in August must keep saying what it said in August after the rent is raised or the
        address is edited.
      required: [id, rentMonth, amount, tenantName, landlordName, propertyAddress, createdAt]
      properties:
        id:
          type: string
          description: >-
            Server-generated, durable receipt id; doubles as the receipt's reference number on the
            generated PDF. Stable across devices and re-downloads.
        rentMonth: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-08' }
        amount: { type: integer, format: int64, description: Whole INR, as the property's monthly rent stood then. }
        tenantName: { type: string }
        landlordName: { type: string }
        propertyAddress: { type: string, description: '"society, locality, Pune" as it stood then.' }
        createdAt: { type: string, format: date-time, description: The receipt date — when the owner recorded the month. }
    TrackedRent:
      type: object
      required: [id, title, address, landlordName, monthlyRent, dueDay, status, dueOn, receipts]
      properties:
        id: { type: string }
        title: { type: string }
        address: { type: string, description: '"society, locality, Pune".' }
        landlordName: { type: string }
        monthlyRent: { type: integer, format: int64 }
        dueDay: { type: integer, minimum: 1, maximum: 28 }
        status:
          type: string
          enum: [paid, due, overdue]
          description: >-
            This month, in IST. A month whose due date fell before the caller was named is never theirs,
            so it reads as due next month rather than overdue.
        dueOn: { type: string, format: date, description: The due date the status refers to. }
        receipts:
          type: array
          description: Newest month first, at most 12.
          items: { $ref: '#/components/schemas/ManagedRentReceipt' }
    ManagedRentReceiptCreate:
      type: object
      required: [rentMonth]
      description: >-
        One field, deliberately. Amount, tenant, landlord and address are read server-side from the
        owned property; accepting them here would let a caller issue themselves a receipt for a rent
        that was never agreed.
      properties:
        rentMonth: { type: string, pattern: '^[0-9]{4}-(0[1-9]|1[0-2])$', example: '2026-08' }
    Document:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        category: { type: string, example: Sale Deed }
        fileName:
          type: [string, 'null']
          description: Null when a co-fill identity scan is redacted from the other side.
        url:
          type: [string, 'null']
          format: uri
          description: >
            Short-lived signed URL. Null on a service request for a co-fill party's PAN, Aadhaar or
            photo scan when the caller is the other side; ops and that side get the link and metadata.
        sizeBytes: { type: [integer, 'null'], format: int64 }
        mimeType: { type: [string, 'null'] }
        uploadedAt: { type: string, format: date-time }
    DocumentSummary:
      type: object
      description: >-
        A vault or granted file's metadata. The file itself is opened through the matching `.../url`
        route, which signs a short-lived link on click.
      properties:
        id: { type: string }
        category: { type: string, example: Sale Deed }
        fileName: { type: [string, 'null'] }
        sizeBytes: { type: [integer, 'null'], format: int64 }
        mimeType: { type: [string, 'null'] }
        uploadedAt: { type: string, format: date-time }
    DocumentUrl:
      type: object
      properties:
        url: { type: string, format: uri, description: Short-lived signed URL for one file }
    DocumentRequest:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        requester: { $ref: '#/components/schemas/Party' }
        categories: { type: array, items: { type: string } }
        status: { type: string, enum: [pending, granted, declined, expired, withdrawn] }
        sharedDocumentCount:
          type: integer
          format: int32
          minimum: 0
          description: >
            Number of uploaded files this request's category scope unlocks. Zero means the owner
            approved categories for which no file has been uploaded yet; it does not mean the
            request was declined.
        # A grant is time-boxed, so the token carries its deadline: without it the client cannot
        # tell a live grant from one about to lapse, and 'expired' appears out of nowhere.
        expiresAt: { type: [string, 'null'], format: date-time }
        acknowledgedDisclaimer: { type: boolean, description: Buyer accepted the sensitive-docs disclaimer }
        createdAt: { type: string, format: date-time }
    # The create schema must carry `acknowledgedDisclaimer`: a consent flag the client cannot send
    # could only ever read false, and that is not consent.
    DocumentRequestCreate:
      type: object
      required: [propertyId]
      properties:
        propertyId: { type: string }
        categories: { type: array, items: { type: string } }
        message: { type: string, maxLength: 500 }
        acknowledgedDisclaimer:
          type: boolean
          default: false
          description: Buyer ticked the sensitive-documents disclaimer before asking.
    Ticket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        propertyId: { type: [string, 'null'] }
        assignee: { type: [string, 'null'], readOnly: true, description: Assignee display name. Set via TicketUpdate.assigneeId (S42). }
        service: { type: string, description: Service catalogue display name }
        customer: { type: string, description: Requester name }
        mobile: { $ref: '#/components/schemas/Mobile' }
        value: { $ref: '#/components/schemas/Money' }
        quotedValue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >
            What the customer accepted when the ticket came off a priced flow. Read *next to*
            `value`, never instead of it: `value` is what the desk expects to bill and is ops-owned,
            `quotedValue` is what was promised at the point of sale and is write-once. A gap between
            the two is the desk's cue that the job is not the job that was quoted, which is a signal
            that only exists while both numbers do.
        detail: { type: string, description: Free-text request detail }
        notes:
          type: array
          description: Internal staff notes.
          items:
            type: object
            properties:
              by: { type: string }
              text: { type: string }
              at: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    TicketRow:
      type: object
      description: One ticket-board row. Notes, `value` and `quotedValue` come with `getTicket`.
      properties:
        id: { type: string }
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        assignee: { type: [string, 'null'], description: Assignee display name }
        service: { type: [string, 'null'], description: Service catalogue display name }
        customer: { type: string, description: Requester name }
        mobile: { $ref: '#/components/schemas/Mobile' }
        detail: { type: [string, 'null'] }
        createdAt: { type: string, format: date-time }
    TicketSummary:
      type: object
      properties:
        open: { type: integer, format: int64 }
        inProgress: { type: integer, format: int64 }
        waiting: { type: integer, format: int64 }
        resolved: { type: integer, format: int64 }
        closed: { type: integer, format: int64 }
        all: { type: integer, format: int64 }
    CustomerTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        propertyId: { type: [string, 'null'] }
        assignee: { type: [string, 'null'], readOnly: true, description: Assignee display name. Set via TicketUpdate.assigneeId (S42). }
        service: { type: string, description: Service catalogue display name }
        customer: { type: string, description: Requester name }
        mobile: { $ref: '#/components/schemas/Mobile' }
        value: { $ref: '#/components/schemas/Money' }
        quotedValue:
          allOf:
            - $ref: '#/components/schemas/Money'
          description: >
            What this customer accepted, echoed back for the same reason as `mobile` — it is their
            own number and their own agreed price, and withholding it from the person who agreed to
            it would make the receipt less useful than the form that produced it (D3).
        detail: { type: string, description: Free-text request detail }
        createdAt: { type: string, format: date-time }
    TicketCreate:
      type: object
      required: [subject]
      properties:
        subject: { type: string }
        team: { $ref: '#/components/schemas/Team' }
        priority: { type: string, enum: [low, medium, high, urgent], default: medium }
        propertyId: { type: string }
        body: { type: string }
        quotedValue:
          allOf:
            - $ref: '#/components/schemas/Money'
          minimum: 0
          description: Optional whole-INR customer-accepted quote; write-once after ticket creation. Negative values are refused with 422.
    TicketUpdate:
      type: object
      properties:
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        priority: { type: string, enum: [low, medium, high, urgent] }
        assigneeId: { type: string, description: 'User id of the staff member to assign, or the reserved value "none" to unassign. Omit to leave the assignee unchanged; a null is treated as omitted.' }
        team: { $ref: '#/components/schemas/Team' }
    SupportTicketSummary:
      type: object
      description: One row of the ticket list. The thread comes from `getSupportTicket`.
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        unread: { type: boolean }
        lastMessage:
          type: [object, 'null']
          description: The newest message; `body` is cut to a 160-character preview.
          properties:
            authorRole: { $ref: '#/components/schemas/Role' }
            body: { type: string, maxLength: 160 }
            createdAt: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
    SupportTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: string }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        unread: { type: boolean }
        messages:
          type: array
          items: { $ref: '#/components/schemas/SupportMessage' }
        createdAt: { type: string, format: date-time }
    AdminSupportTicket:
      type: object
      properties:
        id: { type: string }
        subject: { type: string }
        category: { type: [string, 'null'] }
        status: { type: string, enum: [open, in-progress, waiting, resolved, closed] }
        raiser: { type: [string, 'null'], description: Display name of the customer who raised it }
        raiserMobile: { type: [string, 'null'], description: The raiser's mobile, in full }
        awaitingReply:
          type: boolean
          description: A customer message nobody on the desk has read.
        unread:
          type: boolean
          description: >-
            The other side: a staff reply the customer has not opened. Distinguishes "we have not
            answered" from "we answered and they have not looked".
        createdAt: { type: string, format: date-time }
    SupportTicketCreate:
      type: object
      required: [subject, body]
      properties:
        subject: { type: string }
        category: { type: string }
        body: { type: string }
    ServiceRequestChecklist:
      type: object
      required: [ready, total, items]
      properties:
        ready: { type: integer, description: Items with a document against them }
        total: { type: integer, description: Items this request asks for }
        items:
          type: array
          description: Every item, present or absent, in a fixed render order. The absent ones are the point.
          items:
            type: object
            required: [id, name, done, canUpload]
            properties:
              # Also the upload `category` that satisfies this item -- one vocabulary, read and
              # written, rather than two kept in step by hand.
              id: { type: string, example: owner-id }
              name: { type: string, example: Owner Aadhaar + PAN }
              done: { type: boolean }
              # The newest document filed under this item. An id, never a URL: this endpoint mints
              # no download credential, so the bytes stay behind getServiceRequestDocumentUrl.
              documentId: { type: [string, 'null'] }
              review: { type: [string, 'null'], enum: [pending, verified, rejected, null], description: The desk's verdict on documentId; null when nothing is filed }
              reason: { type: [string, 'null'], description: "Why the desk rejected it; null on another co-fill side's PAN, Aadhaar or photo" }
              canUpload: { type: boolean, description: Whether the viewer may file this item. A co-fill party files only its own side; the requester every side no live invitation holds; ops any. }
    ServiceRequest:
      type: object
      properties:
        id: { type: string }
        type: { type: string, example: rent-agreement }
        team: { $ref: '#/components/schemas/Team' }
        status: { type: string, enum: [awaiting-payment, new, assigned, in-progress, draft-shared, changes-requested, approved, completed, cancelled] }
        propertyId: { type: [string, 'null'] }
        ticketId: { type: [string, 'null'] }
        details: { type: ['object', 'null'], additionalProperties: true }
        assignee: { type: [string, 'null'] }
        assignedToMe: { type: boolean }
        timeline:
          type: array
          items:
            type: object
            properties:
              at: { type: string, format: date-time }
              event: { type: string }
              by: { type: string }
        documents:
          type: array
          description: File metadata only; each file is opened through `getServiceRequestDocumentUrl`.
          items: { $ref: '#/components/schemas/DocumentSummary' }
        messages:
          type: array
          items: { $ref: '#/components/schemas/ServiceRequestMessage' }
        parties:
          type: array
          items: { $ref: '#/components/schemas/ServiceRequestParty' }
        createdAt: { type: string, format: date-time }
        # Whole-rupee desk charge: null for free requests, otherwise the accepted published/repriced fee.
        amount: { type: [integer, 'null'], format: int64 }
        # The single-use Cashfree checkout session for a priced request. Present only on the checkout
        # response (the SDK consumes it once); always null on create/read. Never persisted.
        paymentSessionId: { type: [string, 'null'] }
        registration:
          oneOf: [ { type: 'null' }, { $ref: '#/components/schemas/ServiceRequestRegistration' } ]
        policeIntimation: { $ref: '#/components/schemas/ServiceRequestPoliceIntimation' }
        sla:
          oneOf: [ { type: 'null' }, { $ref: '#/components/schemas/ServiceRequestSla' } ]
        amendment:
          oneOf: [ { type: 'null' }, { $ref: '#/components/schemas/ServiceRequestAmendment' } ]
        draftApproval:
          oneOf: [ { type: 'null' }, { $ref: '#/components/schemas/ServiceRequestDraftApproval' } ]
    ServiceRequestQueueRow:
      type: object
      description: >-
        What a desk queue row draws. The thread, files, parties, payment session and timeline come
        with `getServiceRequest`.
      properties:
        id: { type: string }
        type: { type: string, example: rent-agreement }
        status: { type: string, enum: [awaiting-payment, new, assigned, in-progress, draft-shared, changes-requested, approved, completed, cancelled] }
        details:
          type: ['object', 'null']
          additionalProperties: true
          description: >-
            Only the scalar request fields a row summarises, plus `_state` reduced to the owner and tenant
            names, the flat (`prop`) and the terms.
        requesterName: { type: [string, 'null'], description: The customer who raised the request. }
        requesterMobile: { type: [string, 'null'], description: The requester's mobile, in full. }
        assignee: { type: [string, 'null'] }
        assignedToMe: { type: boolean }
        createdAt: { type: string, format: date-time }
        amount: { type: [integer, 'null'], format: int64 }
        sla:
          oneOf: [ { type: 'null' }, { $ref: '#/components/schemas/ServiceRequestSla' } ]
        policeConfirmed: { type: boolean, description: Police intimation confirmed; read only on completed rows }
        approvedAt: { type: [string, 'null'], format: date-time, description: When the customer approved the draft; read only on approved rent agreements }
    ServiceQueueSummary:
      type: object
      properties:
        toPickUp: { type: integer, format: int64 }
        mine: { type: integer, format: int64 }
        inProgress: { type: integer, format: int64 }
        withCustomer: { type: integer, format: int64 }
        closed: { type: integer, format: int64 }
        overdue: { type: integer, format: int64 }
        openTickets:
          type: integer
          format: int64
          description: >-
            Open customer tickets for the same `team`, as `GET /tickets?status=open` would total them.
            Omitted when the caller does not hold `tickets:read`.
    ServiceRequestDraftApproval:
      type: object
      properties:
        version: { type: integer }
        approved: { type: integer }
        total: { type: integer }
        parties:
          type: array
          items:
            type: object
            properties:
              key: { type: string }
              label: { type: string }
              method: { type: string, enum: [in_app, otp] }
              mobile: { type: [string, 'null'] }
              opened: { type: boolean }
              approved: { type: boolean }
              approvedAt: { type: [string, 'null'], format: date-time }
    DraftOtpRequest:
      type: object
      required: [partyKey]
      properties:
        partyKey: { type: string }
        otp: { type: string, minLength: 6, maxLength: 6 }
    DraftOtpResult:
      type: object
      properties:
        approvalRecorded: { type: boolean }
        resendAfterSeconds: { type: [integer, 'null'] }
    ServiceRequestPoliceIntimation:
      type: object
      properties:
        confirmed: { type: boolean }
        confirmedAt: { type: [string, 'null'], format: date-time }
        confirmedBy: { type: [string, 'null'] }
        reference: { type: [string, 'null'], maxLength: 80 }
        submittedOn: { type: [string, 'null'], format: date }
    ServiceRequestPoliceIntimationConfirm:
      type: object
      properties:
        reference: { type: [string, 'null'], maxLength: 80 }
        submittedOn: { type: [string, 'null'], format: date }
    ServiceRequestAmendment:
      type: object
      description: >
        Re-priced terms the desk proposed and the requester has not accepted. `delta` is
        `amountAfter - amountBefore`: positive is due before the draft is shared, negative is an
        overpayment left on the record.
      properties:
        id: { type: string }
        terms: { type: object, additionalProperties: true, description: 'The changed terms only: rent, deposit, nrDeposit, months, increment, regArea ("Municipal / Urban" or "Rural")' }
        reason: { type: string }
        amountBefore: { type: integer, format: int64 }
        amountAfter: { type: integer, format: int64 }
        delta: { type: integer, format: int64 }
        checkoutOpen: { type: boolean }
        proposedAt: { type: string, format: date-time }
    ServiceRequestAmendmentCreate:
      type: object
      required: [reason]
      properties:
        rent: { type: [integer, 'null'], format: int64, minimum: 1 }
        deposit: { type: [integer, 'null'], format: int64, minimum: 0 }
        nrDeposit: { type: [integer, 'null'], format: int64, minimum: 0 }
        months: { type: [integer, 'null'], format: int64, minimum: 1 }
        increment: { type: [number, 'null'], minimum: 0, maximum: 100 }
        incrementEvery: { type: [integer, 'null'], format: int64, minimum: 1, description: 'Months between increases; only 11 or 12 is priced.' }
        regArea:
          type: [string, 'null']
          enum: [urban, rural, null]
          description: >
            The registration area as the property's Index II shows it. The customer never chooses
            it: the server stamps it from `_state.prop.gramPanchayat` at creation, and only this desk correction
            changes it (₹1,000 urban / ₹500 rural registration fee).
        reason: { type: string, maxLength: 300 }
    ServiceRequestRefunds:
      type: object
      properties:
        paid: { type: integer, format: int64 }
        refunded: { type: integer, format: int64 }
        refundableBeforeDuty: { type: integer, format: int64, description: 'The most one refund may return now if the duty is unpaid (the after-duty figure once registered)' }
        refundableAfterDuty: { type: integer, format: int64 }
        dutyPaidOnRecord: { type: boolean, description: 'A registration is on record, so the duty is paid' }
        refunds:
          type: array
          items:
            type: object
            properties:
              id: { type: string }
              amount: { type: integer, format: int64 }
              status: { type: string, enum: [requested, approved, rejected, failed] }
              dutyPaid: { type: boolean }
              grn: { type: [string, 'null'] }
              reason: { type: string }
              requestedBy: { type: [string, 'null'] }
              decidedBy: { type: [string, 'null'] }
              decisionNote: { type: [string, 'null'] }
              gatewayRefundId: { type: [string, 'null'] }
              requestedAt: { type: string, format: date-time }
              decidedAt: { type: [string, 'null'], format: date-time }
              mine: { type: boolean, description: 'The caller asked for it, so cannot approve it' }
    ServiceRequestRefundCreate:
      type: object
      required: [amount, reason]
      properties:
        amount: { type: integer, format: int64, minimum: 1 }
        dutyPaid: { type: boolean, default: false }
        grn: { type: [string, 'null'], maxLength: 25, description: 'GRAS challan number (MH...), required when dutyPaid' }
        reason: { type: string, maxLength: 300 }
    ServiceRequestRefundDecision:
      type: object
      properties:
        note: { type: [string, 'null'], maxLength: 300, description: 'Required to reject' }
    ServiceRequestSla:
      type: object
      description: >
        The rental desk's turnaround on an open, paid rent agreement, measured from when it entered
        its status: pickup 4 h, first draft 48 h, revision 24 h, registration 7 days. A shared draft
        is the customer's move and carries no due time. Null for every other type.
      properties:
        waitingOn: { type: string, enum: [desk, customer] }
        dueAt: { type: [string, 'null'], format: date-time }
        overdue: { type: boolean }
    ServiceRequestRegistration:
      type: object
      description: >
        What the Sub-Registrar recorded for a completed rent agreement, beside what the customer was
        quoted, so a checker can compare the duty paid with the duty billed. Quoted values are null
        when the terms cannot be priced.
      properties:
        documentNo: { type: string }
        sro: { type: string }
        registeredOn: { type: string, format: date }
        grn: { type: string }
        stampDuty: { type: integer, format: int64 }
        registrationFee: { type: integer, format: int64 }
        quotedStampDuty: { type: [integer, 'null'], format: int64 }
        quotedRegistrationFee: { type: [integer, 'null'], format: int64 }
        recordedBy: { type: [string, 'null'] }
        recordedAt: { type: string, format: date-time }
    RentAgreementOverlap:
      type: object
      properties:
        requestId: { type: string }
        status: { type: string }
        match: { type: string, enum: [listing, address, record], description: 'A record is an agreement filed outside any request; its requestId is that record''s id.' }
        startDate: { type: [string, 'null'], format: date }
        endDate: { type: [string, 'null'], format: date, description: 'Exclusive: start date plus the term in months.' }
        licensor: { type: [string, 'null'] }
        licensorDiffers: { type: boolean }
    ServiceRequestCreate:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [rent-agreement, legal, interior, packers, valuation]
          example: rent-agreement
        propertyId: { type: string }
        details:
          type: ['object', 'null']
          additionalProperties: true
          description: >
            Free-form wizard payload. For a rent agreement the server overwrites `regArea` (and
            `_state.regArea`) from the required boolean `_state.prop.gramPanchayat`: true is "Rural",
            false "Municipal / Urban". A client-sent `regArea` is ignored; a missing or non-boolean
            answer is a 422 once a rent is stated. Rent-agreement
            `_state.owner`, `_state.coOwners[]` and `_state.tenants[]` may carry `type`
            (`individual` or `entity`) and `residency` (`resident`, `nri`, `foreign`); non-resident
            parties use `passport` instead of Aadhaar, and foreign nationals also carry `visaOci`
            plus optional `frro` for the SRO route.
        ticketId: { type: string }
    CoFillServiceRequestCreate:
      type: object
      required: [request, role, mobile]
      description: >
        The request and the invitation in one body, because on a co-filled agreement they are one
        decision.


        A composition of two existing shapes rather than a third variant of `ServiceRequestCreate`:
        `request` is exactly what `createServiceRequest` takes and `role`/`mobile` are exactly what
        `inviteServiceRequestParty` takes, so neither can drift from the operation it came from. The
        alternative -- flattening the four fields into one object -- would have made the co-fill body
        a near-copy of the plain one, and near-copies of a body that gains a field are how a client
        ends up able to set `ticketId` on one route and not the other for no reason anybody
        remembers.
      properties:
        request:
          allOf: [ { $ref: '#/components/schemas/ServiceRequestCreate' } ]
          description: >
            The request itself, on the same terms as `createServiceRequest` -- same closed `type`
            vocabulary, same `details` object, same refusal of identity numbers inside it.
        role:
          type: string
          enum: [owner, tenant]
          description: >
            The side the **invitee** is on, not the caller's. One of each per request, so naming the
            side that is already taken is a 409.
        mobile:
          type: string
          description: >
            The counterparty's mobile, ten digits. Resolved against `users` and bound to the account
            if one holds it; otherwise the invitation is written against the number itself and
            claimed when that number registers and proves itself by OTP (V107). Either way the
            requester is not blocked on the other person having signed up first, which is what the
            earlier design got wrong -- it put a stranger's registration in the middle of the
            requester's checkout.
    ServiceRequestIdentities:
      type: object
      required: [parties]
      properties:
        parties:
          type: array
          minItems: 1
          maxItems: 12
          items: { $ref: '#/components/schemas/ServiceRequestIdentityInput' }
    ServiceRequestIdentityInput:
      type: object
      required: [partyRole]
      description: >
        Both numbers are optional individually -- a tenant may genuinely have no PAN -- but a party
        carrying neither is rejected with 422. Dropping such a party silently would leave the desk
        short of a number it had no way to know it should have asked for.
      properties:
        partyRole: { type: string, enum: [owner, tenant, witness] }
        # The primary licensor is owner 0 and co-owners follow; tenants by position; witnesses are 0 and 1 only.
        partyIndex: { type: integer, minimum: 0, default: 0 }
        partyName: { type: string, maxLength: 120 }
        pan: { type: string, pattern: '^$|^[A-Za-z]{5}[0-9]{4}[A-Za-z]$', example: ABCDE1234F }
        aadhaar:
          type: string
          pattern: '^$|^[2-9][0-9]{11}$'
          description: 'Blank or a full Aadhaar: twelve ASCII digits, not starting 0 or 1, passing the Verhoeff check digit UIDAI issues.'
    ServiceRequestIdentity:
      type: object
      description: >
        Returned in full, unmasked, because a masked PAN cannot be typed into a Leave & License.
        What makes that safe is the route, not the shape: assignee-only, audited, and purged when
        the matter closes.
      properties:
        partyRole: { type: string, enum: [owner, tenant, witness] }
        partyIndex: { type: integer }
        partyName: { type: [string, 'null'] }
        pan: { type: [string, 'null'] }
        aadhaar: { type: [string, 'null'] }
        # Null means two things the reader must separate: with a null purgedAt the customer left the
        # field empty; with a timestamp the matter is closed and the numbers were discarded.
        purgedAt: { type: [string, 'null'], format: date-time }
    RentAgreementRecord:
      type: object
      description: >
        One tenancy row a registered copy produced, as the registration checker sees it.
      properties:
        id: { type: string }
        tenantName: { type: [string, 'null'] }
        tenantMobile: { type: string, example: '9876543201' }
        status: { type: string, enum: [draft, e-sign-pending, registered, active, expired] }
        preparedBy: { type: [string, 'null'], description: Operator who uploaded the registered copy. }
        verifiedBy: { type: [string, 'null'], description: Operator who checked it. }
        preparedByYou: { type: boolean, description: True when the caller uploaded it, so cannot check it. }
        documentId:
          type: [string, 'null']
          description: The exact registered copy this row was prepared from; open it through `getServiceRequestDocumentUrl`.
        otpVerified:
          type: boolean
          description: >
            True when this tenant proved the number by OTP — they raised the request as the
            non-owner side, or accepted a co-fill invite. Only these rows can move to registered
            or active; a typed number gets 422.
    RentAgreement:
      type: object
      properties:
        id: { type: string }
        propertyId: { type: string }
        tenantMobile: { $ref: '#/components/schemas/Mobile' }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        startDate: { type: string, format: date }
        durationMonths: { type: integer }
        status: { type: string, enum: [draft, e-sign-pending, registered, active, expired] }
        documentUrl: { type: [string, 'null'], format: uri }
        serviceRequestId: { type: [string, 'null'], description: The paid rent-agreement request that produced the row; null for rows filed outside one. }
        endDate: { type: [string, 'null'], format: date, description: Last day of the term (start + months - 1 day); null while the start or length is unknown. }
    RentAgreementRenewal:
      type: object
      properties:
        propertyId: { type: string }
        serviceRequestId: { type: [string, 'null'] }
        rent: { type: [integer, 'null'] }
        deposit: { type: [integer, 'null'] }
        months: { type: [integer, 'null'] }
        startDate: { type: [string, 'null'], format: date, description: The day after the current agreement ends. }
        owner: { $ref: '#/components/schemas/RentAgreementRenewalParty' }
        tenants:
          type: array
          description: Tenants on the same registered document, from the agreement rows that are registered or active.
          items: { $ref: '#/components/schemas/RentAgreementRenewalParty' }
    RentAgreementRenewalParty:
      type: object
      properties:
        name: { type: [string, 'null'] }
        mobile: { type: [string, 'null'] }
    Plan:
      type: object
      properties:
        id: { type: string }
        name: { type: string, example: Listing Pass }
        audience: { type: [string, 'null'], enum: [owner, tenant, buyer, null], description: Null means anyone. }
        price: { $ref: '#/components/schemas/Money' }
        billingCycle: { type: [string, 'null'], enum: [monthly, quarterly, yearly, null] }
        termDays: { type: [integer, 'null'], description: Fixed term from payment; overrides billingCycle when set. }
        kind: { type: string, enum: [plan, listing-pass, contact-pack] }
        listingLimit: { type: [integer, 'null'] }
        contactLimit: { type: [integer, 'null'] }
        features: { type: array, items: { type: string } }
    Subscription:
      type: object
      description: >
        A subscription. Every field is null on the synthetic "no subscription" document returned
        by `getSubscription` when the caller has never subscribed (the operation declares only a
        200, and an empty object is friendlier to the plan screen than a 404).
      properties:
        id: { type: [string, 'null'] }
        planId: { type: [string, 'null'] }
        propertyId: { type: [string, 'null'], description: The listing a listing pass covers; null otherwise. }
        status: { type: [string, 'null'], enum: [pending, active, past-due, cancelled, expired] }
        # The gateway order id. Null
        # once nothing is owed; the durable handle the payment webhook correlates against.
        paymentRef: { type: [string, 'null'] }
        # The single-use hosted-checkout session. Present only in the immediate `subscribe` response
        # for a priced plan; never stored, so always null from `getSubscription`.
        paymentSessionId: { type: [string, 'null'] }
    SubscribeRequest:
      type: object
      required: [planId]
      properties:
        planId: { type: string }
        propertyId: { type: string, description: Required for a listing pass — the owner's listing it covers. }
        paymentMethod: { type: string, enum: [upi, card, netbanking] }
    Entitlements:
      type: object
      description: What the caller may do, derived from their live plan and their referrals (D31b).
      properties:
        contacts: { $ref: '#/components/schemas/ContactEntitlement' }
        listings: { $ref: '#/components/schemas/ListingEntitlement' }
        agreements: { $ref: '#/components/schemas/AgreementEntitlement' }
    ContactEntitlement:
      type: object
      # Null, not a huge sentinel, when the plan lifts the ceiling: "999,983 contacts left" is the
      # truth in a form nobody can read. `remaining` is derivable but sent, so only one sum exists.
      properties:
        unlimited: { type: boolean }
        used: { type: integer, description: Contact requests opened, for all time }
        allowance: { type: [integer, 'null'] }
        remaining: { type: [integer, 'null'] }
        referralBonus: { type: integer, description: Part of allowance earned by the caller's seeker-track referrals }
        friendBonus: { type: integer, description: Extra free contacts the caller got for joining through a code; 0 once rejected or clawed back. }
        freeWindowEndsAt:
          type: [string, 'null']
          format: date-time
          description: When the one-time free contacts lapse (30 days after the first contact); null until the first contact.
        packExpiresAt:
          type: [string, 'null']
          format: date-time
          description: Soonest expiry among contact packs that still have contacts left; null when none.
    ListingEntitlement:
      type: object
      properties:
        allowance: { type: integer, description: Live listings allowed without a pass. }
        used:
          type: integer
          description: Live listings not covered by a listing pass — the count `PUT /me/listings/{id}/resume` checks against `allowance`.
        passes:
          type: array
          description: Unexpired listing passes, one per covered listing.
          items:
            type: object
            properties:
              propertyId: { type: string }
              expiresAt: { type: string, format: date-time }
    AgreementEntitlement:
      type: object
      properties:
        free:
          type: integer
          minimum: 0
          description: Free rent agreements earned by owner-track referrals.
        used:
          type: integer
          minimum: 0
          description: Rent-agreement requests holding a credit; a cancelled request releases it.
        remaining:
          type: integer
          minimum: 0
          description: >-
            Credits spendable at `POST /service-requests/{id}/checkout`, which waives only Draazy's
            service fee. Never negative, even after a referral clawback.
    ReferralSummary:
      type: object
      description: >-
        The caller's own view of the scheme. The contacts and agreements earned are spendable through
        `GET /me/entitlements`, derived from the same referrals.
      properties:
        code: { type: string, example: PUNE-AB12 }
        invited: { type: integer, description: People who redeemed the caller's code. }
        converted: { type: integer, description: Referrals that qualified (granted, including rewarded). }
        held: { type: integer, description: Referrals held for the hold period before a decision. }
        earned:
          type: object
          properties:
            owner:
              type: object
              properties:
                referrals: { type: integer }
                agreements: { type: integer, description: Free rent agreements earned. }
            seeker:
              type: object
              properties:
                referrals: { type: integer }
                contacts: { type: integer, description: Owner contacts earned. }
        friendReward:
          type: object
          description: What the caller gets for having joined through a code.
          properties:
            redeemed: { type: boolean }
            status: { type: [string, 'null'], description: The caller's own referral status; null when none. }
            track: { type: [string, 'null'], enum: [owner, seeker, null] }
            contacts: { type: integer, description: Extra free contacts standing now. }
            featuredDays: { type: integer, description: Featured days promised on their first verified listing. }
    Referral:
      type: object
      description: A single referral record with anti-fraud signals (admin/ops view).
      properties:
        id: { type: string, example: RF3000 }
        referrer: { type: string }
        referrerMobile: { $ref: '#/components/schemas/Mobile' }
        referred: { type: string }
        referredMobile: { $ref: '#/components/schemas/Mobile' }
        channel: { type: string, enum: [seeker, owner] }
        reward: { type: string, description: "Human label, e.g. '+15 owner contacts'" }
        rewardAmount: { type: integer, description: Owner contacts or free agreements granted; 0 until it qualifies. }
        status: { type: string, enum: [pending, qualified, held, rewarded, rejected, clawed-back] }
        track: { type: [string, 'null'], enum: [owner, seeker, null], description: Decided by whichever qualifying event came first. }
        risk: { type: string, enum: [low, medium, high] }
        identityVerified: { type: boolean, description: The referred account held the ID verified badge when the referral qualified. }
        identityUnique: { type: boolean }
        sameDevice: { type: boolean }
        sameIp: { type: boolean }
        velocityHigh: { type: boolean }
        activated: { type: boolean }
        holdUntil: { type: [string, 'null'], format: date-time, description: When a held referral is re-checked. }
        autoReason: { type: [string, 'null'], description: 'Why the system decided: high_risk, medium_risk (held), cap_reached, self_dealing, referee_suspended, listing_taken_down (a moderation reject or flag; seeker rows react only to this), verification_revoked, listing_not_live (owner track only).' }
        at: { type: string, format: date-time }
    SavedSearch:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        kind: { type: string, enum: [listings, flatmates], default: listings, description: Which discovery surface this alert watches. }
        query: { type: string, description: URL-encoded filter query string (listings alerts). }
        filters: { type: object, additionalProperties: true, description: Structured filter object (alternative to the query string). }
        criteria: { $ref: '#/components/schemas/FlatmateAlertCriteria', description: Present only when `kind` is `flatmates`; listings alerts use `query` / `filters` instead. }
        label: { type: string, description: Short human summary rendered on the alert card and in the dashboard Alerts panel. }
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly] }
        channel: { type: string, enum: [whatsapp, sms, email, push], default: whatsapp }
        newCount: { type: integer, description: Matches that arrived since the alert sweep's last baseline. Falls back to zero once the alert has been sent — it is a "what changed" number, not a total. }
        matchCount: { type: integer, description: How many live listings match these facets right now, regardless of age. Computed server-side on every read of this resource, because the browser could only ever count one page of the catalogue. Always 0 for a `flatmates` alert, which this count does not cover. }
        createdAt: { type: string, format: date-time }
    SavedSearchCreate:
      type: object
      properties:
        name: { type: string }
        kind: { type: string, enum: [listings, flatmates], default: listings }
        query: { type: string, description: Required when `kind` is `listings`. }
        filters: { type: object, additionalProperties: true }
        criteria: { $ref: '#/components/schemas/FlatmateAlertCriteria', description: Required when `kind` is `flatmates`. }
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly], default: daily }
        channel: { type: string, enum: [whatsapp, sms, email, push], default: whatsapp }
        mobile: { $ref: '#/components/schemas/Mobile' }
    SavedSearchUpdate:
      # Absent means unchanged. `filters` (listings only) needs `query` alongside it.
      type: object
      properties:
        name: { type: string }
        query: { type: string }
        filters: { type: object, additionalProperties: true }
        alertFrequency: { type: string, enum: ["off", instant, daily, weekly] }
        channel: { type: string, enum: [whatsapp, sms, email, push] }
    RecentSearch:
      type: object
      required: [label, url, at]
      properties:
        label: { type: string, maxLength: 200, description: "Chip text the user saw, e.g. `Rent · 2 BHK · Baner`. Presentation only — never the identity of the entry, since two different searches can render the same chip." }
        url: { type: string, maxLength: 500, description: "Normalized relative search URL (lowercased path, query parameters sorted). The identity of the entry." }
        at: { type: string, format: date-time, description: When the user last ran this search. Always server-generated; never accepted from the client. }
    RecentSearchCreate:
      type: object
      required: [label, url]
      properties:
        label: { type: string, minLength: 1, maxLength: 200 }
        url:
          type: string
          minLength: 1
          maxLength: 500
          description: >-
            A relative URL on one of our own search pages (`/listings`, `/flatmates`). Anything
            else — absolute, protocol-relative, backslash-smuggled, off-site or over-long — is a 422.
          example: /listings?deal=rent&loc=baner
    Review:
      # `context`, `categories` and `recommend` are rendered by the property page, so the contract
      # must carry them — a contract that cannot express what the product ships is the defect.
      type: object
      properties:
        id: { type: string }
        targetType: { type: string, enum: [property, locality, society, owner] }
        targetId: { type: string }
        author: { type: string }
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        context:
          type: string
          enum: [visit, tenant]
          readOnly: true
          description: >
            How the author is known to have experienced the property -- `tenant` if they hold or
            held a tenancy on it, otherwise `visit` for a completed site visit. Drives the
            "Verified resident" / "Visited" badge, and is therefore **server-derived and
            read-only**: accepting it from the client would make the badge forgeable by anyone
            who can POST. Absent on society / locality / owner reviews, which have no visit or
            tenancy concept.
        categories:
          $ref: '#/components/schemas/ReviewCategories'
          description: >
            Optional per-aspect sub-ratings, each 1-5. Sparse -- the UI renders only the keys
            present, and an aspect nobody rated is absent rather than 0.

            **The vocabulary depends on the target type, and the server enforces that.** A listing
            is rated on `locality / condition / value / owner / accuracy`; a housing society on
            `Safety / Maintenance / Management / Amenities / Connectivity` -- the ids the society
            hub's aspect bars are keyed on, capitalisation included. The two sets are disjoint,
            because there is no aspect a flat and a society are both rated on. `locality` and
            `owner` targets use the property vocabulary: nothing in the product has named one for
            them, so they keep what they have always accepted.

            JSON Schema cannot make `properties` depend on a path parameter, so the union of both
            vocabularies is declared in `ReviewCategories` and the server narrows it per target --
            a society aspect posted to a property is **rejected with 400**, not dropped. Dropping
            it would return 201 for a review whose bar then renders empty, which is the failure
            nobody reports.
        recommend:
          type: [boolean, 'null']
          description: >
            Nullable on purpose: the UI distinguishes "did not say" (omit the recommend line)
            from "would not recommend" (`r.recommend != null`), so `false` and absent are not
            the same answer.
        createdAt: { type: string, format: date-time }
        mine:
          type: boolean
          readOnly: true
          description: >
            Present and true only on the signed-in caller's own review, so the page can offer
            edit and delete. Absent for every other row and for anonymous readers.
    ReviewModerationRow:
      type: object
      description: One row of the review moderation queue - only what the queue renders, with the review's own moderation state.
      properties:
        id: { type: string }
        targetType: { type: string, enum: [property, locality, society, owner] }
        targetId: { type: string }
        author: { type: string }
        authorMobile: { type: [string, 'null'], description: The author's mobile, in full }
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, published, rejected]
        rating: { type: integer, minimum: 1, maximum: 5 }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        status:
          type: string
          enum: [pending, published, rejected]
          description: >
            `pending` is in the enum because the column can hold it, not because this platform
            writes it: reviews are post-moderated, so `ReviewService` publishes on write.
    ReviewCreate:
      # Note what is NOT here: `context`. It is derived server-side (see Review.context), because a
      # client-settable badge would defeat the anti-fake-review rule it exists to enforce.
      type: object
      required: [rating]
      properties:
        rating: { type: integer, minimum: 1, maximum: 5 }
        title: { type: string }
        body: { type: string }
        categories: { $ref: '#/components/schemas/ReviewCategories' }
        recommend:
          type: [boolean, 'null']
          description: >-
            Omit for "did not say". `false` is a different answer, and the UI shows it as one.
    ReviewCategories:
      # Extracted so `Review` and `ReviewCreate` cannot drift apart on what an aspect map may hold.
      # See Review.categories for why the union is declared and the server narrows it.
      type: object
      properties:
        locality:     { type: integer, minimum: 1, maximum: 5 }
        condition:    { type: integer, minimum: 1, maximum: 5 }
        value:        { type: integer, minimum: 1, maximum: 5 }
        owner:        { type: integer, minimum: 1, maximum: 5 }
        accuracy:     { type: integer, minimum: 1, maximum: 5 }
        Safety:       { type: integer, minimum: 1, maximum: 5 }
        Maintenance:  { type: integer, minimum: 1, maximum: 5 }
        Management:   { type: integer, minimum: 1, maximum: 5 }
        Amenities:    { type: integer, minimum: 1, maximum: 5 }
        Connectivity: { type: integer, minimum: 1, maximum: 5 }
      additionalProperties: false
    ReviewList:
      type: object
      description: >
        Reviews of one target plus the rating summary over every published review of it -- the
        `PageEnvelope` fields, with `content` typed and `summary` beside it so the cards and the
        stars come from one read.
      required: [content, summary]
      properties:
        content:
          type: array
          items: { $ref: '#/components/schemas/Review' }
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }
        sort: { type: [string, 'null'], example: createdAt,desc }
        summary: { $ref: '#/components/schemas/ReviewSummary' }
    ReviewSummary:
      type: object
      required: [reviewCount, distribution, categoryAverages]
      properties:
        avgRating:
          type: [number, 'null']
          description: >-
            Mean published rating to one decimal, as the UI renders it. Null -- not 0 -- when the
            listing has no reviews, matching `Society.avgRating`: no rating is not a rating of
            zero, and a star strip showing 0.0 states something false about a listing nobody has
            reviewed yet.
        reviewCount:
          type: integer
          description: >-
            How many published reviews the summary is over. Always present, 0 included: unlike an
            average, "how many" always has an answer.
        distribution:
          type: object
          description: >-
            Reviews per star rating. **All five keys are always present and zero-filled**, so a bar
            chart needs no guard per bucket -- an absent bar and a zero-height bar are not the same
            picture, and only one of them is true.
          properties:
            '1': { type: integer }
            '2': { type: integer }
            '3': { type: integer }
            '4': { type: integer }
            '5': { type: integer }
          additionalProperties: false
        categoryAverages:
          type: object
          description: >-
            Mean per-aspect sub-rating to one decimal, over only the reviews that answered that
            aspect. Sparse and closed, exactly like `Review.categories`, and over the **same
            per-target-type vocabulary**: an aspect nobody rated is absent rather than 0, because
            averaging it over everyone would understate it, and an aspect belonging to another
            target's vocabulary is never published even if a legacy row holds one.
          properties:
            locality:     { type: number }
            condition:    { type: number }
            value:        { type: number }
            owner:        { type: number }
            accuracy:     { type: number }
            Safety:       { type: number }
            Maintenance:  { type: number }
            Management:   { type: number }
            Amenities:    { type: number }
            Connectivity: { type: number }
          additionalProperties: false
    # Two feeds, split by the one question a seeker can always answer: is there an address yet?
    # Behavioural spec: docs/flows/consumer/flatmates.md
    FlatmateTab:
      type: string
      description: >
        `move-in` = browse PLACES (rooms, plus groups that already hold a flat).
        `team-up` = browse PEOPLE (solo seekers, plus groups still hunting).
        `people` = the seekers of `team-up` alone; `teams` = its hunting groups alone.
        Replaces the legacy flatmates/rooms/groups triple, which split by our storage
        model rather than by seeker intent.
      enum: [move-in, team-up, people, teams]
      default: move-in
    FlatmateTabLegacy:
      type: string
      description: >
        Deprecated `?view=` values kept as read aliases so old deep links, saved alerts and
        notification links resolve instead of falling back to the default:
        rooms -> move-in; flatmates | groups -> team-up.
      enum: [rooms, flatmates, groups]
      deprecated: true
    LivingStyleAnswers:
      type: object
      description: >
        Optional answers to the twelve living-style questions, each an integer 0-2 on an ordered
        scale (0 strictest or quietest, 2 most relaxed). Keys are listed in question order.
      propertyNames: { enum: [tidy, food, sleep, wfh, guests, visitors, smoking, drinks, pets, bills, family, quiet] }
      additionalProperties: { type: integer, minimum: 0, maximum: 2 }
      example: { tidy: 0, food: 1, sleep: 2 }
    LivingStyle:
      type: object
      required: [answers, updatedAt]
      properties:
        answers: { $ref: '#/components/schemas/LivingStyleAnswers' }
        updatedAt: { type: string, format: date-time, nullable: true }
    LivingStyleUpdate:
      type: object
      required: [answers]
      properties:
        answers: { $ref: '#/components/schemas/LivingStyleAnswers' }
    FlatmateLivingStyle:
      type: object
      required: [answers, match, common]
      properties:
        answers: { $ref: '#/components/schemas/LivingStyleAnswers' }
        match:
          type: integer
          nullable: true
          minimum: 0
          maximum: 100
          description: Per shared answer, 2 - |a - b| points; 100 x points / (2 x common). Null under three shared answers.
        common: { type: integer, minimum: 0, maximum: 12, description: Answers both sides gave. }
    RoomKind:
      type: string
      description: >
        What the room physically is. Drives the derived `attachedBath` — a master bedroom's
        private bathroom is implied, so the host is never asked the same question twice.
        A partitioned living room is the budget option.
      enum: [master, bedroom, living]
    PriceBasis:
      type: string
      description: >
        Whether the rent is quoted per ROOM or per PERSON. `person` (legacy spare-room posts)
        is what one flatmate pays; `room` (owner flat-split) is the whole room rent, split
        equally by whoever takes it. Mixing them silently would make a shared bed look pricier
        than a private room. Defaults to `person` for every post predating the split flow.
      enum: [room, person]
      default: person
    Occupancy:
      type: string
      description: >
        Whether anyone already lives in the home. Orthogonal to `hostRole` / `verificationTier`:
        occupancy answers "will I have flatmates from day one?", host role answers the trust
        question. Derived from the flat's ledger server-side, never trusted from the client.
      enum: [empty, filling, occupied]
    HostRole:
      type: string
      description: Who is letting the space — an owner of the flat, or a sitting tenant seeking a replacement.
      enum: [owner, tenant]
    VerificationTier:
      type: string
      description: >
        Supply-side trust tier. `identity` is the floor and carries no badge; `owner` means the
        post is attached to an Ops-approved property; `tenant` means a sitting tenant attested a
        registered rent agreement (badge withheld until Ops approves the uploaded document).
      enum: [identity, tenant, owner]
    ShareIntent:
      type: string
      description: >
        How the seeker intends to take a per-room-priced room — `solo` (alone), `bring` (with
        someone they already know, two people) or `match` (they want Draazy to find them a
        room-sharer). Sets the opening message and tells the host how many people are moving in.
      enum: [solo, bring, match]
      default: solo
    FlatmateMoveIn:
      type: string
      description: >
        Move-in availability — the literal `now`, a legacy bucket of days (`15` | `30` | `60`),
        or an ISO-8601 date from the picker.
      example: '2026-08-15'
    FlatmateModStatus:
      type: string
      description: >
        Admin moderation state.


        `pending` is where every newly written room and group starts (D72) — visible to its
        author, to nobody else. A seeker post goes `live` at once and joins the review queue unreviewed. It is not an accusation; it means only that nobody has looked yet.
        The public feeds match on a whitelist (`live`, `approved`), so a state nobody thought about
        stays invisible rather than leaking.


        Rows written before D72 carry `live`: they were published under the rule in force at the
        time and were not retroactively pulled into the queue.


        `expired` is set only by the 30-day board-life sweep, never by a moderator (sending it is a
        `400`). The post stays on its owner's dashboard; `renewFlatmatePost` or any edit restores
        the state it expired from.
      enum: [pending, live, approved, flagged, removed, rejected, expired]
      default: pending
    FlatmateModerationQueueItem:
      type: object
      description: >
        One row of the flatmate moderation queue (D72). One shape for all three boards: a seeker
        post, a room and a group are stored and rendered differently, but a moderator asks each the
        same question — who wrote this, where do they say it is, and what did they type into the
        boxes nobody validated.


        `freeText` is the point of the screen; everything else is context. D72 exists because the
        free-text fields are where a broker who cannot publish a phone number in the contact field
        puts one instead, so a queue showing only a headline and a price would pass through exactly
        the abuse it was built to stop. `photos` is the other half of it: a number burned into an
        image, or a picture lifted from another listing, cannot be caught by reading.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [post, room, group], description: Which board this came from. }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        authorName: { type: [string, 'null'] }
        authorMobile: { type: [string, 'null'], description: In full }
        headline:
          type: [string, 'null']
          description: >
            The strongest short label the row has — the seeker's name, the society and flat, or the
            group title.
        locality: { type: [string, 'null'] }
        freeText:
          type: [string, 'null']
          description: Everything the author typed that nobody validated. Read this one.
        photos:
          type: array
          items: { type: string }
          description: >
            The author's images, in stored order. Always present; empty for a `post` or a `group`,
            neither of which has a photo column.
        rent:
          type: [integer, 'null']
          format: int64
          description: Monthly rent of a room or group; a seeker's budget ceiling (`budgetMax`, else `budget`).
        recheckReason:
          type: [string, 'null']
          description: >
            Comma-joined field names whose edit raised a pending re-check, accumulated across edits.
            Null when nothing is awaiting a re-read.
        recheckRequestedAt:
          type: [string, 'null']
          format: date-time
          description: >
            When the re-check was first raised. Not reset by later edits: its age is the SLA, so a
            host who re-crops a photo daily cannot walk their own row back down the queue.
        createdAt: { type: string, format: date-time }
    FlatmateModerationRow:
      type: object
      description: >
        One card of the flatmate moderation queue: `FlatmateModerationQueueItem` with only its first
        photo as the card's thumbnail; the popup reads every photo from the detail.
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [post, room, group] }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        authorName: { type: [string, 'null'] }
        authorMobile: { type: [string, 'null'], description: In full }
        headline: { type: [string, 'null'] }
        locality: { type: [string, 'null'] }
        freeText: { type: [string, 'null'] }
        photoCount: { type: integer, description: How many photos the author attached; 0 for a post or a group. }
        coverPhoto: { type: [string, 'null'], description: The first photo; null when there is none. }
        rent: { type: [integer, 'null'], format: int64, description: As on `FlatmateModerationQueueItem`. }
        recheckReason: { type: [string, 'null'] }
        recheckRequestedAt: { type: [string, 'null'], format: date-time }
        createdAt: { type: string, format: date-time }
    FlatmateModerationSummary:
      type: object
      properties:
        pending: { type: integer, format: int64, description: Awaiting posts, re-checks and group applications; badge claims are not counted here. }
        badgeRequests: { type: integer, format: int64, description: Open Verified-property claims, listed on the Badge requests tab. }
        published: { type: integer, format: int64 }
        hidden: { type: integer, format: int64 }
    FlatmateModerationDetail:
      type: object
      description: >
        One flatmate post as the moderation desk opens it. Exactly one of `room`, `group` and `post`
        is non-null, matching `item.kind`.
      properties:
        item: { $ref: '#/components/schemas/FlatmateModerationQueueItem' }
        room:
          oneOf:
            - $ref: '#/components/schemas/FlatmateRoom'
            - type: 'null'
        group:
          oneOf:
            - $ref: '#/components/schemas/FlatmateGroup'
            - type: 'null'
        post:
          oneOf:
            - $ref: '#/components/schemas/FlatmateSeekerPost'
            - type: 'null'
        review:
          oneOf:
            - $ref: '#/components/schemas/FlatmateReview'
            - type: 'null'
          description: The verification case, when the post claimed a tier that needs one.
        livingStyle:
          allOf:
            - $ref: '#/components/schemas/LivingStyleAnswers'
          description: The author's full living-style answers, in question order; empty when none. Staff see every answer.
    FlatmateSeekerPost:
      type: object
      description: >
        A person looking for flatmates who has **no address yet** — the `team-up` feed.
        One live post per identity (matched on mobile, then name).
      properties:
        id: { type: string, example: s1 }
        title: { type: [string, 'null'], maxLength: 120, description: 'The seeker''s own headline. Null on posts made before it existed — render the name instead.' }
        name: { type: string }
        gender: { type: string, enum: [any, male, female] }
        age: { type: [integer, 'null'], minimum: 18 }
        occupation: { type: string, example: UX Designer }
        budget: { $ref: '#/components/schemas/Money' }
        budgetMax: { $ref: '#/components/schemas/FlatmateBudgetMax' }
        localities:
          type: array
          description: Pune localities the seeker will consider (canonical registry names).
          items: { type: string }
          example: [Baner, Balewadi]
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        flatPref: { type: string, enum: [any, women, men], description: Who they want to share the flat with. }
        roomPref: { type: string, enum: [any, private, shared] }
        furnishing: { type: [string, 'null'], enum: [unfurnished, semi, furnished, null], description: Furnishing the seeker needs; null means any. }
        gatedOnly: { type: boolean, default: false, description: Only flats in a gated society. }
        attachedBath: { type: boolean, default: false, description: Needs a room with its own bathroom. }
        parking: { type: [string, 'null'], enum: [bike, car, null], description: Parking the seeker needs; null means none. }
        note: { type: string, maxLength: 600 }
        verifiedContactOnly: { type: boolean, default: false, description: Seeker-side of ADR-019 — only badged callers may express interest. }
        verified: { type: boolean, description: Mirrors the seeker's L2 ID verified badge at post time (ADR-009a). }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        mobile: { $ref: '#/components/schemas/Mobile' }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        createdAt: { type: string, format: date-time }
    FlatmateSeekerFeed:
      type: object
      description: A seeker post as anyone but its author sees it. No moderation verdict or contact; coordinates rounded to 3 decimals.
      properties:
        id: { type: string, example: s1 }
        title: { type: [string, 'null'], maxLength: 120, description: 'The seeker''s own headline. Null on posts made before it existed — render the name instead.' }
        name: { type: string }
        gender: { type: string, enum: [any, male, female] }
        age: { type: [integer, 'null'], minimum: 18 }
        occupation: { type: string, example: UX Designer }
        budget: { $ref: '#/components/schemas/Money' }
        budgetMax: { $ref: '#/components/schemas/FlatmateBudgetMax' }
        localities:
          type: array
          description: Pune localities the seeker will consider (canonical registry names).
          items: { type: string }
          example: [Baner, Balewadi]
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        flatPref: { type: string, enum: [any, women, men], description: Who they want to share the flat with. }
        roomPref: { type: string, enum: [any, private, shared] }
        furnishing: { type: [string, 'null'], enum: [unfurnished, semi, furnished, null], description: Furnishing the seeker needs; null means any. }
        gatedOnly: { type: boolean, default: false, description: Only flats in a gated society. }
        attachedBath: { type: boolean, default: false, description: Needs a room with its own bathroom. }
        parking: { type: [string, 'null'], enum: [bike, car, null], description: Parking the seeker needs; null means none. }
        note: { type: string, maxLength: 600 }
        verifiedContactOnly: { type: boolean, default: false, description: Seeker-side of ADR-019 — only badged callers may express interest. }
        verified: { type: boolean, description: Mirrors the seeker's L2 ID verified badge at post time (ADR-009a). }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        createdAt: { type: string, format: date-time }
    FlatmateSeekerPostCreate:
      type: object
      required: [budget, localities]
      description: The post's name is the poster's profile name, never sent; 422 when the profile has none.
      properties:
        gender: { type: string, enum: [any, male, female], default: any, description: What the poster picked, stored as given and never copied from the profile. A male/female value saves to an empty profile gender and is a 422 when it contradicts a set one. }
        age: { type: integer, minimum: 18 }
        occupation: { type: string }
        budget: { $ref: '#/components/schemas/Money' }
        budgetMax: { $ref: '#/components/schemas/FlatmateBudgetMax' }
        localities: { type: array, minItems: 1, maxItems: 3, items: { type: string } }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        flatPref: { type: string, enum: [any, women, men], default: any }
        roomPref: { type: string, enum: [any, private, shared], default: any }
        furnishing: { type: [string, 'null'], enum: [unfurnished, semi, furnished, null], description: Furnishing the seeker needs; null means any. }
        gatedOnly: { type: boolean, default: false, description: Only flats in a gated society. }
        attachedBath: { type: boolean, default: false, description: Needs a room with its own bathroom. }
        parking: { type: [string, 'null'], enum: [bike, car, null], description: Parking the seeker needs; null means none. }
        note: { type: string, maxLength: 600 }
        verifiedContactOnly: { type: boolean, default: false }
        title: { type: [string, 'null'], maxLength: 120, description: The seeker's own headline. Blank clears it. }
    FlatmateBilling:
      type: [string, 'null']
      enum: [included, shared, separate, null]
      description: >
        How a running bill sits against the quoted rent — inside it, split across the flat, or
        billed on top and paid by whoever takes the room. Null is a fourth state and means the host
        did not say: do not render it as `included`.
    FlatmateNoticePeriodDays:
      type: [integer, 'null']
      minimum: 0
      maximum: 180
      example: 30
      description: >
        How much notice a flatmate must give before leaving. Zero is a real and common term between
        flatmates; null means the host did not state one.
    FlatmateLockInMonths:
      type: [integer, 'null']
      minimum: 0
      maximum: 24
      example: 6
      description: The minimum stay. Zero means none; null means the host did not state one.
    FlatmateBudgetMax:
      type: [integer, 'null']
      minimum: 1
      description: >
        The top of the seeker's range. `budget` is the floor in both cases, so null here means they
        quoted a single number rather than that their budget is open-ended.
    FlatmateSaveKey:
      type: object
      description: >
        One entry in the caller's flatmate shortlist, as a key rather than a card. `GET
        /me/flatmate-saves/keys` answers with these; `GET /me/flatmate-saves` answers the other
        question with full projections.
      required: [kind, id]
      properties:
        kind:
          type: string
          enum: [room, group, post]
          description: Which collection `id` belongs to.
        id: { type: string, format: uuid }
    FlatmateInterestKey:
      type: object
      description: One sent ask as a key. `GET /me/flatmate-interests/keys` answers with these.
      required: [id, kind, targetId, status]
      properties:
        id: { type: string, format: uuid }
        kind: { type: string, enum: [flatmate, room, group] }
        targetId: { type: string, format: uuid }
        status: { type: string, enum: [pending, accepted, declined] }
    FlatmateRoomFeed:
      type: object
      description: >
        The card-sized projection of a room — what every anonymous read returns (`GET
        /flatmates/rooms`, `GET /flatmates/feed`, `GET /properties/{propId}/rooms`). It carries
        exactly what a card, a filter, the map and the client-side flat ledger consume; the eight
        fields `FlatmateRoom` adds on top are host-facing and no public reader touches them.
        Notably absent is `ownerMobile`: an anonymous room read has no field to put a number in,
        so the contact rule is structural rather than conventional.
      properties:
        id: { type: string, example: rm7 }
        type: { type: string, enum: [flatmate] }
        title: { type: [string, 'null'], maxLength: 120, description: 'The host''s own headline for the card. Null on posts made before it existed — render the society (room) or name (seeker) instead.' }
        propertyId: { type: [string, 'null'], description: Parent rent listing when this room came from a flat split — the key that ties sibling rooms into one occupancy ledger and one joint agreement. }
        roomKind: { $ref: '#/components/schemas/RoomKind' }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared], description: Derived from `roomKind` on split rooms (master implies attached); asked explicitly on single-room posts. }
        priceBasis: { $ref: '#/components/schemas/PriceBasis' }
        budget: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        noticePeriodDays: { $ref: '#/components/schemas/FlatmateNoticePeriodDays' }
        lockInMonths: { $ref: '#/components/schemas/FlatmateLockInMonths' }
        maintenanceBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        electricityBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        occupancy: { $ref: '#/components/schemas/Occupancy' }
        occupants: { type: integer, minimum: 0, maximum: 10, description: 'A split room: people actually living in THIS room (at most 3), emergent — tenants decide, the owner only records it. A spare room: how many people live in the whole flat today.' }
        maxOccupants: { type: integer, minimum: 1, default: 3, description: How many people may live in the whole FLAT (the society's rule) — the only ceiling the owner declares. }
        flatCommitted: { type: integer, readOnly: true, description: Derived — people moved into this flat across every sibling room. }
        flatMax: { type: [integer, 'null'], readOnly: true }
        shareMax: { type: integer, readOnly: true, minimum: 1, maximum: 3, description: 'Derived — the most people who could still take this room: min(3 - occupants, flatMax - flatCommitted). Always 1 when priceBasis is `person`.' }
        seatsTotal: { type: integer, minimum: 1, description: Seat model, used by single spare-room posts instead of the occupancy ledger. }
        seatsOpen: { type: integer, minimum: 0 }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        verified: { type: boolean, readOnly: true, description: 'Derived, never stored — the Verified pill. True when `verificationTier` is `owner`, or it is `tenant` and `reviewStatus` is `approved`. The same rule the `verifiedOnly` facet filters on, so a card cannot pass the filter unbadged.' }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted; `pending` withholds the tier badge and says so, `approved` grants it.' }
        society: { type: string }
        locality: { type: string }
        localities: { type: array, items: { type: string } }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        bhk: { type: string, enum: ['1', '2', '3', '4'], description: "'4' means 4+." }
        flatType: { type: string, example: 3 BHK }
        homeTypeLabel: { type: [string, 'null'], enum: [Flat, Independent House, Villa, Row House, null], description: 'What the building is, as the card renders it. Null is "the host did not say", which is a different answer from any of the four.' }
        gatedCommunity: { type: boolean }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        facing: { type: [string, 'null'], maxLength: 32, example: E }
        overlooking: { type: [string, 'null'], maxLength: 32, example: Garden }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        availableFrom: { type: [string, 'null'], format: date }
        gender: { type: string, enum: [any, male, female] }
        food: { type: string, enum: [any, veg, nonveg] }
        note: { type: string, maxLength: 600 }
        cover: { type: [string, 'null'], format: uri, readOnly: true, description: 'Derived — the first of the room''s photos, the card thumbnail. The gallery itself stays on the detail read. Null when the host has not added one yet.' }
        owner: { type: string }
        createdAt: { type: string, format: date-time }
    FlatmateRoom:
      type: object
      description: >
        A room offered inside a real flat — the `move-in` feed. Created either by the
        list-property flatmate flow (one spare room, seat-based) or by an owner splitting a
        whole rent listing room by room (occupancy-based, `POST /properties/{propId}/split`).


        The host-facing shape: every property of `FlatmateRoomFeed` plus the ones only the host's
        own view of a room needs — their number, the anti-broker forensics, and the fields no public
        reader consumes. Returned by the write endpoints (`POST /flatmates/rooms`, the two PATCHes)
        and by `POST /properties/{propId}/split`.


        Stated in full rather than as `allOf: [FlatmateRoomFeed, …]`: `SpecSchemaParityTest` only
        unwraps the paged `allOf`, and returns null for any other composition rather than guess. An
        `allOf` here would therefore drop all four of those operations out of parity checking
        silently — the schema would read better and be checked less. The two schemas cannot drift
        apart regardless, because parity pins each one to its record in both directions and
        `FlatmateRoomShapeTest` pins the records to each other.
      properties:
        id: { type: string, example: rm7 }
        type: { type: string, enum: [flatmate] }
        title: { type: [string, 'null'], maxLength: 120, description: 'The host''s own headline for the card. Null on posts made before it existed — render the society (room) or name (seeker) instead.' }
        propertyId: { type: [string, 'null'], description: Parent rent listing when this room came from a flat split — the key that ties sibling rooms into one occupancy ledger and one joint agreement. }
        roomKind: { $ref: '#/components/schemas/RoomKind' }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared], description: Derived from `roomKind` on split rooms (master implies attached); asked explicitly on single-room posts. }
        priceBasis: { $ref: '#/components/schemas/PriceBasis' }
        budget: { $ref: '#/components/schemas/Money' }
        deposit: { $ref: '#/components/schemas/Money' }
        noticePeriodDays: { $ref: '#/components/schemas/FlatmateNoticePeriodDays' }
        lockInMonths: { $ref: '#/components/schemas/FlatmateLockInMonths' }
        maintenanceBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        electricityBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        occupancy: { $ref: '#/components/schemas/Occupancy' }
        occupants: { type: integer, minimum: 0, maximum: 10, description: 'A split room: people actually living in THIS room (at most 3), emergent — tenants decide, the owner only records it. A spare room: how many people live in the whole flat today.' }
        maxOccupants: { type: integer, minimum: 1, default: 3, description: How many people may live in the whole FLAT (the society's rule) — the only ceiling the owner declares. }
        flatCommitted: { type: integer, readOnly: true, description: Derived — people moved into this flat across every sibling room. }
        flatMax: { type: [integer, 'null'], readOnly: true }
        shareMax: { type: integer, readOnly: true, minimum: 1, maximum: 3, description: 'Derived — the most people who could still take this room: min(3 - occupants, flatMax - flatCommitted). Always 1 when priceBasis is `person`.' }
        seatsTotal: { type: integer, minimum: 1, description: Seat model, used by single spare-room posts instead of the occupancy ledger. }
        seatsOpen: { type: integer, minimum: 0 }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        verified: { type: boolean, readOnly: true, description: 'Derived, never stored — the Verified pill. True when `verificationTier` is `owner`, or it is `tenant` and `reviewStatus` is `approved`. The same rule the `verifiedOnly` facet filters on, so a card cannot pass the filter unbadged.' }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted.' }
        agreementDeclared: { type: boolean }
        addressFingerprint: { type: string, description: Stable key for one physical flat, used to detect two hosts claiming the same address. }
        flagForReview: { type: boolean }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        society: { type: string }
        societyId: { type: string }
        flatNumber: { type: string }
        locality: { type: string }
        localities: { type: array, items: { type: string } }
        lat: { type: [number, 'null'], format: double }
        lng: { type: [number, 'null'], format: double }
        bhk: { type: string, enum: ['1', '2', '3', '4'], description: "'4' means 4+." }
        flatType: { type: string, example: 3 BHK }
        homeTypeLabel: { type: [string, 'null'], enum: [Flat, Independent House, Villa, Row House, null], description: 'What the building is, as the card renders it. Null is "the host did not say", which is a different answer from any of the four.' }
        gatedCommunity: { type: boolean }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        facing: { type: [string, 'null'], maxLength: 32, example: E }
        overlooking: { type: [string, 'null'], maxLength: 32, example: Garden }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        availableFrom: { type: string, format: date }
        gender: { type: string, enum: [any, male, female] }
        food: { type: string, enum: [any, veg, nonveg] }
        note: { type: string, maxLength: 600 }
        cover: { type: [string, 'null'], format: uri, readOnly: true, description: 'Derived — the first of `photos`, the card thumbnail. Null when the host has not added one yet.' }
        photos: { type: array, items: { type: string, format: uri } }
        owner: { type: string }
        ownerMobile: { $ref: '#/components/schemas/Mobile' }
        status: { $ref: '#/components/schemas/PropertyStatus' }
        createdAt: { type: string, format: date-time }
        host:
          oneOf:
            - $ref: '#/components/schemas/FlatmateRoomHost'
            - type: 'null'
          description: The host's own answers for the edit form. Only on `GET /flatmates/rooms/{id}` when the caller is the host; null everywhere else.
    FlatmateRoomDetails:
      type: object
      description: Wizard answers only the host's edit form reads back. Omitted or null clears them on update.
      properties:
        floor: { type: [string, 'null'], pattern: '^(Ground|[1-9]|[1-4][0-9]|50)$' }
        totalFloors: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        floorsInHouse: { type: [integer, 'null'], minimum: 1, maximum: 4 }
        bathrooms: { type: [integer, 'null'], minimum: 1, maximum: 4 }
        balconies: { type: [integer, 'null'], minimum: 0, maximum: 3 }
        furniture: { type: [array, 'null'], maxItems: 40, items: { type: string, maxLength: 60 } }
        tower: { type: [string, 'null'], maxLength: 30 }
        street: { type: [string, 'null'], maxLength: 60 }
        landmark: { type: [string, 'null'], maxLength: 60 }
        pincode: { type: [string, 'null'], pattern: '^[0-9]{6}$' }
    FlatmateRoomHost:
      type: object
      properties:
        details:
          oneOf:
            - $ref: '#/components/schemas/FlatmateRoomDetails'
            - type: 'null'
        agreementDoc:
          type: [object, 'null']
          description: The stored agreement's `id`, `name`, `mime` and `size`, never its bytes. Sending the same `id` back without `dataUrl` keeps the stored file.
        agreementValidTill: { type: [string, 'null'], format: date }
        ownerConsentMobile: { type: [string, 'null'], description: Unmasked — the host typed it, and the edit form sends it back. }
        attachedPropertyId: { type: [string, 'null'], format: uuid, description: 'The listing or tenancy flat this room claimed on create or edit. Not stored on the room, so the edit form sends it back as `propertyId` to keep the tier.' }
        reviewReason: { type: [string, 'null'], description: Ops' reason when the badge review was rejected. Host-only. }
        ownerConsentConfirmed: { type: [boolean, 'null'], description: Whether the flat owner's OTP consent is on file for the review; null with no review. Host-only. }
    FlatmateOwnerNoticeView:
      type: object
      required: [tenantName, locality, roomType, rent, status, homeSaved]
      description: What the flat owner sees on the confirm page. First name only; no phone numbers.
      properties:
        tenantName: { type: string, example: Asha, description: 'The tenant''s first name, or "Your tenant" when none is on file.' }
        society: { type: [string, 'null'] }
        locality: { type: string }
        roomType: { type: string, enum: [Private room, Shared room] }
        rent: { $ref: '#/components/schemas/Money' }
        status: { type: string, enum: [sent, agreed, declined] }
        homeSaved: { type: boolean, description: True when the owner agreed and this flat is saved as a private home on their account. }
    OwnerHome:
      type: object
      required: [managedId, title, locality, rooms]
      description: A flat the caller owns through a confirmed flatmate room, with the live rooms in it.
      properties:
        managedId: { type: string, description: The private managed record's id. }
        publishedListingId: { type: [string, 'null'] }
        title: { type: string }
        society: { type: [string, 'null'] }
        locality: { type: string }
        bhk: { type: [number, 'null'] }
        furnishing: { type: [string, 'null'], description: 'Managed vocabulary: unfurnished, semi-furnished, furnished.' }
        rooms:
          type: array
          items:
            type: object
            required: [id, tenantFirstName]
            properties:
              id: { type: string }
              title: { type: [string, 'null'] }
              roomType: { type: string, enum: [Private room, Shared room] }
              budget: { type: [integer, 'null'], format: int64 }
              deposit: { type: [integer, 'null'], format: int64 }
              status: { type: string }
              modStatus: { type: string }
              availableFrom: { type: [string, 'null'], format: date }
              photo: { type: [string, 'null'], description: The first photo's URL. }
              tenantFirstName: { type: string, description: 'First word of the host''s name, or "Your tenant".' }
    OwnerHomePrefill:
      type: object
      required: [managedId]
      description: >-
        The listing wizard's starting answers in the wizard's own vocabulary (furnishing is
        unfurnished | semi | furnished). Null means the source did not say.
      properties:
        managedId: { type: string }
        homeTypeLabel: { type: [string, 'null'] }
        bhk: { type: [string, 'null'] }
        gatedCommunity: { type: [boolean, 'null'] }
        furnishing: { type: [string, 'null'] }
        facing: { type: [string, 'null'] }
        overlooking: { type: [string, 'null'] }
        locality: { type: [string, 'null'] }
        localitySlug: { type: [string, 'null'] }
        society: { type: [string, 'null'] }
        societyId: { type: [string, 'null'], format: uuid }
        flatNumber: { type: [string, 'null'] }
        lat: { type: [number, 'null'] }
        lng: { type: [number, 'null'] }
        floor: { type: [string, 'null'] }
        totalFloors: { type: [integer, 'null'] }
        floorsInHouse: { type: [integer, 'null'] }
        bathrooms: { type: [integer, 'null'] }
        balconies: { type: [integer, 'null'] }
        furniture: { type: [array, 'null'], items: { type: string } }
        tower: { type: [string, 'null'] }
        street: { type: [string, 'null'] }
        landmark: { type: [string, 'null'] }
        pincode: { type: [string, 'null'] }
    FlatmateRoomCreate:
      type: object
      required: [bhk, roomType, locality, rentShare, deposit, availableFrom]
      description: >-
        Single spare-room post from the list-property flatmate flow. The required set mirrors
        `submitFlatmate` validation. A create (POST) must also carry `homeTypeLabel`, `attachedBath`,
        `furnishing`, `flatNumber`, `noticePeriodDays`, `lockInMonths`, `details.bathrooms`,
        `details.floor` and `details.totalFloors` for a Flat (`details.floorsInHouse` otherwise), and at
        least 3 photos, or it is refused with `422`. A PATCH is not held to these, so rooms posted
        before they were required stay editable.
      properties:
        homeTypeLabel: { type: [string, 'null'], enum: [Flat, Independent House, Villa, Row House, null], description: 'What the building is, as the room card renders it. Null is "the host did not say", which is a different answer from any of the four.' }
        bhk: { type: string, enum: ['1', '2', '3', '4'] }
        roomType: { type: string, enum: ['Private room', 'Shared room'] }
        attachedBath: { type: string, enum: [attached, shared] }
        furnishing: { type: string, enum: [unfurnished, semi, furnished] }
        facing: { type: [string, 'null'], maxLength: 32, example: E, description: 'Optional direction (E/W/N/S). Trimmed; omitted, null or blank clears it on update.' }
        overlooking: { type: [string, 'null'], maxLength: 32, example: Garden, description: 'Optional outlook (Garden/Amenity/Parking/Main Road). Trimmed; omitted, null or blank clears it on update.' }
        locality: { type: string }
        localitySlug: { type: string, maxLength: 80, description: 'The picked live locality; wins over `locality`. A retired one passes only if the record already has it.' }
        societyId:
          type: string
          description: >-
            The society this room sits in. On update, omitted or null keeps the current binding and an
            empty string removes it; the id is checked only when it differs from the current one, so a
            room bound to a since-retired society stays editable. The room's `society` text is derived
            from it on the server.
        society: { type: string, deprecated: true, description: Ignored; the room's society text is derived from `societyId`. }
        flatNumber: { type: string, maxLength: 40 }
        rentShare: { $ref: '#/components/schemas/Money' }
        deposit: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'Required; 0 means no deposit.' }
        occupants: { type: integer, minimum: 0, maximum: 10, description: How many people live in the flat today. A spare room is one vacancy in a flat somebody already lives in, and this is the seeker's first question about it. A split room clamps it to the people in that room (at most 3). }
        maxOccupants: { type: integer, minimum: 1, maximum: 6, default: 3, description: The society's cap on the whole flat. }
        noticePeriodDays: { $ref: '#/components/schemas/FlatmateNoticePeriodDays' }
        lockInMonths: { $ref: '#/components/schemas/FlatmateLockInMonths' }
        maintenanceBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        electricityBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        availableFrom: { type: string, format: date }
        lookingFor: { type: string, enum: [any, male, female] }
        foodPref: { type: string, enum: [any, veg, nonveg] }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        propertyId: { type: string, description: 'For an owner, earns the owner tier only when it is their own Ops-approved listing; for a tenant, the flat of their Draazy tenancy, filed with the review so Ops can match the registered agreement. Never stored on the room — a spare room holds seats, and a room cannot be both seat-based and a split of a flat.' }
        agreementDeclared: { type: boolean, description: 'Files the agreement for the Verified property badge; 409 `identity_required` unless the host''s ID check is verified or in review.' }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        ownerConsentMobile:
          $ref: '#/components/schemas/Mobile'
          description: >
            The flat owner's number. Required (422 otherwise) when the host is a tenant, and it
            cannot be the caller's own number. Sending it asserts nothing: consent is recorded
            against an OTP the owner types at `POST /flatmates/owner-consent` or by the owner
            tapping Agree on the WhatsApp notice the server sends them (see
            `GET /flatmates/owner-notice`), and the server re-derives the flag from that record on
            every create and every edit.
        ownerConsent:
          type: boolean
          description: Required as `true` for tenant-hosted rooms; records the host's declaration that the owner permits the replacement search. The verified consent badge still comes only from OTP-backed `ownerConsentMobile`.
        photos:
          type: array
          maxItems: 20
          items: { type: string, format: uri }
          description: >
            At most `GET /bootstrap`'s `listingPolicy.maxPhotos`, the same ceiling a listing has; more is a `422`.
            Optional, so a host can post the room and add pictures once they are back at the flat.
            An empty gallery still costs the room its auto-publish: it files as `pending` for Ops
            rather than reaching the board, because a pictureless room is the shape of broker spam.
        note: { type: string, maxLength: 600 }
        lat: { type: number, format: double }
        lng: { type: number, format: double }
        gatedCommunity: { type: boolean }
        details: { $ref: '#/components/schemas/FlatmateRoomDetails' }
        title: { type: [string, 'null'], maxLength: 120, description: The host's own headline for the card. Blank clears it. }
    FlatmateDetail:
      type: object
      required: [kind, owned, item, photos]
      properties:
        kind: { type: string, enum: [group, room, post] }
        owned: { type: boolean, description: The caller is the host or author }
        item:
          type: object
          description: The host's full shape when `owned`, else the public feed card
        photos: { type: array, items: { type: string } }
        verification:
          description: The host's own tenant-badge checklist. Null for other viewers and when no badge was claimed.
          oneOf:
            - { $ref: '#/components/schemas/FlatmateVerification' }
            - { type: 'null' }
        specs:
          description: A room's flat and furniture answers from the wizard. Null on groups and posts, and on a room without wizard answers. Tower, street, landmark and pincode are never sent here.
          oneOf:
            - { $ref: '#/components/schemas/FlatmateRoomSpecs' }
            - { type: 'null' }
    FlatmateRoomSpecs:
      type: object
      properties:
        floor: { type: [string, 'null'], pattern: '^(Ground|[1-9]|[1-4][0-9]|50)$' }
        totalFloors: { type: [integer, 'null'], minimum: 1, maximum: 50 }
        floorsInHouse: { type: [integer, 'null'], minimum: 1, maximum: 4 }
        bathrooms: { type: [integer, 'null'], minimum: 1, maximum: 4 }
        balconies: { type: [integer, 'null'], minimum: 0, maximum: 3 }
        furniture: { type: [array, 'null'], maxItems: 40, items: { type: string, maxLength: 60 } }
    FlatmateVerification:
      type: object
      required: [status, ownerConsent]
      properties:
        status: { type: string, enum: [pending, approved, rejected] }
        ownerConsent: { type: boolean, description: The property owner confirmed the sublet by OTP }
        reason: { type: [string, 'null'], description: The moderator's note on a rejection }
    FlatmateGroup:
      type: object
      description: >
        People teaming up. A group with an address (`propertyId` / `society`) sorts into
        `move-in`; an address-less group is a set of people still hunting and sorts into `team-up`.
      properties:
        id: { type: string, example: g1 }
        title: { type: string }
        locality: { type: string }
        policy: { type: string, enum: [any, women, men], description: 'Who the group admits by gender; `any` is mixed. Every join waits for the host to accept.' }
        rent: { $ref: '#/components/schemas/Money', description: Whole-flat rent. }
        deposit: { $ref: '#/components/schemas/Money' }
        noticePeriodDays: { $ref: '#/components/schemas/FlatmateNoticePeriodDays' }
        lockInMonths: { $ref: '#/components/schemas/FlatmateLockInMonths' }
        maintenanceBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        electricityBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        perHead: { $ref: '#/components/schemas/Money', description: 'Server-computed rent / seatsTotal (falling back to whole rent when seatsTotal is 0, so a client never divides by zero). Sent rather than derived because every surface that shows a group shows this number, and one rounding rule beats five.' }
        seatsTotal: { type: integer, minimum: 1 }
        seatsOpen: { type: integer, minimum: 0, description: Seats open right now — the honest count for a tenant backfilling one seat. Never more than seatsTotal minus members; legacy groups without the column get exactly that. }
        members:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: 'Omitted when this member has not given a name — an OTP account has none until its profile is filled in. Render a placeholder; do not invent one, and do not treat the absence as an error.' }
              initials: { type: string, maxLength: 2, description: Omitted with `name`, since there is nothing to take initials from. }
              verified: { type: boolean }
              id: { type: string, description: 'The member row. The host sends it to `DELETE /flatmates/groups/{id}/members/{memberId}`.' }
              host: { type: boolean, description: This member is the group's host. }
        propertyId: { type: [string, 'null'] }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        agreementDeclared: { type: boolean }
        ownerConsent: { type: boolean, description: True once the flat's owner confirmed the replacement search via OTP — turning "trust me" into an auditable consent record. }
        ownerConsentMobile: { $ref: '#/components/schemas/Mobile' }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted.' }
        addressFingerprint: { type: string }
        flagForReview: { type: boolean }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        note: { type: string, maxLength: 600 }
        ownerName: { type: string }
        ownerMobile: { $ref: '#/components/schemas/Mobile' }
        createdAt: { type: string, format: date-time }
        preferences: { $ref: '#/components/schemas/FlatmateGroupPreferences' }
    FlatmateGroupFeed:
      type: object
      description: >
        The card projection of a group, and what every anonymous read returns. Written out in full
        rather than as an `allOf` of FlatmateGroup for the same reason FlatmateRoomFeed is: a
        subtractive relationship cannot be expressed in JSON Schema, so an `allOf` would claim the
        card carries the host-only fields it exists to withhold. Absent here on purpose:
        `ownerConsentMobile` (a third party's number), `addressFingerprint` and `flagForReview`
        (anti-broker forensics the client only writes), `modStatus` (the moderation verdict — every
        producer of this shape already filters to the cleared statuses, so it could only say "this
        one passed") and `ownerMobile` (reached by expressing interest, never by browsing).
        `ownerConsent` stays as the boolean the card actually renders.
      properties:
        id: { type: string, example: g1 }
        title: { type: string }
        locality: { type: string }
        policy: { type: string, enum: [any, women, men], description: 'Who the group admits by gender; `any` is mixed. Every join waits for the host to accept.' }
        rent: { $ref: '#/components/schemas/Money', description: Whole-flat rent. }
        deposit: { $ref: '#/components/schemas/Money' }
        noticePeriodDays: { $ref: '#/components/schemas/FlatmateNoticePeriodDays' }
        lockInMonths: { $ref: '#/components/schemas/FlatmateLockInMonths' }
        maintenanceBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        electricityBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        perHead: { $ref: '#/components/schemas/Money', description: 'Server-computed rent / seatsTotal (falling back to whole rent when seatsTotal is 0, so a client never divides by zero).' }
        seatsTotal: { type: integer, minimum: 1 }
        seatsOpen: { type: integer, minimum: 0, description: Seats open right now — the honest count for a tenant backfilling one seat. Never more than seatsTotal minus members; legacy groups without the column get exactly that. }
        members:
          type: array
          items:
            type: object
            properties:
              name: { type: string, description: 'Omitted when this member has not given a name — an OTP account has none until its profile is filled in. Render a placeholder; do not invent one, and do not treat the absence as an error.' }
              initials: { type: string, maxLength: 2, description: Omitted with `name`, since there is nothing to take initials from. }
              verified: { type: boolean }
              host: { type: boolean, description: This member is the group's host. }
        propertyId: { type: [string, 'null'] }
        hostRole: { $ref: '#/components/schemas/HostRole' }
        verificationTier: { $ref: '#/components/schemas/VerificationTier' }
        agreementDeclared: { type: boolean }
        ownerConsent: { type: boolean, description: True once the flat's owner confirmed the replacement search via OTP — turning "trust me" into an auditable consent record. The fact is public; the number behind it is not. }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: 'Ops verdict on the host claim to the flat — see FlatmateReview. Null when nothing was submitted; `pending` withholds the tier badge and says so, `approved` grants it and lets the group survive the Verified-only filter.' }
        note: { type: string, maxLength: 600 }
        ownerName: { type: string }
        createdAt: { type: string, format: date-time }
        preferences: { $ref: '#/components/schemas/FlatmateGroupPreferences' }
    FlatmateGroupCreate:
      type: object
      required: [title]
      description: >
        With `preferences` the group is still looking for a flat: `locality`, `rent`, the deposit,
        the terms and every trust input (`role`, `propertyId`, agreement, consent) are ignored, since
        there is no flat to describe. Without it, `locality` and `rent` are required (422 otherwise).
        The creator joins as the first member under their profile name; 422 when the profile has
        none.
      properties:
        title: { type: string }
        locality: { type: string, maxLength: 80, description: Where the flat is. Required for a group with a flat — a substituted default would invent a fact about a flat nobody named. }
        localitySlug: { type: string, maxLength: 80, description: 'The picked live locality; wins over `locality`. A retired one passes only if the record already has it.' }
        policy: { type: string, enum: [any, women, men], default: women }
        rent: { $ref: '#/components/schemas/Money' }
        deposit: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'Required (422) for a group with a flat; 0 means no deposit.' }
        noticePeriodDays: { $ref: '#/components/schemas/FlatmateNoticePeriodDays' }
        lockInMonths: { $ref: '#/components/schemas/FlatmateLockInMonths' }
        maintenanceBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        electricityBilling: { $ref: '#/components/schemas/FlatmateBilling' }
        seats: { type: integer, minimum: 1, maximum: 12, default: 2 }
        seatsOpen: { type: integer, minimum: 0, maximum: 12, default: 1 }
        role: { $ref: '#/components/schemas/HostRole' }
        propertyId: { type: string, description: Only honoured when role is `owner`; must be an Ops-approved listing to earn the owner tier. }
        agreement: { type: boolean }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        consentMobile: { $ref: '#/components/schemas/Mobile' }
        note: { type: string, maxLength: 600 }
        preferences: { $ref: '#/components/schemas/FlatmateGroupPreferences' }
    FlatmateGroupPreferences:
      type: [object, 'null']
      description: >
        What a group that is still house-hunting wants. Present exactly when the group has no flat
        yet; null on a group that holds or is filling one. Ranges rather than figures, because the
        flat is not chosen. `rentMax` is also the group's `rent`, so `perHead` is the top of the
        per-head budget.
      required: [localities, rentMax, depositMax]
      properties:
        localities: { type: array, minItems: 1, maxItems: 3, items: { type: string, maxLength: 80 }, description: The shortlist, in the group's order. The first is also `locality`. }
        bhk: { type: array, maxItems: 4, items: { type: string, enum: ['1', '2', '3', '4'] }, description: 'Flat sizes the group would take; `4` means 4 or more. Empty means any.' }
        rentMin: { $ref: '#/components/schemas/Money' }
        rentMax: { $ref: '#/components/schemas/Money' }
        depositMin: { $ref: '#/components/schemas/Money' }
        depositMax: { allOf: [ { $ref: '#/components/schemas/Money' } ], description: 'Required; 0 means no deposit.' }
        gatedOnly: { type: boolean, default: false, description: Only flats in a gated society. }
        bachelors: { type: boolean, default: false, description: 'The group is bachelors, so it needs a flat that allows them — the commonest refusal in Pune rentals.' }
        furnishing: { type: [string, 'null'], enum: [unfurnished, semi, furnished, null] }
        parking: { type: [string, 'null'], enum: [bike, car, null], description: Parking the group needs; null means none. }
        moveInBy: { type: [string, 'null'], format: date, description: When the group wants to move in by. }
    AgreementDoc:
      type: object
      description: >
        A tenant's uploaded rent agreement — the artifact Ops verifies. Images and PDFs only.
        Files over 3 MB are recorded present-but-not-stored so Ops can still ask for the original.
      properties:
        id: { type: string, description: Opaque upload/document id for the registered agreement. Required whenever the agreement is declared. }
        name: { type: string, maxLength: 200 }
        size: { type: integer, minimum: 0 }
        mime: { type: string, enum: ['application/pdf', 'image/jpeg', 'image/png', 'image/webp'] }
        dataUrl: { type: [string, 'null'], description: 'Base64 data URL for a stored document. Null whenever the file was not stored — over the 3 MB cap (`tooLarge: true`), or unreadable — so null does not imply `tooLarge`.' }
        tooLarge: { type: boolean, default: false }
        type: { type: string, enum: [rent_agreement, electricity_bill], description: 'Set when the document came from the personal vault: which of the two evidence kinds it is.' }
    AgreementValidTill:
      type: [string, 'null']
      format: date
      description: >
        Legacy. When set, the nightly sweep withdraws the Verified property badge after this date. Null on
        every new post, and null means nothing expires.
    FlatSplitRequest:
      type: object
      required: [maxOccupants, rooms]
      description: >
        Split an existing **rent** listing into per-room supply. The whole-flat listing keeps
        existing, so the share market never cannibalises core rental inventory.
      properties:
        maxOccupants:
          type: integer
          description: 'People allowed in the whole flat. Must sit in [roomCount, roomCount x 3].'
          minimum: 1
        rooms:
          type: array
          minItems: 1
          description: 'Lettable rooms = bedrooms + hall. Max is bhk + 1; unbounded when bhk is "4" (meaning 4+), so only the flat cap binds.'
          items:
            type: object
            required: [roomKind, rent]
            properties:
              roomKind: { $ref: '#/components/schemas/RoomKind' }
              rent: { $ref: '#/components/schemas/Money' }
              deposit: { $ref: '#/components/schemas/Money', description: Defaults to 2x rent when omitted. }
              note: { type: string, maxLength: 600 }
    FlatSplitResult:
      type: object
      properties:
        count: { type: integer }
        tier: { $ref: '#/components/schemas/VerificationTier' }
        pending: { type: boolean, description: True when the parent listing is not yet Ops-approved, so the rooms start unbadged. }
        flagged: { type: boolean, description: True when a different host already claimed this address. }
        rooms: { type: array, items: { $ref: '#/components/schemas/FlatmateRoom' } }
    FlatmateInterestCreate:
      type: object
      description: Express interest in a seeker, a room or a group.
      properties:
        share: { $ref: '#/components/schemas/ShareIntent', description: Rooms only — how many people are moving in. }
        message: { type: string, maxLength: 4000, description: Optional override; the server generates a share-intent-appropriate opener when absent. }
        gender: { type: string, enum: [any, male, female], description: Rooms and groups restricted to women or men only. Ignored once the caller's profile has a gender, which is what the gate checks; otherwise a male/female value here is saved to the profile, and without either the request is refused with 422. }
    FlatmateRoomCard:
      type: object
      description: >
        A host's own room as the dashboard and the board's "your posts" strip draw it: title, price,
        place, occupancy and moderation state. `FlatmateRoom` stays on the write endpoints and the
        detail read, where the edit form needs the rest.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        propertyId: { type: [string, 'null'], format: uuid }
        society: { type: [string, 'null'] }
        flatType: { type: [string, 'null'] }
        locality: { type: string }
        localities: { type: array, items: { type: string } }
        budget: { type: integer, format: int64 }
        shareMax: { type: integer }
        occupants: { type: integer }
        cover: { type: [string, 'null'] }
        modStatus: { type: string }
        status: { type: string }
        createdAt: { type: string, format: date-time }
        hostRole: { type: string, enum: [owner, tenant] }
        verificationTier: { type: string, enum: [identity, tenant, owner] }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: The badge review's state; null when no review is filed. }
    FlatmateGroupCard:
      type: object
      description: >
        A host's own group as the dashboard, the board's "your posts" strip and the group-apply
        picker draw it. `FlatmateGroup` stays on the write endpoints and the detail read.
      properties:
        id: { type: string, format: uuid }
        title: { type: string }
        locality: { type: string }
        localities: { type: array, items: { type: string }, description: 'The hunted localities, else the group''s one locality.' }
        rent: { type: integer, format: int64 }
        seatsTotal: { type: integer }
        seatsOpen: { type: integer }
        memberCount: { type: integer }
        propertyId: { type: [string, 'null'], format: uuid }
        modStatus: { type: string }
        createdAt: { type: string, format: date-time }
        hostRole: { type: string, enum: [owner, tenant] }
        hunting: { type: boolean, description: Still looking for a flat, so there is no home to verify. }
        verificationTier: { type: string, enum: [identity, tenant, owner] }
        reviewStatus: { type: [string, 'null'], enum: [pending, approved, rejected, null], description: The badge review's state; null when no review is filed. }
    FlatmateRequest:
      type: object
      description: >
        Host-facing inbox record. The seeker-side interest map is device-local; this is what the
        HOST sees in Dashboard -> Requests. Deduped by requester + target.
      properties:
        id: { type: string }
        kind: { type: string, enum: [flatmate, room, group] }
        action: { type: string, enum: [request, join], description: 'Always `request` (needs host approval); `join` appears only on legacy rows from the retired auto-join.' }
        share: { $ref: '#/components/schemas/ShareIntent' }
        targetId: { type: string }
        targetTitle: { type: string }
        locality: { type: string }
        requesterName: { type: string }
        requesterMobile:
          type: [string, 'null']
          description: Masked (`98XXXXX210`) on the host's inbox until the host accepts; the requester's own outbox rows carry their own ten-digit number.
        status: { type: string, enum: [pending, accepted, declined] }
        requestedAt: { type: string, format: date-time }
        message: { type: [string, 'null'], description: "The requester's note to the host, written when the request was made." }
        decidedAt: { type: [string, 'null'], format: date-time }
    FlatmateReview:
      type: object
      description: >
        Ops agreement-review queue item. A tenant's "I have a registered rent agreement" is
        self-declared, so tenant-tier posts — plus any address a different host already claimed and
        any flat split whose parent listing is still pending — land here before the post earns a
        badge. One review per group, and one per flat (not per room).
      properties:
        id: { type: string }
        kind: { type: string, enum: [room, group] }
        roomId: { type: [string, 'null'] }
        groupId: { type: [string, 'null'] }
        host: { type: string }
        hostMobile:
          type: [string, 'null']
          example: '9876543210'
          description: In full — back-office only.
        hostVerified: { type: boolean, description: The host has completed ID verification. Required to approve a `tenant` claim. }
        address: { type: string }
        tier: { $ref: '#/components/schemas/VerificationTier' }
        flagForReview: { type: boolean, description: Contested address — a DIFFERENT host already claimed it. Fuzzy match, so flag-not-block. }
        ownerConsent:
          type: boolean
          description: >
            True only once the flat's owner confirmed by OTP. Never client-asserted: the supply
            service derives it from the consent table on every create and every edit. Approving a
            `tenant` review while this is false is refused with 422.
        ownerConsentMobile:
          type: [string, 'null']
          example: '9876543210'
          description: The number the owner consent OTP goes to. In full — back-office only.
        ownerConsentAccount:
          type: [string, 'null']
          description: >
            Name on the Draazy account registered to `ownerConsentMobile`; null when there is none. The OTP
            proves only possession of the number, so this is what the reviewer compares with a light bill.
        ownerConsentAccountVerified: { type: boolean, description: That account has completed ID verification. }
        agreementDoc: { $ref: '#/components/schemas/AgreementDoc' }
        evidenceType: { type: [string, 'null'], enum: [rent_agreement, electricity_bill, null], description: What the host filed. Null on reviews that predate light bills, which are read as `rent_agreement`. }
        evidenceIssuedOn: { type: [string, 'null'], format: date, description: The bill date the reviewer recorded. }
        nameMatches: { type: [boolean, 'null'], description: The reviewer's name check; cleared when the host files again. }
        addressMatches: { type: [boolean, 'null'], description: The reviewer's address check; cleared when the host files again. }
        agreementValidTill: { $ref: '#/components/schemas/AgreementValidTill' }
        status: { type: string, enum: [pending, approved, rejected] }
        reason: { type: string, description: Required on reject; shown to the host. }
        createdAt: { type: string, format: date-time }
        updatedAt: { type: string, format: date-time }
    FlatmateReviewRow:
      type: object
      description: >
        One card of the verification queue: `FlatmateReview` without the agreement file, the
        registration particulars and the verdict, all of which the popup reads from the detail.
      properties:
        id: { type: string }
        kind: { type: string, enum: [room, group] }
        roomId: { type: [string, 'null'] }
        groupId: { type: [string, 'null'] }
        host: { type: string }
        hostMobile: { type: [string, 'null'], description: In full }
        hostVerified: { type: boolean }
        evidenceType: { type: [string, 'null'], enum: [rent_agreement, electricity_bill, null] }
        address: { type: string }
        tier: { $ref: '#/components/schemas/VerificationTier' }
        flagForReview: { type: boolean }
        ownerConsent: { type: boolean }
        createdAt: { type: string, format: date-time }
    FlatmateAlertCriteria:
      type: object
      description: >
        A flatmates saved-search. Only records filters the active tab actually honours, mirroring
        the tab-gated FilterBar, so a stale value never rides along invisibly.
      properties:
        tab: { $ref: '#/components/schemas/FlatmateTab' }
        q: { type: string }
        locality: { type: string }
        budget: { $ref: '#/components/schemas/Money', description: Omitted when the slider sits at its 40000 "Any" sentinel. }
        moveIn: { $ref: '#/components/schemas/FlatmateMoveIn' }
        gender: { type: string, enum: [male, female] }
        sharing: { type: string, description: '`team-up` only — group size.' }
        attachedBath: { type: boolean, description: '`move-in` only.' }
        strictGender: { type: boolean, description: 'With `gender`: excludes rows open to any gender.' }
        roomType: { type: string, enum: [private, shared], description: '`move-in` rooms and `people` seekers; `teams` ignores it.' }
        furnishing: { type: string, enum: [furnished, semi, unfurnished], description: '`move-in` only.' }
        gated: { type: boolean, description: '`move-in` only.' }
        verifiedOnly: { type: boolean }
        vibe:
          type: array
          description: Living-style tokens, same grammar and semantics as the feed `vibe` parameter; the alert owner's own answers play the caller.
          items: { type: string, pattern: '^(food|smoking|pets|drinks|visitors|sleep):[0-2]$' }
        label: { type: string, readOnly: true, description: Short human summary, e.g. 'Move in now · Baner · Verified'. }
    GroupApplication:
      type: object
      description: A flatmate group applying to an owner's listing. Carries two independent statuses — the owner's decision and admin moderation.
      properties:
        id: { type: string }
        listingId: { type: string }
        listingTitle: { type: string }
        locality: { type: string }
        rent: { $ref: '#/components/schemas/Money' }
        perHead: { $ref: '#/components/schemas/Money' }
        groupTitle: { type: string }
        applicantName: { type: string }
        applicantMobile: { type: [string, 'null'], description: In full on the staff moderation desk; null on the owner's inbox. }
        members: { type: integer }
        seatsTotal: { type: integer }
        status: { type: string, enum: [pending, accepted, declined, withdrawn], description: The OWNER's decision, or withdrawn by the applicant. Admin may never write this. }
        modStatus: { $ref: '#/components/schemas/FlatmateModStatus' }
        at: { type: string, format: date-time }
    HostEligibility:
      type: object
      description: >
        Anti-broker guardrails, evaluated on every supply-side create (room post, group, flat split).
        A hard block (cap hit, or the same host re-claiming an address) refuses the post; a soft flag
        (a different host already claimed it) still posts but routes to Ops.
      properties:
        blocked: { type: boolean }
        overCap: { type: boolean, description: True at 3 live non-owner-tier posts per identity. Owner-tier posts are exempt from the count but never from the dedupe. }
        duplicate: { type: boolean }
        flagForReview: { type: boolean }
        fingerprint: { type: string }
        reason: { type: string }
    Notification:
      type: object
      properties:
        id: { type: string }
        type: { type: string, description: 'Dotted domain event (e.g. `offer.received`) or a coarse surface tag: `share` (flatmates), `listing`, `service`.', example: offer.received }
        title: { type: string }
        body: { type: string }
        read: { type: boolean }
        link: { type: string }
        createdAt: { type: string, format: date-time }
    QuietHours:
      type: object
      description: |
        A do-not-disturb window as two 24-hour `HH:mm` wall-clock labels -- exactly what
        `<input type="time">` emits and what the browser has always stored.

        The window MAY wrap past midnight; the default (22:00-07:00) does. `start == end` means
        "never", not "always" -- zero minutes and 1,440 minutes are the same pair of labels, and
        reading it the other way would mute a user permanently for dragging two sliders together.

        **Timezone.** The labels are reckoned in Asia/Kolkata. This platform has no per-user
        timezone -- `users` carries a city and nothing more -- so a user outside India would be
        quieted at IST-equivalent local times. Recorded here as an assumption rather than left
        implicit; a per-user zone is a new column and a new control, not a change to this schema.
      properties:
        enabled: { type: boolean }
        start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '22:00' }
        end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '07:00' }
    NotificationPreferences:
      type: object
      description: |
        How the platform is allowed to reach this user. Absent settings resolve to the values below,
        which are the browser's long-standing defaults: an account that has never opened Settings
        behaves exactly as it always has, and never as "everything muted".

        What the server acts on TODAY:
        * `quietHours` -- a notification written inside the window is **deferred**, never dropped.
          It is stored with its real timestamp and becomes visible when the window closes. The inbox
          is the only place a notification is ever read, so suppressing one would permanently lose an
          event (an offer, a moderation verdict) the user never asked to lose.
        * `matchAlerts` -- the master switch for proactive saved-search/price alerts, which ARE
          dropped when it is off (there is no later moment at which the user wants one). It does not
          silence events the user is a party to; an offer on your listing is not an alert you opted
          into.

        What is stored and returned but NOT yet acted on: `email`, `sms`, `whatsapp` and `language`.
        Nothing on the server sends email, SMS or WhatsApp -- delivery today is the in-app inbox and
        nothing else -- so there is no sender for these to gate. Gating the in-app row on a switch
        labelled "Email" would be worse than not gating it. They are persisted so the first real
        channel sender inherits an answer instead of a migration.
      properties:
        email: { type: boolean, default: true }
        sms: { type: boolean, default: false }
        whatsapp: { type: boolean, default: true }
        matchAlerts: { type: boolean, default: true }
        quietHours: { $ref: '#/components/schemas/QuietHours' }
        language: { type: string, enum: [en, hi, mr], default: en }
    NotificationPreferencesUpdate:
      type: object
      description: >
        The whole document. Every field is required -- see the operation description for why an
        omission is a 400 rather than a keep or a reset.
      required: [email, sms, whatsapp, matchAlerts, quietHours, language]
      properties:
        email: { type: boolean }
        sms: { type: boolean }
        whatsapp: { type: boolean }
        matchAlerts: { type: boolean }
        quietHours:
          type: object
          required: [enabled, start, end]
          properties:
            enabled: { type: boolean }
            start: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '22:00' }
            end: { type: string, pattern: '^([01][0-9]|2[0-3]):[0-5][0-9]$', example: '07:00' }
        language: { type: string, enum: [en, hi, mr] }
    PushSubscriptionCreate:
      type: object
      required: [endpoint, keys]
      properties:
        endpoint: { type: string, maxLength: 2048, pattern: '^https://\S+$' }
        keys:
          type: object
          required: [p256dh, auth]
          properties:
            p256dh: { type: string, maxLength: 256 }
            auth: { type: string, maxLength: 64 }
    OwnerProfile:
      type: object
      description: >
        A ceiling, not a projection of convenience. The profile page used to be handed the entire
        user row — email, where they operate, how long they have been here — so every field here is
        one somebody decided a stranger may see, and the absent ones are absent on purpose.
      properties:
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        verified:
          type: boolean
          description: The person has passed identity verification (ID + selfie review).
        city: { type: [string, 'null'] }
        memberSince:
          type: [integer, 'null']
          example: 2024
          description: >
            The *year* they joined, or null if unrecorded. A year, not a date: "on the platform
            since 2024" is the trust signal, and a precise join date is an account fact rather than
            a public one.
        listingCount:
          type: integer
          minimum: 0
          description: How many live listings they currently hold.
    TrustStats:
      type: object
      description: >
        Every field is a plain integer and zero is a real answer — an empty slice is a slice, not a
        missing one, so nothing here is ever null.
      required: [verifiedListings, totalListings, verifiedOwners]
      properties:
        verifiedListings: { type: integer, minimum: 0 }
        totalListings: { type: integer, minimum: 0 }
        verifiedOwners:
          type: integer
          minimum: 0
          description: >
            Distinct owners, counted by the database. Counting rows client-side made two listings
            from one owner read as two verified owners.
    FlatmatePulse:
      type: object
      description: >
        The home flatmate panel, counted from the same public rows the flatmate board lists.
      required: [seeking, initials]
      properties:
        seeking:
          type: integer
          minimum: 0
          description: Live seeker posts plus groups still hunting — the board's "team-up" tab total.
        initials:
          type: array
          maxItems: 3
          description: The newest of those seekers, newest first; ones without a name are skipped.
          items: { type: string }
        split:
          type: object
          description: The newest live group that has its flat. Absent when there is none.
          required: [locality, rent, seats, share]
          properties:
            locality: { type: string }
            bhk:
              type: number
              description: Absent unless the flat is a listing that states one.
            rent: { type: integer, minimum: 1, description: Whole-flat rent per month. }
            seats: { type: integer, minimum: 2 }
            share: { type: integer, minimum: 0, description: 'round(rent / seats), per month.' }
    PropertyCounts:
      type: object
      required: [counts]
      properties:
        counts:
          type: array
          items: { $ref: '#/components/schemas/PropertyCount' }
    PropertyCount:
      type: object
      required: [category, deal, count]
      properties:
        category:
          type: string
          enum: [commercial, farmland, flat, flatmates, house, plot, villa]
        deal: { $ref: '#/components/schemas/DealIntent' }
        count:
          type: integer
          format: int64
          minimum: 0
    MovePackConfig:
      type: object
      description: >
        Whether the Move-in Pack is on sale, and for how much.


        `items` is an open map rather than a record of named prices because the pack's contents are
        a merchandising decision — movers, cleaning, an agreement, paint, a verification, broadband
        today, something else next quarter. Naming them here would make adding a line item a deploy.


        Prices are **whole rupees**, like every other money value in this contract. There are no
        paise anywhere on this platform. Entries whose value is not a non-negative integer are
        omitted rather than forwarded or clamped: clamping would invent a number, and the page
        treats a missing item as one it cannot sell yet, which is the honest reading of a price
        nobody has validly set.
      required: [enabled, items]
      properties:
        enabled:
          type: boolean
          description: >
            Whether the pack is on sale. `false` puts the page in coming-soon mode — prices hidden,
            waitlist capture instead of booking. This is also the answer when the block is missing
            or malformed, deliberately: silence about a feature is a reasonable yes, silence about a
            price never is.
        items:
          type: object
          description: Price per pack line item in whole rupees, keyed by item slug. `{}` is a real answer.
          additionalProperties: { type: integer, minimum: 0 }
          example:
            movers: 8000
            clean: 2500
            agreement: 1500
            paint: 6000
            verify: 999
            internet: 500
    ListingPolicy:
      type: object
      required: [maxPhotos]
      properties:
        maxPhotos:
          type: integer
          minimum: 3
          maximum: 20
          description: >-
            Photos one listing or flatmate room may carry, for every property type. `settings.listings.maxPhotos`;
            10 when unset. The floor is the three a listing needs to publish; the ceiling is the DTOs' hard cap.
    PlatformPricing:
      type: object
      description: >
        What Draazy charges for its own products, as opposed to `Fees`, which is what a
        transaction costs and is mostly the state's money.


        Named fields rather than an open map, and the reason is the document they come out of:
        the same settings block also holds the free contact allowance and the referral fraud
        thresholds (velocity, retention). A projection of the block would publish them. This shape
        cannot, and neither can it publish the next key ops adds.


        Prices are **whole rupees** — there are no paise anywhere on this platform.
      required:
        - listingPass
        - contactPack
        - rentAgreementPlatform
      properties:
        listingPass:
          type: integer
          minimum: 0
          description: Price of one listing pass — an extra live listing for 60 days.
          example: 999
        contactPack:
          type: integer
          minimum: 0
          description: Price of one contact pack — 15 owner contacts for 30 days.
          example: 199
        rentAgreementPlatform:
          type: integer
          minimum: 0
          description: >
            The platform's share of a rent agreement. Stamp duty and registration are the state's,
            are computed per agreement from its own terms, and are quoted on `/fees` instead.
          example: 499
        refunds:
          type: object
          description: The refund and contact-return numbers the plans page quotes (admin settings under `fees`).
          properties:
            packRefundDays: { type: integer }
            passGuaranteeDays: { type: integer }
            passGuaranteeMaxEnquiries: { type: integer }
            passGuaranteeEveryMonths: { type: integer }
            contactReplyDays: { type: integer }
        referral:
          type: object
          description: >-
            The referral numbers the Refer screen quotes. Each is an admin setting under `fees`
            (`referralContactBonus`, `referralSeekerBonusContacts`, `referralOwnerFeaturedDays`,
            `referralOwnerRewardAgreements`, `featuredDays`, `referralQualifyPerMonth`,
            `referralQualifyPerYear`, `referralHoldDays`, `referralClawbackDays`,
            `referralSignupWindowHours`). Velocity, retention and new-referrer thresholds are not published.
          required: [contactBonus, seekerBonusContacts, ownerFeaturedDays, ownerRewardAgreements, featuredDays, qualifyPerMonth, qualifyPerYear, holdDays, clawbackDays, signupWindowHours]
          properties:
            contactBonus: { type: integer, description: Owner contacts the referrer earns per seeker-track referral. }
            seekerBonusContacts: { type: integer, description: Extra free contacts the friend gets on joining through a code. }
            ownerFeaturedDays: { type: integer, description: Days the friend's qualifying listing stays Featured. }
            ownerRewardAgreements: { type: integer, description: Free rent agreements the referrer earns per owner-track referral. }
            featuredDays: { type: integer, description: Days any listing stays Featured after its ownership is verified. }
            qualifyPerMonth: { type: integer, description: Referrals that can pay out per calendar month (IST). }
            qualifyPerYear: { type: integer, description: Referrals that can pay out per calendar year (IST). }
            holdDays: { type: integer, description: How long a medium-risk referral is held before it is re-checked. }
            clawbackDays: { type: integer, description: Days after a grant during which a problem takes the reward back. }
            signupWindowHours: { type: integer, description: A code can be redeemed only this long after the account was created. }
    MyPayment:
      type: object
      required: [id, kind, label, amount, status]
      properties:
        id: { type: string, description: The order id; pass it to the refund route. }
        kind: { type: string, enum: [listing_pass, contact_pack, rent_agreement, ra_amendment] }
        label: { type: string }
