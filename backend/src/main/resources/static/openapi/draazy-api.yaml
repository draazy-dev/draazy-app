          schema: { type: string, maxLength: 2048 }
      responses:
        '204': { description: Removed }
  /faqs:
    get:
      tags: [Engagement]
      summary: FAQs (public)
      operationId: listFaqs
      security: []
      responses:
        '200':
          description: FAQs
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Faq' }
  /admin/dashboard:
    get:
      tags: [Admin & Analytics]
      summary: Admin dashboard, in one read
      operationId: adminDashboard
      x-roles: [staff, admin]
      description: >
        Every figure the platform dashboard shows. Each section is present only when the caller
        holds the permission its standalone read requires, and absent - never empty - otherwise:
        `kpis`, `traffic` and `sla` need analytics, `listings` needs properties:read, `demand`
        needs enquiries:read, `tickets` needs tickets:read (and at least one desk), `owners`
        needs users:read, `flatmates` needs flatmates:read.
      responses:
        '200':
          description: The sections the caller may see
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminDashboard' }
  /admin/bell:
    get:
      tags: [Admin & Analytics]
      summary: Back-office bell badge and items, in one read
      operationId: adminBell
      x-roles: [staff, admin]
      description: >
        Totals and the five newest items per section. A section is present only when the caller
        holds the permission its source read requires (properties:read for `pendingListings` and
        `ownerReplies`, tickets:read for `openTickets`, which is scoped to the caller's desks).
      responses:
        '200':
          description: The sections the caller may see
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminBell' }
  /admin/analytics/traffic:
    get:
      tags: [Admin & Analytics]
      summary: Who arrived, from where, on what
      operationId: adminAnalyticsTraffic
      x-roles: [staff, admin]
      description: >
        Built entirely from Draazy's own `page_views` table. No third-party analytics tag is
        loaded on the site, so this is the only traffic picture that exists -- and it is the only
        one that can be, given the platform holds Indian users' browsing behaviour and shipping it
        to an ad network would be a disclosure nobody consented to.


        `sources` is derived from the referrer host, which means it is honest about its own limits:
        a visit with no referrer is `direct`, and `direct` therefore includes app switches, pasted
        links and stripped referrers as well as people typing the URL. It is not inflated to look
        better.


        `identity` splits sessions into anonymous and signed-in by week. That split, not the raw
        session count, is the number the funnel actually turns on.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: 'Window length; the response echoes the window it used in `days`, `from` and `to`.' }
      responses:
        '200':
          description: Traffic for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsTraffic' }
  /admin/analytics/engagement:
    get:
      tags: [Admin & Analytics]
      summary: How deep the visits went
      operationId: adminAnalyticsEngagement
      x-roles: [staff, admin]
      description: >
        Session depth and bounce rate by week, plus the pages people actually reached.


        **`avgSessionMinutes` and `bounceRatePct` are nullable and are never zero-filled.** A week
        with too few sessions to average honestly returns null, and the chart draws a gap. Rounding
        thin data to `0.0` would put a line on the dashboard that reads as "engagement collapsed"
        when what happened is "nobody visited on the 2nd of January", and somebody would act on it.


        `topPages` reports `views` beside `anonViews` rather than one total, because a page that
        only signed-in users reach and a page that anonymous users bounce off are different problems
        with the same view count.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: Window length; echoed back in the response }
      responses:
        '200':
          description: Engagement for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsEngagement' }
  /admin/analytics/surfers:
    get:
      tags: [Admin & Analytics]
      summary: The anonymous-to-signed-in funnel
      operationId: adminAnalyticsSurfers
      x-roles: [staff, admin]
      description: >
        The question this endpoint exists to answer: of the people who arrive without an account,
        how many end up with one, and where do the rest leave?


        `anonSharePct` and `conversionRatePct` are the headline pair, `weeks` is their trend, and
        `dropOff` names the paths people exit from -- which is the actionable half. A high exit
        share on a listing detail page means something quite different from a high exit share on the
        signup screen, and only the second is a funnel problem.


        Same self-hosted source as the other two analytics reads, with the same consequence: it sees
        what `POST /page-views` was told and nothing else, so a visitor who blocked the beacon is
        invisible here rather than estimated.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 30 }, description: Window length; echoed back in the response }
      responses:
        '200':
          description: The funnel for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsSurfers' }
  /admin/analytics/funnel:
    get:
      tags: [Admin & Analytics]
      summary: Listings posted, approved, contacted, visited and closed, per week
      operationId: adminAnalyticsFunnel
      x-roles: [staff, admin]
      description: >
        Each stage counts events in the week they happened (IST, weeks start Monday), not one cohort
        followed through, so stage ratios over the window are throughput. Every week the window
        touches is present, zero-filled. Archived listings are excluded; approved is a listing's first
        approval; deals are closed deals by `closed_at`.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 90, minimum: 1, maximum: 365 }, description: Window length; echoed back in the response }
      responses:
        '200':
          description: Weekly stage counts for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsFunnel' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/analytics/flatmates:
    get:
      tags: [Admin & Analytics]
      summary: Flatmate posts, requests, matches and host replies, per week
      operationId: adminAnalyticsFlatmates
      x-roles: [staff, admin]
      description: >
        Weekly throughput like the funnel (IST, weeks start Monday, zero-filled). A request is
        answered when the host accepts or declines it; one still pending and younger than 48h is not
        judged yet. `localities` is live now and ignores the window.
      parameters:
        - { name: days, in: query, schema: { type: integer, default: 90, minimum: 1, maximum: 365 }, description: Window length; echoed back in the response }
      responses:
        '200':
          description: Flatmate activity for the window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminAnalyticsFlatmates' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/analytics/pricing:
    get:
      tags: [Admin & Analytics]
      summary: What live listings ask, by locality
      operationId: adminPricingInsights
      x-roles: [staff, admin]
      description: >
        What live listings ask per locality. Every figure is derived from approved, unarchived
        flats; there is no curated market rate to compare against. An average is null with fewer
        than three samples, and a retired locality appears only while it still has live listings.


        A **bare array**, not a page. It is one row per locality in Pune, the set is bounded by
        geography rather than by user behaviour, and paging a fixed-length report would only make it
        harder to sort in the client.
      responses:
        '200':
          description: One row per locality
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PricingInsightRow' }
  /admin/analytics/sla:
    get:
      tags: [Admin & Analytics]
      summary: Moderation turnaround against the promised target
      operationId: adminSlaSummary
      x-roles: [staff, admin]
      description: >
        Whether the listing-review promise is being kept, and which listings are currently breaking
        it.


        The report deliberately looks in both directions. `avgHoursToReview`, `medianHoursToReview`
        and `slaRatePct` are history -- how the last window went. `pendingCount`,
        `pendingBreachingCount` and `worstPending` are the present, and they are the half an
        operator can still do something about: a queue that has already breached is a set of owners
        currently being let down, named individually so somebody can pick one up.


        Median beside mean because a single listing left for a fortnight drags the average past the
        target while most owners were served in an hour, and acting on that average would be acting
        on the wrong problem.


        **Nulls are serialised rather than omitted.** A window with nothing reviewed returns
        `avgHoursToReview: null`, not an absent key -- the dashboard needs to say "no data" and an
        omitted field is indistinguishable from a field the client forgot to read.
      parameters:
        - { name: days, in: query, required: false, schema: { type: integer }, description: "Window on the decision instant; omitted means all time, which is the difference from the other analytics reads and is deliberate -- an SLA is a standing promise, not a monthly figure. Spelled the same way as on /admin/supply-gap so two adjacent tabs cannot name the same control differently." }
      responses:
        '200':
          description: SLA summary
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SlaSummary' }
  /admin/localities:
    get:
      tags: [Admin & Analytics]
      summary: Every locality the console lists, with its live listing count
      operationId: adminListLocalities
      # Server also requires the localities:read permission.
      x-roles: [staff, admin]
      description: >
        The staff table's row: pin, retired flag and live count, without the public page's market stats.
      responses:
        '200':
          description: Localities, alphabetical
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/LocalityAdminRow' }
  /admin/localities/{slug}/retire:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [Admin & Analytics]
      summary: Close an area to new listings
      operationId: adminRetireLocality
      # Server also requires the localities:write permission.
      x-roles: [staff, admin]
      description: >
        Retiring only stops the area being picked for new listings, by place or by name. Existing
        listings stay online and the area page keeps rendering. Idempotent: retiring a retired area
        changes nothing and is not audited again. Audited as `locality.retire` with the live count.
      responses:
        '200':
          description: The row as the console lists it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalityAdminRow' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/localities/{slug}/restore:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    post:
      tags: [Admin & Analytics]
      summary: Reopen a retired area for new listings
      operationId: adminRestoreLocality
      # Server also requires the localities:write permission.
      x-roles: [staff, admin]
      description: >
        Clears the retirement and marks the row active. Idempotent. Audited as `locality.restore`.
      responses:
        '200':
          description: The row as the console lists it
          content:
            application/json:
              schema: { $ref: '#/components/schemas/LocalityAdminRow' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/societies:
    get:
      tags: [Admin & Analytics]
      summary: The staff society directory, one page
      operationId: adminListSocieties
      # Server also requires the societies:read permission.
      x-roles: [staff, admin]
      description: >
        Live societies by name with only what the directory table draws. Edits open `/admin/societies/{slug}`.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text search over name, builder and the locality's words }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Societies, alphabetical
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyDirectoryRow' }
  /admin/societies/summary:
    get:
      tags: [Admin & Analytics]
      summary: Count behind the societies console's candidates tab
      operationId: adminSocietiesSummary
      # Server also requires the societies:read permission.
      x-roles: [staff, admin]
      description: >
        The whole-set count of member-added societies, never the length of a page.
      responses:
        '200':
          description: Pending counts
          content:
            application/json:
              schema:
                type: object
                properties:
                  candidates: { type: integer, format: int64, description: Live member-added societies }
  /admin/society-candidates:
    get:
      tags: [Admin & Analytics]
      summary: Live member-added societies, newest first
      operationId: adminListSocietyCandidates
      # Server also requires the societies:read permission.
      x-roles: [staff, admin]
      description: >
        Every live society `mintSociety` created that has not been merged away, newest first. There
        is no clearing action: duplicates leave the list by being merged.
      parameters:
        - { name: q, in: query, schema: { type: string }, description: Free-text search over name and the locality's words }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Member-added societies, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyCandidate' }
  /admin/society-candidates/{slug}/duplicates:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin & Analytics]
      summary: Societies this candidate may already be a copy of
      operationId: adminListSocietyCandidateDuplicates
      # Server also requires the societies:read permission.
      x-roles: [staff, admin]
      description: >
        Ranked hints, strongest first, scored on shared distinctive name tokens plus a boost for
        sharing a locality. Verified targets sort ahead of unverified ones because a merge
        canonicalises *into* the trusted row.


        This was computed in the browser against a bundled file of 28 curated societies. Every
        duplicate this queue actually produces is a member-added row -- that is what a candidate is
        -- and not one of those was in the file, so a candidate that was a textbook duplicate of
        another candidate rendered "No obvious match". An operator reads that as "no duplicate
        exists" and verifies the junk row into a permanent one.


        **A hint, never an action.** Nothing merges here; the operator takes it to
        `/admin/society-merges` or ignores it. Merged-away societies are excluded, so a pair already
        dealt with does not come back asking to be dealt with again.
      parameters:
        - name: limit
          in: query
          required: false
          schema: { type: integer, default: 6, minimum: 1, maximum: 25 }
          description: >
            How many hints to return -- a handful of chips, not a report. Out of range is refused
            with 400 rather than clamped: a silently different number would leave nothing in the
            response saying so.
      responses:
        '200':
          description: Possible duplicates, strongest match first; empty when nothing resembles it
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SocietyDuplicateSuggestion' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/society-merges:
    get:
      tags: [Admin & Analytics]
      summary: Every society merge currently in force
      operationId: adminListSocietyMerges
      # Server also requires the societies:read permission.
      x-roles: [staff, admin]
      description: >
        Newest first, and deliberately the other way round from the four work queues beside it.
        Those are backlogs, where the oldest item is the one somebody is still waiting on. This is
        not a backlog: it is a record of decisions already taken, and the one an operator comes here
        to check is almost always the one just made — either their own, or the one that explains why
        a society they were about to merge has vanished.


        It is also what makes the undo usable rather than merely possible. A merged-away society is
        absent from the directory and its slug no longer resolves to itself, so this is the only
        surface on which a merge can be found in order to be reversed.
      parameters:
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Merges in force, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/SocietyMerge' }
    post:
      tags: [Admin & Analytics]
      summary: Record that one society is a duplicate of another
      operationId: adminMergeSocieties
      # Server also requires the societies:write permission.
      x-roles: [staff, admin]
      description: >
        Auto-minting a society from four surfaces guarantees duplicates: "Kumar Pinnacle", "Kumar
        Pinnacle Phase 1" and "kumar pinacle" are three rows and one building, splitting its
        listings, followers and reviews across three cards. This is the operator's tool for saying
        which one is real.


        **A merge is a pointer, not a move.** Nothing is copied, rewritten or deleted: the duplicate
        keeps its listings, follows and reviews, and the reads union them
        onto the survivor. That is what makes it undoable — rewriting `properties.society_id` onto
        the survivor would leave no record of which rows had moved, so the one ops action whose
        input is two rows differing by a typo would be the one with no undo.


        `201`, because a merge is a thing that now exists and can be listed and deleted, not a
        mutation of either society. Both slugs travel in the body rather than one in the path: they
        are the two halves of one statement, not subject and object, and putting either in the path
        would read as an edit of that society.


        `422` for merging a society into itself. `409` for either shape of chain — merging into a
        society that is itself merged away, or merging away one that has already absorbed others —
        and for losing the race to another operator working the same pair. Each `409` names the
        merge that has to be undone first, so the next action is one corrected request rather than
        an investigation. Chains are refused rather than collapsed because collapsing them is
        unrecoverable: once A is silently re-pointed from B to C, nothing records that the operator
        chose B.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyMergeCreate' }
      responses:
        '201':
          description: The merge that was recorded
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyMerge' }
        '404': { $ref: '#/components/responses/NotFound' }
        '409': { $ref: '#/components/responses/Conflict' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/society-merges/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    delete:
      tags: [Admin & Analytics]
      summary: Undo a society merge
      operationId: adminUndoSocietyMerge
      # Server also requires the societies:write permission.
      x-roles: [staff, admin]
      description: >
        Addressed by the slug of the society that was **merged away**, not the survivor's: a
        survivor can have absorbed several duplicates, and "undo the merge on this society" would
        then be ambiguous — and the ambiguity would resolve silently to the wrong one.


        This route is the reason a merge is a pointer. The operator's input is two societies that
        differ by a typo, so merging the wrong pair — or the right pair the wrong way round — is a
        mistake that will be made. Here it costs one request.


        `404` when the slug names a society that is not merged into anything: the resource being
        deleted is the merge, and there is no merge here to delete.
      responses:
        '204':
          description: The merge was undone; the society stands on its own again
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/societies/{slug}:
    parameters:
      - { name: slug, in: path, required: true, schema: { type: string } }
    get:
      tags: [Admin & Analytics]
      summary: One society as the back-office editor needs it
      operationId: adminGetSociety
      # Server also requires the societies:read permission.
      x-roles: [staff, admin]
      description: >
        The four public facts plus `adminNote`.


        It exists for the note. The other four are already on `SocietyResponse`, which the directory
        listing hands over in bulk, so a console that only needed those would not need this. The
        note is not on that payload and will not be: it is moderator prose about a named building
        and frequently about the people in it, and the anonymous directory is the last place it
        belongs. Without a route of its own the note is write-only — saved, then blank the next time
        the form is opened, which is precisely the failure the `localStorage` editor had.


        `societies:read` rather than `societies:write`, so an operator who cannot change the row can
        still read the note explaining why it was left alone. That is what the note is for; it is
        addressed to the next person to open this form.
      responses:
        '200':
          description: The society, including the internal note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyAdminView' }
        '404': { $ref: '#/components/responses/NotFound' }
    patch:
      tags: [Admin & Analytics]
      summary: Correct a society's own facts
      operationId: adminEditSociety
      # Server also requires the societies:write permission.
      x-roles: [staff, admin]
      description: >
        Registration, conveyance and the maintenance rate, plus an internal note
        for whoever reads the row next.


        Replaces an editor that wrote to the browser's own `localStorage`. The form reported success
        and the correction reached nobody — not the directory, not the next operator, not the
        society's own committee — so a building's facts were whatever the machine you happened to be
        sitting at believed.


        Addressed by **slug**, which is this system's public alias for a society: it is what the
        directory link carries, what the operator arrived with, and the only handle that appears
        anywhere outside the database. The UUID is internal.


        `PATCH` with omitted-means-unchanged, because the four facts are corrected one at a time
        from different evidence — a conveyance deed says nothing about the maintenance rate — and a
        `PUT` would make every correction a full restatement, so a stale form would quietly revert
        the other three. `adminNote` is the one field where an explicit `null` is meaningful: it
        clears the note, which omission cannot express.


        Every edit is audited with the previous values, because this overwrites in place and an
        overwrite destroys the evidence that the old value was ever there.


        `422` when `maintenancePerSqft` is negative or above 100 — it is rupees per square foot,
        typically 1 to 8 in Pune, and the adjacent mental model is the monthly bill, so a four-digit
        figure is a units mistake rather than an expensive society.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SocietyAdminEdit' }
      responses:
        '200':
          description: The society as it now stands, including the internal note
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SocietyAdminView' }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/supply-gap:
    get:
      tags: [Admin & Analytics]
      summary: Where demand outruns supply, by locality
      operationId: adminSupplyGap
      x-roles: [staff, admin]
      description: >
        Live approved listings against recorded demand signals, per locality, over a rolling
        window.


        `demand` is weighted, not a raw total: an alert counts 5, a search 2. Views are reported but
        not counted - they are interest in listings that already exist, and they grow with supply.
        The weights are a judgement rather than a measurement, and they
        are applied on read - changing them re-scores the whole history rather than only what
        arrives afterwards.


        `demandPerListing` is `demand / (supply + 1)` and is computed server-side so that one
        definition of the weighting exists in one place. A ratio, not a difference: demand and
        listings are different units.


        Two rows are easy to miss and both are deliberate. A locality with listings and no demand
        still appears, with `demand` zero, because inventory nobody is asking for is a finding.
        And signals that carried no locality at all are reported together as a single row with no
        `localitySlug`, rather than being discarded - "people are looking, we do not know where"
        is information about the search UI, not noise.


        A locality that has demand but no row in the localities table is reported too, with
        `localityName` absent. That is somebody asking for somewhere Draazy does not cover, which
        is the single most useful row here - and exactly the row a foreign key would have refused
        at write time.
      parameters:
        - name: days
          in: query
          description: >
            Rolling window in days, counted back from now. Capped at 365: an unbounded window over
            an append-only table is a full scan with a report on it.
          schema: { type: integer, minimum: 1, maximum: 365, default: 30 }
      responses:
        '200':
          description: One row per locality with supply or demand, ordered by demandPerListing descending, no-locality row last
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/SupplyGapRow' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/finance:
    get:
      tags: [Admin & Analytics]
      summary: Finance overview - this month's money, the subscription book and what needs a decision
      operationId: adminFinance
      description: >
        Money is read from invoices (issued only once the gateway confirms payment) and credit notes
        (issued on a refund). Subscriptions seeded or created without a payment are not money; they
        still count towards `mrr` when active and paid-for.
      x-roles: [admin]
      responses:
        '200':
          description: Finance overview
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminFinance' }
  /admin/finance/series:
    get:
      tags: [Admin & Analytics]
      summary: Draazy's fees per month, split by source
      operationId: adminFinanceSeries
      # Finance guard, not the staff one: exposes the revenue mix.
      description: >
        Monthly fees for the finance console's chart, oldest month first, ending with the current
        (partial) month. Every month in the window is returned, including empty ones, because an
        omitted bucket reads as trading months that did not happen. The current month's net equals
        `month.net` on `/admin/finance`.
      x-roles: [admin]
      parameters:
        - name: months
          in: query
          description: How many monthly buckets to return, counting back from and including the current month.
          schema: { type: integer, minimum: 1, maximum: 60, default: 12 }
      responses:
        '200':
          description: One point per month, oldest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminFinanceSeriesPoint' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/finance/transactions:
    get:
      tags: [Admin & Analytics]
      summary: The invoice and credit-note ledger, paged
      operationId: adminFinanceTransactions
      # Finance guard: lists every movement of money with the counterparty's name.
      description: Every invoice and credit note, newest first. Credit notes carry negative amounts.
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - name: kind
          in: query
          description: Narrow to one kind. Omit for all; an unknown kind is a 400.
          schema: { type: string, enum: [subscription, service, refund] }
        - name: q
          in: query
          description: >
            Case-insensitive substring of the customer's name or the document number. `%` and `_`
            are escaped, so they match literally.
          schema: { type: string }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page of the ledger
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminFinanceTransaction' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/integrations:
    get:
      tags: [Admin & Analytics]
      summary: Third-party provider health
      operationId: adminIntegrations
      description: >
        One entry per paid third party (email, WhatsApp, payment gateway), always in that order,
        counted from the `provider_call` ledger. `live=false` means the mock is wired, so its calls
        are recorded as `skipped`.
      x-roles: [admin]
      responses:
        '200':
          description: Provider health
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/AdminProviderHealth' }
  /admin/integrations/calls:
    get:
      tags: [Admin & Analytics]
      summary: The provider call log, paged
      operationId: adminIntegrationCalls
      description: >
        Every outbound call to a third party and every inbound payment webhook, newest first, kept
        for 30 days. Never carries a message body, OTP, link or key; mobiles are shown in full, emails masked.
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - name: provider
          in: query
          schema: { type: string, enum: [zeptomail, whatsapp, cashfree] }
        - name: outcome
          in: query
          schema: { type: string, enum: [ok, failed, skipped] }
        - name: q
          in: query
          description: >
            Exact match on `reference` (e.g. a payment order id), or a full email or mobile matched
            against the recipient. A partial recipient matches nothing.
          schema: { type: string }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page of the log
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminProviderCall' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/help-feedback:
    get:
      tags: [Admin & Analytics]
      summary: Help article verdicts, worst first
      operationId: adminHelpFeedback
      description: >
        One row per article and language, most "not helpful" verdicts first, so a weak translation
        is not averaged into a good English rate. `comments` counts written reasons and is kept
        apart from the verdicts: most readers who vote give none.
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page of article verdict counts
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminHelpFeedbackArticle' }
  /admin/help-feedback/comments:
    get:
      tags: [Admin & Analytics]
      summary: Help article comments, newest first
      operationId: adminHelpFeedbackComments
      description: >
        Readers' own words, verbatim and never rendered to another reader. Render as text only; a
        CSV or XLSX export must neutralise a leading `=`, `+`, `-` or `@`. Carries no user id and
        no address hash.
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - name: slug
          in: query
          schema: { type: string, pattern: '^[a-z0-9-]{1,120}$' }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One page of comments
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AdminHelpFeedbackComment' }
        '400': { $ref: '#/components/responses/BadRequest' }
  /admin/help/staff:
    get:
      tags: [Admin & Analytics]
      summary: Staff-only help runbooks
      operationId: adminStaffHelp
      description: >
        The help-centre sections, categories and articles marked `access: staff`, compiled from the
        frontend help content. Served here so they never ship in the public frontend bundle.
      x-roles: [staff, manager, admin]
      responses:
        '200':
          description: The staff help tree
          content:
            application/json:
              schema:
                type: object
                properties:
                  sections: { type: array, items: { type: object } }
                  categories: { type: array, items: { type: object } }
                  articles: { type: array, items: { type: object } }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/settings/flags:
    get:
      tags: [Admin & Analytics]
      summary: Admin console module switches
      description: >-
        Only the `adminFlags` block of the settings document, so the console shell does not download
        the fee table and permission map on every page. Any back-office role may read it: staff and managers
        need the tab switches to build their navigation.
      operationId: getAdminSettingsFlags
      x-roles: [staff, manager, admin]
      responses:
        '200':
          description: The module switches, keyed by section then flag; empty when none are stored.
          content:
            application/json:
              schema: { type: object, additionalProperties: true }
  /admin/settings:
    get:
      tags: [Admin & Analytics]
      summary: Platform settings
      operationId: getAdminSettings
      x-roles: [admin]
      responses:
        '200':
          description: Settings
          headers:
            ETag:
              description: >-
                Opaque version of the returned document. Send it back as `If-Match` on PUT to make
                the write conditional.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
    put:
      tags: [Admin & Analytics]
      summary: Update platform settings (merge)
      operationId: updateAdminSettings
      x-roles: [admin]
      parameters:
        - name: If-Match
          in: header
          required: false
          description: >-
            The ETag from a previous GET. If the stored document has changed since, the write is
            refused with 412 and nothing is written.
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AdminSettings' }
      responses:
        '200':
          description: Saved - only the top-level blocks that were written, merged; GET for the whole document.
          headers:
            ETag:
              description: Version of the document as saved - use it for the next conditional write.
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AdminSettings' }
        '412':
          description: >-
            Someone else changed the settings since the ETag was issued. Nothing was written; re-read
            and re-apply.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '422':
          description: >-
            The body names a key this server stores but enforces nothing with, currently
            `customRoles` (D67/D13). Refused rather than dropped, and refused whole: accepting it
            with a 200 is how an administrator ends up believing a decorative control granted
            something. Nothing was written and no audit row was recorded - resend without the key.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
  /admin/cities/waitlist:
    get:
      tags: [Admin & Analytics]
      summary: Which cities people have asked Draazy to launch in
      operationId: adminCityWaitlist
      # Guarded like /admin/supply-gap, since it renders on that tab: an operator who sees the gap
      # but not the waitlist gets a half-loaded screen they cannot tell from nobody having asked.
      x-roles: [staff, admin]
      description: >
        The `city_waitlist` table aggregated by city, most-wanted first. This is the evidence for
        the decision `PATCH /admin/cities/{slug}` executes.


        **Counts only, and that is a constraint rather than a convenience.** Every row of the
        underlying table is an unauthenticated submission carrying a mobile and an optional email.
        Grouping happens in the database, so no contact detail reaches this process on the way to a
        response that contains none of it. An operator deciding the next launch city needs to know
        that 61 people want Nashik; a back-office grid listing those 61 phone numbers would turn a
        signup form into a contact list one export away from leaving the building.


        `requests` counts people rather than rows, and only because
        `uq_city_waitlist_mobile_city` makes those the same number - one row per
        `(mobile, lower(city))`. Without that index a repeat submission would inflate the count and
        the report would rank loudest over largest.


        **No `days` parameter, unlike every other analytics read here.** Wanting a city is not an
        event that decays: somebody who asked eight months ago still wants Nashik, and a 30-day
        window on a signal that arrives a handful of times a week would report noise as a trend.
        `lastRequestedAt` carries the recency a window would otherwise stand in for, without
        discarding the history to do it.


        Unpaged, and safe to be - the row count is the number of distinct cities people have named,
        not the number of signups.


        This replaces a panel that read a `dzCityRequests` array out of localStorage, and therefore
        reported only the asks made from the reading operator's own browser.
      responses:
        '200':
          description: One row per city, ordered by `requests` descending then most recent first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/CityWaitlistDemandRow' }
  /admin/cities/{slug}:
    parameters:
      - name: slug
        in: path
        required: true
        schema: { type: string }
    patch:
      tags: [Admin & Analytics]
      summary: Update one city's launch state
      operationId: adminUpdateCity
      description: >-
        Admin-only control for whether a curated city is launched. This is deliberately separate from
        `PUT /admin/settings`: the settings document still owns map bounds and the blacklist, but the
        city roster and each city's `live` bit are served from the `cities` catalogue itself.
        Requires the `settings:write` permission in addition to the admin role. Every call writes a
        `city.update` audit row carrying `beforeLive` and `afterLive`, including when the value is
        unchanged. `slug` is matched exactly, as published in the `cities` section of `GET /bootstrap`.
      x-roles: [admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CityAdminUpdate' }
      responses:
        '204': { description: Saved }
        '404': { $ref: '#/components/responses/NotFound' }
        '422': { $ref: '#/components/responses/ValidationError' }
  /admin/function-catalogue:
    get:
      tags: [Admin & Analytics]
      summary: Every grantable back-office function
      operationId: getFunctionCatalogue
      description: >
        Functions are the stored unit managers grant. The server derives permission atoms and desk
        scopes from these names.
      x-roles: [manager, admin]
      responses:
        '200':
          description: The function catalogue, in render order
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/BackOfficeFunction' }
  /admin/team:
    get:
      tags: [Admin & Analytics]
      summary: Every back-office account with its functions
      operationId: listTeam
      description: >
        The Team & Access roster in one read: administrator, managers and staff, live and archived,
        with the function names `GET /users/{id}/permissions` reports as `functions`, mobiles in
        full. `functions` is filled on the same terms as that read — an administrator sees every
        manager and staff account, a manager only staff and itself — and is empty otherwise
        (always for the administrator, who holds every function).
      x-roles: [manager, admin]
      responses:
        '200':
          description: Accounts, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamMember' }
  /admin/team/assignees:
    get:
      tags: [Admin & Analytics]
      summary: Who a ticket can be handed to
      operationId: listTeamAssignees
      description: >
        The ticket board's assignee picker: active back-office accounts with the desks each works. No
        mobile, email or role, and `users:read` is not needed - `tickets:read` is.
      x-roles: [manager, admin]
      responses:
        '200':
          description: Active accounts
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/TeamAssignee' }
  /admin/message-templates:
    get:
      tags: [Admin & Analytics]
      summary: The approved copy staff may send to owners
      operationId: listMessageTemplates
      description: >
        Served rather than bundled into the console, for the same reason as the permission
        catalogue: a screen must not be able to offer a template the server would refuse. Outreach
        requests name a template by id and never carry a body, so this list *is* the set of things
        that can be said.


        Returned with `body` un-rendered, placeholders intact, so the console can show a live
        preview as the operator picks. The substitution itself happens server-side at send.


        Guarded on staff role alone, with no permission atom, and that is a considered omission
        rather than an oversight: this is copy. It names no owner, no listing and no account, so
        there is nothing here to grant access to. The atom lives on the endpoint that *sends*.


        Retired templates are withheld rather than deleted, because the messages already prepared
        from them stay readable in the outreach log and a dangling reference there would be worse
        than an unused row here.
      x-roles: [staff, admin]
      parameters:
        - name: channel
          in: query
          schema: { type: string, enum: [whatsapp, sms, email], default: whatsapp }
      responses:
        '200':
          description: Active templates for the channel, grouped by category then name
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/MessageTemplate' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/audit-log:
    get:
      tags: [Admin & Analytics]
      summary: Audit log (maker-checker trail)
      operationId: adminAuditLog
      # Admin-only: staff must not read the record of admin actions.
      x-roles: [admin]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        # Narrows the trail to one record; without it the log is browsable only by time, which
        # serves the daily review and is useless for a case. `entity` is optional — ids are UUIDs.
        - { name: entityId, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Audit entries
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/AuditEntry' }
  /admin/error-log:
    get:
      tags: [Admin & Analytics]
      summary: Captured errors, newest first
      operationId: adminErrorLog
      # Admin-only, like the audit log: stacks and request paths are operational detail.
      x-roles: [admin]
      parameters:
        - $ref: '#/components/parameters/BoardDays'
        - { name: source, in: query, schema: { type: string, enum: [api, job, web] } }
        - { name: status, in: query, schema: { type: string, enum: [open, resolved, all], default: open } }
        # Matches message, error type, path, last trace id and fingerprint anywhere, and the client crash
        # reference from its start; `%` and `_` are escaped.
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: One row per distinct error, with an occurrence count
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/ErrorEventSummary' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/error-log/{id}:
    get:
      tags: [Admin & Analytics]
      summary: One captured error with its stack and context
      operationId: adminErrorLogDetail
      x-roles: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The error
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ErrorEventDetail' }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/error-log/{id}/resolve:
    post:
      tags: [Admin & Analytics]
      summary: Mark a captured error resolved
      operationId: adminErrorLogResolve
      # A server error happening again reopens the row; a browser report does not.
      x-roles: [admin]
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Resolved. No body. }
        '403': { $ref: '#/components/responses/Forbidden' }
        '404': { $ref: '#/components/responses/NotFound' }
  /admin/staff-activity:
    get:
      tags: [Admin & Analytics]
      summary: Back-office activity feed (who did what)
      operationId: adminStaffActivity
      # Managers see staff rows only; administrators see the full back-office feed.
      x-roles: [manager, admin]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        # Free text over actor name, action, entity and entity id. `%` and `_` are escaped server
        # side; a search for "100%" narrows rather than matching everything.
        - { name: q, in: query, schema: { type: string } }
        - { $ref: '#/components/parameters/Page' }
        - { $ref: '#/components/parameters/Size' }
      responses:
        '200':
          description: Activity entries, newest first
          content:
            application/json:
              schema:
                allOf:
                  - $ref: '#/components/schemas/PageEnvelope'
                  - type: object
                    properties:
                      content:
                        type: array
                        items: { $ref: '#/components/schemas/StaffActivityEntry' }
  /admin/staff-activity/summary:
    get:
      tags: [Admin & Analytics]
      summary: Back-office activity totals, facets and leaderboard
      operationId: adminStaffActivitySummary
      # Takes the same filter set as the feed so a narrowed console gets a headline about what it
      # is showing. Aggregated in the database: a leaderboard folded from one page ranks the page.
      x-roles: [manager, admin]
      parameters:
        - { name: actor, in: query, schema: { type: string } }
        - { name: entity, in: query, schema: { type: string } }
        - { name: action, in: query, schema: { type: string } }
        - { name: from, in: query, schema: { type: string, format: date-time } }
        - { name: to, in: query, schema: { type: string, format: date-time } }
        - { name: q, in: query, schema: { type: string } }
      responses:
        '200':
          description: Aggregates for the same window
          content:
            application/json:
              schema: { $ref: '#/components/schemas/StaffActivitySummary' }
  /admin/team-performance:
    get:
      tags: [Admin & Analytics]
      summary: Team performance read model
      operationId: adminTeamPerformance
      description: >
        Staff-only performance projection for the requested window. `handled` counts every staff audit
        row in the window; `byFunction` classifies rows whose action/entity maps to a held back-office
        function. Queue medians are present only where the underlying table stores both the submitted
        and decided instants.
      x-roles: [manager, admin]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30], default: 7 }
      responses:
        '200':
          description: Staff volume and open queue metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TeamPerformanceResponse' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/my-work:
    get:
      tags: [Admin & Analytics]
      summary: Current caller's staff dashboard work projection
      operationId: adminMyWork
      description: >
        Single-actor version of team performance for the signed-in back-office user. `staff` contains
        exactly the caller (name, functions and counts only - no id), `handled` counts the caller's
        audit rows in the window, and `queues` is computed only for the caller's effective functions,
        without the median decision time.
      x-roles: [staff, manager, admin]
      parameters:
        - name: days
          in: query
          schema: { type: integer, enum: [7, 30], default: 7 }
      responses:
        '200':
          description: Caller volume and open queue metrics
          content:
            application/json:
              schema: { $ref: '#/components/schemas/MyWork' }
        '400': { $ref: '#/components/responses/BadRequest' }
        '403': { $ref: '#/components/responses/Forbidden' }
  /admin/content/{type}:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
    get:
      tags: [Admin & Analytics]
      summary: List CMS content of a type
      operationId: adminListContent
      # CMS is an ops job. Bare array (api-standards.md §5.1: fixed reference data).
      x-roles: [staff, admin]
      parameters:
        - { name: archived, in: query, schema: { type: boolean }, description: 'true: archived rows only; false: live rows only; absent: both' }
        - { name: translations, in: query, schema: { type: boolean, default: false }, description: Include each row's translation map }
      responses:
        '200':
          description: Content items, newest first
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/ContentItem' }
    post:
      tags: [Admin & Analytics]
      summary: Create CMS content item
      operationId: adminCreateContent
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemWrite' }
      responses:
        '201':
          description: Created
          # Not a bodiless 201: the ops screen renders the saved row straight from the
          # response; without a body it has to guess the server-assigned id and timestamps.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    patch:
      tags: [Admin & Analytics]
      summary: Update CMS content item
      operationId: adminUpdateContent
      x-roles: [staff, admin]
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/ContentItemWrite' }
      responses:
        '200':
          description: Updated
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}/archive:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    post:
      tags: [Admin & Analytics]
      summary: Archive content item (soft delete)
      operationId: adminArchiveContent
      # Returns the item so the caller can see `archived: true` without a re-read.
      x-roles: [staff, admin]
      responses:
        '200':
          description: Archived
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
  /admin/content/{type}/{id}/restore:
    parameters:
      - { $ref: '#/components/parameters/ContentType' }
      - { $ref: '#/components/parameters/GenericId' }
    post:
      tags: [Admin & Analytics]
      summary: Restore archived content item
      operationId: adminRestoreContent
      x-roles: [staff, admin]
      responses:
        '200':
          description: Restored
          content:
            application/json:
              schema: { $ref: '#/components/schemas/ContentItem' }
components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
      bearerFormat: JWT
      description: >
        JWT access token issued by the Identity & Access domain. Send as
        `Authorization: Bearer <token>`. Short-lived (15 min); refresh via
        `/auth/refresh`. Claims carry `sub`, `role`, `mobileVerified`, and
        `verified` (an opt-in trust **badge**, not a gate — participation only
        needs `mobileVerified`); `staff` tokens also carry `team`.
    oidc:
      type: openIdConnect
      openIdConnectUrl: https://auth.draazy.in/.well-known/openid-configuration
      description: >
        Target-state federation. The modular monolith issues its own JWTs today;
        an external OIDC provider (Keycloak/Auth0) can be adopted without changing
        resource-server contracts.

  parameters:
    Page:
      name: page
      in: query
      description: Zero-based page index.
      schema: { type: integer, minimum: 0, default: 0 }
    Size:
      name: size
      in: query
      description: Page size (max 100).
      schema: { type: integer, minimum: 1, maximum: 100, default: 20 }
    Sort:
      name: sort
      in: query
      description: '`field,(asc|desc)`; repeatable for multi-sort.'
      schema: { type: string, example: createdAt,desc }
    PropertyId:
      name: id
      in: path
      required: true
      description: Property slug or id.
      schema: { type: string, example: 3bhk-koregaon-park-xf12 }
    PropertyUuid:
      name: id
      in: path
      required: true
      description: >
        The property's **id**, and only its id. A slug is rejected with 400.


        Spelled `id` like `PropertyId`, and sitting on paths that look exactly like the lenient
        ones, but `FlatSplitController` binds `@PathVariable UUID id` where every other
        `/properties/{id}/…` operation binds `String` and resolves either form. Only the two flat
        split operations and the room feed work this way.


        These paths carried `PropertyId` — "Property slug or id" — until it was checked. Nothing
        calls them yet, so the promise has never been tested by a client, which is the only reason
        it did not cost anything: the same false promise on `/me/saved/{propId}` produced a run of
        silent 400s. Documented before the first caller arrives rather than after.
      schema: { type: string, format: uuid, example: 51897b51-f1a2-56ce-9687-2be847ff4dee }
    PropId:
      name: propId
      in: path
      required: true
      description: >
        The property's **id**, and only its id. A slug is rejected.


        This is not the same token as `PropertyId` on `/properties/{id}`, which resolves either
        form. The two are distinguished here only by this sentence, because both are strings and
        a UUID and a slug are equally well-formed strings — which is exactly how a client came to
        address `PUT /me/saved/{propId}` with the slug it had been routing on. Every save answered
        400 and the optimistic control rolled itself back, so nothing was visible but a heart that
        filled for one frame.


        Two failure shapes exist behind this one parameter and callers should treat both as
        "wrong identifier": `SavedPropertyController`, `PropertyReviewController` and
        `TenancyDeclarationController` bind `@PathVariable UUID` and Spring answers **400** when
        conversion fails, while the deals, finalization and finances controllers bind `String`,
        hand-parse with `Ids.parseUuid(...).orElseThrow(NotFoundException::of)` and answer **404**.
        That inconsistency is recorded rather than papered over: documenting one status here would
        make this description wrong for eleven paths, and changing the server to agree is a
        behaviour change across seventeen operations, not a spec edit.
      schema: { type: string, format: uuid, example: 51897b51-f1a2-56ce-9687-2be847ff4dee }
    PropRef:
      name: propId
      in: path
      required: true
      description: >
        The property's id **or** its slug; both resolve. Spelled `propId` for continuity with the
        paths around it, but it accepts what `PropertyId` accepts.


        Only the owner-scoped document vault works this way, because `DocumentService.ownedProperty`
        resolves the token itself: it tries `Ids.parseUuid` first and falls back to
        `findBySlugAndOwner_Id`. Everything else under `{propId}` requires the id; see `PropId`.
      schema: { type: string, example: 3bhk-koregaon-park-xf12 }
    ContentType:
      name: type
      in: path
      required: true
      description: Which CMS list is being managed. FAQs are the only one authored here.
      schema: { type: string, enum: [faqs] }
    BoardSearch:
      name: q
      in: query
      description: Matches the property title, the person's name, or the start of their mobile number.
      schema: { type: string }
    BoardDays:
      name: days
      in: query
      description: >
        Only rows from the last N IST calendar days, today included (1 = since IST midnight); omit for all time.
        Filters the row's own timestamp (the one the list sorts on); counts and summaries stay all-time.
      schema: { type: integer, minimum: 1, maximum: 3660 }
    GenericId:
      name: id
      in: path
      required: true
      schema: { type: string }
    ReqId:
      name: reqId
      in: path
      required: true
      schema: { type: string }
    DeviceId:
      name: X-Device-Id
      in: header
      required: false
      description: An opaque first-party device id, at most 64 characters. Only a salted hash is stored; a longer or blank value is ignored. On redeem, omitting it counts as a risk signal.
      schema: { type: string, maxLength: 64 }
    IdempotencyKey:
      name: Idempotency-Key
      in: header
      required: false
      description: Client-generated UUID to make unsafe money/booking operations retry-safe.
      schema: { type: string, format: uuid }

  responses:
    BadRequest:
      description: Malformed request.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: bad_request, message: Invalid query parameter 'size', status: 400 }
    Unauthorized:
      description: Missing/invalid credentials.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: unauthorized, message: Authentication required, status: 401 }
    Forbidden:
      description: Authenticated but not permitted (RBAC, or owner accepts verified contacts only).
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: forbidden, message: You do not have permission to perform this action, status: 403 }
    NotFound:
      description: Resource not found.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: not_found, message: Property not found, status: 404 }
    Conflict:
      description: >
        The request is well-formed but conflicts with current state -- a duplicate, or an
        illegal transition for the resource's present status. Distinct from `422`, which is a
        payload that failed validation on its own terms.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: conflict, message: Rent for this month is already paid or in progress, status: 409 }
    ValidationError:
      description: Semantic validation failure.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/ValidationProblem' }
    TooManyRequests:
      description: Rate limit exceeded.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds until retry is allowed. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example: { error: rate_limited, message: Too many requests, status: 429 }
    ServiceUnavailable:
      description: >
        `maintenance_mode` — the platform is closed for maintenance and refuses state-changing
        requests. Applies to every POST/PUT/PATCH/DELETE in this document; see the Conventions
        section for the exemptions. Reads are unaffected.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
          example:
            error: maintenance_mode
            message: The site is down for maintenance. Please try again shortly.
            status: 503

  links:
    GetCurrentUser:
      operationId: getMe
      description: Fetch the freshly authenticated user's profile.
    CheckContactStatus:
      operationId: contactStatus
      description: Re-read the gate state for the property just requested.
      parameters:
        propertyId: $request.body#/propertyId
    CloseThisDeal:
      operationId: closeDeal
      description: After reserving, close the deal (sold/rented) for the same property.
      parameters:
        propId: $request.path.propId
    FinalizationStatus:
      operationId: finalizationStatus
      description: Track the maker-checker finalization for this property.
      parameters:
        propId: $request.path.propId
    RespondToOffer:
      operationId: respondOffer
      description: Owner accepts / declines / counters the submitted offer.
      parameters:
        id: $response.body#/id
  callbacks:
    PaymentResult:
      'https://api.draazy.example/api/webhooks/cashfree/payment':
        post:
          summary: Cashfree posts the terminal payment result here (async continuation).
          description: See `POST /webhooks/cashfree/payment` for signature verification and full semantics.
          requestBody:
            content:
              application/json:
                schema: { $ref: '#/components/schemas/PaymentWebhook' }
          responses:
            '200': { description: Acknowledged }
  schemas:
    Error:
      type: object
      required: [error, message, status]
      properties:
        error: { type: string, description: Machine-readable code., example: not_found }
        message: { type: string, description: Human-readable detail. }
        status: { type: integer, description: HTTP status., example: 404 }
        traceId: { type: string, description: Correlation id for observability. }
        reason: { type: string, description: 'Present only on 422 refund_not_eligible: the policy reason code.' }
        existingId: { type: string, format: uuid, description: 'Present only on 409 duplicate_submission: the listing the owner already posted.' }
        nextReminderAt: { type: string, format: date-time, description: 'Present only on 409 reminder_too_soon: the earliest moment another reminder is allowed.' }
        attemptsRemaining:
          type: integer
          minimum: 0
          description: >
            Guesses left against the OTP just rejected. Present **only** where a submitted `otp`
            was wrong: the 401 from `login`, and from the owner-consent route, which verifies
            through the same primitive. Absent from every other error — including the
            `otp_attempts_exhausted` 429 that follows, where the code is already burnt and the
            remedy is a new one rather than another try.


            It is in the body rather than a response header because the API exposes no CORS
            response headers, so a browser on another origin could not read one.


            `0` means this was the last allowed guess, not that the guess was refused: that
            attempt was still evaluated, and it is the *next* one that is answered `429`. Clients
            should render their own wording from this number rather than the `message`, which is
            English only.
          example: 2
        retryAfterSeconds:
          type: integer
          minimum: 0
          description: >
            Seconds left before the refused call may be retried. Present **only** on a `429`, and
            it mirrors the `Retry-After` header sent alongside it — the header is what a proxy
            acts on, this is what a screen can read, for the same CORS reason as
            `attemptsRemaining` above. It is the *remaining* wait, not the full window, so a
            client restarting a countdown from it never asks the user to wait longer than the
            server would.
          example: 43
    ValidationProblem:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          properties:
            fields:
              type: array
              items:
                type: object
                properties:
                  field: { type: string, example: mobile }
                  message: { type: string, example: must be a 10-digit Indian mobile }
    PageEnvelope:
      type: object
      description: Envelope for paginated collections; `content` is supplied per endpoint.
      properties:
        page: { type: integer, example: 0 }
        size: { type: integer, example: 20 }
        totalElements: { type: integer, format: int64, example: 137 }
        totalPages: { type: integer, example: 7 }
        sort: { type: string, example: createdAt,desc }
        counts:
          type: object
          additionalProperties: { type: integer, format: int64 }
          description: >
            Whole-set totals for the tabs above the table, present only on endpoints that document
            them (`GET /users?counts=true`, `GET /admin/support-tickets`). Counted in one grouped
            statement, never over the rows of the page.
    SearchEnvelope:
      description: >
        A page envelope plus the one count a page cannot supply about itself. Search results carry
        a "N homes · M verified" headline, and M is counted over the whole result set in the same
        statement as `totalElements`, under the same filters: counting it over the rows a page
        happens to hold would state a window as a statement about the catalogue.
      allOf:
        - $ref: '#/components/schemas/PageEnvelope'
        - type: object
          properties:
            verifiedElements: { type: integer, format: int64, example: 41 }
            otherTabElements:
              type: integer
              format: int64
              example: 12
              description: The other tab's total under the same facets, for its tab label.
    Mobile:
      type: string
      pattern: '^[6-9][0-9]{9}$'
      description: >-
        An Indian mobile number. The pattern is the canonical stored and returned
        shape: ten digits, leading 6-9. On input the server is deliberately more
        tolerant (Q1) — it accepts spacing and a leading +91/0091/0 country code and
        normalises to these ten digits before storing. Anything that does not reduce
        to a valid ten-digit mobile is rejected with 422.
      example: '9876543210'
    Money:
      type: integer
      format: int64
      description: Amount in whole Indian rupees (INR). No decimals/paise.
      example: 2500000
    DealIntent:
      type: string
      description: Transaction intent.
      enum: [buy, rent]
    PropertyTypeLabel:
      type: string
      description: >
        Free-text display label for the property type — but one that is *parsed* on the way out.
        `property_type_key` and `commercial_use_key` are generated columns built from `LIKE`
        patterns against this string, and every type and subtype filter reads those keys. A label
        the patterns do not recognise fails silently: the listing is stored and published, and is
        simply absent from the filter an enquiry arrives through. So this is not an enum — it must
        merely *contain* a recognised token, which is exactly what the generated column asks of it.


        Tokens (case-insensitive, substring): office, shop, showroom, retail, commercial,
        warehouse, godown, industrial, co-working/coworking, independent house, row house,
        villa / house, flat, studio, penthouse, apartment, villa, farm land/farmland, plot.
        Prefer the labels the wizards compose (`Flat`, `Warehouse / Godown`, …); the looser
        aliases are admitted because live rows carry them and classify correctly.
      pattern: >-
        (?i).*(office|shop|showroom|retail|commercial|warehouse|godown|industrial|co-working|coworking|independent
        house|row house|villa / house|flat|studio|penthouse|apartment|villa|farm ?land|plot).*
      example: Flat
    Furnishing:
      type: string
      enum: [unfurnished, semi-furnished, furnished]
    PropertyPossession:
      type: string
      description: >
        When the property can be occupied. Absent/null means "not stated", which is
        deliberately distinct from all three values — an unrecorded possession must not
        satisfy a `ready-to-move` search. Land and plot listings have no meaningful
        possession state and stay unset.
      enum: [ready-to-move, new-launch, under-construction]
    PropertyStatus:
      type: string
      enum: [pending, approved, paused, rejected, flagged, archived, sold, rented]
      description: >
        Moderation state. `sold`/`rented` are terminal (D110): set when the listing's deal closes,
        they drop it from the approved-floored search but keep it reachable by direct link, badged.
    Role:
      type: string
      description: >
        Canonical auth role carried in the JWT `role` claim. Property seekers
        (buyers and tenants) share the single `buyer` role. `staff` are scoped
        further by `team`. Admin RBAC labels (e.g. manager/member) are
        permissions, not roles, and are not modelled here.
      enum: [buyer, owner, staff, manager, admin]
    Team:
      type: string
      description: Ops team a staff member belongs to; scopes service-request and ticket routing.
      enum: [rental, legal, loans, interior, packers, valuation]
    Party:
      type: object
      description: |
        A platform user acting as a participant on an offer, visit, deal or finalization
        request. Always resolves to a registered account, so `id` is the user id.

        `mobile` is contact gated, and the gate is **not** the same on every surface, so do
        not build on a single rule:
          * a party always sees their own number in full, on every surface, at every status;
          * on **visits**, the listing owner also sees the visitor's number once the visit is
            `confirmed` (and so on `completed` / `no-show`, which only follow it). While it is
            merely `scheduled` the owner sees `98XXXXX210` — booking must not be a way to
            harvest a phone number. Rescheduling resets the status to `scheduled` and
            therefore re-masks it;
          * on **tenancy**, the counterparty sees `98XXXXX210` at every status;
          * **contact requests** and **conversations** reveal it once an approved contact
            request exists between the two parties.
        The safe assumption for a client is that the number is masked; treat a raw one as a
        bonus, never as a precondition, and never parse the mask for digits.

        `verified` is stated by the server rather than derived from `mobile`: the mask is
        lossy, so a client matching `98XXXXX210` against a verified-user list can only ever
        answer false.
      properties:
        id:
          type: string
          readOnly: true
          description: User id of the participant. Server-assigned.
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        role: { type: string, enum: [buyer, owner] }
        verified:
          type: boolean
          readOnly: true
          description: |
            Whether this party carries the ID verified badge. Server-computed, and optional
            like every other property here: populated today on `Offer.from` and on the two
            `FinalizationRequest` parties, absent from the payloads that have no badge to show.
    # Distinct from Party: an under-offer party is off-platform, so it has no account, no `role`
    # and no contact gating, and carries `note`/`at`, meaningless on Offer.from or Visit.visitor.
    DealParty:
      type: object
      description: An off-platform interested party recorded by the owner on a reserved deal.
      required: [name]
      properties:
        id:
          type: string
          readOnly: true
          description: Server-assigned. Stable across edits, unlike the previous positional index.
        name: { type: string, maxLength: 120 }
        mobile: { $ref: '#/components/schemas/Mobile' }
        note: { type: string, maxLength: 500 }
        at:
          type: string
          format: date-time
          readOnly: true
    StatusUpdate:
      type: object
      required: [status]
      properties:
        status: { type: string }
        note: { type: string, maxLength: 500 }
    ReasonRequest:
      type: object
      required: [reason]
      properties:
        reason: { type: string }
    UserBadgeRequest:
      type: object
      required: [granted, reason]
      properties:
        granted:
          type: boolean
          description: >
            Required, and deliberately has no default. Defaulting to `false` would mean a client that
            omitted the field asked to withdraw somebody's badge — the more destructive of the two
            outcomes, reached by saying nothing. Omitting it is 422.
        reason:
          type: string
          minLength: 10
          maxLength: 300
          description: >
            Required in both directions. The badge is what buyers use to decide who to trust, so both
            halves of the decision have to be answerable later out of the audit log.
    UserFlagRequest:
      type: object
      required: [flagged]
      properties:
        flagged: { type: boolean }
        reason:
          type: string
          description: >
            Required when `flagged` is true, optional when lowering the flag. Expressed as a
            conditional rather than in `required` because a caller clearing a flag should not have to
            invent a reason for doing so; a raise without one is 422.
    UserTimelineEntry:
      type: object
      required: [kind, entityId, at]
      properties:
        kind:
          type: string
          enum: [account, enquiry, visit, service, listing, moderation]
          description: >
            What sort of event this is. The client picks the icon and the wording from this;
            `moderation` is an action a back-office colleague took against the account, everything
            else is something the person themselves did.
        entityId:
          type: string
          description: >
            The id of the thing that happened, so the console can link to it. For `account` and
            `moderation` this is the user's own id.
        at:
          type: string
          format: date-time
          description: >
            When it happened. For a visit this is when it was booked, not the slot it was booked
            for — the slot may be in the future, and a history that sorted by it would put next
            week's viewing above last week's enquiry.
        label:
          type: string
          description: >
            The source row's own name for itself — a property title, a service type, an audit
            action, or the person's role on the `account` entry. Not a sentence: the console is
            translated and the server does not own English.
        status:
          type: string
          description: >
            The source row's status where it has one. Absent for moderation entries, so the client
            can tell "no status" from "blank status".
    DecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, reject] }
        note: { type: string }
    FlatmateReviewDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approved, rejected] }
        note: { type: string, maxLength: 600, description: Required on `rejected`; shown to the host. }
        checks:
          type: object
          description: What the reviewer confirmed. Required for approving a `tenant` claim; ignored otherwise.
          properties:
            nameMatches: { type: boolean, description: The name on the document is the host's ID-verified legal name (agreement) or the flat owner's (light bill). Must be true. }
            addressMatches: { type: boolean, description: The document's address is the post's society, flat and locality. Must be true. }
            validTill: { type: string, format: date, description: 'Agreement end date, after today. Required for `rent_agreement`.' }
            issuedOn: { type: string, format: date, description: 'Bill date, not in the future and at most 90 days old. Required for `electricity_bill`.' }
    FlatmateReviewDocumentUrl:
      type: object
      properties:
        url: { type: string, description: Signed link that expires shortly. }
    PropertyVerificationDecisionRequest:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [approve, needs_info, reject] }
        note: { type: string, maxLength: 2000 }
        reasonCode:
          type: string
          nullable: true
          enum: [photos_not_real, duplicate, broker, wrong_details, locality_unclear, document_unreadable, name_mismatch, rera_not_found, rera_mismatch, other, null]
          description: Required for needs_info and reject. `other` also requires note.
        expectedStatus:
          type: string
          nullable: true
          description: Optional optimistic guard; 409 stale_decision if the listing status changed.
    ServiceRequestPartyInvite:
      type: object
      required: [role, mobile]
      properties:
        role:
          type: string
          enum: [owner, tenant]
          description: Which side of the agreement the invitee is on.
        partyIndex:
          type: integer
          minimum: 0
          default: 0
          description: Tenant row index in `details._state.tenants`; owners use 0.
        mobile:
          type: string
          description: >
            The counterparty's registered mobile. Used once, to find their account, and then
            discarded -- it is not stored on the invitation. An unregistered number is a 409, not an
            invitation: there is nobody to authenticate as, and a token link addressed to a phone
            number is exactly the exposure this design refuses.
    InviteDecision:
      type: object
      required: [decision]
      properties:
        decision: { type: string, enum: [accept, decline] }
    VaultDocFiling:
      type: object
      required: [documentId]
      properties:
        documentId:
          type: string
          description: The id of a row in the caller's own `GET /me/documents/personal`.
        category:
          type: string
          maxLength: 64
          description: The checklist slot slug, exactly as `addServiceRequestDoc` takes it.
    ServiceRequestCheckout:
      type: object
      properties:
        declaration:
          type: string
          maxLength: 64
          description: >
            The declaration version the requester accepted. Required, and must be current, for a rent
            agreement; ignored for every other type.
    PartyDetailsUpdate:
      type: object
      required: [details]
      description: >
        The accepted invitee's half of the agreement, submitted before checkout is opened.
      properties:
        details:
          type: object
          additionalProperties: true
          description: >
            Structured detail, merged into the request's own `details` -- the same free-shaped object
            `ServiceRequestCreate.details` carries, and subject to the same rules, including the
            refusal of `pan`/`aadhaar` at any depth. Identity numbers go to
            `PUT /service-requests/{id}/identities`, which is assignee-only and audited; this object
            is echoed verbatim on every read of the request by everybody on it.


            Free-shaped rather than a typed body per service because the fields a tenant fills differ
            by agreement and are the wizard's business, not the server's -- the same reasoning that
            left `details` open on creation. What the server owns is who may write it and when: the
            invitee, once accepted, and only while the request is still waiting for the requester to
            pay.
    ServiceRequestParty:
      type: object
      description: >
        One side of a co-filled service request. Keyed on the invited *account* wherever
        there is one to key on, and carrying no contact detail of its own beyond the masked
        `mobile` that V107 made unavoidable — see that property for why the exception is narrow.


        Served in two places with two different jobs, which is why it carries more than the
        request's own view of it needs. Inside `ServiceRequest.parties` it tells the people already
        on the matter who else is on it and whether they have answered. On
        `GET /me/service-request-invites` it is the whole of what an invited person is shown
        *before* they accept, which is why `requestType` and `invitedBy` are here and why nothing
        about the agreement itself is: enough to decide, and not the paperwork.
      properties:
        id: { type: string }
        requestId: { type: string }
        # Echoed so /me/service-request-invites can say what the invitation is *for* without the
        # invitee having to fetch a request they cannot yet read.
        requestType: { type: string, example: rent-agreement }
        role: { type: string, enum: [owner, tenant] }
        partyIndex: { type: integer, minimum: 0, default: 0 }
        status: { type: string, enum: [invited, accepted, declined] }
        party:
          type: [string, 'null']
          description: >
            Display name of the invited account. `null` while the invitation is still `pending` --
            there is no account to take a name from -- and also `null` if a once-claimed account has
            since been removed.
        # An invitation may be addressed to a number that never registered, leaving the requester
        # with no name to show for the side they just named. Exists only while that is true.
        mobile:
          type: [string, 'null']
          example: 98XXXXX999
          description: >
            The invited number, **masked**, and present only while `pending` is true. Absent -- and
            discarded from the row in the same statement -- the moment the invitation is claimed by
            an account, because from then on `party` answers the question this was standing in for.


            Masked rather than whole because the reader of a `ServiceRequest` is whoever is on the
            matter, and the other side's full number is not theirs until that side has accepted.
            `ContactVisibility` governs that everywhere else on this platform and this is not an
            exception to it: enough of the number is shown to answer the only question the requester
            asks of it -- "is that the number I meant?" -- and no more.
        pending:
          type: boolean
          description: >
            True while the invitation is addressed to a number rather than to an account (V107).


            Deliberately **not** the same fact as `status: invited`, which means only "has not
            answered". A pending invitation has nobody who *could* answer yet; a claimed one has a
            person who has not. The two want different words in the interface -- "waiting for them to
            sign up" against "waiting for them to reply" -- and a client that collapses them will tell
            a requester to chase somebody who does not exist. A claimed-but-unanswered invitation is
            `pending: false, status: invited`.
        invitedBy: { type: [string, 'null'], description: Display name of the requester who sent it }
        createdAt: { type: string, format: date-time }
    MessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
    ConversationMessageCreate:
      type: object
      required: [body]
      properties:
        body: { type: string, maxLength: 4000 }
        clientId: { type: [string, 'null'], maxLength: 120, description: Caller-generated idempotency key scoped to this author and conversation }
        replyToId: { type: [string, 'null'], description: Message id in the same conversation }
    MessageAttachment:
      type: object
      description: >
        One file on a message. Only ever returned inside a message the reader is already entitled to
        see, on either the chat or the support surface.
      properties:
        id: { type: string }
        fileName: { type: string, description: Sanitised original name, safe to render }
        contentType: { type: string, description: The *sniffed* type, which is what was stored }
        sizeBytes: { type: integer, format: int64 }
        url:
          type: string
          format: uri
          description: >
            Signed download link, **minted for this read and short-lived**. Not an identifier and not
            a link to store - re-read the message to get a fresh one.
        uploadedAt: { type: string, format: date-time }
    SupportMessage:
      type: object
      properties:
        id: { type: string }
        author: { type: [string, 'null'], description: Display name, absent if the account has none }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
    ConversationMessage:
      type: object
      properties:
        id: { type: string }
        mine: { type: boolean, description: The reader wrote it. Decides the side of the thread; `author` is only a display name. }
        author: { type: [string, 'null'], description: Display name, absent if the account has none }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        clientId: { type: [string, 'null'] }
        replyTo:
          type: [object, 'null']
          properties:
            id: { type: string }
            author: { type: [string, 'null'] }
            body: { type: string, maxLength: 120 }
        read: { type: boolean, description: For the reader's own pair-thread messages, whether the recipient has read it }
        delivered: { type: boolean, description: "For the reader's own pair-thread messages, whether the recipient has received it: on the recipient's live stream when sent, else their next inbox, thread or stream request." }
        attachments:
          type: array
          items: { $ref: '#/components/schemas/MessageAttachment' }
    ServiceRequestMessage:
      type: object
      properties:
        id: { type: string }
        authorId:
          type: string
          description: >
            Who wrote it. **Use this, not `author`, to decide whether a message is the reader's
            own.** `author` is a display name, and attributing by name works until two users share
            one - at which point a stranger's message renders on the reader's side of the thread.
        author: { type: [string, 'null'], description: Display name, absent if the account has none }
        authorRole: { $ref: '#/components/schemas/Role' }
        body: { type: string }
        createdAt: { type: string, format: date-time }
        # When the other side read it, or null while unread. Per side rather than per reader — on a
        # co-filled request this means "somebody on the other side has seen it", not "everyone has".
        readAt: { type: [string, 'null'], format: date-time }
    Conversation:
      type: object
      description: >
        In-app chat thread. `direct` is between two parties, optionally about a listing; `group` is a
        flatmate group's thread, whose participants are the group's current members. A group thread has
        no counterparty and never a mobile.
      properties:
        id: { type: string }
        kind: { type: string, enum: [direct, group] }
        counterpartyId: { type: [string, 'null'], description: User id of the other participant; null on a group thread }
        counterpartyName: { type: [string, 'null'] }
        counterpartyRole: { $ref: '#/components/schemas/Role' }
        # Masking is listing-bound: approval reveals the owner to the buyer (unless hidden) and the requester
        # to the owner; an unrelated conversation reveals nothing. Detail only, the inbox list omits it.
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        youAre: { type: string, enum: [owner, buyer, member] }
        propertyId: { type: [string, 'null'] }
        propertySlug: { type: [string, 'null'] }
        propertyTitle: { type: [string, 'null'] }
        propertyPrice: { type: [integer, 'null'], format: int64 }
        propertyDeal: { type: [string, 'null'], enum: [rent, sale, null] }
        propertyBhk: { type: [string, 'null'] }
        propertyLocality: { type: [string, 'null'] }
        propertyCover: { type: [string, 'null'] }
        propertyAvailable: { type: boolean }
        listingDeleted: { type: boolean, description: 'The owner deleted the listing; the thread is read-only and sends answer 409 `conversation_closed`' }
        groupId: { type: [string, 'null'] }
        groupTitle: { type: [string, 'null'] }
        memberCount: { type: [integer, 'null'] }
        flatmateKind: { type: string, enum: [room, group, post], description: 'Direct thread opened from an accepted flatmate request: the kind of post it was about (the latest one, if several). Absent otherwise' }
        flatmateTargetId: { type: string, description: 'Id of that room, group or seeker post; present exactly when flatmateKind is' }
        lastMessage: { type: [string, 'null'], description: Preview of the most recent message; null on an empty group thread }
        unread: { type: integer, description: Unread message count for the current user }
        updatedAt: { type: string, format: date-time }
        archived: { type: boolean }
        muted: { type: boolean }
        blocked: { type: boolean, description: The caller has blocked the counterparty }
        blockedYou: { type: boolean, description: The counterparty has blocked the caller, so sending is refused }
        awaitingReply: { type: boolean, description: The last message was authored by someone else }
        presence:
          type: [object, 'null']
          description: Pair-thread counterparty activity on detail only, omitted when either side hides activity status.
          properties:
            online: { type: boolean }
            lastSeenAt: { type: [string, 'null'], format: date-time }
        messages:
          type: array
          description: Full thread; present on detail, omitted on list.
          items: { $ref: '#/components/schemas/ConversationMessage' }
    ConversationCreate:
      type: object
      required: [body]
      description: >
        Address the thread by `counterpartyMobile`, or by `propertyId` alone — supply at least one.
        The buyer side may name the listing and let the server derive the owner. Whether the two may
        message is decided by the approved contact request (or an owner-confirmed visit) either way;
        naming a listing buys nothing on its own.
      properties:
        counterpartyMobile: { $ref: '#/components/schemas/Mobile' }
        propertyId: { type: string, description: 'Listing the chat is about; required when counterpartyMobile is omitted' }
        body: { type: string, maxLength: 4000 }
        clientId: { type: string, maxLength: 120, description: Optional idempotency key; a repeat with the same key delivers the first message once }

    LoginRequest:
      type: object
      required: [mobile]
      properties:
        mobile: { $ref: '#/components/schemas/Mobile' }
        otp: { type: string, description: Required on the verify step., example: '123456' }
        password: { type: string, description: Optional password path. }
        remember: { $ref: '#/components/schemas/RememberDevice' }
    StaffLoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string, format: password }
    StaffEnrolRequest:
      type: object
      required: [challenge]
      properties:
        challenge: { type: string, description: From the password step. Opaque. }
    StaffCodeRequest:
      type: object
      required: [challenge, code]
      properties:
        challenge: { type: string, description: From the password step. Opaque. }
        code: { type: string, maxLength: 32, description: Six-digit authenticator code or a recovery code. }
        remember: { $ref: '#/components/schemas/RememberDevice' }
    StaffTotpEnrolment:
      type: object
      required: [secret, otpauthUri]
      properties:
        secret: { type: string, description: Base32, for typing into an app that cannot scan. }
        otpauthUri: { type: string, description: 'otpauth://totp/... for a QR code.' }
    RememberDevice:
      type: boolean
      default: true
      description: >
        "Remember this device". Governs only the lifetime of the refresh cookie: `true` sets a
        persistent cookie capped at the refresh TTL, `false` a session cookie the browser drops on
        close. Omit it and the session is remembered, which is what every caller got before the
        field existed.
    StaffInviteRedeem:
      type: object
      required: [token, password]
      properties:
        token:
          type: string
          description: >
            The single-use invite delivered out of band to the account's holder. Opaque; clients
            must not parse it.
        password: { type: string, format: password, minLength: 12, maxLength: 72 }
    RefreshRequest:
      type: object
      description: >
        Optional, and it carries no credential — the refresh token travels in the
        `__Host-draazy_rt` cookie. Send it only to keep "remember this device" true across a
        rotation: the browser tells the server nothing about the lifetime of the cookie it just
        presented, so the client has to restate it.
      properties:
        remember: { $ref: '#/components/schemas/RememberDevice' }
    AuthResponse:
      type: object
      description: >
        Dual-shape response. `POST /auth/login` without an `otp` is the *send* step and returns
        `{ "otpSent": true, "resendAfterSeconds": 60 }` — no tokens. The staff password step returns
        `{ "mfa", "challenge" }`, also without tokens. A completed verify / staff second step /
        refresh returns the access token plus `user`. Absent fields are omitted, not
        null.


        The **refresh token is not in this body**. It is set as an `HttpOnly`, `Secure`,
        `SameSite=Lax` cookie named `__Host-draazy_rt` at `Path=/`, so no client script can read
        it. The `__Host-` prefix is what makes the host-only scoping browser-enforced rather than
        merely intended: without it another host under the registrable domain could place a
        `Domain`-scoped cookie of the same name in the jar and choose which session the browser
        presents. Clients must send credentialed requests (`fetch(…, { credentials: 'include' })`)
        and must not attempt to persist it themselves.


        A second cookie, `__Host-draazy_session`, is set beside it and is deliberately **not**
        `HttpOnly`. It carries no identity — only `1` (remembered) or `0` (this tab only) — and
        exists so a client whose script-written storage was cleared, as Safari's Intelligent Tracking
        Prevention does after seven days, can still tell that a refresh is worth attempting. Being
        server-set, ITP spares it. Treat it as a hint, never as proof of a session.
      properties:
        accessToken: { type: string }
        tokenType: { type: string, default: Bearer }
        expiresIn: { type: integer, example: 900 }
        user:
          description: >
            The session identity the client caches. `Self` for consumer roles; back-office roles
            (staff, manager, admin) get the slimmer `StaffSelf`.
          oneOf:
            - { $ref: '#/components/schemas/Self' }
            - { $ref: '#/components/schemas/StaffSelf' }
        otpSent:
          type: boolean
          description: Present and `true` only on the OTP-send step; omitted on token-bearing responses.
          example: true
        resendAfterSeconds:
          type: integer
          description: >
            Seconds the caller must wait before another code to the same mobile is allowed. Present
            only on the OTP-send step. It is the gap the server will actually enforce in this
            environment (60 in a deployment, 0 where a mock sender rings no phone), so a client
            counts this down instead of a constant of its own — a shorter countdown offers a resend
            that can only answer `429`, and a longer one withholds one the server would allow.
          example: 60
        mfa:
          type: string
          enum: [totp, enrol]
          description: Present only on the staff password step. Which second step comes next.
        challenge:
          type: string
          description: Present only on the staff password step. Opaque; valid five minutes.
        recoveryCodes:
          type: array
          items: { type: string }
          description: Present only when an authenticator is first confirmed. Never shown again.
    ConsentResult:
      type: object
      description: >
        The consent routes' two-call shape in one object: the flatmate owner's consent and a
        rent-agreement tenant's confirmation. `consentRecorded: false` means a code was just sent;
        `true` means the code was verified and the consent is stored.
      required: [consentRecorded]
      properties:
        consentRecorded: { type: boolean }
        resendAfterSeconds:
          type: integer
          description: >
            Seconds before another code may be sent to that owner. Present only on the send call —
            once consent is recorded there is nothing left to resend. It is the same OTP send
            budget `POST /auth/login` reports, since the cooldown is one value across purposes.
          example: 60
    User:
      type: object
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: [string, 'null'], format: email }
        role:
          allOf: [ { $ref: '#/components/schemas/Role' } ]
          description: Must be `staff`; administrators are bootstrapped once per environment.
        team: { $ref: '#/components/schemas/Team' }
        status: { type: string, enum: [active, suspended, archived] }
        verified: { type: boolean, description: 'Opt-in ID verified badge (L2, ADR-019) — not required to participate.' }
        city: { type: string, example: Pune }
        mobileVerified: { type: boolean, description: Mobile-OTP (L1) — the floor for posting/enquiring/contacting. }
        verifiedContactOnly: { type: boolean, description: Owner preference — accept contact requests from verified (L2) users only. }
        hideNumber: { type: boolean, description: 'Owner preference — stay masked even after approving a contact request. The approval grants the conversation, not the digits.' }
        shareActivityStatus: { type: boolean, description: Share online/last-seen activity with message counterparties who also share theirs. }
        shareReadReceipts: { type: boolean, description: Share pair-thread read receipts with counterparties who also share theirs. }
        listingsCount: { type: integer, description: "How many listings this account has ever posted, including the rejected and the archived — the owner-vs-seeker persona, not live inventory. The count a visitor can actually open is a different number, counted at the point of use." }
        joinedAt: { type: string, format: date-time }
        lastActive: { type: string, format: date-time }
        createdAt: { type: string, format: date-time }
        permissions:
          type: array
          items: { type: string }
          description: >
            The caller's own resolved back-office permission atoms (`module:action`), and **only on
            `GET /auth/me`** — every other route serving this schema describes somebody else, and
            omits the key entirely. The admin console renders its navigation from these: an account
            has to know what it may do before it can draw a sidebar, and the route that answers
            "which atoms does account X hold" (`GET /users/{id}/permissions`) is deliberately
            admin-only, so a scoped manager has no other way to ask about itself.
            Resolved, not stored — the account's document intersected with its role baseline, i.e.
            what the server will actually honour. Present and possibly empty for `staff` and `admin`
            (empty means "scoped to nothing", which is a real state); absent for `buyer` and `owner`,
            who have no back-office baseline for the question to apply to.
            Advisory to the UI only. Every atom is enforced at its own route; hiding a tab is a
            courtesy, never the control.
        desks:
          type: array
          items: { type: string }
          description: >
            The caller's service desks on `GET /auth/me`, sorted. Empty for accounts with no desk
            scope and for consumer roles.
        flagged:
          type: boolean
          description: >
            The internal review marker, and **only on the back-office user routes**
            (`GET /users`, `GET /users/{id}`, and the three that write it). Absent everywhere else,
            including `GET /auth/me` — it is a note between moderators about the account holder, and
            the route that serves them their own profile has no business carrying it. Absent is
            therefore meaningfully different from `false`: it means nobody asked.
            Flagging changes nothing the platform does. It is not a status; see `status` for the
            states that gate behaviour.
        flagReason:
          type: string
          description: >
            What was noticed. Present exactly when `flagged` is true — a flag without one is a smear
            the next moderator cannot act on, and the database enforces the same pairing. Cleared,
            not kept, when the flag is lowered: a reason left behind on an unflagged account reads
            as an accusation that was never withdrawn. The history is in the audit log.
        badgeSource:
          type: string
          enum: [identity, manual]
          description: >
            Back-office routes only, present when `verified` is true. `identity` means the badge was
            earned through identity review and can only be revoked from that record (withdrawing it
            by hand answers 409); `manual` means an administrator granted it through the two-admin
            badge request.
    AdminUserRow:
      type: object
      description: One row of the back-office users list. The full record is `GET /users/{id}`.
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { type: string, description: In full }
        role: { $ref: '#/components/schemas/Role' }
        status: { type: string, enum: [active, suspended, archived] }
        verified: { type: boolean }
        city: { type: string }
        listingsCount: { type: integer }
        joinedAt: { type: string, format: date-time }
        flagged: { type: boolean }
        flagReason: { type: string }
        badgeSource: { type: string, enum: [identity, manual] }
        archived: { type: boolean, description: The soft-delete flag, independent of `status`. }
    AdminEnquirySummary:
      type: object
      properties:
        enquiries: { type: object, additionalProperties: { type: integer, format: int64 }, description: Count per status plus `all` }
        visits: { type: object, additionalProperties: { type: integer, format: int64 } }
        deals: { type: object, additionalProperties: { type: integer, format: int64 } }
        dealTypes: { type: object, additionalProperties: { type: integer, format: int64 } }
        gmv: { type: integer, format: int64, description: Whole INR over every deal }
        funnel:
          type: object
          properties:
            enquiries: { type: integer, format: int64 }
            visits: { type: integer, format: int64 }
            dealsClosed: { type: integer, format: int64 }
            gmv: { type: integer, format: int64 }
            localities:
              type: array
              description: Top ten by enquiries
              items:
                type: object
                properties:
                  locality: { type: string }
                  enquiries: { type: integer, format: int64 }
                  visits: { type: integer, format: int64 }
                  deals: { type: integer, format: int64 }
                  gmv: { type: integer, format: int64 }
    PropertyLookupRow:
      type: object
      properties:
        id: { type: string }
        slug: { type: string }
        title: { type: string }
        locality: { type: string }
        owner: { type: string }
        ownerMobile: { type: string, description: In full }
        status: { type: string }
    Self:
      type: object
      description: >
        The caller reading themselves (`GET`/`PATCH /auth/me`, token-bearing auth responses,
        `/me/bootstrap`). Only what the app shell, the profile tab and the console's navigation draw;
        account-state and moderation fields live on `User`, which only the back-office routes serve.
      properties:
        id: { type: string }
        name: { type: string }
        mobile: { $ref: '#/components/schemas/Mobile' }
        email: { type: [string, 'null'], format: email }
        role: { $ref: '#/components/schemas/Role' }
        verified: { type: boolean }
        city: { type: string, example: Pune }
        gender: { type: string, enum: [male, female], description: 'Set by the user, then changeable genderChangesLeft more times; the flatmates gender gate reads it. Absent until set. Staff correct it from the ID on identity approval.' }
        genderChangesLeft: { type: integer, minimum: 0, maximum: 2, description: 'Self-service gender changes still allowed after the first pick. 0 once spent or once the profile is ID-verified.' }
        verifiedContactOnly: { type: boolean }
