  /owners/{id}:
    get:
      tags: [Catalog & Search]
      summary: Public owner profile card
      description: >
        The seller card behind a listing. Public, and takes no principal at all: the page shows the
        same thing to everyone, and the mobile is masked unconditionally because the profile has no
        listing in context and so no contact gate to consult.


        That is the fix, not a limitation. The old page revealed the number to anyone holding an
        approved request against *any* of this owner's listings, which quietly turned a per-listing
        grant into a per-person one — approval on a Baner 2BHK saying nothing about the same owner's
        Kothrud shop.


        The owner's listings are deliberately not embedded. They are `GET /properties?owner={id}`,
        which is the same paged, approved-and-unarchived read as every other catalogue surface — one
        hard floor, one card shape, one place to get it wrong. There is no `GET /owners`: a
        downloadable list of the platform's landlords is not a feature.
      security: []
      operationId: getOwnerProfile
      parameters:
        - { name: id, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '200':
          description: The owner's public card
          content:
            application/json:
              schema: { $ref: '#/components/schemas/OwnerProfile' }
        '404':
          description: >
            Unknown, malformed, or belonging to an archived account — one answer for all three, so
            the route cannot be used to test whether an id exists.
  /localities:
    get:
      tags: [Catalog & Search]
      summary: Localities with a live presence
      security: []
      operationId: listLocalities
      description: >
        Localities someone has picked from Google Places and still stand, plus retired ones that
        still have live listings. Counts and averages come from live listings only.
      responses:
