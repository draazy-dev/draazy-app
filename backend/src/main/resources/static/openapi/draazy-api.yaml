    GeoPolicy:
      type: object
      description: >
        Map coverage and place-suppression policy.


        **Every field is an override.** The client ships a built-in centre and bounding box per city,
        and merges this document over them. City launch status is the `cities` section of `GET /bootstrap`.
        So an empty object is the correct answer for an install whose operator has never opened the
        Maps panel — not a broken one — and an unreachable server leaves the client on its defaults
        rather than on nothing.


        **Values that do not typecheck are dropped rather than forwarded**, as on the `flags` and
        `movePack` sections. The stored block is untyped and hand-editable, and a half-written bounding box
        passed through would be a response that disagrees with this schema.
      required: [cities, blacklist]
      properties:
        enforceCityLimit:
          type: boolean
          description: >
            Whether locality search is *restricted* to the active city's box rather than merely
            biased toward it. Absent when the operator has never set it; the client's default is on,
            because a search that can return an address in another state is worse than one that
            cannot find a legitimate fringe suburb.
        cities:
          type: object
          description: >
            Per-city overrides, keyed by the city name the client knows it by. Cities the operator
            has never touched are absent rather than echoed back at their defaults, so this map is
            usually much shorter than the city list. An entry with nothing set is omitted entirely.
          additionalProperties: { $ref: '#/components/schemas/GeoCityOverride' }
          example:
            Pune:
              center: { lat: 18.553, lng: 73.86 }
        blacklist:
          type: array
          description: >
            Places to hide from every suggestion box, newest first. `[]` is a real answer. Entries
            that could match nothing — no `placeId` and no term long enough for the client's matcher
            — are omitted, because they are inert on the client and a list whose whole purpose is to
            be matched against should not carry rows that never will be.
          items: { $ref: '#/components/schemas/GeoBlacklistEntry' }
    GeoCityOverride:
      type: object
      description: >
        One city's map overrides. Both are independently optional because the panel writes them
        independently: recentering a city and redrawing its box are separate edits, and an operator
        who did one has implied nothing about the other.
      properties:
        center:
          type: object
          description: >
            Map centre. Dropped as a unit when either coordinate is missing, not a number, not
            finite, or off the globe: half a point is not a point, and centring on a latitude and a
            zero lands the map in the sea off West Africa. Out-of-range values are dropped rather
            than clamped — clamping 200 to 90 invents a place at the North Pole that looks
            deliberate. Absent falls back to the built-in centre, which is a place.
          required: [lat, lng]
          properties:
            lat: { type: number, format: double, minimum: -90, maximum: 90 }
            lng: { type: number, format: double, minimum: -180, maximum: 180 }
        bounds:
          type: object
          description: >
            Coverage box, in the north/south/east/west vocabulary the Places request takes. Dropped
            as a unit when any edge is missing, not a number or off the globe, and it matters more
            than `center` does: with the city limit on, the client turns these into a hard
            `locationRestriction`, and a box missing its south edge is not a smaller box but a fence
            with a gap.


            Also dropped when the box is inverted — `north` at or below `south`, or `east` at or
            below `west`. Such a box encloses nothing, so every candidate is refused and the
            suggestion box for that city goes permanently and silently empty. Absent hands the city
            back its built-in bounds, which enclose the city.
          required: [north, south, east, west]
          properties:
            north: { type: number, format: double, minimum: -90, maximum: 90 }
            south: { type: number, format: double, minimum: -90, maximum: 90 }
            east: { type: number, format: double, minimum: -180, maximum: 180 }
            west: { type: number, format: double, minimum: -180, maximum: 180 }
    GeoBlacklistEntry:
      type: object
      description: >
        One blacklisted place. At least one of `placeId` and `term` is always present — an entry
        that can match nothing is not published.


        **The operator's reason is deliberately not on this schema.** Each stored entry carries a
        free-text note, which is moderator prose about a named building written when staff were the
        readers. The matcher has never consumed it, so it is withheld from this anonymous route and
        served only on `GET /admin/settings`.
      properties:
        id:
          type: string
          description: The entry's identifier, so a client can key a list without inventing a heuristic.
        placeId:
          type: string
          description: >
            Google place id, when the entry was picked from a search rather than typed. Matched
            exactly, which is why the panel recommends picking.
        term:
          type: string
          minLength: 2
          description: >
            Name to match as a case-insensitive substring, when the entry was typed. Never shorter
            than two characters — the client refuses to test below that, since one character matches
            most of Pune.
    ServiceWaitlistJoin:
      type: object
      description: >
        `name` is optional and `mobile` is not — the opposite way round from most forms, because the
        number is the only thing ops can act on and a name without one is a row nobody can use.
      required: [service, mobile]
      properties:
        service:
          type: string
          maxLength: 40
          description: >
            A slug from the server's waitlist vocabulary. Rejected with a 400 naming the value rather
            than silently filed under a default, so a client typo does not become a queue nobody
            reads.
        name:
          type: string
          maxLength: 120
          description: What to call them, if they said. Trimmed and capped; blank becomes a fixed placeholder.
        mobile: { $ref: '#/components/schemas/Mobile' }
    ContentTranslations:
      type: object
      description: >
        Editor-written translations, keyed language then wire field name (D2) — e.g.
        `{ "mr": { "question": "...", "answer": "..." } }`. Two levels, strings at the leaves, and
        nothing else: the shape is fixed rather than free-form so a nested array or a number is
        refused at deserialisation instead of failing later at the point somebody tried to render it.
        Only the fields an editor actually translated are present, and only the languages they
        translated into; a client falls back to the top-level field for anything missing. Empty
        rather than absent when nothing is translated, so "this row has no translations" and "this
        row predates translations" stay the same fact.
      additionalProperties:
        type: object
        additionalProperties: { type: string }
