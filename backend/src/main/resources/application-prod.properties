# Profile 4 of 4 (prod): real users only, standalone. Every secret is a ${ENV} lookup with NO default,
# so a missing one fails the boot -- add new ones to ProdProfileContractTest and the sandbox file too.

spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USER}
spring.datasource.password=${DB_PASSWORD}
draazy.security.jwt.secret=${JWT_SECRET}
draazy.security.referral-signal-salt=${REFERRAL_SIGNAL_SALT}
draazy.security.identity-hash-secret=${IDENTITY_HASH_SECRET}
draazy.security.identity-key=${IDENTITY_ENCRYPTION_KEY}
draazy.security.identity-key-id=${IDENTITY_ENCRYPTION_KEY_ID}
draazy.security.staff-totp-key=${STAFF_TOTP_KEY}
# Set CASHFREE_WEBHOOK_SECRET to the SAME value as CASHFREE_SECRET_KEY, from one Secret Manager
# entry: two entries drift on the first rotation, and a stale-but-real key still boots.
draazy.webhooks.cashfree.secret=${CASHFREE_WEBHOOK_SECRET}

# Hardcoded, not ${ENV}: no environment wants a 30-day credential in clear on the wire.
draazy.security.refresh-cookie.secure=true

# Without this a deploy refuses its own frontend, as opaque browser CORS errors and 200s in the log.
draazy.web.cors.allowed-origins=${WEB_ORIGINS}

# The origin the BROWSER uses, so CookieDeliveryCheck can prove same-site at boot. Unset, it skips.
draazy.web.public-origin=${API_PUBLIC_ORIGIN}

# Supabase Postgres through the Supavisor pooler (ADR-007). Transaction pooling gives each
# transaction a different backend, so named prepared statements break on the 6th execution.
spring.datasource.hikari.data-source-properties.prepareThreshold=0

# Small and allowed to drain: N instances holding 10 idle slots each exhaust the free tier unused.
spring.datasource.hikari.maximum-pool-size=5
spring.datasource.hikari.minimum-idle=0

# Shorter than Supavisor's idle reaping; Hikari's 30-minute default hands dead sockets to requests.
spring.datasource.hikari.max-lifetime=600000

# pgjdbc defaults to `prefer`, which SILENTLY falls back to plaintext. `require` is the floor, not
# the goal -- it does not authenticate the server, so verify-full still needs the CA (docs/DEPLOY.md).
spring.datasource.hikari.data-source-properties.sslmode=require

# Session connection (pg_advisory_lock) as the schema owner; DB_USER is DML-only (docs/DEPLOY.md §2.1).
# A separate Flyway URL gets its own DataSource, so user and password must be explicit.
spring.flyway.url=${FLYWAY_DB_URL}
spring.flyway.user=${FLYWAY_DB_USER}
spring.flyway.password=${FLYWAY_DB_PASSWORD}

# Schema only, and load-bearing: `local,prod` loads both files and this is what wins that collision.
# `R__` means repeatable, so the demo seed would re-run on any deploy whose checksum moved.
spring.flyway.locations=classpath:db/migration

logging.structured.format.console=ecs

# `health` only -- `info` publishes build, git and Java version to the internet, which serves attackers.
management.endpoints.web.exposure.include=health
management.endpoint.health.probes.enabled=true

# Re-pinned because `local,prod` also loads the loosened file. Real codes cost money and ring a phone.
draazy.otp.send-cooldown-seconds=60
draazy.otp.max-sends-per-window=5

# Keyed on nothing, so this is the whole platform's hourly ceiling rather than one number's worth
# of SMS. Left to its `@Value` default an active `e2e` would raise it to 100000 here (guard 2 of 3).
draazy.otp.max-platform-sends-per-window=500

# Pinned so the value cannot arrive from a properties file active alongside this one. Not a lock:
# DRAAZY_OTP_MAX_VERIFY_ATTEMPTS still outranks it, and rejectUnusableAttemptCap is the only ceiling.
draazy.otp.max-verify-attempts=3

# Pinned empty so an active `e2e` cannot hand a deployment a predictable login code (guard 2 of 3).
draazy.otp.fixed-code=

# Pinned empty for the same reason, for the key sandbox uses instead. OtpService refuses to boot if
# this is set while `prod` is active, but the pin means a copied properties file cannot get that far.
draazy.otp.sandbox-code=

# Pinned empty for the same reason: a fixed authenticator code would void staff 2FA.
draazy.staff-totp.fixed-code=

# Must be the load balancer's actual CIDR as a Java regex. Wrong here puts the whole internet in one
# bucket, so one host sending 120 logins a minute 429s every anonymous write on the platform.
draazy.security.trusted-proxies=${INTERNAL_PROXIES}

# Sent by the Pages Function as X-Proxy-Auth. Without it the *.run.app URL serves anyone who finds
# it, and any address the rate limiter trusts can be forged -- docs/DEPLOY.md §4.
draazy.security.origin-secret=${ORIGIN_SHARED_SECRET}
