# The Java suite's configuration: `local` against a throwaway `draazy_test` on real local Postgres.
# This file SHADOWS src/main/resources/application.properties, so anything the suite needs is repeated.
spring.datasource.url=${TEST_DB_URL:jdbc:postgresql://localhost:5432/draazy_test}
spring.datasource.username=${TEST_DB_USER:postgres}
spring.datasource.password=${TEST_DB_PASSWORD:postgres}

spring.flyway.enabled=true
spring.jpa.hibernate.ddl-auto=validate

# One pool per CACHED CONTEXT, so use is (contexts x pool size). At Hikari's default of 10 the fourth
# context tipped Postgres over max_connections. Nothing here runs concurrently.
spring.datasource.hikari.maximum-pool-size=4

# Schema only. ENFORCED by application-local.properties in this directory -- a profile-specific file
# outranks a plain one from either source set. Stated here for intent; TestDatabaseIsolationTest guards.
spring.flyway.locations=classpath:db/migration,classpath:db/test-fixtures

# Repeated from main, or the suite would prove a cap production has and the test run does not.
spring.data.web.pageable.max-page-size=100
spring.data.web.pageable.default-page-size=20

# Repeated from main. MockMvc ignores the context path, so only ApiContextPathTest would notice this
# missing -- and it would then assert against a server configured unlike every deployment.
server.servlet.context-path=/api
server.tomcat.use-relative-redirects=true

# Deterministic, keyless providers for the whole test run.
spring.profiles.active=local

# Test-only JWT secret (never a real secret; prod reads JWT_SECRET from env).
draazy.security.jwt.secret=test-only-hs256-secret-key-that-is-long-enough-32b

# Strict, unlike production's 15s. Every test presenting a spent token does so deliberately, so an open
# window would read them all as the two-tab race and serve them. Opened only by RefreshGraceWindowTest.
draazy.security.jwt.refresh-grace=0s

# Test-only signing key. Tests sign their own payloads, so verification is exercised, not stubbed.
draazy.webhooks.cashfree.secret=test-only-webhook-signing-secret

# Fixed, so a digest is reproducible across a run. ReferralSignals reads it with no default.
draazy.security.referral-signal-salt=test-only-referral-signal-salt

# Repeated for the same reason as the salt above: this file shadows the main one, so IdentityHasher's
# dev default never reaches a test and every @SpringBootTest fails to start on the unresolved placeholder.
draazy.security.identity-hash-secret=test-only-identity-hash-secret
draazy.security.identity-key=pFkO7MI67bHo2WcAbF0MuZbojV+DvC8WaGbzzYV+4rU=
draazy.security.identity-key-id=test
draazy.security.identity-retired-keys=
draazy.security.staff-totp-key=szyGfQ7noc+gwoN/dFw77mTx27dpl8bI3sckOWhosts=

# Repeated, or the container caps uploads at Boot's 1MB default and the 10MB rule is unreachable.
spring.servlet.multipart.max-file-size=12MB
spring.servlet.multipart.max-request-size=13MB

# Repeated, or the suite boots with OSIV on and proves nothing about what production runs.
spring.jpa.open-in-view=false

# Uploaded bytes land here rather than in the developer's real storage dir.
draazy.storage.dir=${java.io.tmpdir}/draazy-test-storage

# Each runs outside the test's transaction and mutates rows a test just seeded; proved directly instead.

# SubscriptionService.expireLapsed(now).
draazy.billing.subscription-sweep.enabled=false

# expireAbandonedCheckouts(cutoff), per payment family. Its 5-minute initial delay means it would
# rarely fire inside a run, but "rarely" is not a guarantee on a slow CI machine.
draazy.payments.checkout-sweep.enabled=false

# RefreshTokenService.pruneExpired(now).
draazy.auth.refresh-prune.enabled=false

# Saved-search counter.
draazy.engagement.saved-search-sweep.enabled=false

# The most dangerous of the set: it WRITES an ops note onto the verification case of any recently
# created listing that collides, and nearly every fixture uses the same few addresses.
draazy.catalog.duplicate-sweep.enabled=false

# ReferralSignalRetentionSweep.expireSignalsOlderThan(cutoff).
draazy.referrals.signal-retention.enabled=false
draazy.identity.purge-sweep.enabled=false

# PageViewRetention.expirePageViewsOlderThan(cutoff).
draazy.analytics.page-view-retention.enabled=false

# NotificationRetention.purgeOlderThan(cutoff).
draazy.engagement.notification-retention.enabled=false

# Sends a paid WhatsApp per due user; the test drives WaitingDigestService.sendDue(now) directly.
draazy.engagement.waiting-digest.enabled=false

# Notifies owners and tenants; the test drives RentAgreementRenewalSweeper.remindEnding(now) directly.
draazy.documents.renewal-reminder.enabled=false

# The same hazard pointed the other way -- it rewrites aggregate rows rather than deleting raw ones,
# so an expected page_view_daily row can be replaced mid-assertion.
draazy.analytics.page-view-rollup.enabled=false

# Deletes pending party rows, so a test that just wrote an invitation loses it underneath itself.
draazy.services.co-fill-invite-retention.enabled=false

# Blanks identity numbers on idle requests, which a test that just recorded them would lose.
draazy.services.identity-retention.enabled=false

# MockMvc gives every request the same remote address, so ~700 tests present as one caller and would
# exhaust any realistic budget. Proved by WriteRateLimitTest, which enables it with a budget of 2.
draazy.security.rate-limit.enabled=false

# Tests write rows and read them back anonymously in the same context. PublicReadCacheFilterTest proves it.
draazy.cache.public-reads.ttl=0s
draazy.cache.settings.ttl=0s

# Without this line every @SpringBootTest fails to start, and that IS the point: TrustedProxyConfig
# reads the property with no default so a deploy cannot decline to answer.
draazy.security.trusted-proxies=none

# Read with no default, like the line above; OriginGateTest turns the gate on.
draazy.security.origin-secret=none

# Deliberately not draazy.com: a test passing against the production hostname is indistinguishable
# from one accidentally pointed at it.
draazy.app.base-url=http://localhost:5173
